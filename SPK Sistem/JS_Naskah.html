<script>












window.handleLogin = handleLogin;




function isNaskahCancelled(n) {
  return String(n?.statusProses || '').toLowerCase() === 'dibatalkan';
}

function picQueueStageForCurrentUser() {
  const role = typeof normalizeRole === 'function' ? normalizeRole(state.user?.role || '') : String(state.user?.role || '').toLowerCase();
  if (role === 'editor' || role === 'pic_editor') return 'proofreading';
  if (role === 'layouter' || role === 'pic_layouter') return 'layout';
  return '';
}

function getPicStageDeadline(n, stageKey = picQueueStageForCurrentUser()) {
  const parseDeadlineMap = (value) => {
    if (!value) return {};
    if (typeof value === 'object') return value;
    try { return JSON.parse(value); } catch (error) { return {}; }
  };
  const deadlines = parseDeadlineMap(n?.deadlines);
  const baseDeadlines = parseDeadlineMap(n?.baseDeadlines);
  const ranges = parseDeadlineMap(n?.timelineRanges);
  const range = ranges?.[stageKey];
  if (range?.start && range?.end) return range.start + ' - ' + range.end;
  return deadlines?.[stageKey] || baseDeadlines?.[stageKey] || '';
}

function isPicStageDeadlineOpenClient(n, stageKey = picQueueStageForCurrentUser()) {
  const deadline = String(getPicStageDeadline(n, stageKey) || '').slice(0, 10);
  if (!deadline) return true;
  return deadline <= getTodayInputValue();
}

function getPicStageLabel(stageKey = picQueueStageForCurrentUser()) {
  return stageKey === 'proofreading' ? 'Proofreading' : stageKey === 'layout' ? 'Layout' : 'Tahap';
}

function isNaskahVisibleInPicDatabase(n) {
  if (String(n?.source || '').toLowerCase() !== 'cs') return true;
  if (String(n?.intakeStatus || '').toLowerCase() !== 'production_started') return false;
  const stageKey = picQueueStageForCurrentUser();
  if (stageKey === 'proofreading' && String(n?.butuhProofreading ?? '1') === '0') return false;
  const field = stageKey === 'proofreading' ? 'picEditorQueueStatus' : stageKey === 'layout' ? 'picLayouterQueueStatus' : '';
  const stageStatus = field ? String(n?.[field] || '').toLowerCase() : '';
  return stageStatus === 'queued' || (!stageStatus && String(n?.picQueueStatus || '').toLowerCase() === 'queued');
}

// --- RENDER CONTENT ---
function loadNaskah() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    mockNaskahDB = res?.data || [];
    const data = mockNaskahDB.filter((n) => (n.statusProses === 'Siap Proses' || !n.statusProses) && !isNaskahCancelled(n) && isNaskahVisibleInPicDatabase(n));
    const searchQuery = String(window._naskahDbSearch || '').trim().toLowerCase();
    const penerbitFilter = window._naskahDbPenerbit || 'semua';
    const progressFilter = window._naskahDbProgress || 'semua';
    const penerbitOptions = [...new Set(data.map((n) => n.penerbit || 'Tanpa Penerbit'))].sort((a, b) => a.localeCompare(b));
    const progressOptions = [...new Set(data.map((n) => n.timeline || 'Belum Diatur'))].sort((a, b) => a.localeCompare(b));
    const filteredData = data.filter((n) => {
      const haystack = [n.judul, n.penulis, n.trackingCode, n.cs, n.penerbit, n.paket, n.picEditor, n.picLayouter, n.timeline].join(' ').toLowerCase();
      return (!searchQuery || haystack.includes(searchQuery)) && (
      penerbitFilter === 'semua' || (n.penerbit || 'Tanpa Penerbit') === penerbitFilter) && (
      progressFilter === 'semua' || (n.timeline || 'Belum Diatur') === progressFilter);
    });
    const pageSize = 10;
    const currentPage = Math.max(1, Number(window._naskahDbPage || 1));
    const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
    const safePage = Math.min(currentPage, totalPages);
    window._naskahDbPage = safePage;
    const pagedData = filteredData.slice((safePage - 1) * pageSize, safePage * pageSize);

    content.innerHTML = "\n                    <div class=\"mb-4 flex flex-wrap items-center gap-4 text-[11px] font-bold text-slate-300 bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm\">\n                        <span class=\"uppercase tracking-wider text-slate-400\">Status PIC:</span>\n                        <div class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-blue-500\"></span> Menunggu</div>\n                        <div class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-amber-500\"></span> Revisi</div>\n                        <div class=\"flex items-center gap-1.5\"><span class=\"w-2 h-2 rounded-full bg-emerald-500\"></span> Complete</div>\n                        <span class=\"border-l border-slate-200 h-4\"></span>\n                        <span class=\"uppercase tracking-wider text-slate-400\">Penerbit:</span>\n                        <div class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded\" style=\"background:#eff6ff;border:1px solid #dbeafe\"></span> Nasmedia</div>\n                        <div class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded\" style=\"background:#faf5ff;border:1px solid #f3e8ff\"></span> Idebuku</div>\n                    </div>\n                    <div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden\">\n                        <div class=\"p-4 border-b border-slate-100 grid grid-cols-1 md:grid-cols-3 gap-3\">\n                            <input value=\"".concat(


      window._naskahDbSearch || '', "\" oninput=\"window._naskahDbSearch=this.value; window._naskahDbPage=1; loadNaskah()\" placeholder=\"Cari judul, kode, penulis, PIC...\" class=\"px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold outline-none focus:border-accent-400\">\n                            <select onchange=\"window._naskahDbPenerbit=this.value; window._naskahDbPage=1; loadNaskah()\" class=\"px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold outline-none bg-white focus:border-accent-400\">\n                                <option value=\"semua\" ").concat(

      penerbitFilter === 'semua' ? 'selected' : '', ">Semua Penerbit</option>\n                                ").concat(
      penerbitOptions.map((p) => "<option value=\"".concat(p, "\" ").concat(penerbitFilter === p ? 'selected' : '', ">").concat(p, "</option>")).join(''), "\n                            </select>\n                            <select onchange=\"window._naskahDbProgress=this.value; window._naskahDbPage=1; loadNaskah()\" class=\"px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold outline-none bg-white focus:border-accent-400\">\n                                <option value=\"semua\" ").concat(


      progressFilter === 'semua' ? 'selected' : '', ">Semua Progress</option>\n                                ").concat(
      progressOptions.map((p) => "<option value=\"".concat(p, "\" ").concat(progressFilter === p ? 'selected' : '', ">").concat(p, "</option>")).join(''), "\n                            </select>\n                        </div>\n                        <div class=\"overflow-x-auto\">\n                        <table class=\"w-full text-left\">\n                            <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                <tr>\n                                    <th class=\"px-4 py-3\">Judul Naskah</th>\n                                    <th class=\"px-4 py-3\">Penulis & CS</th>\n                                    <th class=\"px-4 py-3\">PIC Produksi</th>\n                                    <th class=\"px-4 py-3\">Target Deadline</th>\n                                    <th class=\"px-4 py-3 text-center\">Aksi</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y divide-slate-50\">\n                                ").concat(














      pagedData.map((n) => {
        const isNasmedia = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('nasmedia');
        const isIdebuku = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('idebuku');
        const rowStyle = isNasmedia ? 'background-color: #eff6ff !important;' : isIdebuku ? 'background-color: #faf5ff !important;' : '';
        const edSt = n.statusEditor || 'Menunggu';
        const edCol = edSt === 'Complete' ? 'bg-emerald-500' : edSt === 'Revisi' ? 'bg-amber-500' : 'bg-blue-500';
        const laySt = n.statusLayouter || 'Menunggu';
        const layCol = laySt === 'Complete' ? 'bg-emerald-500' : laySt === 'Revisi' ? 'bg-amber-500' : 'bg-blue-500';
        const deadlineStage = picQueueStageForCurrentUser();
        const deadlineLabel = getPicStageLabel(deadlineStage);
        const deadlineValue = getPicStageDeadline(n, deadlineStage);
        const deadlineLate = deadlineValue && getTodayInputValue() > String(deadlineValue).slice(0, 10);
        return `
          <tr class="text-[12px] transition-colors " style="${rowStyle}">
            <td class="px-8 py-4 font-bold text-slate-800">
              ${n.judul}<br>
              <span class="text-[10px] text-slate-400 font-mono mr-2">${n.id}</span>
              ${n.revisiProofreading > 0 || n.revisiLayout > 0 ? `<div class="mt-1 flex gap-1"><span class="px-1.5 py-0.5 bg-amber-50 text-amber-600 rounded text-[9px] font-bold border border-amber-100">Rev. Aktual: PR (${n.revisiProofreading || 0}x), LY (${n.revisiLayout || 0}x)</span></div>` : ''}
            </td>
            <td class="px-8 py-4">${n.penulis}<br><span class="text-[10px] text-slate-400 italic">via ${n.cs}</span></td>
            <td class="px-8 py-4">
              <div class="flex flex-col gap-1 text-[10px]">
                <div class="flex items-center gap-1.5"><i class="fa-solid fa-pen-nib text-slate-300 w-3"></i> <span class="${n.picEditor ? 'text-slate-700 font-semibold' : 'text-slate-400 italic'}">${n.picEditor || 'Belum diatur'}</span>
                  ${n.picEditor ? `<span class="w-1.5 h-1.5 rounded-full ${edCol}" title="${edSt}"></span>` : ''}
                </div>
                <div class="flex items-center gap-1.5"><i class="fa-solid fa-desktop text-slate-300 w-3"></i> <span class="${n.picLayouter ? 'text-slate-700 font-semibold' : 'text-slate-400 italic'}">${n.picLayouter || 'Belum diatur'}</span>
                  ${n.picLayouter ? `<span class="w-1.5 h-1.5 rounded-full ${layCol}" title="${laySt}"></span>` : ''}
                </div>
              </div>
            </td>
            <td class="px-8 py-4">
              ${deadlineValue ? `<div class="text-[10px]"><span class="text-slate-400">${deadlineLabel}:</span> <span class="font-bold ${deadlineLate ? 'text-red-500' : 'text-slate-700'}">${deadlineValue || '-'}</span></div>` : '<span class="text-[10px] text-slate-300 italic">Belum diatur</span>'}
            </td>
            <td class="px-8 py-4 text-center">
              <div class="flex items-center justify-center gap-1">
                <button onclick="viewDetailNaskah('${n.id}')" class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg" title="Detail"><i class="fa-solid fa-eye"></i></button>
                ${state.user.role === 'pic_editor' || state.user.role === 'pic_layouter' ? `
                  <button onclick="openTrackingDelayDialog('${n.id}', '${state.user.role === 'pic_layouter' ? 'layout' : 'proofreading'}')" class="p-2 text-amber-500 hover:bg-amber-50 rounded-lg" title="Mundur Estimasi"><i class="fa-solid fa-clock"></i></button>
                  <button onclick="editNaskah('${n.id}')" class="p-2 text-blue-500 hover:bg-blue-50 rounded-lg" title="Edit"><i class="fa-solid fa-edit"></i></button>
                ` : ''}
              </div>
            </td>
          </tr>`;
      }


      ).join(''), "\n                                ").concat(
      filteredData.length === 0 ? '<tr><td colspan="5" class="p-16 text-center text-slate-300 italic">Tidak ada naskah yang sesuai pencarian/filter.</td></tr>' : '', "\n                            </tbody>\n                        </table>\n                        </div>\n                        <div class=\"flex flex-col md:flex-row md:items-center md:justify-between gap-3 px-5 py-4 border-t border-slate-100\">\n                            <div class=\"text-[10px] font-bold text-slate-400\">Menampilkan ").concat(




      pagedData.length, " dari ").concat(filteredData.length, " naskah &bull; Halaman ").concat(safePage, " / ").concat(totalPages, "</div>\n                            <div class=\"flex items-center gap-2\">\n                                <button onclick=\"window._naskahDbPage=Math.max(1,(window._naskahDbPage||1)-1); loadNaskah()\" class=\"px-3 py-2 rounded-lg border border-slate-200 text-xs font-black text-slate-500 hover:border-accent-200 hover:text-accent-600\">Prev</button>\n                                <span class=\"px-3 py-2 rounded-lg bg-accent-50 text-accent-600 text-xs font-black\">").concat(


      safePage, "</span>\n                                <button onclick=\"window._naskahDbPage=Math.min(").concat(
      totalPages, ",(window._naskahDbPage||1)+1); loadNaskah()\" class=\"px-3 py-2 rounded-lg border border-slate-200 text-xs font-black text-slate-500 hover:border-accent-200 hover:text-accent-600\">Next</button>\n                            </div>\n                        </div>\n                    </div>");



  }).getNaskahData();
}

function picNaskahSafe(value) {
  return String(value ?? '-').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function picNaskahAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function loadPicNaskahBaru() {
  const content = document.getElementById('contentArea');
  if (content) content.innerHTML = '<div class="bg-white border border-slate-100 rounded-2xl p-10 text-center text-slate-400 font-bold">Memuat naskah baru PIC...</div>';
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    if (!res || res.success === false) {
      content.innerHTML = '<div class="bg-white border border-red-100 rounded-2xl p-10 text-center text-red-500 font-bold">' + picNaskahSafe(res?.message || 'Gagal memuat naskah baru PIC.') + '</div>';
      return;
    }
    const rows = res?.data || [];
    const stageKey = res?.stageKey || picQueueStageForCurrentUser();
    const stageLabel = getPicStageLabel(stageKey);
    mockNaskahDB = rows;
    content.innerHTML = `
      <div class="space-y-4">
        <div class="mb-4 flex items-center gap-4 text-[11px] font-bold text-slate-300 bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm"><span class="uppercase tracking-wider text-slate-400"><i class="fa-solid fa-palette mr-1"></i>Penerbit:</span><div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#eff6ff;border:1px solid #dbeafe"></span> Nasmedia</div><div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#faf5ff;border:1px solid #f3e8ff"></span> Idebuku</div></div>
        <div class="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div>
            <h3 class="text-xl font-black text-slate-900">Naskah Baru</h3>
            <p class="text-sm text-slate-400 mt-1">Naskah siap ${picNaskahSafe(stageLabel)} dan menunggu ditugaskan ke tim.</p>
          </div>
          <div class="px-4 py-2 rounded-xl bg-accent-50 text-accent-600 text-sm font-black">${rows.length} naskah</div>
        </div>
        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
          ${rows.map((n) => {
            const isNasmedia = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('nasmedia');
            const isIdebuku = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('idebuku');
            const rowStyle = isNasmedia ? 'background-color: #eff6ff !important;' : isIdebuku ? 'background-color: #faf5ff !important;' : '';
            return `
            <div class="border border-slate-100 rounded-2xl p-5 shadow-sm transition-colors" style="${rowStyle}">
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="text-[10px] font-black uppercase tracking-widest text-accent-500">${picNaskahSafe(n.trackingCode || n.id || '-')}</div>
                  <h4 class="text-lg font-black text-slate-900 mt-1">${picNaskahSafe(n.judul || '-')}</h4>
                  <p class="text-xs font-bold text-slate-400 mt-1">${picNaskahSafe(n.penulis || '-')}</p>
                </div>
                <span class="shrink-0 px-3 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-100 text-[10px] font-black">Belum Antri</span>
              </div>
              <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                  <div class="text-[9px] font-black text-slate-400 uppercase">Paket</div>
                  <div class="font-bold text-slate-700 mt-1">${picNaskahSafe(n.paket || '-')}</div>
                </div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                  <div class="text-[9px] font-black text-slate-400 uppercase">Ukuran</div>
                  <div class="font-bold text-slate-700 mt-1">${picNaskahSafe(n.ukuran || '-')}</div>
                </div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                  <div class="text-[9px] font-black text-slate-400 uppercase">Halaman</div>
                  <div class="font-bold text-slate-700 mt-1">${picNaskahSafe(n.estimasiHalaman || '-')}</div>
                </div>
                <div class="rounded-xl bg-slate-50 border border-slate-100 p-3">
                  <div class="text-[9px] font-black text-slate-400 uppercase">Deadline ${picNaskahSafe(stageLabel)}</div>
                  <div class="font-bold text-slate-700 mt-1">${picNaskahSafe(getPicStageDeadline(n, stageKey) || '-')}</div>
                </div>
              </div>
              <div class="mt-4 flex flex-wrap gap-2">
                <button onclick="viewDetailNaskah('${picNaskahAttr(n.id)}')" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-black"><i class="fa-solid fa-eye mr-1"></i>Lihat Detail</button>
                <button onclick="editNaskah('${picNaskahAttr(n.id)}')" class="px-4 py-2 rounded-xl bg-accent-600 hover:bg-accent-700 text-white text-xs font-black shadow-sm"><i class="fa-solid fa-user-plus mr-1"></i>Tugaskan</button>
              </div>
            </div>
          `; }).join('')}
        </div>
        ${rows.length === 0 ? '<div class="bg-white border border-slate-100 rounded-2xl p-12 text-center text-slate-300 italic">Belum ada naskah siap ditugaskan untuk PIC.</div>' : ''}
      </div>`;
  }).withFailureHandler((error) => showServerError('Gagal Memuat Naskah Baru PIC', error)).getPicNewNaskahData(state.user.role);
}

function enqueuePicNaskahClient(id) {
  const submitQueue = () => {
    Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res?.message || res?.error || 'Naskah gagal dimasukkan ke antrian.', 'error');
        return;
      }
      Swal.fire('Berhasil', 'Naskah sudah masuk antrian.', 'success');
      loadPicNaskahBaru();
    }).withFailureHandler((error) => showServerError('Gagal Memasukkan Antrian', error)).enqueuePicNaskah(id, state.user.username, state.user.role);
  };
  Swal.fire({
    title: 'Masukkan ke Antrian?',
    text: 'Naskah akan masuk daftar antrian PIC sesuai prioritas deadline dan paket.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Masukkan Antrian',
    cancelButtonText: 'Batal',
    confirmButtonColor: '#4763FD'
  }).then((result) => {
    if (!result.isConfirmed) return;
    submitQueue('');
  });
}

function renderAntrianNaskahTable(rows, stageKey, title) {
  const stageLabel = title || getPicStageLabel(stageKey);
  return `
    <div class="mb-4 flex items-center gap-4 text-[11px] font-bold text-slate-300 bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm"><span class="uppercase tracking-wider text-slate-400"><i class="fa-solid fa-palette mr-1"></i>Penerbit:</span><div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#eff6ff;border:1px solid #dbeafe"></span> Nasmedia</div><div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded" style="background:#faf5ff;border:1px solid #f3e8ff"></span> Idebuku</div></div>
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <h3 class="text-xl font-black text-slate-900">Antrian ${picNaskahSafe(stageLabel)}</h3>
          <p class="text-sm text-slate-400 mt-1">Otomatis urut berdasarkan deadline ${picNaskahSafe(stageLabel)}, prioritas paket, lalu tanggal input CS.</p>
        </div>
        <div class="px-4 py-2 rounded-xl bg-accent-50 text-accent-600 text-sm font-black">${rows.length} antrian</div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
            <tr>
              <th class="px-5 py-4">Judul</th>
              <th class="px-5 py-4">Nama Penulis</th>
              <th class="px-5 py-4">Paket</th>
              <th class="px-5 py-4">Deadline ${picNaskahSafe(stageLabel)}</th>
              <th class="px-5 py-4">Ukuran</th>
              <th class="px-5 py-4">Estimasi Halaman</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            ${rows.map((n) => {
              const isNasmedia = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('nasmedia');
              const isIdebuku = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('idebuku');
              const rowStyle = isNasmedia ? 'background-color: #eff6ff !important;' : isIdebuku ? 'background-color: #faf5ff !important;' : '';
              return `
              <tr class="transition-colors " style="${rowStyle}">
                <td class="px-5 py-4 font-bold text-slate-800">${picNaskahSafe(n.judul || '-')}</td>
                <td class="px-5 py-4 text-slate-600">${picNaskahSafe(n.penulis || '-')}</td>
                <td class="px-5 py-4"><span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-black">${picNaskahSafe(n.paket || '-')}</span></td>
                <td class="px-5 py-4 text-slate-600 font-mono">${picNaskahSafe(getPicStageDeadline(n, stageKey) || '-')}</td>
                <td class="px-5 py-4 text-slate-600">${picNaskahSafe(n.ukuran || '-')}</td>
                <td class="px-5 py-4 text-slate-600 font-mono">${picNaskahSafe(n.estimasiHalaman || '-')}</td>
              </tr>
            `; }).join('')}
            ${rows.length === 0 ? '<tr><td colspan="6" class="p-12 text-center text-slate-300 italic">Belum ada naskah dalam antrian.</td></tr>' : ''}
          </tbody>
        </table>
      </div>
    </section>`;
}

function loadManajemenAntrianNaskah() {
  const content = document.getElementById('contentArea');
  if (content) content.innerHTML = '<div class="bg-white border border-slate-100 rounded-2xl p-10 text-center text-slate-400 font-bold">Memuat antrian naskah...</div>';
  gas.withSuccessHandler((res) => {
    const content = document.getElementById('contentArea');

function lunasiKpiDP(id) {

function normalizeCetakInputDate(value, fallback = '') {
  if (!value) return fallback;
  const raw = String(value).trim();
  const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return iso[0];
  const slash = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (slash) {
    const month = slash[1].padStart(2, '0');
    const day = slash[2].padStart(2, '0');
    return `${slash[3]}-${month}-${day}`;
  }
  const parsed = new Date(raw);
  if (!Number.isNaN(parsed.getTime())) return parsed.toISOString().slice(0, 10);
  return fallback;
}

  };

    Swal.fire('Data Belum Lengkap', 'Tanggal, judul, spesifikasi cetak, jumlah eks, dan nominal wajib diisi.', 'warning');
    return;

    Swal.fire('Jumlah Hal Warna', 'Jumlah halaman warna wajib diisi.', 'warning');

    Swal.fire('DP Tidak Valid', 'Nominal DP wajib lebih dari 0 dan lebih kecil dari nominal.', 'warning');
    return;

function getHolidayMapClient() {
  const rows = window._holidaySettings || [];
  const map = {};
  rows.forEach((r) => {
    if (String(r.active || '1') !== '0' && r.tanggal) {
      map[String(r.tanggal).slice(0, 10)] = true;
    }

  return map;

function addBusinessDaysClient(dateText, days) {
  const date = dateText ? new Date(dateText + 'T00:00:00') : new Date();
  let count = 0;
  const target = Math.max(0, Number(days || 0));
  const holidays = getHolidayMapClient();
  while (count < target) {
    date.setDate(date.getDate() + 1);
    const day = date.getDay();
    const dateStr = date.toISOString().slice(0, 10);
    if (day !== 0 && day !== 6 && !holidays[dateStr]) count++;
  }
  return date.toISOString().slice(0, 10);
}

function businessDaysBetweenClient(startText, endText) {
  if (!startText || !endText) return 0;
  const start = new Date(startText + 'T00:00:00');
  const end = new Date(endText + 'T00:00:00');
  let count = 0;
  const holidays = getHolidayMapClient();
  while (start < end) {
    start.setDate(start.getDate() + 1);
    const day = start.getDay();
    const dateStr = start.toISOString().slice(0, 10);
    if (day !== 0 && day !== 6 && !holidays[dateStr]) count++;
  }
  return Math.max(0, count);
}

function handleSaveNaskah(e) {
  e.preventDefault();
  const id = document.getElementById('n_id').value;
  const current = mockNaskahDB.find((n) => n.id === id);

  if (!current) return;

  const role = typeof normalizeRole === 'function' ? normalizeRole(state.user.role) : state.user.role;
  const isPicEditor = role === 'pic_editor';
  const isPicLayouter = role === 'pic_layouter';

  // Build payload Ã¯Â¿Â½ always start from current data to preserve untouched fields
  const payload = { ...current };

  if (isPicEditor) {
    // PIC Editor: only update editor assignment + proofreading revision limit. Deadline stays automatic.
    payload.picEditor = getAssigneeValue('n_pic_editor', 'n_pic_editor_manual');
    payload.batasRevisiProofreading = Number(document.getElementById('n_batas_revisi_proofreading').value) || 0;
  } else if (isPicLayouter) {
    // PIC Layouter: only update layouter assignment + layout revision limit. Deadline stays automatic.
    payload.picLayouter = getAssigneeValue('n_pic_layouter', 'n_pic_layouter_manual');
    payload.batasRevisiLayout = Number(document.getElementById('n_batas_revisi_layout').value) || 0;
  } else {
    // Full access: update semua field
    payload.tanggal = document.getElementById('n_tanggal').value;
    payload.batasRevisiProofreading = Number(document.getElementById('n_batas_revisi_proofreading').value) || 0;
    payload.batasRevisiLayout = Number(document.getElementById('n_batas_revisi_layout').value) || 0;
    payload.picEditor = getAssigneeValue('n_pic_editor', 'n_pic_editor_manual');
    payload.picLayouter = getAssigneeValue('n_pic_layouter', 'n_pic_layouter_manual');
    payload.statusEditor = current.statusEditor || 'Menunggu';
    payload.statusLayouter = current.statusLayouter || 'Menunggu';
    payload.revisiProofreading = current.revisiProofreading || 0;
    payload.revisiLayout = current.revisiLayout || 0;
    payload.statusIsbn = current.statusIsbn || 'Menunggu';
    payload.tindakanIsbn = current.tindakanIsbn || '';
    payload.deadlines = {
      proofreading: document.getElementById('n_dl_proofreading').value,
      layout: document.getElementById('n_dl_layout').value,
      produksi: document.getElementById('n_dl_produksi').value
    };
  }

  const submitNaskah = (password = '') => {
    payload._userRole = role;
    if (password) payload.picAssignAuthPassword = password;
    Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res?.message || res?.error || 'Pengaturan produksi gagal disimpan.', 'error');
        return;
      }
      closeModal('modalNaskah');
      if (state.activeTab === 'naskah_baru' && typeof loadPicNaskahBaru === 'function') loadPicNaskahBaru();
      else loadNaskah();
      Swal.fire('Tersimpan!', 'Pengaturan produksi berhasil diperbarui.', 'success');
    }).withFailureHandler((error) => showServerError('Gagal Menyimpan Naskah', error)).saveNaskahData(payload);
  };

  const stageKey = isPicEditor ? 'proofreading' : isPicLayouter ? 'layout' : '';
  const assigneeField = isPicEditor ? 'picEditor' : isPicLayouter ? 'picLayouter' : '';
  const unlock = window._picAssignmentUnlock || {};
  const unlockedPassword = unlock.naskahId === current.id && unlock.stageKey === stageKey ? unlock.password : '';
  const assigningEarly = stageKey && assigneeField &&
    String(payload[assigneeField] || '').trim() &&
    String(payload[assigneeField] || '').trim() !== String(current[assigneeField] || '').trim() &&
    false;

  if (assigningEarly && !unlockedPassword) {
    Swal.fire({
      title: 'Buka Kunci Penugasan?',
      text: 'Belum masuk jadwal deadline. Masukkan password otorisasi dari manajemen untuk menugaskan lebih cepat.',
      icon: 'warning',
      input: 'password',
      inputPlaceholder: 'Password otorisasi',
      showCancelButton: true,
      confirmButtonText: 'Buka Kunci & Simpan',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#0f172a',
      inputValidator: (value) => !value ? 'Password wajib diisi.' : undefined
    }).then((result) => {
      if (!result.isConfirmed) return;
      submitNaskah(result.value || '');
    });
    return;
  }

  submitNaskah(assigningEarly ? unlockedPassword : '');
}

function parseTrackingDelaysClient(value) {
  const normalize = (raw) => {
    const result = {};
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return result;
    Object.keys(raw).forEach((stageKey) => {
      const list = Array.isArray(raw[stageKey]) ? raw[stageKey] : [raw[stageKey]];
      result[stageKey] = list.
      filter(Boolean).
      map((item, idx) => ({
        id: item.id || "TD-".concat(String(stageKey).toUpperCase(), "-").concat(idx + 1),
        days: Number(item.days || 0),
        reasonCode: item.reasonCode || '',
        note: item.note || '',
        reason: item.reason || 'Estimasi tahapan membutuhkan penyesuaian.',

      })).

    return Swal.fire('No HP Tidak Tersedia', 'Naskah ini tidak memiliki No HP penulis.', 'error');
  }
  
  let formattedPhone = phoneStr.replace(/\D/g, '');
  if (formattedPhone.startsWith('0')) {
    formattedPhone = '62' + formattedPhone.substring(1);
  }
  
  const template = window._whatsAppTrackingTemplate || 'Halo {{nama_penulis}}, progres naskah {{judul_naskah}} tahap {{tahap_saat_ini}}. Kode tracking: {{kode_tracking}}. Estimasi: {{estimasi_selesai}}';
  
  const timeline = n.timeline || 'Administrasi';
  const deadlines = n.deadlines || {};
  let estimasiSelesai = 'Belum ditentukan';
  
  if (timeline === 'Proofreading' && deadlines.proofreading) estimasiSelesai = window.formatDateShort ? formatDateShort(deadlines.proofreading) : deadlines.proofreading;
  else if (timeline === 'Desain Cover & Layout' && deadlines.layout) estimasiSelesai = window.formatDateShort ? formatDateShort(deadlines.layout) : deadlines.layout;
  else if (deadlines.selesai) estimasiSelesai = window.formatDateShort ? formatDateShort(deadlines.selesai) : deadlines.selesai;
  else if (timeline === 'Selesai Cetak' && deadlines.cetak) estimasiSelesai = window.formatDateShort ? formatDateShort(deadlines.cetak) : deadlines.cetak;
  
  let message = template
    .replace(/\{\{nama_penulis\}\}/g, n.penulis || 'Penulis')
    .replace(/\{\{judul_naskah\}\}/g, n.judul || 'Naskah')
    .replace(/\{\{tahap_saat_ini\}\}/g, timeline)
    .replace(/\{\{kode_tracking\}\}/g, n.trackingCode || '-')
    .replace(/\{\{estimasi_selesai\}\}/g, estimasiSelesai);
    
  const encodedMessage = encodeURIComponent(message);
  window.open('https://wa.me/' + formattedPhone + '?text=' + encodedMessage, '_blank');
}

function isBeforeKpiActiveDate(activeDate) {

function updateNaskahField(id, field, value) {
  const naskah = mockNaskahDB.find((n) => n.id === id);
  if (naskah) {
    const oldVal = naskah[field] || 0;
    naskah[field] = field.includes('revisi') ? Number(value) : value;

    // LOGIC: Catat kendala jika revisi melebihi jatah
    if (field === 'revisiProofreading') {
      const limit = naskah.batasRevisiProofreading || 0;

      // Hanya catat jika ada penambahan (value baru > value lama) dan melampaui limit
      if (Number(value) > limit && Number(value) > oldVal) {
        logKendala(naskah, 'Revisi Over Limit', "Revisi Proofreading bertambah menjadi ".concat(value, "x, melebihi batas maksimal (").concat(limit, "x)."));
      }
    } else if (field === 'revisiLayout') {
      const limit = naskah.batasRevisiLayout || 0;

      if (Number(value) > limit && Number(value) > oldVal) {
        logKendala(naskah, 'Revisi Over Limit', "Revisi Layout bertambah menjadi ".concat(value, "x, melebihi batas maksimal (").concat(limit, "x)."));
      }
    }

    gas.withSuccessHandler(() => {
      if (state.activeTab === 'progres') loadProgres();
    }).saveNaskahData(naskah);
  }
}

function updateIsbnStatus(id, value) {
  const naskah = mockNaskahDB.find((n) => n.id === id);
  if (naskah) {
    naskah.statusIsbn = value;
    if (value === 'Diperbaiki') {
      // LOGIC: Catat kendala jika ISBN perlu diperbaiki
      logKendala(naskah, 'ISBN Diperbaiki', 'Pengajuan ISBN dikembalikan/perlu diperbaiki oleh Perpusnas.');

    gas.withSuccessHandler(() => {

    }).saveNaskahData(naskah);
  }
}

function populatePenerbitDropdown(selectId, selectedValue = '', callback = null) {
  gas.withSuccessHandler((res) => {
    const select = document.getElementById(selectId);
    if (!select) return; // Safeguard DOM
    select.innerHTML = '<option value="">Pilih Penerbit</option>';
    (res?.data?.penerbit || []).forEach((p) => {
      const option = document.createElement('option');
      option.value = p.nama;
      option.textContent = p.nama;
      if (p.nama === selectedValue) option.selected = true;
      select.appendChild(option);
    });
    if (callback) callback(); // Panggil fungsi selanjutnya (update paket)
  }).getSettingsData();
}

function updatePaketDropdown(penerbitId, paketId, selectedValue = '', callback = null) {
  const penerbitEl = document.getElementById(penerbitId);
  if (!penerbitEl) return;
  const penerbitNama = penerbitEl.value;

  gas.withSuccessHandler((res) => {
    const paketSelect = document.getElementById(paketId);
    if (!paketSelect) return; // Safeguard DOM
    paketSelect.innerHTML = '<option value="">Pilih Paket</option>';

    const pub = (res?.data?.penerbit || []).find((p) => p.nama === penerbitNama);
    if (pub && pub.paket) {
      pub.paket.forEach((p) => {
        const option = document.createElement('option');
        option.value = p;
        option.textContent = p;
        if (p === selectedValue) option.selected = true;
        paketSelect.appendChild(option);
      });
    } else {
      paketSelect.innerHTML = '<option value="">Pilih Penerbit Dulu</option>';
    }
    if (callback) callback();
  }).getSettingsData();
}

function populatePICDropdowns(selectedEditor = '', selectedLayouter = '', callback = null) {
  gas.withSuccessHandler((res) => {
    const picEditorSelect = document.getElementById('n_pic_editor');
    const picLayouterSelect = document.getElementById('n_pic_layouter');
    const data = res?.data || [];

    if (picEditorSelect) {
      const knownEditors = data.filter((u) => u.role === 'editor' || u.role === 'pic_editor').map((u) => u.nama);
      picEditorSelect.innerHTML = '<option value="">Pilih Editor...</option>';
      // Show editors and PIC Editor so PIC can assign proofreading to themselves when needed.
      knownEditors.forEach((nama) => {
        picEditorSelect.innerHTML += "<option value=\"".concat(nama, "\" ").concat(nama === selectedEditor ? 'selected' : '', ">").concat(nama, "</option>");
      });
      picEditorSelect.innerHTML += '<option value="__manual__">Lainnya / Freelance</option>';
      if (selectedEditor && !knownEditors.includes(selectedEditor)) {
        picEditorSelect.value = '__manual__';
        const manual = document.getElementById('n_pic_editor_manual');
        if (manual) manual.value = selectedEditor;
      }
      picEditorSelect.onchange = () => toggleManualAssignee('n_pic_editor', 'n_pic_editor_manual');
      toggleManualAssignee('n_pic_editor', 'n_pic_editor_manual');
    }

    if (picLayouterSelect) {
      const knownLayouters = data.filter((u) => u.role === 'layouter' || u.role === 'pic_layouter').map((u) => u.nama);
      picLayouterSelect.innerHTML = '<option value="">Pilih Layouter...</option>';
      // Show layouters and PIC Layouter so PIC can assign layout to themselves when needed.
      knownLayouters.forEach((nama) => {
        picLayouterSelect.innerHTML += "<option value=\"".concat(nama, "\" ").concat(nama === selectedLayouter ? 'selected' : '', ">").concat(nama, "</option>");
      });
      picLayouterSelect.innerHTML += '<option value="__manual__">Lainnya / Freelance</option>';
      if (selectedLayouter && !knownLayouters.includes(selectedLayouter)) {
        picLayouterSelect.value = '__manual__';
        const manual = document.getElementById('n_pic_layouter_manual');
        if (manual) manual.value = selectedLayouter;
      }
      picLayouterSelect.onchange = () => toggleManualAssignee('n_pic_layouter', 'n_pic_layouter_manual');
      toggleManualAssignee('n_pic_layouter', 'n_pic_layouter_manual');
    }

    if (callback) callback();
  }).getUsersData();
}
