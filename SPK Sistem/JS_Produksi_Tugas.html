<script>

// --- MODUL MANAJEMEN PRODUKSI & TUGAS TIM KREATIF ---

function showNaskahSpesifikasiCetak(id) {
  const naskah = (window._progressNaskahCache || mockNaskahDB || []).find((row) => String(row.id || '') === String(id || ''));
  if (!naskah) {
    Swal.fire('Data Tidak Ditemukan', 'Spesifikasi cetak belum tersedia. Coba muat ulang Tracking Progres.', 'warning');
    return;
  }
  Swal.fire({
    title: 'Spesifikasi Cetak',
    html: `<div class="text-left text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">${reportSafeText(naskah.spesifikasiCetak || 'Spesifikasi cetak belum diisi.')}</div>`,
    confirmButtonColor: '#4763FD',
    confirmButtonText: 'Tutup'
  });
}

function loadProgres() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const isCsProgressView = state.activeTab === 'naskah_diproses_cs';
    const isReadOnlyProgress = isCsProgressView || state.user.role === 'manajemen' || state.user.role === 'pimpinan';
    const showCancelledProgress = !isCsProgressView && window._progressShowCancelled === true;
    const allProgressRows = res?.data || [];
    mockNaskahDB = allProgressRows || mockNaskahDB || [];
    window._progressNaskahCache = mockNaskahDB;
    const data = allProgressRows.filter((n) => {
      const naskahSource = String(n.source || '').toLowerCase();
      const isMigrasiManajemen = naskahSource === 'migrasi' || String(n.cs || '').toLowerCase() === 'migrasi manajemen';
      const csOwner = String(n.cs || '').trim().toLowerCase();
      const currentCsName = String(state.user.nama || '').trim().toLowerCase();
      const currentCsUsername = String(state.user.username || '').trim().toLowerCase();
      const matchesOwner = !isCsProgressView || isMigrasiManajemen || csOwner === currentCsName || csOwner === currentCsUsername;
      const nUser = String(n.assignedCssUsername || '').trim().toLowerCase();
      const nName = String(n.assignedCssName || '').trim().toLowerCase();
      const uUser = String(state.user.username || '').trim().toLowerCase();
      const uName = String(state.user.nama || '').trim().toLowerCase();
      const matchesCssAssignment = state.user.role !== 'css' ||
      nUser === uUser || nUser === uName && uName || nName === uUser || nName === uName && uName;
      const matchesStatus = showCancelledProgress ?
      isNaskahCancelled(n) :
      (n.statusProses === 'Siap Proses' || !n.statusProses || isMigrasiManajemen) && !isNaskahCancelled(n);
      return matchesOwner && matchesCssAssignment && matchesStatus;
    });

    const safeText = (value) => String(value || '-').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);
    const safeAttr = (value) => String(value || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[ch]);
    const formatDateShort = (value) => {
      if (!value) return '-';
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
    };
    const stepIcon = (step) => ({
      'Administrasi': 'fa-file-signature',
      'Proofreading': 'fa-pen-nib',
      'Desain Cover & Layout': 'fa-object-group',
      'ISBN': 'fa-barcode',
      'Produksi': 'fa-print',
      'Distribusi': 'fa-truck-fast',
      'Selesai': 'fa-flag-checkered'
    })[step] || 'fa-circle-check';
    const getEffectiveProgressStage = (n) => {
      const storedIdx = timelineSteps.indexOf(n.timeline);
      const proofIdx = timelineSteps.indexOf('Proofreading');
      const layoutIdx = timelineSteps.indexOf('Desain Cover & Layout');
      const produksiIdx = timelineSteps.indexOf('Produksi');
      let effectiveIdx = storedIdx < 0 ? 0 : storedIdx;
      if (!naskahNeedsProofreading(n) || n.statusEditor === 'Complete') {
        if (effectiveIdx <= proofIdx) effectiveIdx = layoutIdx;
      }
      if (n.statusLayouter === 'Complete') {
        if (effectiveIdx <= layoutIdx) effectiveIdx = produksiIdx;
      }
      return timelineSteps[effectiveIdx] || n.timeline || timelineSteps[0];
    };
    window._progressSearch = window._progressSearch || '';
    window._progressPublisher = window._progressPublisher || '';
    window._progressStage = window._progressStage || '';
    window._progressPage = Number(window._progressPage || 1);
    window.setProgressSearch = (value) => {window._progressSearch = value || '';window._progressPage = 1;loadProgres();};
    window.setProgressPublisher = (value) => {window._progressPublisher = value || '';window._progressPage = 1;loadProgres();};
    window.setProgressStage = (value) => {window._progressStage = value || '';window._progressPage = 1;loadProgres();};
    window.setProgressPage = (page) => {window._progressPage = Number(page || 1);loadProgres();};
    const searchText = String(window._progressSearch || '').toLowerCase();
    const publishers = [...new Set(data.map((n) => n.penerbit).filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b)));
    const filteredData = data.filter((n) => {
      const haystack = [n.judul, n.penulis, n.trackingCode, n.penerbit, n.paket, n.picEditor, n.picLayouter].map((v) => String(v || '').toLowerCase()).join(' ');
      return (!searchText || haystack.includes(searchText)) && (
      !window._progressPublisher || n.penerbit === window._progressPublisher) && (
      !window._progressStage || getEffectiveProgressStage(n) === window._progressStage);
    });
    const pageSize = 10;
    const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
    if (window._progressPage > totalPages) window._progressPage = totalPages;
    if (window._progressPage < 1) window._progressPage = 1;
    const pageStart = (window._progressPage - 1) * pageSize;
    const pagedData = filteredData.slice(pageStart, pageStart + pageSize);

    content.innerHTML = "\n                    <div class=\"space-y-6\">\n                        <div class=\"flex items-center gap-4 text-[11px] font-bold text-slate-300 bg-slate-800 p-3 rounded-2xl border border-slate-700 shadow-sm\"><span class=\"uppercase tracking-wider text-slate-400\"><i class=\"fa-solid fa-palette mr-1\"></i>Penerbit:</span><div class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded\" style=\"background:#eff6ff;border:1px solid #dbeafe\"></span> Nasmedia</div><div class=\"flex items-center gap-1.5\"><span class=\"w-3 h-3 rounded\" style=\"background:#faf5ff;border:1px solid #f3e8ff\"></span> Idebuku</div></div>\n                        <div class=\"bg-white border border-slate-100 rounded-3xl shadow-sm p-4\">\n                            <div class=\"grid grid-cols-1 ".concat(









      isCsProgressView ? 'lg:grid-cols-[1fr_13rem_13rem_8rem]' : 'lg:grid-cols-[1fr_13rem_13rem_8rem_12rem]', " gap-3\">\n                                <div class=\"relative\">\n                                    <i class=\"fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-sm\"></i>\n                                    <input id=\"progress_search_input\" type=\"text\" value=\"").concat(


      safeAttr(window._progressSearch), "\" onkeydown=\"if(event.key==='Enter') setProgressSearch(this.value)\" placeholder=\"Cari judul, kode, penulis, penerbit, PIC...\" class=\"w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-accent-600 text-sm font-semibold\">\n                                </div>\n                                <select onchange=\"setProgressPublisher(this.value)\" class=\"w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-accent-600 text-sm font-bold bg-white\">\n                                    <option value=\"\">Semua Penerbit</option>\n                                    ").concat(



      publishers.map((p) => "<option value=\"".concat(safeAttr(p), "\" ").concat(window._progressPublisher === p ? 'selected' : '', ">").concat(safeText(p), "</option>")).join(''), "\n                                </select>\n                                <select onchange=\"setProgressStage(this.value)\" class=\"w-full px-4 py-3 rounded-2xl border border-slate-200 outline-none focus:border-accent-600 text-sm font-bold bg-white\">\n                                    <option value=\"\">Semua Tahap</option>\n                                    ").concat(



      timelineSteps.map((step) => "<option value=\"".concat(safeAttr(step), "\" ").concat(window._progressStage === step ? 'selected' : '', ">").concat(safeText(step), "</option>")).join(''), "\n                                </select>\n                                <button onclick=\"setProgressSearch(document.getElementById('progress_search_input')?.value || '')\" class=\"px-4 py-3 rounded-2xl bg-accent-600 hover:bg-accent-700 text-white text-sm font-black shadow-sm\"><i class=\"fa-solid fa-search mr-2\"></i>Cari</button>\n                                ").concat(


      !isCsProgressView ? "<button onclick=\"window._progressShowCancelled=!window._progressShowCancelled; window._progressPage=1; loadProgres()\" class=\"px-4 py-3 rounded-2xl ".concat(showCancelledProgress ? 'bg-red-50 text-red-600 border-red-100' : 'bg-slate-50 text-slate-600 border-slate-200', " border text-sm font-black hover:border-red-200 hover:text-red-600\">\n                                    <i class=\"fa-solid ").concat(
        showCancelledProgress ? 'fa-list-check' : 'fa-ban', " mr-2\"></i>").concat(showCancelledProgress ? 'Tampilkan Aktif' : 'Naskah Batal', "\n                                </button>") :
      '', "\n                            </div>\n                            <div class=\"mt-3 text-xs font-bold text-slate-400\">Menampilkan ").concat(

      pagedData.length, " dari ").concat(filteredData.length, " progress").concat(showCancelledProgress ? ' dibatalkan' : '', ". Halaman ").concat(window._progressPage, " / ").concat(totalPages, "</div>\n                        </div>\n\n                        ").concat(


      pagedData.map((n) => {
        let alertsHTML = '';
        const storedIdx = timelineSteps.indexOf(n.timeline);
        const proofIdx = timelineSteps.indexOf('Proofreading');
        const layoutIdx = timelineSteps.indexOf('Desain Cover & Layout');
        const produksiIdx = timelineSteps.indexOf('Produksi');
        let effectiveIdx = storedIdx < 0 ? 0 : storedIdx;
        let autoProof = false;
        let autoLayout = false;
        const skipProofreading = !naskahNeedsProofreading(n);

        if (skipProofreading || n.statusEditor === 'Complete') {
          autoProof = true;
          if (effectiveIdx <= proofIdx) effectiveIdx = layoutIdx;
        }
        if (n.statusLayouter === 'Complete') {
          autoLayout = true;
          if (effectiveIdx <= layoutIdx) effectiveIdx = produksiIdx;
        }

        const effectiveTimeline = timelineSteps[effectiveIdx] || n.timeline || timelineSteps[0];
        const delaySummary = getTrackingDelaySummary(n);
        const delayDetailButton = "<button type=\"button\" data-tracking-delay-detail=\"".concat(safeAttr(n.id), "\" class=\"px-3 py-2 bg-amber-50 hover:bg-amber-100 text-amber-600 border border-amber-100 rounded-xl text-[10px] font-black tracking-wider transition-colors cursor-pointer relative z-10\"><i class=\"fa-solid fa-clock mr-1\"></i>Delay").concat(delaySummary.length ? " (".concat(delaySummary.length, ")") : '', "</button>");
        const detailNaskahBtn = "<button type=\"button\" onclick=\"viewDetailNaskah('".concat(safeAttr(n.id), "')\" class=\"px-3 py-2 bg-blue-50 hover:bg-blue-100 text-accent-600 border border-blue-100 rounded-xl text-[10px] font-black tracking-wider transition-colors cursor-pointer relative z-10\"><i class=\"fa-solid fa-circle-info mr-1\"></i>Detail</button>");
        const spesifikasiCetakBtn = state.user.role === 'css' ? "<button type=\"button\" onclick=\"showNaskahSpesifikasiCetak('".concat(
          safeAttr(n.id), "')\" class=\"px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-100 rounded-xl text-[10px] font-black tracking-wider transition-colors cursor-pointer relative z-10\"><i class=\"fa-solid fa-print mr-1\"></i>Lihat Spesifikasi Cetak</button>") : '';
        const trackingCode = String(n.trackingCode || '').trim();
        const trackingCodeBadge = trackingCode ? "<button type=\"button\" onclick=\"copyTrackingCode('".concat(
          safeAttr(trackingCode), "')\" class=\"mt-2 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-accent-50 hover:bg-accent-100 border border-accent-100 text-accent-700 text-[10px] font-black tracking-wider transition\">\n                            <i class=\"fa-solid fa-barcode\"></i>\n                            <span>Kode: ").concat(

          safeText(trackingCode), "</span>\n                            <i class=\"fa-solid fa-copy text-[9px]\"></i>\n                       </button>") : "<div class=\"mt-2 inline-flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 border border-slate-100 text-slate-400 text-[10px] font-black tracking-wider\">\n                            <i class=\"fa-solid fa-barcode\"></i>\n                            <span>Kode: -</span>\n                       </div>";
        const phoneButton = "<button type=\"button\" onclick=\"viewNaskahPhone('".concat(
          safeAttr(n.id), "')\" class=\"inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-100 text-emerald-700 text-[10px] font-black tracking-wider transition\">\n                            <i class=\"fa-solid fa-phone\"></i>\n                            <span>No HP</span>\n                       </button>");
        const whatsappButton = "<button type=\"button\" onclick=\"sendWhatsAppTracking('".concat(
          safeAttr(n.id), "')\" class=\"inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-green-500 hover:bg-green-600 border border-green-500 text-white text-[10px] font-black tracking-wider transition shadow-sm\">\n                            <i class=\"fa-brands fa-whatsapp\"></i>\n                            <span>Chat WA</span>\n                       </button>");






        if (effectiveIdx > storedIdx) {
          n.timeline = effectiveTimeline;
          const naskahRef = mockNaskahDB.find((x) => x.id === n.id);
          if (naskahRef) naskahRef.timeline = effectiveTimeline;
        }

        // Deadline tetap ditampilkan pada timeline; alert keterlambatan tidak ditampilkan di sistem utama.

        let autoBadges = '';

        const cssSelectableSteps = timelineSteps.filter((s, i) => i >= effectiveIdx);
        const progressPct = Math.max(0, Math.min(100, effectiveIdx / Math.max(timelineSteps.length - 1, 1) * 100));
        const importantDates = {
          'Administrasi': n.tanggal,
          'Proofreading': n.deadlines?.proofreading,
          'Desain Cover & Layout': n.deadlines?.layout
        };
        let statusBadge = '';
        let cancelButton = '';
        if (state.user.role === 'css' && isNaskahCancelled(n)) {
          statusBadge = "<div class=\"flex flex-wrap items-center gap-2\"><div class=\"text-xs px-4 py-2 border rounded-xl bg-red-50 font-bold text-red-600 border-red-100\"><i class=\"fa-solid fa-ban mr-1\"></i>Dibatalkan</div><div class=\"text-[10px] text-slate-400 max-w-xs\">".concat(safeText(n.cancelReason || 'Tanpa alasan'), "</div></div>");
        } else {
          cancelButton = state.user.role === 'css' ? "<button type=\"button\" onclick=\"requestDeleteNaskah('".concat(n.id, "')\" class=\"px-3 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl text-[10px] font-black tracking-wider shadow-sm transition-colors\"><i class=\"fa-solid fa-ban mr-1\"></i>Batalkan</button>") : '';
          
          if (isReadOnlyProgress || state.user.role === 'css' || (state.user.role !== 'pic_editor' && state.user.role !== 'pic_layouter')) {
             statusBadge = "<div class=\"text-xs px-4 py-2 border rounded-xl bg-white font-bold text-slate-600 border-slate-200 inline-block\">Status: <span class=\"text-accent-600\">".concat(safeText(effectiveTimeline), "</span></div>");
          } else {
             statusBadge = "<select onchange=\"updateNaskahTimeline('".concat(n.id, "', this.value)\" class=\"text-xs p-2 border rounded-xl bg-white font-bold outline-none border-slate-200 inline-block\">").concat(cssSelectableSteps.map((s) => "<option value=\"".concat(s, "\" ").concat(effectiveTimeline === s ? 'selected' : '', ">").concat(s, "</option>")).join(''), "</select>");
          }
        }



        const isNasmedia = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('nasmedia');
        const isIdebuku = String(n.penerbit || '').toLowerCase().replace(/\s/g, '').includes('idebuku');
        const rowStyle = isNasmedia ? 'background-color: #eff6ff !important;' : isIdebuku ? 'background-color: #faf5ff !important;' : '';
        return "\n                            <div class=\"rounded-3xl border border-slate-100 shadow-sm overflow-hidden transition-colors \" style=\"".concat(rowStyle, "\">\n                                <div class=\"px-6 py-3 border-b border-slate-100 flex flex-col xl:flex-row xl:items-center justify-between gap-4\">\n                                    <div class=\"min-w-0\">\n                                        <h4 class=\"font-black text-lg text-slate-900 truncate\">").concat(
          safeText(n.judul), " <span class=\"text-slate-300 mx-1\">||</span> <span class=\"text-sm text-slate-500\">").concat(
          safeText(n.penulis), "</span></h4>\n                                        ").concat(
          "<div>", trackingCodeBadge, "</div><div class=\"mt-2\">", statusBadge, "</div>\n                                        ").concat(
          alertsHTML || autoBadges ? "<div class=\"flex flex-wrap gap-1.5 mt-2\">".concat(autoBadges).concat(alertsHTML, "</div>") : '', "\n                                    </div>\n                                    <div class=\"flex flex-wrap items-center gap-2\">").concat(
          
          detailNaskahBtn).concat(spesifikasiCetakBtn).concat(delayDetailButton).concat(whatsappButton).concat(phoneButton).concat(cancelButton, "</div>\n                                </div>\n\n                                <div class=\"p-4 lg:p-6\">\n                                    <div class=\"overflow-x-auto custom-scroll pb-2\">\n                                        <div class=\"relative min-w-[900px] px-6 pt-4 pb-6\">\n                                            <div class=\"absolute left-10 right-10 h-3 rounded-full bg-accent-50 overflow-hidden\" style=\"top: 26px;\">\n                                                <div class=\"h-full rounded-full bg-gradient-to-r from-emerald-400 to-accent-600\" style=\"width:").concat(
          progressPct, "%\"></div>\n                                            </div>\n                                            <div class=\"grid\" style=\"grid-template-columns: repeat(").concat(

          timelineSteps.length, ", minmax(120px, 1fr));\">\n                                                ").concat(
          timelineSteps.map((step, idx) => {
            const isCurrent = effectiveTimeline === step;
            const isPast = effectiveIdx >= idx;
            const isBypassed = idx === proofIdx && skipProofreading;
            return `
                                                    <div class="relative flex flex-col items-center text-center px-3">
                                                        <div class="relative z-10 w-8 h-8 rounded-full ${
              isCurrent ? 'bg-accent-600 text-white shadow-lg shadow-accent-600/30' : isPast ? isBypassed ? 'bg-red-500 text-white' : 'bg-white text-accent-600 border-2 border-accent-600' : 'bg-white text-slate-300 border-2 border-accent-100'} flex items-center justify-center">
                                                            <i class="fa-solid ${
              isPast ? isBypassed ? 'fa-forward-step' : 'fa-check' : stepIcon(step)} text-[10px]"></i>
                                                        </div>
                                                        <div class="mt-2 text-xs font-black ${
              isCurrent ? 'text-slate-900' : isPast ? 'text-slate-700' : 'text-slate-400'}">${safeText(step)}</div>
                                                        <div class="text-[10px] text-slate-400 mt-1 leading-tight">${
              isCurrent ? 'Tahap aktif' : isPast ? isBypassed ? 'Langsung Layout' : 'Selesai' : 'Menunggu'}</div>
                                                        <div class="text-[11px] font-black ${
              isPast ? 'text-accent-600' : 'text-slate-400'} mt-2">${formatDateShort(importantDates[step])}</div>
                                                        ${
              isBypassed && isPast ? '<span class="mt-2 px-2 py-0.5 rounded-full bg-red-50 text-red-600 text-[8px] font-black border border-red-100">BYPASS</span>' : ''}
                                                    </div>
                                                `;


          }).join(''), "\n                                            </div>\n                                        </div>\n                                    </div>\n                                </div>\n                            </div>\n                        ");





      }).join(''), "\n                        ").concat(
      filteredData.length === 0 ? '<div class="text-center py-10 text-slate-400 italic">Tidak ada progress yang cocok dengan pencarian/filter.</div>' : '', "\n                        ").concat(
      filteredData.length > 0 ? "\n                            <div class=\"flex flex-wrap items-center justify-between gap-3 bg-white border border-slate-100 rounded-3xl shadow-sm p-4\">\n                                <button onclick=\"setProgressPage(".concat(

        Math.max(1, window._progressPage - 1), ")\" ").concat(window._progressPage <= 1 ? 'disabled' : '', " class=\"px-4 py-2 rounded-xl border border-slate-200 text-xs font-black ").concat(window._progressPage <= 1 ? 'text-slate-300 cursor-not-allowed' : 'text-slate-600 hover:border-accent-300 hover:text-accent-600', "\"><i class=\"fa-solid fa-chevron-left mr-2\"></i>Sebelumnya</button>\n                                <div class=\"flex flex-wrap gap-1\">\n                                    ").concat(

        Array.from({ length: totalPages }, (_, i) => i + 1).map((page) => "<button onclick=\"setProgressPage(".concat(page, ")\" class=\"w-9 h-9 rounded-xl text-xs font-black ").concat(page === window._progressPage ? 'bg-accent-600 text-white' : 'bg-slate-50 text-slate-500 hover:bg-accent-50 hover:text-accent-600', "\">").concat(page, "</button>")).join(''), "\n                                </div>\n                                <button onclick=\"setProgressPage(").concat(

        Math.min(totalPages, window._progressPage + 1), ")\" ").concat(window._progressPage >= totalPages ? 'disabled' : '', " class=\"px-4 py-2 rounded-xl border border-slate-200 text-xs font-black ").concat(window._progressPage >= totalPages ? 'text-slate-300 cursor-not-allowed' : 'text-slate-600 hover:border-accent-300 hover:text-accent-600', "\">Selanjutnya<i class=\"fa-solid fa-chevron-right ml-2\"></i></button>\n                            </div>\n                        ") :

      '', "\n                    </div>\n                ");


    content.querySelectorAll('[data-tracking-delay-detail]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        openTrackingDelayDetail(button.dataset.trackingDelayDetail);
      });
    });
  }).getNaskahData();
}


function getHiddenTugasNaskahKey() {
  return 'hidden_tugas_naskah_' + (state.user && state.user.username || 'guest');
}


function getHiddenTugasNaskahIds() {
  try {
    const parsed = JSON.parse(localStorage.getItem(getHiddenTugasNaskahKey()) || '[]');
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}


function setHiddenTugasNaskahIds(ids) {
  localStorage.setItem(getHiddenTugasNaskahKey(), JSON.stringify([...new Set(ids)]));
}


function hideCompletedTugasNaskah(id) {
  const ids = getHiddenTugasNaskahIds();
  if (!ids.includes(id)) ids.push(id);
  setHiddenTugasNaskahIds(ids);
  window._tugasNaskahPage = 1;
  loadTugasNaskah();
}


function restoreHiddenTugasNaskah(id) {
  setHiddenTugasNaskahIds(getHiddenTugasNaskahIds().filter((item) => item !== id));
  loadTugasNaskah();
}


function loadTugasNaskah() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    mockNaskahDB = res?.data || [];
    const data = mockNaskahDB.filter((n) => {
      const isReadyProcess = n.statusProses === 'Siap Proses' || !n.statusProses;
      const isCsSource = String(n.source || '').toLowerCase() === 'cs';
      const isCsProductionActive = !isCsSource ||
        String(n.intakeStatus || '').toLowerCase() === 'production_started' ||
        !!String(n.productionStartedAt || '').trim() ||
        n.statusProses === 'Siap Proses';
      return isReadyProcess && !isNaskahCancelled(n) && isCsProductionActive;
    });

    const userNameKey = String(state.user.nama || '').trim().toLowerCase();
    const userUsernameKey = String(state.user.username || '').trim().toLowerCase();
    const assignedToCurrentUser = (value) => {
      const assigneeKey = String(value || '').trim().toLowerCase();
      return assigneeKey && (assigneeKey === userNameKey || assigneeKey === userUsernameKey);
    };
    const myNaskah = data.filter((n) => {
      const workflowStage = String(n.workflowStage || '').toLowerCase();
      const editorDone = ['done', 'complete', 'selesai'].includes(String(n.statusEditor || '').toLowerCase());

function loadDetailTimNonTarget() {
  gas.withSuccessHandler((res) => {

    const roles = ['admin', 'css', 'campaign', 'admin_marketplace'];
    const groups = users.filter((u) => roles.includes(normalizeRole(u.role))).map((u) => {
      const userKpi = kpi.filter((row) => row.picName === u.nama && String(row.tanggal || '').startsWith(currentMonth));

      }).filter(Boolean);
      const avgPct = items.length ? Math.round(items.reduce((sum, item) => sum + item.pct, 0) / items.length) : 0;
      return { nama: u.nama, role: getRoleLabel(u.role), items, avgPct };

      currentMonth, ").</p></div>\n                        ").concat(
      renderReportTargetCards(targetCards, 'detail_tim_non_target_target'), "\n                        <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-5\">\n                            ").concat(

      groups.map((group) => "\n                                <div class=\"bg-white border border-slate-100 shadow-sm overflow-hidden\">\n                                    <div class=\"px-5 py-4 border-b border-accent-100 bg-accent-50/60 flex items-center gap-3\">\n                                        <div class=\"w-10 h-10 rounded-xl bg-accent-600 text-white flex items-center justify-center font-black\">".concat(


        reportSafeText(String(group.nama || 'T').charAt(0).toUpperCase()), "</div>\n                                        <div>\n                                            <div class=\"text-[10px] font-black text-accent-500 uppercase tracking-widest\">").concat(

        reportSafeText(group.role), "</div>\n                                            <div class=\"font-black text-slate-900\">").concat(
        reportSafeText(group.nama), "</div>\n                                        </div>\n                                    </div>\n                                    <div class=\"px-5 py-4 border-b border-slate-100 bg-white\">\n                                        <div class=\"grid grid-cols-2 gap-3 mb-3\">\n                                            <div class=\"bg-slate-50 border border-slate-100 px-3 py-2\"><div class=\"text-[9px] font-black uppercase tracking-widest text-slate-400\">Total Entri</div><div class=\"mt-1 text-lg font-black text-slate-900\">").concat(

function updateTugasNaskahStatus(id, field, val) {
  const naskah = mockNaskahDB.find((n) => n.id === id);
  if (naskah) {
    const isKpiClaimAttempt =
    (state.user.role === 'editor' || state.user.role === 'pic_editor') && field === 'statusEditor' && (val === 'Done' || val === 'Revisi') ||
    (state.user.role === 'layouter' || state.user.role === 'pic_layouter') && field === 'statusLayouter' && (val === 'Done' || String(val).startsWith('Revisi'));

    if (isKpiClaimAttempt && !window._skipKpiActiveCheck) {
      gas.withSuccessHandler((res) => {
        const activeDate = res?.data?.kpiActiveDate || naskah.kpiEligibleFrom || '';
        if (isBeforeKpiActiveDate(activeDate)) {
          saveStatusWithoutKpiBeforeActive(naskah, field, val, activeDate);
          return;
        }
        window._skipKpiActiveCheck = true;
        updateTugasNaskahStatus(id, field, val);
        window._skipKpiActiveCheck = false;
      }).getKpiTransitionSettings();
      return;
    }
    // Logika penyelesaian/klaim KPI Editor
    if ((state.user.role === 'editor' || state.user.role === 'pic_editor') && field === 'statusEditor' && (val === 'Done' || val === 'Revisi')) {
      if (val === 'Done') {
        Swal.fire({
          title: 'Klaim KPI Proofreading',
          html: "Masukkan jumlah kata aktual yang diselesaikan untuk diklaim ke KPI Anda.<br><small class=\"text-slate-500\">Estimasi awal: ".concat(naskah.estimasiKata || 0, " Kata</small>"),
          icon: 'info',
          input: 'number',
          inputValue: naskah.estimasiKata || 0,
          showCancelButton: true,
          confirmButtonColor: '#10b981',
          confirmButtonText: 'Klaim KPI',
          cancelButtonText: 'Batal',
          inputValidator: (value) => {
            if (!value || value <= 0) return 'Jumlah kata tidak valid!';
          }
        }).then((r) => {
          if (r.isConfirmed && r.value) {
            naskah[field] = val;
            const kpiPayload = {
              id: '',
              picName: state.user.nama,
              tanggal: new Date().toISOString().split('T')[0],
              jenis: 'Proofreading',
              judul: naskah.judul,
              jumlahKata: Number(r.value)
            };

            gas.withSuccessHandler(() => {
              gas.withSuccessHandler(() => {
                if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                Swal.fire('Berhasil!', 'Status diubah dan KPI berhasil dicatat.', 'success');
              }).saveNaskahData(naskah);
            }).saveKPIData(kpiPayload);
          } else {
            if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
          }
        });
      } else if (val === 'Revisi') {
        Swal.fire({
          title: 'Klaim Revisi Naskah',
          html:
          '<p class="text-sm text-slate-600 mb-4 text-left">Masukkan poin revisi dan kata tambahan (jika ada). Poin revisi hanya masuk KPI Revisi, kata tambahan masuk capaian kata.</p>' +
          '<div class="text-left space-y-4">' +
          '<div>' +
          '<label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Poin Revisi (KPI Revisi)</label>' +
          '<input type="number" id="swal-revisi" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500 font-bold" value="0" min="0">' +
          '</div>' +
          '<div>' +
          '<label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Kata Tambahan (Masuk KPI Utama)</label>' +
          '<input type="number" id="swal-tambahan" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-emerald-500 font-bold" value="0" min="0">' +
          '</div>' +
          '</div>',
          icon: 'info',
          showCancelButton: true,
          confirmButtonColor: '#f59e0b',
          confirmButtonText: 'Klaim KPI',
          cancelButtonText: 'Batal',
          preConfirm: () => {
            const revisi = document.getElementById('swal-revisi').value;
            const tambahan = document.getElementById('swal-tambahan').value;
            if (revisi === '' || tambahan === '' || Number(revisi) < 0 || Number(tambahan) < 0 || Number(revisi) === 0 && Number(tambahan) === 0) {
              Swal.showValidationMessage('Minimal poin revisi atau kata tambahan harus lebih dari 0!');
            }
            return { revisi: Number(revisi), tambahan: Number(tambahan) };
          }
        }).then((r) => {
          if (r.isConfirmed) {
            naskah[field] = val;
            naskah.revisiProofreading = (naskah.revisiProofreading || 0) + 1;

            const dateNow = new Date().toISOString().split('T')[0];

            const saveKpiTambahan = () => {
              if (r.value.tambahan > 0) {
                gas.withSuccessHandler(() => {
                  gas.withSuccessHandler(() => {
                    if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                    Swal.fire('Berhasil!', 'Status diubah dan semua KPI berhasil dicatat.', 'success');
                  }).saveNaskahData(naskah);
                }).saveKPIData({ id: '', picName: state.user.nama, tanggal: dateNow, jenis: 'Proofreading', judul: naskah.judul + ' (Tambahan Rev-' + naskah.revisiProofreading + ')', jumlahKata: r.value.tambahan });
              } else {
                gas.withSuccessHandler(() => {
                  if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                  Swal.fire('Berhasil!', 'Status diubah dan KPI Revisi berhasil dicatat.', 'success');
                }).saveNaskahData(naskah);
              }
            };

            if (r.value.revisi > 0) {
              gas.withSuccessHandler(() => {
                saveKpiTambahan();
              }).saveKPIData({ id: '', picName: state.user.nama, tanggal: dateNow, jenis: 'Revisi Naskah', judul: naskah.judul + ' (Revisi ke-' + naskah.revisiProofreading + ')', jumlahUmum: r.value.revisi });
            } else {
              saveKpiTambahan();
            }
          } else {
            if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
          }
        });
      }
      return;
    }

    // Logika penyelesaian/klaim KPI Layouter
    if ((state.user.role === 'layouter' || state.user.role === 'pic_layouter') && field === 'statusLayouter' && (val === 'Done' || String(val).startsWith('Revisi'))) {
      if (val === 'Done') {
        Swal.fire({
          title: 'Klaim KPI Layout',
          html: 'Masukkan jumlah halaman aktual yang diselesaikan untuk diklaim ke KPI Anda.<br><small class="text-slate-500">Estimasi awal: ' + (naskah.estimasiHalaman || 0) + ' Hal</small>',
          icon: 'info',
          input: 'number',
          inputValue: naskah.estimasiHalaman || 0,
          showCancelButton: true,
          confirmButtonColor: '#10b981',
          confirmButtonText: 'Klaim KPI',
          cancelButtonText: 'Batal',
          inputValidator: (value) => {
            if (!value || value <= 0) return 'Jumlah halaman tidak valid!';
          }
        }).then((r) => {
          if (r.isConfirmed && r.value) {
            naskah[field] = val;
            const kpiPayload = {
              id: '',
              picName: state.user.nama,
              tanggal: new Date().toISOString().split('T')[0],
              jenis: 'Layout',
              judul: naskah.judul,
              jumlahHalaman: Number(r.value)
            };
            gas.withSuccessHandler(() => {
              gas.withSuccessHandler(() => {
                if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                Swal.fire('Berhasil!', 'Status diubah dan KPI berhasil dicatat.', 'success');
              }).saveNaskahData(naskah);
            }).saveKPIData(kpiPayload);
          } else {
            if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
          }
        });
      } else if (String(val).startsWith('Revisi')) {
        const currentRevision = Number(naskah.revisiLayout || 0);
        if (currentRevision >= 3) {
          Swal.fire('Batas Revisi', 'Revisi layout sudah mencapai Revisi 3. Silakan pilih Complete jika pekerjaan sudah selesai.', 'warning');
          if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
          return;
        }
        const revisionStage = Math.min(currentRevision + 1, 3);
        Swal.fire({
          title: 'Klaim Revisi ' + revisionStage + ' Layout',
          html:
          '<p class="text-sm text-slate-600 mb-4 text-left">Masukkan poin revisi dan halaman tambahan (jika ada). Poin revisi hanya masuk KPI Revisi, halaman tambahan masuk capaian layout.</p>' +
          '<div class="text-left space-y-4">' +
          '<div>' +
          '<label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Poin Revisi (KPI Revisi)</label>' +
          '<input type="number" id="swal-revisi" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-amber-500 font-bold" value="0" min="0">' +
          '</div>' +
          '<div>' +
          '<label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Halaman Tambahan (Masuk KPI Utama)</label>' +
          '<input type="number" id="swal-tambahan" class="w-full p-2 border border-slate-200 rounded-lg outline-none focus:border-emerald-500 font-bold" value="0" min="0">' +
          '</div>' +
          '</div>',
          icon: 'info',
          showCancelButton: true,
          confirmButtonColor: '#f59e0b',
          confirmButtonText: 'Klaim KPI',
          cancelButtonText: 'Batal',
          preConfirm: () => {
            const revisi = document.getElementById('swal-revisi').value;
            const tambahan = document.getElementById('swal-tambahan').value;
            if (revisi === '' || tambahan === '' || Number(revisi) < 0 || Number(tambahan) < 0 || Number(revisi) === 0 && Number(tambahan) === 0) {
              Swal.showValidationMessage('Minimal poin revisi atau halaman tambahan harus lebih dari 0!');
            }
            return { revisi: Number(revisi), tambahan: Number(tambahan) };
          }
        }).then((r) => {
          if (r.isConfirmed) {
            naskah[field] = 'Revisi';
            naskah.revisiLayout = revisionStage;

            const dateNow = new Date().toISOString().split('T')[0];

            const saveKpiTambahan = () => {
              if (r.value.tambahan > 0) {
                gas.withSuccessHandler(() => {
                  gas.withSuccessHandler(() => {
                    if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                    Swal.fire('Berhasil!', 'Revisi ' + revisionStage + ' dicatat. Halaman tambahan masuk ke capaian KPI Layout.', 'success');
                  }).saveNaskahData(naskah);
                }).saveKPIData({ id: '', picName: state.user.nama, tanggal: dateNow, jenis: 'Layout', judul: naskah.judul + ' (Tambahan Revisi ' + revisionStage + ')', jumlahHalaman: r.value.tambahan });
              } else {
                gas.withSuccessHandler(() => {
                  if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
                  Swal.fire('Berhasil!', 'Revisi ' + revisionStage + ' dicatat.', 'success');
                }).saveNaskahData(naskah);
              }
            };

            if (r.value.revisi > 0) {
              gas.withSuccessHandler(() => {
                saveKpiTambahan();
              }).saveKPIData({ id: '', picName: state.user.nama, tanggal: dateNow, jenis: 'Revisi Layout', judul: naskah.judul + ' (Revisi ' + revisionStage + ')', jumlahUmum: r.value.revisi });
            } else {
              saveKpiTambahan();
            }
          } else {
            if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
          }
        });
      }
      return;
    }

    // Logika default untuk status lain
    naskah[field] = val;
    gas.withSuccessHandler(() => {
      if (state.activeTab === 'tugas_naskah') loadTugasNaskah();
      if (val === 'Complete') {
        Swal.fire({
          title: 'Berhasil',
          text: 'Naskah telah diselesaikan.',
          icon: 'success',
          confirmButtonColor: '#10b981'
        });
      }
    }).saveNaskahData(naskah);
  }
}

function populateEvalLayouterDropdown() {
  gas.withSuccessHandler((res) => {
    const select = document.getElementById('kpi_eval_layouter');
    if (!select) return;
    select.innerHTML = '<option value="">Pilih Layouter...</option>';
    const layouters = (res?.data || []).filter((u) => u.role === 'layouter');
    layouters.forEach((u) => {
      select.innerHTML += "<option value=\"".concat(u.nama, "\">").concat(u.nama, "</option>");
    });
    // Hide info panel
    const info = document.getElementById('kpi_eval_info');
    if (info) info.classList.add('hidden');
  }).getUsersData();
}


function loadEvalCapaian() {
  const layouterName = document.getElementById('kpi_eval_layouter')?.value;
  const info = document.getElementById('kpi_eval_info');
  if (!layouterName) {if (info) info.classList.add('hidden');return;}

  // Fetch target and KPI data
  gas.withSuccessHandler((resTarget) => {
    gas.withSuccessHandler((resKPI) => {
      gas.withSuccessHandler((resUsers) => {
        const users = resUsers?.data || [];
        const layouterUser = users.find((u) => u.nama === layouterName && u.role === 'layouter');
        if (!layouterUser) return;

        const targets = resTarget?.data || [];
        const t = targets.find((x) => x.username === layouterUser.username) || {};
        const targetHal = Number(t.targetHalaman || 0);

        const currentMonth = new Date().toISOString().slice(0, 7);
        const kpiAll = (resKPI?.data || []).filter((k) => k.picName === layouterName && String(k.tanggal || '').startsWith(currentMonth));
        let capaianHal = 0;
        kpiAll.forEach((k) => {capaianHal += Number(k.jumlahHalaman || 0);});

        const met = targetHal > 0 ? capaianHal >= targetHal : true;

        document.getElementById('kpi_eval_target_val').textContent = targetHal.toLocaleString('id-ID') + ' Hal';
        document.getElementById('kpi_eval_capaian_val').textContent = capaianHal.toLocaleString('id-ID') + ' Hal';
        const statusEl = document.getElementById('kpi_eval_status_val');
        if (met) {
          statusEl.innerHTML = '<span class="px-2 py-1 bg-emerald-50 text-emerald-600 rounded-lg text-[10px]"><i class="fa-solid fa-check-circle mr-1"></i>Memenuhi Target</span>';
        } else {
          statusEl.innerHTML = '<span class="px-2 py-1 bg-red-50 text-red-600 rounded-lg text-[10px]"><i class="fa-solid fa-times-circle mr-1"></i>Belum Memenuhi Target</span>';
        }
        document.getElementById('kpi_eval_target_hidden').value = targetHal;
        document.getElementById('kpi_eval_capaian_hidden').value = capaianHal;
        document.getElementById('kpi_eval_met_hidden').value = met ? '1' : '0';
        document.getElementById('kpi_judul').value = 'Evaluasi: ' + layouterName;

        if (info) info.classList.remove('hidden');
      }).getUsersData();
    }).getKPIData();
  }).getTargetData();
}
