<script>



// --- DASHBOARD FUNCTIONS ---
function loadDashboardData() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return; // Safeguard
    const data = (res?.data || []).filter((n) => {
      const nUser = String(n.assignedCssUsername || '').trim().toLowerCase();
      const nName = String(n.assignedCssName || '').trim().toLowerCase();

      const uName = String(state.user.nama || '').trim().toLowerCase();

      nUser === uUser || nUser === uName && uName || nName === uUser || nName === uName && uName;

    };

    const timelineStats = timelineSteps.map((step) => ({

    content.innerHTML = "\n                    ".concat(

      state.user.role === 'pic_editor' ? "\n                    <div class=\"mb-6 p-4 bg-violet-50 text-violet-700 rounded-2xl border border-violet-100 flex items-start gap-3\">\n                        <i class=\"fa-solid fa-user-tie mt-0.5 text-lg\"></i>\n                        <div><b>Dashboard PIC Editor</b><br><span class=\"text-sm\">Anda dapat menugaskan tim editor melalui menu <b>Database Naskah</b>. Deadline mengikuti pengaturan paket otomatis.</span></div>\n                    </div>" :



      state.user.role === 'pic_layouter' ? "\n                    <div class=\"mb-6 p-4 bg-teal-50 text-teal-700 rounded-2xl border border-teal-100 flex items-start gap-3\">\n                        <i class=\"fa-solid fa-user-tie mt-0.5 text-lg\"></i>\n                        <div><b>Dashboard PIC Layouter</b><br><span class=\"text-sm\">Anda dapat menugaskan tim layouter melalui menu <b>Database Naskah</b>. Deadline mengikuti pengaturan paket otomatis.</span></div>\n                    </div>" :



      '', "\n                    <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10\">\n                        ").concat(

      renderStatCard('Total Naskah', stats.total, 'fa-book', 'bg-blue-50 text-blue-600'), "\n                        ").concat(
      renderStatCard('Dalam Progres', stats.active, 'fa-spinner fa-spin', 'bg-amber-50 text-amber-600'), "\n                        ").concat(
      renderStatCard('Administrasi', stats.pending, 'fa-clock', 'bg-indigo-50 text-indigo-600'), "\n                        ").concat(
      renderStatCard('Selesai Terbit', stats.done, 'fa-circle-check', 'bg-emerald-50 text-emerald-600'), "\n                    </div>\n\n                    <div class=\"grid grid-cols-1 lg:grid-cols-3 gap-8\">\n                        <div class=\"lg:col-span-2 bg-white p-8 rounded-3xl border border-slate-100 shadow-sm\">\n                            <h3 class=\"font-bold text-slate-800 mb-6 flex items-center gap-2\">\n                                <i class=\"fa-solid fa-chart-simple text-accent-600\"></i> Sebaran Status Naskah\n                            </h3>\n                            <div class=\"flex items-end justify-between h-64 px-4 gap-4\">\n                                ").concat(








      timelineStats.map((s) => "\n                                    <div class=\"flex flex-col items-center flex-1\">\n                                        <div class=\"relative w-full group\">\n                                            <div class=\"chart-bar bg-accent-100 group-hover:bg-accent-600 rounded-t-xl w-full flex items-end justify-center transition-all\" style=\"height: ".concat(


        s.count / maxCount * 100, "%\">\n                                                <span class=\"text-[10px] font-black mb-2 ").concat(
        s.count > 0 ? 'text-accent-600 group-hover:text-white' : 'hidden', "\">").concat(s.count, "</span>\n                                            </div>\n                                            <div class=\"absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[9px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-10 whitespace-nowrap\">\n                                                ").concat(


        s.count, " Naskah\n                                            </div>\n                                        </div>\n                                        <div class=\"mt-4 text-[9px] font-bold text-slate-400 text-center leading-tight uppercase h-10 flex items-center\">\n                                            ").concat(



        s.step.replace(' ', '<br>'), "\n                                        </div>\n                                    </div>\n                                ")


      ).join(''), "\n                            </div>\n                        </div>\n\n                        <div class=\"bg-white p-8 rounded-3xl border border-slate-100 shadow-sm\">\n                            <h3 class=\"font-bold text-slate-800 mb-6\">Aktivitas Terkini</h3>\n                            <div class=\"space-y-4\">\n                                ").concat(






      data.slice(-5).reverse().map((n) => "\n                                    <div class=\"flex gap-4 items-start p-3 rounded-2xl hover:bg-slate-50 transition-colors\">\n                                        <div class=\"w-10 h-10 rounded-xl bg-slate-100 flex shrink-0 items-center justify-center text-slate-400\">\n                                            <i class=\"fa-solid fa-file\"></i>\n                                        </div>\n                                        <div class=\"overflow-hidden\">\n                                            <p class=\"text-xs font-bold text-slate-800 truncate\">".concat(





        n.judul, "</p>\n                                            <p class=\"text-[10px] text-slate-400\">").concat(
        n.penerbit, " &bull; ").concat(n.timeline, "</p>\n                                        </div>\n                                    </div>\n                                ")


      ).join(''), "\n                                ").concat(
      data.length === 0 ? '<p class="text-center text-slate-300 py-10 italic">Belum ada aktivitas</p>' : '', "\n                            </div>\n                        </div>\n                    </div>\n                ");




  }).getNaskahData();
}

function loadDashboardLayouter() {
  loadDashboardData();
}

function getCsKpiSummary(userName, target, dealRows, kpiRows, currentMonth) {
  const isCurrentMonth = (dateValue) => String(dateValue || '').startsWith(currentMonth);
  const normalizeTx = (value) => {
    if (Array.isArray(value)) return value;
    if (typeof value === 'string' && value.trim()) {
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    }
    return [];
  };
  const isTambahDpTx = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
  const getDealOriginalPaymentAmount = (deal) => {
    const tx = normalizeTx(deal.transaksiTambahan);
    const addedDp = tx.filter(isTambahDpTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
    const addedCost = tx.filter((item) => !isTambahDpTx(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
    const hasPelunasan = Number(deal.nominalPelunasan || 0) > 0;
    if (deal.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(deal.nominalDP || 0) - addedDp);
    return Math.max(0, Number(deal.nilai || 0) - addedCost);
  };
  const getInitialPaymentAmount = (item, totalField) => {
    const hasPelunasan = Number(item.nominalPelunasan || 0) > 0;
    if (item.statusPayment === 'DP' || hasPelunasan) return Number(item.nominalDP || 0);
    return Number(item[totalField] || 0);
  };
  const getKpiOriginalPaymentAmount = (item) => {
    const tx = normalizeTx(item.transaksiTambahan);
    const addedDp = tx.filter(isTambahDpTx).reduce((sum, row) => sum + Number(row.nominal || 0), 0);
    const hasPelunasan = Number(item.nominalPelunasan || 0) > 0;
    if (item.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(item.nominalDP || 0) - addedDp);
    return Number(item.nominal || 0);
  };
  const getPelunasanAmount = (item) => isCurrentMonth(item.tanggalPelunasan) ? Number(item.nominalPelunasan || 0) : 0;
  const userDeals = (dealRows || []).filter((d) => d.csName === userName);
  const userKpi = (kpiRows || []).filter((k) => k.picName === userName);
  const currentDeals = userDeals.filter((d) => d.source !== 'legacy' && isCurrentMonth(d.tanggal || d.deadline));
  let omzet = 0;
  userDeals.forEach((d) => {
    if (d.source !== 'legacy' && isCurrentMonth(d.tanggal || d.deadline)) omzet += getDealOriginalPaymentAmount(d);
    omzet += getPelunasanAmount(d);
    const extraTx = normalizeTx(d.transaksiTambahan);
    extraTx.forEach((tx) => {
      if (isCurrentMonth(tx.tanggal)) omzet += Number(tx.nominal || 0);
    });
  });
  userKpi.filter((k) => k.jenis === 'Cetak' || k.jenis === 'Lainnya').forEach((k) => {
    if (isCurrentMonth(k.tanggal)) omzet += getKpiOriginalPaymentAmount(k);
    omzet += getPelunasanAmount(k);
    normalizeTx(k.transaksiTambahan).forEach((tx) => {
      if (isCurrentMonth(tx.tanggal)) omzet += Number(tx.nominal || 0);
    });
  });
  const cetak = userKpi.
  filter((k) => k.jenis === 'Cetak' && isCurrentMonth(k.tanggal)).
  reduce((sum, k) => sum + Number(k.jumlahKinerja || 0), 0);
  const targetOmzet = Number(target?.targetOmzet || 0);
  const targetTerbit = Number(target?.targetTerbit || 0);
  const targetCetak = Number(target?.targetCetak || 0);
  const pctOmzet = targetOmzet > 0 ? clampPercent(Math.round(omzet / targetOmzet * 100)) : 0;
  const pctDeal = targetTerbit > 0 ? clampPercent(Math.round(currentDeals.length / targetTerbit * 100)) : 0;
  const pctCetak = targetCetak > 0 ? clampPercent(Math.round(cetak / targetCetak * 100)) : 0;
  const activeScores = [
  targetOmzet > 0 ? pctOmzet : null,
  targetTerbit > 0 ? pctDeal : null].
  filter((v) => v !== null);
  const score = activeScores.length ? Math.round(activeScores.reduce((a, b) => a + b, 0) / activeScores.length) : 0;
  return { omzet, dealCount: currentDeals.length, cetak, pctOmzet, pctDeal, pctCetak, score };
}
function getPicLayouterQcEvalSummary(picName, kpiRows, users = [], targets = []) {
  const source = (kpiRows || []).filter((k) => !picName || k.picName === picName);
  const qcRows = source.filter((k) => k.jenis === 'Quality Control');
  const qcTotal = qcRows.length;
  const qcErrors = qcRows.reduce((sum, k) => sum + Number(k.qcErrorCount || 0), 0);
  const qcScore = clampPercent(100 - qcErrors * 0.1);

  const evalRows = source.filter((k) => k.jenis === 'Evaluasi Tim');
  const layouterUsers = (users || []).filter((u) => normalizeRole(u.role) === 'layouter' && u.nama);
  const evaluatedNames = [...new Set(evalRows.map((k) => k.evalLayouter).filter(Boolean))];
  const targetRows = targets || [];
  const targetFor = (user) => targetRows.find((t) => t.username === user.username) || {};
  const rowsForRealtime = layouterUsers.
  map((user) => {
    const targetHalaman = Number(targetFor(user).targetHalaman || 0);
    const capaianHalaman = (kpiRows || []).
    filter((k) => k.picName === user.nama && (k.jenis === 'Layout' || !['Quality Control', 'Evaluasi Tim', 'Lainnya'].includes(k.jenis) && !isRevisiKPI(k))).
    reduce((sum, k) => sum + Number(k.jumlahHalaman || 0), 0);
    return {
      nama: user.nama,
      targetHalaman,
      capaianHalaman,
      evaluated: evaluatedNames.includes(user.nama)
    };
  });

  let evalMet = 0;
  let evalTotal = rowsForRealtime.length;
  if (evalTotal > 0) {
    // Only count as 'met' if they have a target and they reached it.
    evalMet = rowsForRealtime.filter((row) => row.targetHalaman > 0 && row.capaianHalaman >= row.targetHalaman).length;
  }
  const evalScore = evalTotal > 0 ? clampPercent(Math.round(evalMet / evalTotal * 100)) : null;
  const activeScores = [qcScore, evalScore].filter((score) => score !== null);
  const score = activeScores.length ? Math.round(activeScores.reduce((sum, score) => sum + Number(score), 0) / activeScores.length) : 0;
  return {
    score,
    qcScore,
    evalScore: evalScore === null ? 0 : evalScore,
    qcTotal,
    qcErrors,
    evalMet,
    evalTotal,
    hasQc: true,
    hasEval: evalScore !== null,
    evalMode: rowsForRealtime.length ? 'realtime' : 'snapshot'
  };
}
// --- VIEWS MANAJEMEN EKSISTING ---
function loadDashboardManajemen() {
  gas.withSuccessHandler((resInit) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;

    const d = resInit?.data || {};
    const resNaskah = { data: d.naskah };
    const resUsers = { data: d.users };
    const resTarget = { data: d.target };
    const resKPI = { data: d.kpi };
    const resDeal = { data: [...(d.deal || []), ...(d.dealArchive || [])] };
    const resKendala = { data: d.kendala };
    const resPenjualan = { data: d.penjualan };

    const formatRp = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');
    const dataNaskah = (resNaskah?.data || []).filter((n) => !isNaskahCancelled(n));
    const dataKendala = resKendala?.data || [];

    // 1. Naskah On Process
    const naskahOnProcess = dataNaskah.filter((n) => n.timeline !== 'Distribusi');

    // 2. Data Omzet 6 Bulan Terakhir
    let globalRoyalti = 10;
    (d.settings || []).forEach((g) => {if (g.key === 'royaltiGlobal') globalRoyalti = parseFloat(g.value);});

    const monthlyOmzet = {};
    for (let i = 5; i >= 0; i--) {
      const dt = new Date();
      dt.setMonth(dt.getMonth() - i);
      const m = dt.toISOString().slice(0, 7);
      monthlyOmzet[m] = { label: dt.toLocaleString('id-ID', { month: 'short', year: '2-digit' }), omzetPenerbitan: 0, omzetPenjualan: 0, labaBersih: 0 };
    }

    const dealData = resDeal?.data || [];
    const penjualanData = resPenjualan?.data || [];
    const normalizeDashboardDealTransactions = (value) => {
      if (Array.isArray(value)) return value;
      if (typeof value === 'string' && value.trim()) {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          return [];
        }
      }
      return [];
    };
    const isTambahDpDashboardTx = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
    const getOriginalDashboardDealNominal = (deal) => {
      const tx = normalizeDashboardDealTransactions(deal.transaksiTambahan);
      const addedDp = tx.filter(isTambahDpDashboardTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const addedCost = tx.filter((item) => !isTambahDpDashboardTx(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const hasPelunasan = Number(deal.nominalPelunasan || 0) > 0;
      if (deal.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(deal.nominalDP || 0) - addedDp);
      return Math.max(0, Number(deal.nilai || 0) - addedCost);
    };
    const getOriginalDashboardKpiNominal = (k) => {
      const tx = normalizeDashboardDealTransactions(k.transaksiTambahan);
      const addedDp = tx.filter(isTambahDpDashboardTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const hasPelunasan = Number(k.nominalPelunasan || 0) > 0;
      if (k.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(k.nominalDP || 0) - addedDp);
      return Number(k.nominal || 0);
    };

    dealData.forEach((d) => {
      const m = d.tanggal ? d.tanggal.slice(0, 7) : d.deadline ? d.deadline.slice(0, 7) : null;
      if (m && monthlyOmzet[m]) {
        monthlyOmzet[m].omzetPenerbitan += getOriginalDashboardDealNominal(d);
      }
      const mPelunasan = d.tanggalPelunasan ? d.tanggalPelunasan.slice(0, 7) : null;
      if (mPelunasan && monthlyOmzet[mPelunasan]) {
        monthlyOmzet[mPelunasan].omzetPenerbitan += Number(d.nominalPelunasan || 0);
      }
      normalizeDashboardDealTransactions(d.transaksiTambahan).forEach((tx) => {
        const mTx = tx.tanggal ? String(tx.tanggal).slice(0, 7) : null;
        if (mTx && monthlyOmzet[mTx]) monthlyOmzet[mTx].omzetPenerbitan += Number(tx.nominal || 0);
      });
    });

    penjualanData.forEach((p) => {
      const m = p.tanggal ? p.tanggal.slice(0, 7) : null;
      if (m && monthlyOmzet[m]) {
        let totalPenj = Number(p.qty || 0) * Number(p.hargaJual || 0);
        let roy = totalPenj * (globalRoyalti / 100);
        monthlyOmzet[m].omzetPenjualan += totalPenj;
        monthlyOmzet[m].labaBersih += totalPenj - roy;
      }
    });

    const kpiData = resKPI?.data || [];
    kpiData.filter((k) => k.jenis === 'Cetak' || k.jenis === 'Lainnya').forEach((k) => {
      const m = k.tanggal ? k.tanggal.slice(0, 7) : null;
      if (m && monthlyOmzet[m]) {
        monthlyOmzet[m].omzetPenerbitan += getOriginalDashboardKpiNominal(k);
      }
      const mPelunasan = k.tanggalPelunasan ? k.tanggalPelunasan.slice(0, 7) : null;
      if (mPelunasan && monthlyOmzet[mPelunasan]) {
        monthlyOmzet[mPelunasan].omzetPenerbitan += Number(k.nominalPelunasan || 0);
      }
      normalizeDashboardDealTransactions(k.transaksiTambahan).forEach((tx) => {
        const mTx = tx.tanggal ? String(tx.tanggal).slice(0, 7) : null;
        if (mTx && monthlyOmzet[mTx]) monthlyOmzet[mTx].omzetPenerbitan += Number(tx.nominal || 0);
      });
    });

    const chartData = Object.values(monthlyOmzet);
    const maxOmzet = Math.max(...chartData.map((c) => c.omzetPenerbitan + c.omzetPenjualan), 100000);
    const totalOmzetPenerbitan6Bulan = chartData.reduce((acc, curr) => acc + curr.omzetPenerbitan, 0);
    const totalOmzetPenjualan6Bulan = chartData.reduce((acc, curr) => acc + curr.omzetPenjualan, 0);
    const totalLabaBersih6Bulan = chartData.reduce((acc, curr) => acc + curr.labaBersih, 0);

    // 3. Pantauan KPI
    const currentMonth = new Date().toISOString().slice(0, 7);
    const kpiUsers = (resUsers?.data || []).filter((u) => ['cs', 'editor', 'layouter', 'admin', 'css', 'admin_marketplace', 'campaign', 'pic_editor', 'pic_layouter'].includes(u.role));
    const targets = resTarget?.data || [];
    const allKpiRows = resKPI?.data || [];
    const allDealRows = resDeal?.data || [];
    const kpiDataBulanIni = allKpiRows.filter((k) => String(k.tanggal || '').startsWith(currentMonth));

    // Reuse the same logic as loadTargetKPI to build window._targetKPIData
    const usersData = kpiUsers.map((usr) => {
      const t = targets.find((x) => x.username === usr.username) || { targetTerbit: 0, targetCetak: 0, targetOmzet: 0, targetKata: 0, targetHalaman: 0 };
      const myKPI = kpiDataBulanIni.filter((k) => k.picName === usr.nama);
      let mainValue = 0,mainTarget = 0,mainLabel = '',mainUnit = '';
      let detailRows = [];

      if (usr.role === 'cs') {
        const csSummary = getCsKpiSummary(usr.nama, t, allDealRows, allKpiRows, currentMonth);
        mainValue = csSummary.score;mainTarget = 100;mainLabel = 'Rata-rata KPI';mainUnit = '%';
        detailRows.push({ label: 'Target Naskah/Deal', value: t.targetTerbit + ' Item' });
        detailRows.push({ label: 'Target Omzet', value: formatRp(t.targetOmzet) });
        detailRows.push({ label: 'Capaian Deal', value: csSummary.dealCount + ' / ' + (t.targetTerbit || 0) + ' (' + csSummary.pctDeal + '%)' });
        detailRows.push({ label: 'Capaian Cetak', value: csSummary.cetak + ' Poin tercatat (tidak dihitung ke skor)' });
        detailRows.push({ label: 'Capaian Omzet', value: formatRp(csSummary.omzet) + ' / ' + formatRp(t.targetOmzet || 0) + ' (' + csSummary.pctOmzet + '%)' });
      } else if (usr.role === 'editor' || usr.role === 'pic_editor') {
        const mainKPI = myKPI.filter((k) => !isRevisiKPI(k));
        const totalKata = mainKPI.reduce((a, b) => a + Number(b.jumlahKata || 0), 0);
        mainValue = totalKata;mainTarget = t.targetKata || 0;mainLabel = 'Kata';mainUnit = 'Kata';
        detailRows.push({ label: 'Target Kata', value: (t.targetKata || 0).toLocaleString('id-ID') + ' Kata' });
        detailRows.push({ label: 'Capaian Kata', value: totalKata.toLocaleString('id-ID') + ' Kata' });
        detailRows.push({ label: 'Judul Selesai', value: mainKPI.length + ' Judul' });
        const revisi = myKPI.filter(isRevisiKPI);
        if (revisi.length > 0) detailRows.push({ label: 'Revisi', value: revisi.length + ' naskah' });
      } else if (usr.role === 'layouter') {
        const mainKPI = myKPI.filter((k) => !isRevisiKPI(k));
        const totalHal = mainKPI.reduce((a, b) => a + Number(b.jumlahHalaman || 0), 0);
        mainValue = totalHal;mainTarget = t.targetHalaman || 0;mainLabel = 'Halaman';mainUnit = 'Hal';
        detailRows.push({ label: 'Target Halaman', value: (t.targetHalaman || 0).toLocaleString('id-ID') + ' Hal' });
        detailRows.push({ label: 'Capaian Halaman', value: totalHal.toLocaleString('id-ID') + ' Hal' });
        detailRows.push({ label: 'Judul Selesai', value: mainKPI.length + ' Judul' });
        const revisi = myKPI.filter(isRevisiKPI);
        if (revisi.length > 0) detailRows.push({ label: 'Revisi', value: revisi.length + ' naskah' });
      } else if (usr.role === 'pic_layouter') {
        // 1. Layout KPI (Halaman) - tercatat sebagai detail, bukan persentase utama PIC Layouter
        const layoutKPI = myKPI.filter((k) => k.jenis === 'Layout');
        const totalHal = layoutKPI.reduce((a, b) => a + Number(b.jumlahHalaman || 0), 0);
        const targetHal = Number(t.targetHalaman || 0);
        const persenLayout = targetHal > 0 ? Math.min(Math.round(totalHal / targetHal * 100), 100) : 0;
        const picScore = getPicLayouterQcEvalSummary(usr.nama, kpiDataBulanIni, resUsers?.data || [], targets);
        const pctAverage = picScore.score;
        mainValue = pctAverage;mainTarget = 100;mainLabel = 'Persentase';mainUnit = '%';

        detailRows.push({ label: 'Capaian Utama', value: pctAverage + '% (QC + Evaluasi Tim)' });
        detailRows.push({ label: 'Quality Control (QC)', value: picScore.qcScore + '% (' + picScore.qcTotal + ' Naskah di-QC)' });
        detailRows.push({ label: 'Evaluasi Tim', value: picScore.evalScore + '% (' + picScore.evalMet + '/' + picScore.evalTotal + ' Layouter)' });
        detailRows.push({ label: 'Layout Halaman', value: totalHal.toLocaleString('id-ID') + ' / ' + targetHal.toLocaleString('id-ID') + ' Hal (' + persenLayout + '% tercatat)' });
      } else if (['admin', 'css', 'admin_marketplace', 'campaign'].includes(usr.role)) {
