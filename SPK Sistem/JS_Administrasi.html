<script>



// --- MODUL ADMINISTRASI HARIAN & LAPORAN ---

function loadSurat() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const data = res?.data || [];
    const jenisFilter = window._suratJenisFilter || 'semua';
    const showHidden = window._suratShowHidden === true;
    const currentMonth = new Date().toISOString().slice(0, 7);
    const activeData = data.filter((s) => showHidden ? String(s.hidden || '') === '1' : String(s.hidden || '') !== '1');
    const jenisOptions = [...new Set(activeData.map((s) => s.jenis || 'Tanpa Jenis'))].sort((a, b) => a.localeCompare(b));
    const filteredData = activeData.filter((s) => jenisFilter === 'semua' || (s.jenis || 'Tanpa Jenis') === jenisFilter);
    const hiddenMonthOptions = [...new Set(data.filter((s) => String(s.hidden || '') === '1').map((s) => s.hiddenMonth || String(s.tanggal || '').slice(0, 7)).filter(Boolean))].sort().reverse();
    const pageSize = 10;
    const currentPage = Math.max(1, Number(window._suratPage || 1));
    const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
    const safePage = Math.min(currentPage, totalPages);
    window._suratPage = safePage;
    const pagedData = filteredData.slice().reverse().slice((safePage - 1) * pageSize, safePage * pageSize);

    window.downloadExcelSurat = function () {
      const dataExcel = filteredData.map((s) => ({
        "Nomor Surat": s.no,
        "Kategori": s.jenis,
        "Judul Naskah": s.judulNaskah,
        "Penulis": s.penulis,
        "Penerbit": s.penerbit,
        "Tanggal Terbit": s.tanggal,
        "PIC Pengambil": s.pengambil,
        "Status": String(s.hidden || '') === '1' ? 'Hidden' : 'Aktif',
        "Hidden Bulan": s.hiddenMonth || ''
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(dataExcel);
      XLSX.utils.book_append_sheet(wb, ws, "Data Surat");
      XLSX.writeFile(wb, "Data_Surat_" + new Date().toISOString().split('T')[0] + ".xlsx");
    };

    window.resetNomorSurat = function () {
      Swal.fire({
        title: 'Reset Nomor Surat?',
        html: 'Penomoran untuk seluruh jenis surat akan dimulai kembali dari <b>1001</b>.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Ya, Reset Nomor',
        cancelButtonText: 'Batal'
      }).then((r) => {
        if (r.isConfirmed) {
          gas.withSuccessHandler(() => {
            loadSurat();
            Swal.fire('Berhasil!', 'Penomoran surat telah direset.', 'success');
          }).resetNomorSurat();
        }
      });
    };

    window.deleteSuratByNo = function (no) {
      Swal.fire({
        title: 'Hapus Nomor Surat?',
        html: 'Nomor surat ini akan dihapus dari daftar, tetapi urutan nomor berikutnya tidak akan mundur.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Hapus',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (!result.isConfirmed) return;
        gas.withSuccessHandler(() => {
          loadSurat();
          Swal.fire('Terhapus', 'Nomor surat berhasil dihapus tanpa mempengaruhi counter berjalan.', 'success');
        }).deleteSurat(no);
      });
    };

    window.hideSuratMonth = function () {
      const month = currentMonth;
      const count = data.filter((s) => String(s.hidden || '') !== '1' && String(s.tanggal || '').startsWith(month)).length;
      Swal.fire({
        title: 'Hide Nomor Surat Bulan Ini?',
        html: "Sebanyak <b>".concat(count, "</b> nomor surat bulan <b>").concat(month, "</b> akan disembunyikan dari tampilan utama. Data tidak dihapus."),
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#4763FD',
        confirmButtonText: 'Ya, Hide Bulan Ini',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (!result.isConfirmed) return;
        gas.withSuccessHandler((res) => {
          loadSurat();
          Swal.fire('Berhasil', "".concat(res?.count || 0, " nomor surat bulan ").concat(month, " disembunyikan."), 'success');
        }).setSuratHiddenByMonth(month, true, state.user.nama);
      });
    };

    window.restoreSuratMonth = function (month) {
      Swal.fire({
        title: 'Tampilkan Lagi Riwayat?',
        html: "Nomor surat hidden bulan <b>".concat(month, "</b> akan dikembalikan ke tampilan utama."),
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        confirmButtonText: 'Ya, Tampilkan Lagi',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (!result.isConfirmed) return;
        gas.withSuccessHandler((res) => {
          loadSurat();
          Swal.fire('Berhasil', "".concat(res?.count || 0, " nomor surat bulan ").concat(month, " ditampilkan kembali."), 'success');
        }).setSuratHiddenByMonth(month, false, state.user.nama);
      });
    };

    content.innerHTML = "\n                    <div class=\"mb-6 flex flex-col md:flex-row justify-end items-end gap-3\">\n                        ".concat(

      state.user.role === 'admin' ? "\n                            <button onclick=\"window._suratShowHidden=!window._suratShowHidden; window._suratPage=1; window._suratJenisFilter='semua'; loadSurat()\" class=\"flex items-center gap-2 px-5 py-2.5 ".concat(
        showHidden ? 'bg-accent-600 text-white' : 'bg-white text-slate-600', " hover:bg-accent-50 rounded-xl text-[11px] font-bold shadow-sm transition-all border border-slate-200\">\n                                <i class=\"fa-solid ").concat(
        showHidden ? 'fa-eye' : 'fa-eye-slash', "\"></i> ").concat(showHidden ? 'Lihat Aktif' : 'Lihat Hidden', "\n                            </button>\n                            <select onchange=\"window._suratJenisFilter=this.value; window._suratPage=1; loadSurat()\" class=\"px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold outline-none bg-white focus:border-accent-400\">\n                                <option value=\"semua\" ").concat(


        jenisFilter === 'semua' ? 'selected' : '', ">Semua Jenis Surat</option>\n                                ").concat(
        jenisOptions.map((j) => "<option value=\"".concat(j, "\" ").concat(jenisFilter === j ? 'selected' : '', ">").concat(j, "</option>")).join(''), "\n                            </select>\n                            <button onclick=\"downloadExcelSurat()\" class=\"flex items-center gap-2 px-5 py-2.5 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-xl text-[11px] font-bold shadow-sm transition-all border border-emerald-200\">\n                                <i class=\"fa-solid fa-file-excel\"></i> Download Excel\n                            </button>\n                            <button onclick=\"resetNomorSurat()\" class=\"flex items-center gap-2 px-5 py-2.5 bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-xl text-[11px] font-bold shadow-sm transition-all border border-rose-200\">\n                                <i class=\"fa-solid fa-rotate-left\"></i> Reset Nomor (1001)\n                            </button>\n                            ").concat(







        showHidden && hiddenMonthOptions.length ? "<select onchange=\"if(this.value) restoreSuratMonth(this.value)\" class=\"px-4 py-2.5 rounded-xl border border-emerald-200 text-xs font-bold outline-none bg-emerald-50 text-emerald-700 focus:border-emerald-400\">\n                                <option value=\">Tampilkan Lagi Per Bulan</option>\n                                ".concat(

          hiddenMonthOptions.map((m) => "<option value=\"".concat(m, "\">").concat(m, "</option>")).join(''), "\n                            </select>") : "<button onclick=\"hideSuratMonth()\" class=\"flex items-center gap-2 px-5 py-2.5 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-xl text-[11px] font-bold shadow-sm transition-all border border-amber-200\">\n                                <i class=\"fa-solid fa-eye-slash\"></i> Hide Bulan Ini\n                            </button>", "\n                            <button onclick=\"openFormSurat()\" class=\"bg-emerald-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg hover:bg-emerald-700 transition-colors\">+ Terbitkan Nomor</button>\n                        ") :




      '', "\n                    </div>\n                    ").concat(

      showHidden ? '<div class="mb-4 px-4 py-3 rounded-2xl bg-amber-50 border border-amber-100 text-amber-700 text-xs font-bold"><i class="fa-solid fa-eye-slash mr-2"></i>Mode lihat hidden aktif. Data di sini tidak terhapus dan bisa ditampilkan kembali per bulan.</div>' : '', "\n                    <div class=\"bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden\">\n                        <div class=\"overflow-x-auto\">\n                        <table class=\"w-full text-left\">\n                            <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                <tr>\n                                    <th class=\"px-8 py-4\">Nomor Surat</th>\n                                    <th class=\"px-8 py-4\">Kategori</th>\n                                    <th class=\"px-8 py-4\">Judul Naskah & Penulis</th>\n                                    <th class=\"px-8 py-4\">Penerbit</th>\n                                    <th class=\"px-8 py-4\">Tgl Terbit</th>\n                                    <th class=\"px-8 py-4 text-center\">Aksi</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y divide-slate-50\">\n                                ").concat(














      pagedData.map((s) => "\n                                    <tr class=\"text-[13px] hover:bg-slate-50/50 transition-colors\">\n                                        <td class=\"px-8 py-4 font-mono font-bold text-accent-600\">".concat(

        s.no, "</td>\n                                        <td class=\"px-8 py-4\"><span class=\"px-2 py-0.5 bg-accent-50 text-accent-600 rounded-full font-bold text-[10px]\">").concat(
        s.jenis, "</span></td>\n                                        <td class=\"px-8 py-4\">\n                                            <div class=\"font-bold text-slate-800\">").concat(

        s.judulNaskah, "</div>\n                                            <div class=\"text-[11px] text-slate-400\">Penulis: ").concat(
        s.penulis, "</div>\n                                        </td>\n                                        <td class=\"px-8 py-4 font-semibold text-slate-500\">").concat(

        s.penerbit || '-', "</td>\n                                        <td class=\"px-8 py-4 text-slate-400 text-[11px]\">").concat(
        s.tanggal, "</td>\n                                        <td class=\"px-8 py-4 text-center\">\n                                            ").concat(

        state.user.role === 'admin' ? "<button onclick=\"deleteSuratByNo('".concat(String(s.no || '').replace(/'/g, "\\'"), "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg\" title=\"Hapus Nomor Surat\"><i class=\"fa-solid fa-trash\"></i></button>") : '', "\n                                        </td>\n                                    </tr>")

      ).join(''), "\n                                ").concat(
      filteredData.length === 0 ? '<tr><td colspan="6" class="p-16 text-center text-slate-300 italic">Belum ada dokumen yang sesuai filter.</td></tr>' : '', "\n                            </tbody>\n                        </table>\n                        </div>\n                        <div class=\"flex flex-col md:flex-row md:items-center md:justify-between gap-3 px-5 py-4 border-t border-slate-100\">\n                            <div class=\"text-[10px] font-bold text-slate-400\">Menampilkan ").concat(




      pagedData.length, " dari ").concat(filteredData.length, " surat &bull; Halaman ").concat(safePage, " / ").concat(totalPages, "</div>\n                            <div class=\"flex items-center gap-2\">\n                                <button onclick=\"window._suratPage=Math.max(1,(window._suratPage||1)-1); loadSurat()\" class=\"px-3 py-2 rounded-lg border border-slate-200 text-xs font-black text-slate-500 hover:border-accent-200 hover:text-accent-600\">Prev</button>\n                                <span class=\"px-3 py-2 rounded-lg bg-accent-50 text-accent-600 text-xs font-black\">").concat(


      safePage, "</span>\n                                <button onclick=\"window._suratPage=Math.min(").concat(
      totalPages, ",(window._suratPage||1)+1); loadSurat()\" class=\"px-3 py-2 rounded-lg border border-slate-200 text-xs font-black text-slate-500 hover:border-accent-200 hover:text-accent-600\">Next</button>\n                            </div>\n                        </div>\n                    </div>");



  }).getSuratData();
}


function intakeSafeText(value) {
  return String(value ?? '-').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function intakeSafeAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function buildFinalDataLink(n) {
  const baseUrl = window.PORTAL_WEB_APP_URL || '';
  return `${baseUrl}?page=author`;
}

function getFinalAuthorList(n) {
  const raw = n?.finalPenulisList || n?.finalPenulisUtama || n?.penulis || '';
  if (Array.isArray(raw)) return raw.filter(Boolean);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.filter(Boolean);
  } catch (err) {}
  return String(raw || '').split(/\n|,|;/).map((v) => v.trim()).filter(Boolean);
}

function getFinalEditorList(n) {
  const raw = n?.finalEditorList || '';
  if (Array.isArray(raw)) return raw.filter(Boolean);
  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.filter(Boolean);
  } catch (err) {}
  return String(raw || '').split(/\n|,|;/).map((v) => v.trim()).filter(Boolean);
}

function copyFinalDataToken(id, btn) {
    const rows = []
      .concat(window._cssNewNaskahRows || [])
      .concat(window._adminNaskahRows || []);
    const n = rows.find((r) => String(r.id) === String(id));
    if (!n) return Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Data naskah tidak ditemukan', showConfirmButton: false, timer: 3000 });

    const token = n.finalDataToken || '';
    if (!token) return Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: 'Token belum dibuat', showConfirmButton: false, timer: 3000 });

    if (window.quickCopy && btn) {
        window.quickCopy(token, btn);
        return;
    }

    navigator.clipboard?.writeText(token).then(() => {
        Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Token Disalin', showConfirmButton: false, timer: 2000 });
    }).catch(() => {
        Swal.fire({ title: 'Salin Token', html: '<textarea class="w-full p-3 border rounded-xl text-xs font-mono" rows="2" readonly>' + intakeSafeText(token) + '</textarea>', confirmButtonText: 'OK' });
    });
}
window.copyFinalDataToken = copyFinalDataToken;

async function copyFinalDataLink(id, btn) {
    const rows = [].concat(window._cssNewNaskahRows || []).concat(window._adminNaskahRows || []);
    const n = rows.find((r) => String(r.id) === String(id));
    if (!n) return Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Data naskah tidak ditemukan', showConfirmButton: false, timer: 3000 });
    const token = n.finalDataToken || '';
    if (!token) return Swal.fire({ toast: true, position: 'top-end', icon: 'warning', title: 'Token belum dibuat', showConfirmButton: false, timer: 3000 });
    
    if (btn) {
        btn.dataset.originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>Proses...';
        btn.disabled = true;
    }
    
    try {
        const longUrl = buildFinalDataLink(n);
        
        gas.withSuccessHandler(async (res) => {
            if (res && res.success) {
                await navigator.clipboard.writeText(res.shortUrl);
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Link Disalin', showConfirmButton: false, timer: 2000 });
                if (btn) {
                    btn.innerHTML = '<i class="fa-solid fa-check text-emerald-500 mr-1"></i>Tersalin';
                    setTimeout(() => { btn.innerHTML = btn.dataset.originalHtml; btn.disabled = false; }, 2000);
                }
            } else {
                if (btn) {
                    btn.innerHTML = btn.dataset.originalHtml;
                    btn.disabled = false;
                }
                Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Gagal memendekkan link', text: res?.message || 'Error Server', showConfirmButton: false, timer: 4000 });
            }
        }).withFailureHandler((e) => {
            if (btn) {
                btn.innerHTML = btn.dataset.originalHtml;
                btn.disabled = false;
            }
            Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Gagal koneksi ke server', text: String(e), showConfirmButton: false, timer: 4000 });
        }).generateShortUrlBackend(longUrl);
        
    } catch (e) {
        if (btn) {
            btn.innerHTML = btn.dataset.originalHtml;
            btn.disabled = false;
        }
        Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Gagal memendekkan link', showConfirmButton: false, timer: 3000 });
    }
}
window.copyFinalDataLink = copyFinalDataLink;

function openPortalPenulis() {
  const baseUrl = window.PORTAL_WEB_APP_URL || '';
  window.open(baseUrl + '?page=author', '_blank', 'noopener');
}
window.openPortalPenulis = openPortalPenulis;

function startCssProduction(id) {
  Swal.fire({
    title: 'Mulai Produksi?',
    html: `
      <div class="text-left text-sm text-slate-600 mb-4">
        Naskah akan masuk ke antrean PIC Editor dan PIC Layouter.<br><br>
        <b class="text-rose-500">PENTING:</b> Sebelum memulai produksi, pastikan Anda telah mengirimkan dokumen administrasi ke pihak penulis.
      </div>
      <label class="flex items-start gap-3 p-4 bg-rose-50 border border-rose-100 rounded-xl cursor-pointer">
        <input type="checkbox" id="css_admin_confirm" class="w-5 h-5 mt-0.5 accent-rose-600" onchange="document.getElementById('btn_start_prod').disabled = !this.checked; if(this.checked){document.getElementById('btn_start_prod').classList.remove('opacity-50','cursor-not-allowed');}else{document.getElementById('btn_start_prod').classList.add('opacity-50','cursor-not-allowed');}">
        <span class="text-xs font-bold text-rose-800 leading-snug text-left">Saya mengonfirmasi bahwa dokumen administrasi (LoA & Keaslian) telah dikirimkan ke pihak penulis.</span>
      </label>
    `,
    icon: 'warning',
    showCancelButton: true,
    didOpen: () => {
      const confirmBtn = Swal.getConfirmButton();
      confirmBtn.id = 'btn_start_prod';
      confirmBtn.disabled = true;
      confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
    },
    confirmButtonText: 'Mulai Produksi',
    cancelButtonText: 'Batal',
    confirmButtonColor: '#4763FD'
  }).then((result) => {
    if (!result.isConfirmed) return;
    Swal.fire({ title: 'Memulai Produksi...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res?.message || res?.error || 'Produksi belum bisa dimulai.', 'error');
        return;
      }
      Swal.fire('Berhasil', 'Naskah masuk ke alur produksi.', 'success');
      loadNaskahBaruCss();
      refreshIntakeCounts();
    }).withFailureHandler((error) => showServerError('Gagal Memulai Produksi', error)).startNaskahProductionFromCss(id, state.user.username);
  });
}
window.startCssProduction = startCssProduction;

function loadNaskahBaruCss() {
  const content = document.getElementById('contentArea');
  if (content) {
    content.innerHTML = '<div class="bg-white border border-slate-100 rounded-3xl p-10 text-center text-slate-400 font-bold">Memuat naskah baru...</div>';
  }
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const rows = res?.data || [];
    window._cssNewNaskahRows = rows;
    state.intakeCounts = state.intakeCounts || {};
    state.intakeCounts.naskah_baru = rows.length;
    updateIntakeBadges();
    const hasAuthorFinalData = (n) => {
      const authors = getFinalAuthorList(n);
      return !!String(n.finalDataSubmittedAt || '').trim() || (authors.length > 0 && !!String(n.finalJudul || n.judul || '').trim());
    };
    const waitingFinal = rows.filter((n) => String(n.intakeStatus || '') === 'waiting_final_data' && !hasAuthorFinalData(n)).length;
    const waitingAdmin = rows.filter((n) => ['waiting_admin', 'admin_done'].includes(String(n.intakeStatus || '')) || (String(n.workflowStage || '') === 'administrasi' && hasAuthorFinalData(n))).length;
    const ready = rows.filter((n) => String(n.intakeStatus || '') === 'admin_done').length;

    content.innerHTML = `
        <div class="space-y-5">
            <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
                <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                    <div>
                        <p class="text-[10px] font-black uppercase tracking-widest text-accent-500">CCO Intake</p>
                        <h3 class="text-2xl font-black text-slate-900">Naskah Baru</h3>
                        <p class="text-sm text-slate-400 mt-1">Naskah dari CS menunggu data final penulis, administrasi, lalu mulai produksi.</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="rounded-2xl bg-amber-50 border border-amber-100 px-4 py-3"><div class="text-xl font-black text-amber-600">${waitingFinal}</div><div class="text-[9px] font-black text-amber-500 uppercase">Data Penulis</div></div>
                        <div class="rounded-2xl bg-blue-50 border border-blue-100 px-4 py-3"><div class="text-xl font-black text-blue-600">${waitingAdmin}</div><div class="text-[9px] font-black text-blue-500 uppercase">Administrasi</div></div>
                        <div class="rounded-2xl bg-emerald-50 border border-emerald-100 px-4 py-3"><div class="text-xl font-black text-emerald-600">${ready}</div><div class="text-[9px] font-black text-emerald-500 uppercase">Siap Produksi</div></div>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                ${rows.map((n) => {
                    const authors = getFinalAuthorList(n);
                    const editors = getFinalEditorList(n);
                    const statusRaw = String(n.intakeStatus || 'waiting_final_data');
                    const status = statusRaw === 'waiting_final_data' && hasAuthorFinalData(n) ? 'waiting_admin' : statusRaw;
                    const statusBadge = status === 'admin_done' ?
                        '<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 text-[10px] font-black">Administrasi Selesai</span>' :
                        status === 'waiting_admin' ?
                        '<span class="px-3 py-1 rounded-full bg-blue-50 text-blue-600 border border-blue-100 text-[10px] font-black">Menunggu Admin</span>' :
                        '<span class="px-3 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-100 text-[10px] font-black">Menunggu Data Final</span>';

                    let baseBg = status === 'admin_done' ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-100 bg-slate-50/50';
                    let bgClass = baseBg;
                    const packageColor = typeof ccoPackageColorFor === 'function' ? ccoPackageColorFor(n) : '#e2e8f0';
                    const rowStyle = `background-color:${packageColor}10!important;border-color:${packageColor}55!important;`;
                    return `
                        <div class="flex flex-col md:flex-row gap-4 p-5 rounded-2xl border hover:shadow-md transition-all group ${bgClass}" style="${rowStyle}">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 mb-2">
                                    <div class="text-[10px] font-black uppercase tracking-widest text-accent-500">${intakeSafeText(n.trackingCode || '-')}</div>
                                    ${statusBadge}
                                </div>
                                <h4 class="text-lg font-black text-slate-900 mt-1">${intakeSafeText(n.finalJudul || n.judul || '-')}</h4>
                                <p class="text-xs font-bold text-slate-400 mt-1 flex items-center gap-1.5">${intakeSafeText(n.paket || '-')}</p>
                                <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">

function ccoWorkflowStageOf(n) {
  const statusProduksi = String(n.statusProduksi || '').trim().toLowerCase();
  const statusDistribusi = String(n.statusDistribusi || '').trim().toLowerCase();
  const statusLayouter = String(n.statusLayouter || '').trim().toLowerCase();
  const statusDone = (value) => ['done', 'complete', 'selesai', 'terbit'].includes(String(value || '').trim().toLowerCase());
  if (statusDone(statusDistribusi) || String(n.workflowStage || '').toLowerCase() === 'selesai') return 'selesai';
  if (statusDone(statusProduksi) || String(n.workflowStage || '').toLowerCase() === 'distribusi') return 'distribusi';
  if (statusDone(statusLayouter) || String(n.workflowStage || '').toLowerCase() === 'produksi') return 'produksi';
  return 'baru';
}

function ccoCurrentWorkflowConfig() {
  const tab = String(state.activeTab || 'naskah_baru');
  const configs = {
    naskah_baru: { key: 'baru', title: 'Naskah Baru', eyebrow: 'CCO Intake', desc: 'Naskah menunggu data final penulis, administrasi, atau siap mulai alur produksi.', empty: 'Belum ada naskah baru untuk CCO ini.' },
    naskah_produksi: { key: 'produksi', title: 'Naskah Produksi', eyebrow: 'CCO Produksi', desc: 'Naskah yang sudah selesai layout dan menunggu proses produksi diselesaikan.', empty: 'Belum ada naskah pada tahap produksi.' },
    naskah_distribusi: { key: 'distribusi', title: 'Naskah Distribusi', eyebrow: 'CCO Distribusi', desc: 'Naskah yang sudah selesai produksi dan menunggu distribusi diselesaikan.', empty: 'Belum ada naskah pada tahap distribusi.' },
    naskah_selesai: { key: 'selesai', title: 'Naskah Selesai', eyebrow: 'CCO Selesai', desc: 'Naskah yang sudah selesai distribusi dan siap diajukan penghapusan setelah beres.', empty: 'Belum ada naskah selesai.' }
  };
  return configs[tab] || configs.naskah_baru;
}

function ccoStageBadge(stage, status) {
  if (stage === 'produksi') return '<span class="px-3 py-1 rounded-full bg-purple-50 text-purple-600 border border-purple-100 text-[10px] font-black">Produksi</span>';
  if (stage === 'distribusi') return '<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 text-[10px] font-black">Distribusi</span>';
  if (stage === 'selesai') return '<span class="px-3 py-1 rounded-full bg-slate-100 text-slate-600 border border-slate-200 text-[10px] font-black">Selesai</span>';
  if (status === 'admin_done') return '<span class="px-3 py-1 rounded-full bg-emerald-50 text-emerald-600 border border-emerald-100 text-[10px] font-black">Administrasi Selesai</span>';
  if (status === 'waiting_admin') return '<span class="px-3 py-1 rounded-full bg-blue-50 text-blue-600 border border-blue-100 text-[10px] font-black">Menunggu Admin</span>';
  return '<span class="px-3 py-1 rounded-full bg-amber-50 text-amber-600 border border-amber-100 text-[10px] font-black">Menunggu Data Final</span>';
}

function ccoStageRangeText(n, stage) {
  const ranges = n.timelineRanges || {};
  const map = { baru: 'administrasi', produksi: 'produksi', distribusi: 'distribusi', selesai: 'selesai' };
  const range = ranges[map[stage] || 'administrasi'] || {};
  if (range.start && range.end) return `${range.start} - ${range.end}`;
  return range.end || n.deadline || '-';
}

function ccoNormalizePackageColor(value) {
  const color = String(value || '').trim();
  return /^#[0-9a-fA-F]{6}$/.test(color) ? color : '#e2e8f0';
}

function ccoBuildPackageColorMap(penerbitRows) {
  const map = {};
  (penerbitRows || []).forEach((pub) => {
    const pubKey = String(pub.nama || '').trim().toLowerCase();
    (pub.paket || []).forEach((pkg, idx) => {
      const isObject = pkg && typeof pkg === 'object';
      const name = String(isObject ? (pkg.nama || pkg.name || pkg.label || '') : (pkg || '')).trim();
      if (!name) return;
      const color = ccoNormalizePackageColor(isObject ? (pkg.warna || pkg.color || '') : '');
      const pkgKey = name.toLowerCase();
      map[`${pubKey}::${pkgKey}`] = color;
      if (!map[`::${pkgKey}`]) map[`::${pkgKey}`] = color;
    });
  });
  return map;
}

function ccoPackageColorFor(n) {
  const map = window._ccoPackageColorMap || {};
  const pubKey = String(n?.penerbit || '').trim().toLowerCase();
  const pkgKey = String(n?.paket || '').trim().toLowerCase();
  return ccoNormalizePackageColor(map[`${pubKey}::${pkgKey}`] || map[`::${pkgKey}`] || '#e2e8f0');
}

function ccoOpenTrackingDelay(id, stageKey) {
  gas.withSuccessHandler((res) => {
    const reasons = (res?.data || []).filter((row) => String(row.stageKey || '') === String(stageKey || '') && String(row.active || '1') !== '0');
    const options = reasons.map((row) => `<option value="${intakeSafeAttr(row.reasonCode)}">${intakeSafeText(row.label)}</option>`).join('');
    Swal.fire({
      title: 'Atur Kemunduran',
      html: `
        <div class="text-left space-y-3">
          <div><label class="text-[10px] font-black uppercase text-slate-400">Jumlah Hari</label><input id="cco_delay_days" type="number" min="1" class="swal2-input" placeholder="Contoh: 2"></div>
          <div><label class="text-[10px] font-black uppercase text-slate-400">Alasan</label><select id="cco_delay_reason" class="swal2-select">${options || '<option value="manual">Penyesuaian timeline</option>'}</select></div>
          <div><label class="text-[10px] font-black uppercase text-slate-400">Catatan</label><textarea id="cco_delay_note" class="swal2-textarea" placeholder="Opsional"></textarea></div>
        </div>
      `,
      showCancelButton: true,
      confirmButtonText: 'Simpan Kemunduran',
      cancelButtonText: 'Batal',
      confirmButtonColor: '#FF6B35',
      preConfirm: () => {
        const days = Number(document.getElementById('cco_delay_days')?.value || 0);
        if (!days || days < 1) {
          Swal.showValidationMessage('Jumlah hari wajib diisi minimal 1.');
          return false;
        }
        return {
          days,
          reasonCode: document.getElementById('cco_delay_reason')?.value || 'manual',
          note: document.getElementById('cco_delay_note')?.value || ''
        };
      }
    }).then((result) => {
      if (!result.isConfirmed) return;
      Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      gas.withSuccessHandler((saveRes) => {
        if (!saveRes || saveRes.success === false) {
          Swal.fire('Gagal', saveRes?.message || saveRes?.error || 'Kemunduran gagal disimpan.', 'error');
          return;
        }
        Swal.fire('Tersimpan', 'Kemunduran timeline berhasil disimpan.', 'success');
        loadNaskahBaruCss();
      }).withFailureHandler((error) => showServerError('Gagal Menyimpan Kemunduran', error)).saveNaskahTrackingDelay(id, stageKey, result.value.days, result.value.reasonCode, result.value.note);
    });
  }).withFailureHandler((error) => showServerError('Gagal Memuat Alasan Kemunduran', error)).getDelayReasons();
}

function ccoRequestDelete(id) {
  const rows = window._cssNewNaskahRows || [];

    title: 'Ajukan Penghapusan?',

    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    confirmButtonText: 'Ajukan Penghapusan',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const alasan = document.getElementById('cco_delete_reason')?.value.trim();
      if (!alasan) {
        Swal.showValidationMessage('Alasan penghapusan wajib diisi.');

      requestBy: state.user.nama,

    }).withFailureHandler((error) => showServerError('Gagal Mengajukan Penghapusan', error)).saveDeleteRequest(payload);
  });

window.quickCopy = function(text, btn) {
  const performCopy = () => {
    if (btn) {
      const originalHtml = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-check text-emerald-500 text-[10px]"></i>';
      setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
    }
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(performCopy);
  } else {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-999999px";
    textArea.style.top = "-999999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      performCopy();
    } catch (err) {}
    document.body.removeChild(textArea);
  }
};

function loadLaporan() {
  gas.withSuccessHandler((resInit) => {
    try {
      if (!state.user) return;
      const content = document.getElementById('contentArea');
      if (!content) return;

      const d = resInit?.data || {};
      const dataNaskah = (d.naskah || []).filter((n) => !isNaskahCancelled(n));
      const dataUsers = d.users || [];
      const dataKPI = d.kpi || [];
      const dataDeal = [...(d.deal || []), ...(d.dealArchive || [])];
      const dataPenjualan = d.penjualan || [];
      const dataKehadiran = d.kehadiran || [];
      const formatRp = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');

      let globalRoyalti = 10;
      (d.settings || []).forEach((g) => {if (g.key === 'royaltiGlobal') globalRoyalti = parseFloat(g.value);});

      // 1. Agregasi Pertumbuhan Bulanan
      const normalizeDealPaymentTransactionsForReport = (value) => {
        if (Array.isArray(value)) return value;
        if (typeof value === 'string' && value.trim()) {
          try {
            const parsed = JSON.parse(value);
            return Array.isArray(parsed) ? parsed : [];
          } catch (err) {
            return [];
          }
        }
        return [];
      };
      const isTambahDpMonthlyTx = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
      const getOriginalMonthlyDealNominal = (deal) => {
        const tx = normalizeDealPaymentTransactionsForReport(deal.transaksiTambahan);
        const addedDp = tx.filter(isTambahDpMonthlyTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const addedCost = tx.filter((item) => !isTambahDpMonthlyTx(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const hasPelunasan = Number(deal.nominalPelunasan || 0) > 0;
        if (deal.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(deal.nominalDP || 0) - addedDp);
        return Math.max(0, Number(deal.nilai || 0) - addedCost);
      };
      const getOriginalMonthlyKpiNominal = (k) => {
        const tx = normalizeDealPaymentTransactionsForReport(k.transaksiTambahan);
        const addedDp = tx.filter(isTambahDpMonthlyTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const hasPelunasan = Number(k.nominalPelunasan || 0) > 0;
        if (k.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(k.nominalDP || 0) - addedDp);
        return Number(k.nominal || 0);
      };
      const monthlyStats = {};
      dataNaskah.forEach((n) => {
        const m = n.tanggal ? n.tanggal.substring(0, 7) : 'Unknown';
        if (!monthlyStats[m]) monthlyStats[m] = { naskah: 0, omzetPenerbitan: 0, omzetPenjualan: 0, labaBersih: 0 };
        monthlyStats[m].naskah++;
      });
      dataDeal.forEach((d) => {
        const m = d.tanggal ? d.tanggal.substring(0, 7) : d.deadline ? d.deadline.substring(0, 7) : 'Unknown';
        if (!monthlyStats[m]) monthlyStats[m] = { naskah: 0, omzetPenerbitan: 0, omzetPenjualan: 0, labaBersih: 0 };
        const hasPelunasan = Number(d.nominalPelunasan || 0) > 0;

      })).filter((group) => group.rows.length > 0);

      );
      const normalizeMetricLabel = (label) => String(label || '').
      replace(/\s+/g, ' ').
      replace(/\s*\/\s*/g, ' / ').
      trim();
      const extractKpiMetricMap = (metricText) => {
        const skipLabels = ['Total Nilai', 'Rata-Rata', 'Persentase Utama'];
        const text = String(metricText || '').replace(/\s+/g, ' ').trim();
        const matches = [];
        const re = /(^|\s)([A-Za-zÀ-ÿ0-9/& ]{2,45}?):\s*/g;
        let match;
        while ((match = re.exec(text)) !== null) {
          matches.push({
            label: normalizeMetricLabel(match[2]),
            start: match.index + match[1].length,
            valueStart: re.lastIndex
          });
        }
        return matches.reduce((acc, item, idx) => {
          if (skipLabels.includes(item.label)) return acc;
          const nextStart = matches[idx + 1]?.start ?? text.length;
          const value = text.slice(item.valueStart, nextStart).trim();
          if (value) acc[item.label] = value;
          return acc;
        }, {});
      };
      const getKpiMetricKeys = (rows) => {
        const keys = [];

      const disciplineStats = reportUsers.filter((u) => !['pimpinan', 'report'].includes(u.role)).map((u) => {

      const isTambahDpReportTx = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
      const getDealOriginalReportNominal = (deal) => {
        const tx = normalizeExtraTransactions(deal.transaksiTambahan);
        const addedDp = tx.filter(isTambahDpReportTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const addedCost = tx.filter((item) => !isTambahDpReportTx(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const hasPelunasan = Number(deal.nominalPelunasan || 0) > 0;
        if (deal.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(deal.nominalDP || 0) - addedDp);
        return Math.max(0, Number(deal.nilai || 0) - addedCost);
      };
      const getKpiOriginalReportNominal = (k) => {
        const tx = normalizeExtraTransactions(k.transaksiTambahan);
        const addedDp = tx.filter(isTambahDpReportTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
        const hasPelunasan = Number(k.nominalPelunasan || 0) > 0;
        if (k.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(k.nominalDP || 0) - addedDp);
        return Number(k.nominal || 0);
      };
      const makeCsDealDetailRows = (csName) => {
        const rows = [];

          const nominal = Number(row.nominal || 0);
          if (nominal <= 0) return;
          rows.push({
            tanggal: row.tanggal || '',
            judul: row.judul || '-',
            kotaAsal: row.kotaAsal || '-',
            uraian: row.uraian || '-',
            terbit: row.terbit || '',
            cetak: row.cetak || '',
            lainnya: row.lainnya || '',
            nominal,
            sumber: row.sumber || '-'
          });
        };

        dataDeal.filter((deal) => deal.csName === csName).forEach((deal) => {
          const dealDate = deal.tanggal || deal.deadline || '';
          const packageText = [deal.penerbit, deal.paket].filter(Boolean).join(' - ') || 'Deal Penerbitan';
          if (deal.source !== 'legacy' && isCurrentReportMonth(dealDate)) {
            const category = deal.source === 'legacy' ? normalizeLegacyDealCategory(deal.kategori) : 'Terbit';
            pushRow({
              tanggal: dealDate,
              judul: deal.judul,
              kotaAsal: deal.kotaAsal || '-',
              uraian: packageText,
              terbit: category === 'Terbit' ? 1 : '',
              cetak: category === 'Cetak' ? 1 : '',
              lainnya: category === 'Lainnya' ? 1 : '',
              nominal: getDealOriginalReportNominal(deal),
              sumber: deal.source === 'legacy' ? 'Deal Lama - ' + category : 'Deal'

          }
          if (isCurrentReportMonth(deal.tanggalPelunasan)) {
            pushRow({
              tanggal: deal.tanggalPelunasan,
              judul: deal.judul,
              kotaAsal: deal.kotaAsal || '-',

              terbit: '',
              nominal: Number(deal.nominalPelunasan || 0),

              tanggal: k.tanggalPelunasan,

              kotaAsal: k.kotaAsal || '-',
              uraian: 'Pelunasan - ' + (k.spesifikasi || k.jenis),
              lainnya: '',
              cetak: '',
              nominal: Number(k.nominalPelunasan || 0),
              sumber: 'Pelunasan ' + k.jenis

          normalizeExtraTransactions(k.transaksiTambahan).forEach((tx) => {
            if (!isCurrentReportMonth(tx.tanggal)) return;

              tanggal: tx.tanggal,
              judul: k.judul || k.spesifikasi,
              kotaAsal: k.kotaAsal || '-',
              uraian: 'Tambah DP - ' + (k.spesifikasi || k.jenis),
              lainnya: '',
              cetak: '',
              nominal: Number(tx.nominal || 0),
              sumber: 'Tambah DP ' + k.jenis
            });
          });
        });

        return rows.sort((a, b) => String(a.tanggal).localeCompare(String(b.tanggal)) || String(a.judul).localeCompare(String(b.judul)));

      const normalizeReportDeadlines = (value) => {
        if (!value) return {};
        if (typeof value === 'object') return value;
        if (typeof value === 'string' && value.trim()) {
          try {
            const parsed = JSON.parse(value);
            return parsed && typeof parsed === 'object' ? parsed : {};
          } catch (err) {
            return {};
          }

        return {};

      const isTaskComplete = (value) => ['done', 'complete', 'selesai'].includes(String(value || '').toLowerCase());

        const doc = new jsPDF({ orientation: 'l', unit: 'mm', format: 'a4' });
        const pageW = doc.internal.pageSize.getWidth();
        const pageH = doc.internal.pageSize.getHeight();
        const margin = 14;
        let y = 16;
        const line = (text, size = 10, style = 'normal', color = [15, 23, 42]) => {
          doc.setFont('helvetica', style);
          doc.setFontSize(size);
          doc.setTextColor(color[0], color[1], color[2]);
          const lines = doc.splitTextToSize(String(text || '-'), pageW - margin * 2);
          lines.forEach((t) => {
            if (y > pageH - 16) {doc.addPage();y = 16;}
            doc.text(t, margin, y);
            y += size * 0.42 + 2;
          });
        };
        const section = (title) => {
          if (y > pageH - 28) {doc.addPage();y = 16;}
          y += 4;
          doc.setFillColor(238, 246, 250);
          doc.rect(margin, y - 5, pageW - margin * 2, 9, 'F');
          line(title, 12, 'bold', [2, 132, 199]);
          y += 2;
        };
        const rows = (items, mapper, limit = Infinity) => {

          });
        };

          const headerH = 8;

            if (y + headerH > pageH - 14) {doc.addPage();y = 16;}
            doc.setFillColor(241, 245, 249);
            doc.rect(margin, y, columns.reduce((sum, col) => sum + col.width, 0), headerH, 'F');
            let x = margin;
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(7.5);
            doc.setTextColor(71, 85, 105);
            columns.forEach((col) => {
              doc.text(col.label, x + rowPad, y + 5);
              x += col.width;
            });
            y += headerH;
          };
          drawHeader();
          dataRows.forEach((row, idx) => {
            const wrapped = columns.map((col) => {
              const text = String(row[col.key] ?? '-');

function reportSafeText(value) {
  return String(value ?? '-').
  replace(/&/g, '&amp;').
  replace(/</g, '&lt;').
  replace(/>/g, '&gt;').
  replace(/"/g, '&quot;').
  replace(/'/g, '&#039;');
}


function reportFormatRp(value) {
  return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
}


function normalizeReportTransactions(value) {
  if (Array.isArray(value)) return value;
  if (typeof value === 'string' && value.trim()) {
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }
  return [];
}


function getReportCurrentMonth() {
  return new Date().toISOString().slice(0, 7);
}

const REPORT_DETAIL_PAGE_SIZE = 10;

function getReportDetailPage(key, totalRows) {
  const totalPages = Math.max(1, Math.ceil(totalRows / REPORT_DETAIL_PAGE_SIZE));
  const current = Number(window._reportDetailPages[key] || 1);
  const page = Math.min(Math.max(1, current), totalPages);
  window._reportDetailPages[key] = page;
  return page;
}

function setReportDetailPage(key, page, loaderName) {

window._reportTargetDetails = window._reportTargetDetails || {};

function reportClampPercent(value) {
  return Math.max(0, Math.min(100, Math.round(Number(value || 0))));
}

function reportTargetPercent(achieved, target) {
  const tgt = Number(target || 0);
  if (tgt <= 0) return 0;
  return reportClampPercent(Number(achieved || 0) / tgt * 100);
}

function reportOverTargetInfo(achieved, target, unit = '') {
  const total = Number(achieved || 0);
  const tgt = Number(target || 0);
  if (tgt <= 0 || total <= tgt) return null;
  const overValue = total - tgt;
  const overPct = Math.round(overValue / tgt * 100);
  const suffix = unit ? " ".concat(unit) : '';
  return {
    value: overValue,
    pct: overPct,
    label: "+".concat(overValue.toLocaleString('id-ID')).concat(suffix),
    fullLabel: "+".concat(overValue.toLocaleString('id-ID')).concat(suffix, " (").concat(overPct, "% over)")
  };
}

function normalizeReportTargetPerJenis(value) {
  if (value && typeof value === 'object' && !Array.isArray(value)) return value;
  if (typeof value === 'string' && value.trim()) {
    try {
      const parsed = JSON.parse(value);
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch (err) {

  return {};
}

function startReportAutoScroll() {
  const card = document.querySelector('.report-display-card');
  if (!card) return;
  if (window._reportScrollInterval) clearInterval(window._reportScrollInterval);
  if (window._reportScrollRaf) cancelAnimationFrame(window._reportScrollRaf);
  card.scrollTop = 0;
  const maxScroll = Math.max(0, card.scrollHeight - card.clientHeight);
  if (maxScroll <= 8) {
    window._reportNextSlideDelay = 12000;
    return window._reportNextSlideDelay;
  }
  const duration = Math.max(32000, Math.min(90000, maxScroll * 95));
  const delay = 3500;
  const bottomHold = 8000;
  window._reportNextSlideDelay = delay + duration + bottomHold;
  const startAt = performance.now() + delay;
  const animate = (now) => {
    if (!document.querySelector('.report-display-card')) {
      return;
    }
    const elapsed = Math.max(0, now - startAt);
    const progress = Math.min(elapsed / duration, 1);
    const eased = progress < 0.5 ?
    2 * progress * progress :
    1 - Math.pow(-2 * progress + 2, 2) / 2;
    card.scrollTop = maxScroll * eased;
    if (progress < 1) window._reportScrollRaf = requestAnimationFrame(animate);
  };
  window._reportScrollRaf = requestAnimationFrame(animate);
  return window._reportNextSlideDelay;
}

        detail = total.toLocaleString('id-ID') + ' nilai' + (overItems.length ? " - Over ".concat(overItems.slice(0, 2).join(', ')) : '');
      }
      return { nama: u.nama, role: u.role, score, detail };
    }).sort((a, b) => b.score - a.score || a.nama.localeCompare(b.nama));

    const disciplineRank = users.filter((u) => !['pimpinan', 'report'].includes(u.role)).map((u) => {
      const records = attMonth.filter((a) => a.karyawan === u.nama);
      const counts = { Alpa: 0, Izin: 0, 'Izin Setengah Hari': 0, Terlambat: 0, Sakit: 0, Cuti: 0 };
      records.forEach((a) => {if (counts[a.status] !== undefined) counts[a.status]++;});
      const penalty = counts.Alpa * 12 + counts.Izin * 8 + counts['Izin Setengah Hari'] * 4 + counts.Terlambat * 2 + counts.Sakit * 3 + counts.Cuti * 1;
      const score = Math.max(0, 100 - penalty);
      const issueCount = records.length;
      return { nama: u.nama, role: u.role, score, detail: issueCount === 0 ? 'Full masuk on time' : "".concat(issueCount, " catatan") };
    }).sort((a, b) => b.score - a.score || a.nama.localeCompare(b.nama));

    const reportTimelineSteps = [
    { key: 'administrasi', label: 'Administrasi', source: (n) => n.tanggal || '' },
    { key: 'proofreading', label: 'Proofreading', source: (n) => n.deadlines?.proofreading || '' },
    { key: 'layout', label: 'Layout', source: (n) => n.deadlines?.layout || '' },
    { key: 'isbn', label: 'ISBN', source: (n) => n.deadlines?.isbn || '' },
    { key: 'produksi', label: 'Produksi', source: (n) => n.deadlines?.produksi || '' },
    { key: 'distribusi', label: 'Distribusi', source: (n) => n.deadlines?.distribusi || '' },
    { key: 'selesai', label: 'Selesai', source: (n) => n.deadlines?.selesai || '' }];

    const reportTimelineIndex = (n) => {
      const current = String(n.timeline || 'Administrasi');
      const idx = timelineSteps.indexOf(current);
      if (idx >= 0) return Math.min(idx, reportTimelineSteps.length - 1);
      const normalized = trackingDelayStageFromTimeline(current);
      const byKey = reportTimelineSteps.findIndex((step) => step.key === normalized);
      return byKey >= 0 ? byKey : 0;
    };
    const activeNaskah = naskah.filter((x) => (x.statusProses === 'Siap Proses' || !x.statusProses) && !isNaskahCancelled(x)).map((x) => {
      const idx = reportTimelineIndex(x);
      const pct = Math.round(idx / Math.max(reportTimelineSteps.length - 1, 1) * 100);
      const steps = reportTimelineSteps.map((step, stepIdx) => ({
        ...step,
        date: step.source(x) || '-',
        state: stepIdx < idx ? 'done' : stepIdx === idx ? 'active' : 'waiting'
      }));
      return {
        judul: x.judul,
        penulis: x.penulis,
        penerbit: x.penerbit,
        paket: x.paket,
        trackingCode: x.trackingCode,
        status: x.timeline || 'Administrasi',
        pct,
        steps
      };
    }).sort((a, b) => b.pct - a.pct || String(a.judul || '').localeCompare(String(b.judul || '')));

    const rankRows = (items, suffix = '%') => items.map((item, idx) => {
      const rawScore = Number(item.score || 0);
      const displayScore = suffix === '%' ? reportClampPercent(rawScore) : item.score;
      const overScore = suffix === '%' && rawScore > 100 ? Math.round(rawScore - 100) : 0;
      return "\n                    <div class=\"report-rank-row\">\n                        <div class=\"report-rank-no\">".concat(

        idx + 1, "</div>\n                        <div class=\"min-w-0 flex-1\">\n                            <div class=\"report-rank-name\">").concat(

        item.nama, "</div>\n                            <div class=\"report-rank-detail\">").concat(
        getRoleLabel(item.role), " - ").concat(item.detail, "</div>\n                        </div>\n                        <div class=\"report-rank-score\">").concat(

        displayScore).concat(suffix).concat(overScore ? "<div class=\"report-rank-detail text-emerald-500\">+".concat(overScore, "%</div>") : '', "</div>\n                    </div>");

    }).join('');
    const roleGroups = [
    { title: 'PIC Layouter & Layouter', roles: ['pic_layouter', 'layouter'] },
    { title: 'PIC Editor & Editor', roles: ['pic_editor', 'editor'] },
    { title: 'CSS & Admin', roles: ['css', 'admin'] },
    { title: 'Campaign & Admin Marketplace', roles: ['campaign', 'admin_marketplace'] },
    { title: 'Customer Service', roles: ['cs'] }];

    const groupedKpiBody = roleGroups.map((group) => {
      const items = kpiRank.filter((item) => group.roles.includes(item.role));
      return "\n                        <div class=\"report-role-group\">\n                            <div class=\"report-role-title\">".concat(

        group.title, "</div>\n                            ").concat(
        items.length ? rankRows(items) : '<div class="report-empty report-empty-compact">Belum ada data KPI bulan ini.</div>', "\n                        </div>");

    }).join('');
    const renderProgressRows = (items, offset = 0) => "\n                <div class=\"report-timeline-list\" style=\"display:flex;flex-direction:column;gap:7px;\">\n                    ".concat(

      items.map((item, idx) => "\n                        <div class=\"report-timeline-row\" style=\"display:grid;grid-template-columns:44px minmax(230px,340px) minmax(620px,1fr) 118px;align-items:center;gap:16px;padding:12px 26px 12px 16px;border-radius:16px;background:rgba(255,255,255,.94);color:#0f172a;border:1px solid rgba(255,255,255,.22);max-width:100%;box-sizing:border-box;\">\n                            <div class=\"report-timeline-no\" style=\"width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#dbeafe;color:#2563eb;font-size:16px;font-weight:900;\">".concat(

        offset + idx + 1, "</div>\n                            <div class=\"report-timeline-title min-w-0\" style=\"min-width:0;\">\n                                <div class=\"report-rank-name\" style=\"font-size:20px;line-height:1.15;font-weight:900;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">").concat(

        reportSafeText(item.judul || '-'), "</div>\n                                <div class=\"report-rank-detail\" style=\"margin-top:3px;color:#64748b;font-size:13px;line-height:1.15;font-weight:800;\">").concat(
        reportSafeText(item.penerbit || '-'), " ").concat(item.paket ? '&bull; ' + reportSafeText(item.paket) : '', "</div>\n                                <div class=\"report-rank-detail\" style=\"margin-top:3px;color:#64748b;font-size:13px;line-height:1.15;font-weight:800;\">").concat(
        reportSafeText(item.trackingCode || item.penulis || '-'), "</div>\n                            </div>\n                            <div class=\"report-timeline-flow\" style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:start;min-width:0;\">\n                                ").concat(


        item.steps.map((step, stepIdx) => {
          const dotColor = step.state === 'done' ? '#10b981' : step.state === 'active' ? '#2563eb' : '#cbd5e1';
          const ringColor = step.state === 'done' ? '#bbf7d0' : step.state === 'active' ? '#bfdbfe' : '#e2e8f0';
          const lineColor = step.state === 'done' ? '#86efac' : '#e2e8f0';
          return "\n                                    <div class=\"report-timeline-step ".concat(
            step.state, "\" style=\"position:relative;min-width:0;text-align:center;padding-top:1px;\">\n                                        <span class=\"report-timeline-dot\" style=\"position:relative;z-index:1;display:inline-block;width:18px;height:18px;border-radius:999px;background:").concat(
            dotColor, ";border:3px solid #f8fafc;box-shadow:0 0 0 3px ").concat(ringColor, ";\"></span>\n                                        ").concat(
            stepIdx < item.steps.length - 1 ? "<span class=\"report-timeline-line\" style=\"position:absolute;left:50%;right:-50%;top:10px;height:4px;background:".concat(lineColor, ";\"></span>") : '', "\n                                        <div class=\"report-timeline-label\" style=\"margin-top:5px;color:#334155;font-size:11px;font-weight:900;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">").concat(
            reportSafeText(step.label), "</div>\n                                        <div class=\"report-timeline-date\" style=\"margin-top:3px;color:#94a3b8;font-size:11px;font-weight:800;line-height:1;\">").concat(
            reportSafeText(step.date || '-'), "</div>\n                                    </div>");

        }).join(''), "\n                            </div>\n                            <div class=\"report-timeline-status\" style=\"text-align:center;min-width:0;justify-self:stretch;\">\n                                <div class=\"report-timeline-percent\" style=\"display:inline-flex;align-items:center;justify-content:center;min-width:86px;padding:4px 8px;border-radius:14px;background:#e0f2fe;color:#0284c7;font-size:23px;font-weight:900;line-height:1;letter-spacing:0;\">").concat(


        item.pct, "%</div>\n                                <div class=\"report-rank-detail\" style=\"margin-top:5px;color:#64748b;font-size:11px;line-height:1.1;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">").concat(
        reportSafeText(item.status), "</div>\n                            </div>\n                        </div>\n                    ")


      ).join(''), "\n                </div>");

    const progressPageSize = 20;
    const progressSlides = activeNaskah.length ?
    Array.from({ length: Math.ceil(activeNaskah.length / progressPageSize) }, (_, pageIdx) => {
      const start = pageIdx * progressPageSize;
      const rows = activeNaskah.slice(start, start + progressPageSize);
      const totalPages = Math.ceil(activeNaskah.length / progressPageSize);
      return {
        key: 'progress',
        title: "Tracking Progress Naskah (".concat(pageIdx + 1, "/").concat(totalPages, ")"),
        icon: 'fa-timeline',
        body: "\n                            <div class=\"report-rank-detail mb-4\">Menampilkan ".concat(
          start + 1, "-").concat(Math.min(start + progressPageSize, activeNaskah.length), " dari ").concat(activeNaskah.length, " naskah aktif.</div>\n                            ").concat(
          renderProgressRows(rows, start), "\n                        ")

      };
    }) :
    [{ key: 'progress', title: 'Tracking Progress Naskah', icon: 'fa-timeline', body: '<div class="report-empty">Belum ada naskah aktif.</div>' }];
    const enabledSlides = getReportSlideOptions();
    const allSlides = [
    { key: 'kpi', title: 'Ranking Capaian KPI Karyawan Per Role', icon: 'fa-trophy', body: groupedKpiBody || '<div class="report-empty">Belum ada data KPI bulan ini.</div>' },
    { key: 'discipline', title: 'Ranking Kedisiplinan Karyawan', icon: 'fa-user-check', body: rankRows(disciplineRank) || '<div class="report-empty">Belum ada data kedisiplinan.</div>' },
    ...progressSlides];

    const slides = allSlides.filter((slide) => enabledSlides[slide.key] !== false);
    if (!slides.length) {
      renderReportHomeContent();
      Swal.fire('Pilih Laporan', 'Aktifkan minimal satu laporan untuk ditampilkan.', 'warning');
      return;
    }
    window._reportSlides = slides;
    window._reportSlideIndex = reportOptions.preserveSlide ?
    Math.min(Math.max(previousSlideIndex, 0), window._reportSlides.length - 1) :
    0;
    const renderSlide = () => {
      if (window._reportScrollInterval) clearInterval(window._reportScrollInterval);
      if (window._reportScrollRaf) cancelAnimationFrame(window._reportScrollRaf);
      const slide = window._reportSlides[window._reportSlideIndex % window._reportSlides.length];
      const now = new Date().toLocaleString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      content.innerHTML = "\n                        <div class=\"report-display-screen\">\n                            <div class=\"report-display-top\">\n                                <div>\n                                    <div class=\"report-display-kicker\">Nasmedia Live Report - ".concat(



        currentMonth, "</div>\n                                    <h1><i class=\"fa-solid ").concat(
        slide.icon, "\"></i>").concat(slide.title, "</h1>\n                                </div>\n                                <div class=\"flex items-center gap-3\">\n                                    <div class=\"report-display-clock\">").concat(


        now, "</div>\n                                    <button onclick=\"confirmLogout()\" class=\"report-logout-btn\"><i class=\"fa-solid fa-right-from-bracket mr-2\"></i>Logout</button>\n                                    <button onclick=\"state.activeTab='report_home'; render();\" class=\"report-exit-btn\"><i class=\"fa-solid fa-xmark\"></i></button>\n                                </div>\n                            </div>\n                            <div class=\"report-display-card\">").concat(




        slide.body, "</div>\n                            <div class=\"report-slide-dots\">").concat(
        window._reportSlides.map((_, i) => "<span class=\"".concat(i === window._reportSlideIndex ? 'active' : '', "\"></span>")).join(''), "</div>\n                        </div>");

      requestAnimationFrame(() => requestAnimationFrame(() => {
        const nextDelay = startReportAutoScroll() || 12000;
        if (window._reportInterval) clearTimeout(window._reportInterval);
        window._reportInterval = setTimeout(() => {
          window._reportSlideIndex = (window._reportSlideIndex + 1) % window._reportSlides.length;
          renderSlide();
        }, nextDelay);
      }));
    };
    if (window._reportInterval) clearInterval(window._reportInterval);
    if (window._reportRefreshInterval) clearInterval(window._reportRefreshInterval);
    window._reportRefreshInterval = setInterval(() => {
      if (state.activeTab === 'report_display' && normalizeRole(state.user?.role) === 'report') {
        loadReportDisplay({ silentRefresh: true, preserveSlide: true });
      }
    }, 30 * 60 * 1000);
    renderSlide();
  }).withFailureHandler((error) => {
    if (reportOptions.silentRefresh) {
      console.warn('Report auto refresh gagal:', error);
      return;
    }
    if (window._reportInterval) clearInterval(window._reportInterval);
    if (window._reportRefreshInterval) clearInterval(window._reportRefreshInterval);
    if (window._reportScrollInterval) clearInterval(window._reportScrollInterval);
    if (window._reportScrollRaf) cancelAnimationFrame(window._reportScrollRaf);
    renderReportLoadError(error);
  }).getInitialData();
}


[
'loadSurat',
'loadBriefingHarian',
'viewBriefingDetail',
'openFormBriefing',
'handleSaveBriefing',
'loadLaporan',
'reportSafeText',
'reportFormatRp',
'normalizeReportTransactions',
'getReportCurrentMonth',
'getReportDetailPage',
'setReportDetailPage',
'renderReportDetailPagination',
'reportClampPercent',
'reportTargetPercent',
'reportOverTargetInfo',
'normalizeReportTargetPerJenis',
'renderReportTargetCards',
'loadKalenderKontenReport',
'loadReportAccount',
'handleSaveReportAccount',
'loadReportHome',
'startReportAutoScroll',
'loadReportDisplay'].
forEach((name) => {
  try {
    const fn = eval(name);
    if (typeof fn === 'function') window[name] = fn;
  } catch (error) {}
});
