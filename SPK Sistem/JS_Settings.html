function getDeadlineTimelineStagesClient() {
  return [
    ['administrasi', 'Adm'],
    ['proofreading', 'Proof'],
    ['layout', 'Layout'],
    ['produksi', 'Produksi'],
    ['distribusi', 'Distribusi'],
    ['selesai', 'Selesai']
  ];
}

function normalizeDeadlineSettingClient(row) {
  const stages = getDeadlineTimelineStagesClient().map(([key]) => key);
  const normalized = { ...(row || {}) };
  let previousEnd = 0;
  stages.forEach((key) => {
    const startKey = key + 'Mulai';
    const endKey = key + 'Selesai';
    const legacyEnd = Number(normalized[key] || 0);
    const end = Math.max(0, Number(normalized[endKey] || legacyEnd || previousEnd));
    const start = Math.max(0, Number(normalized[startKey] ?? previousEnd));
    normalized[startKey] = Math.min(start, end);
    normalized[endKey] = end;
    normalized[key] = end;
    previousEnd = end;
  });
  normalized.totalHari = Math.max(1, Number(normalized.totalHari || normalized.selesaiSelesai || normalized.selesai || previousEnd || 0));
  normalized.selesaiSelesai = Math.max(Number(normalized.selesaiSelesai || 0), normalized.totalHari);
  normalized.selesai = normalized.selesaiSelesai;
  return normalized;
}


function normalizeDealPublisherKeyClient(penerbit) {
  const compact = String(penerbit || '').trim().toLowerCase().replace(/\s+/g, '');
  if (compact === 'idebuku') return 'idebuku';
  return String(penerbit || '').trim().toLowerCase();
}

function findDeadlineSettingClient(penerbit, paket, settings = null) {
  const rows = settings || window._deadlineSettings || getDefaultDeadlineSettings();
  const pkg = String(paket || '').trim().toLowerCase();
  const pub = normalizeDealPublisherKeyClient(penerbit);
  return rows.find((row) => String(row.paket || '').trim().toLowerCase() === pkg && normalizeDealPublisherKeyClient(row.penerbit) === pub) ||
  rows.find((row) => String(row.paket || '').trim().toLowerCase() === pkg && !String(row.penerbit || '').trim()) ||
  null;
}

function getDealAccelerationDaysClient(penerbit, percepatanProses) {
  const acceleration = String(percepatanProses || '').trim().toUpperCase();
  if (acceleration === 'VVIP') return 14;
  if (acceleration === 'VIP') return 21;
  return 0;
}

function findDeadlineSettingByWorkdaysClient(workdays, settings = null) {
  const target = Number(workdays || 0);
  if (!target) return null;
  const rows = settings || window._deadlineSettings || getDefaultDeadlineSettings();
  return rows.find((row) => Number(row.totalHari || row.selesai || 0) === target) || null;
}

function resolveDealDeadlineSettingClient(penerbit, paket, percepatanProses = '', settings = null) {
  const accelerationDays = getDealAccelerationDaysClient(penerbit, percepatanProses);
  if (accelerationDays) {
    const normAcceleration = String(percepatanProses || '').trim().toUpperCase();
    if (normAcceleration === 'VIP' || normAcceleration === 'VVIP') {
      const accelerationSpecificSetting = findDeadlineSettingClient(penerbit, normAcceleration, settings) || findDeadlineSettingClient('', normAcceleration, settings);
      if (accelerationSpecificSetting) return accelerationSpecificSetting;
    }
    const accelerationSetting = findDeadlineSettingByWorkdaysClient(accelerationDays, settings);
    if (accelerationSetting) return accelerationSetting;
  }
  return findDeadlineSettingClient(penerbit, paket, settings);
}


function hasGasMethod(name) {

function fetchDeadlineSettingsClient(onSuccess, onFailure) {

}



function buildNaskahDeadlineDefaults(naskah, settings = null) {
  const rawSetting = resolveDealDeadlineSettingClient(naskah?.penerbit, naskah?.paket, naskah?.percepatanProses, settings);
  if (!rawSetting) return {};
  const setting = normalizeDeadlineSettingClient(rawSetting);
  const startDate = naskah?.tanggal || new Date().toISOString().slice(0, 10);
  if (!setting || !startDate) return {};
  const dayFor = (key) => Number(setting[key + 'Selesai'] || setting[key] || setting.totalHari || setting.selesai || 0);
  return {
    administrasi: addBusinessDaysClient(startDate, dayFor('administrasi')),
    proofreading: String(naskah?.butuhProofreading ?? '1') === '0' ? '' : addBusinessDaysClient(startDate, dayFor('proofreading')),
    layout: addBusinessDaysClient(startDate, dayFor('layout')),
    produksi: addBusinessDaysClient(startDate, dayFor('produksi')),
    distribusi: addBusinessDaysClient(startDate, dayFor('distribusi')),
    selesai: addBusinessDaysClient(startDate, dayFor('selesai'))
  };
}


function getNaskahDeadlineValue(naskah, key, settings = null) {
  const existing = naskah?.deadlines || {};
  if (existing && existing[key]) return existing[key];
  const base = naskah?.baseDeadlines || {};
  if (base && base[key]) return base[key];
  const generated = buildNaskahDeadlineDefaults(naskah, settings);
  return generated[key] || '';
}

    join('');
    const initialPackages = d.penerbit ?
    publishers.find((pub) => pub.nama === d.penerbit)?.paket || [] :
    [...new Set(publishers.flatMap((pub) => pub.paket || []))];
    const packageOptions = [...new Set([...initialPackages, d.paket].filter(Boolean))].
    map((pkt) => "<option value=\"".concat(reportSafeText(pkt), "\" ").concat(pkt === d.paket ? 'selected' : '', ">").concat(reportSafeText(pkt), "</option>")).
    join('');
    Swal.fire({
      title: id ? 'Edit Deadline Paket' : 'Tambah Deadline Paket',
      width: 'min(980px, 96vw)',
      customClass: { popup: 'deadline-landscape-popup', htmlContainer: 'deadline-landscape-html' },
      html: "\n                <div class=\"deadline-form-wrap\">\n                  <div class=\"deadline-form-top\">\n                    <input type=\"hidden\" id=\"dl_id\" value=\"".concat(

        reportSafeText(d.id || ''), "\">\n                    <label class=\"deadline-field-label\">Penerbit\n                        <select id=\"dl_penerbit\" onchange=\"updateDeadlinePackageOptions()\" class=\"deadline-field-input\">").concat(

        publisherOptions, "</select>\n                    </label>\n                    <label class=\"deadline-field-label\">Paket *\n                        <select id=\"dl_paket\" class=\"deadline-field-input\"><option value=\"\">Pilih Paket</option>").concat(


        packageOptions, "</select>\n                    </label>\n                    <label class=\"deadline-field-label\">Total Hari Keseluruhan Timeline *\n                        <input id=\"dl_totalHari\" type=\"number\" min=\"1\" value=\"").concat(Number(d.totalHari || d.selesaiSelesai || d.selesai || 0), "\" class=\"deadline-field-input\">\n                    </label>\n                  </div>\n                  <div class=\"deadline-stage-head\"><div>Tahap</div><div>Mulai H+</div><div>Selesai H+</div></div>\n                  <div class=\"deadline-stage-grid\">\n                    ").concat(

        stages.map(([key, label]) => "<div class=\"deadline-stage-card\"><div class=\"deadline-stage-name\">".concat(reportSafeText(label), "</div><input id=\"dl_").concat(key, "Mulai\" type=\"number\" min=\"0\" value=\"").concat(Number(d[key + 'Mulai'] || 0), "\" class=\"deadline-stage-input\"><input id=\"dl_").concat(key, "Selesai\" type=\"number\" min=\"0\" value=\"").concat(Number(d[key + 'Selesai'] || d[key] || 0), "\" class=\"deadline-stage-input\"></div>")).join(''), "\n                  </div>\n                </div>"),

      showCancelButton: true,
      confirmButtonText: 'Simpan',
      cancelButtonText: 'Batal',
      preConfirm: () => {
        const payload = {
          id: document.getElementById('dl_id').value,
          paket: document.getElementById('dl_paket').value.trim(),
          penerbit: document.getElementById('dl_penerbit').value.trim()
        };
        payload.totalHari = Number(document.getElementById('dl_totalHari').value || 0);
        stages.forEach(([key]) => {
          payload[key + 'Mulai'] = Number(document.getElementById('dl_' + key + 'Mulai').value || 0);
          payload[key + 'Selesai'] = Number(document.getElementById('dl_' + key + 'Selesai').value || 0);
          payload[key] = payload[key + 'Selesai'];
        });
        if (!payload.paket) return Swal.showValidationMessage('Nama paket wajib diisi.');
        if (payload.totalHari <= 0) return Swal.showValidationMessage('Total hari keseluruhan timeline wajib lebih dari 0.');
        for (const [key, label] of stages) {
          if (payload[key + 'Selesai'] < payload[key + 'Mulai']) return Swal.showValidationMessage(label + ' selesai tidak boleh lebih kecil dari mulai.');
          if (payload[key + 'Selesai'] > payload.totalHari) return Swal.showValidationMessage(label + ' selesai tidak boleh melewati total hari keseluruhan timeline.');
        }
        payload.selesaiSelesai = payload.totalHari;
        payload.selesai = payload.totalHari;
        return payload;
      }
    }).then((result) => {
      if (!result.isConfirmed) return;
      gas.withSuccessHandler((res) => {
        if (!res || res.success === false) {
          Swal.fire('Gagal', res?.message || 'Pengaturan deadline gagal disimpan.', 'error');
          return;
        }
        Swal.fire('Tersimpan', 'Template deadline paket berhasil diperbarui.', 'success');
        loadDeadlineTrackingSettings();
      }).withFailureHandler((error) => showServerError('Gagal Menyimpan Deadline', error)).saveDeadlineSetting(result.value);
    });
  };
  if (window._deadlinePublisherSettings) {
    openForm(window._deadlinePublisherSettings);
    return;
  }
  gas.withSuccessHandler((res) => {
    openForm(res?.data?.penerbit || []);
  }).withFailureHandler(() => {
    openForm([]);
  }).getSettingsData();}

function loadHolidaySettings() {
  gas.withSuccessHandler((res) => {
    const content = document.getElementById('contentArea');
    if (!content) return;
    const rows = res?.data || [];
    window._holidaySettings = rows;

    const monthFilter = window._holidayMonthFilter || new Date().toISOString().slice(0, 7);
    const availableMonths = [...new Set(rows.map((r) => String(r.tanggal || '').slice(0, 7)).filter((d) => /^\d{4}-\d{2}$/.test(d)))].sort().reverse();
    if (!availableMonths.includes(new Date().toISOString().slice(0, 7))) availableMonths.unshift(new Date().toISOString().slice(0, 7));

    const filteredRows = monthFilter === 'semua' ? rows : rows.filter((r) => String(r.tanggal || '').startsWith(monthFilter));

    const safe = reportSafeText;
    const renderRow = (row) => "\n                <tr class=\"border-b border-slate-100\">\n                    <td class=\"px-3 py-3 text-slate-500\">".concat(

      safe(row.tanggal || '-'), "</td>\n                    <td class=\"px-3 py-3 font-black text-slate-800\">").concat(
      safe(row.nama || '-'), "</td>\n                    <td class=\"px-3 py-3\">\n                        ").concat(

      String(row.active || '1') !== '0' ?
      '<span class="px-2 py-1 bg-emerald-50 text-emerald-600 rounded-lg text-[10px] font-black">Aktif</span>' :
      '<span class="px-2 py-1 bg-red-50 text-red-500 rounded-lg text-[10px] font-black">Nonaktif</span>', "\n                    </td>\n                    <td class=\"px-3 py-3 text-right\">\n                        <button onclick=\"openHolidaySettingForm('").concat(


      safe(row.id), "')\" class=\"px-3 py-1.5 rounded-lg bg-accent-50 text-accent-600 text-[10px] font-black mr-1\">Edit</button>\n                        <button onclick=\"deleteHolidaySettingItem('").concat(
      safe(row.id), "')\" class=\"px-3 py-1.5 rounded-lg bg-red-50 text-red-500 text-[10px] font-black\">Hapus</button>\n                    </td>\n                </tr>");



    content.innerHTML = "\n                <div class=\"space-y-5\">\n                    <div class=\"bg-white border border-slate-100 shadow-sm p-6 flex flex-col md:flex-row md:items-center justify-between gap-4\">\n                        <div>\n                            <h3 class=\"text-xl font-black text-slate-900\">Pengaturan Tanggal Merah</h3>\n                            <p class=\"text-sm text-slate-400 mt-1\">Daftar hari libur yang akan menghentikan perhitungan otomatis pada estimasi deadline.</p>\n                        </div>\n                        <div class=\"flex gap-2\">\n                            <select onchange=\"window._holidayMonthFilter=this.value; loadHolidaySettings()\" class=\"px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold outline-none bg-white focus:border-accent-400\">\n                                <option value=\"semua\" ".concat(








      monthFilter === 'semua' ? 'selected' : '', ">Semua Bulan</option>\n                                ").concat(
      availableMonths.map((m) => "<option value=\"".concat(m, "\" ").concat(monthFilter === m ? 'selected' : '', ">").concat(m, "</option>")).join(''), "\n                            </select>\n                            <button onclick=\"openHolidaySettingForm()\" class=\"btn-gradient text-white px-5 py-2.5 rounded-xl font-black text-sm\"><i class=\"fa-solid fa-plus mr-2\"></i>Tambah Libur</button>\n                        </div>\n                    </div>\n                    <div class=\"bg-white border border-slate-100 shadow-sm overflow-x-auto\">\n                        <table class=\"w-full text-left text-sm min-w-[700px]\">\n                            <thead class=\"bg-slate-50 text-[10px] uppercase tracking-widest text-slate-400\">\n                                <tr>\n                                    <th class=\"px-3 py-3\">Tanggal</th>\n                                    <th class=\"px-3 py-3\">Keterangan Libur</th>\n                                    <th class=\"px-3 py-3\">Status</th>\n                                    <th class=\"px-3 py-3\"></th>\n                                </tr>\n                            </thead>\n                            <tbody>\n                                ").concat(















      filteredRows.length > 0 ? filteredRows.map(renderRow).join('') : '<tr><td colspan="4" class="px-3 py-6 text-center text-slate-400 font-bold italic">Belum ada data tanggal merah untuk bulan ini.</td></tr>', "\n                            </tbody>\n                        </table>\n                    </div>\n                </div>");




  }).withFailureHandler((error) => showServerError('Gagal Memuat Tanggal Merah', error)).getHolidaySettings();
}

function openHolidaySettingForm(id = '') {
  const rows = window._holidaySettings || [];
  const existing = rows.find((row) => String(row.id) === String(id)) || {
    id: '',
    tanggal: new Date().toISOString().slice(0, 10),
    nama: '',
    active: '1'
  };
  Swal.fire({
    title: id ? 'Edit Tanggal Merah' : 'Tambah Tanggal Merah',
    width: 480,
    html: "\n                <div class=\"text-left space-y-3\">\n                    <input type=\"hidden\" id=\"holiday_id\" value=\"".concat(

      reportSafeText(existing.id || ''), "\">\n                    <label class=\"block text-[10px] font-black text-slate-400 uppercase tracking-widest\">Tanggal *</label>\n                    <input id=\"holiday_tanggal\" type=\"date\" value=\"").concat(

      reportSafeText(existing.tanggal || ''), "\" class=\"swal2-input !mx-0 !mt-0 !w-full\">\n                    <label class=\"block text-[10px] font-black text-slate-400 uppercase tracking-widest\">Keterangan *</label>\n                    <input id=\"holiday_nama\" value=\"").concat(

      reportSafeText(existing.nama || ''), "\" class=\"swal2-input !mx-0 !mt-0 !w-full\" placeholder=\"contoh: Libur Lebaran\">\n                    <label class=\"flex items-center gap-2 p-3 rounded-xl border border-slate-100 bg-slate-50 text-sm font-bold text-slate-600 mt-2\">\n                        <input id=\"holiday_active\" type=\"checkbox\" ").concat(

      String(existing.active || '1') !== '0' ? 'checked' : '', ">\n                        Status Aktif\n                    </label>\n                </div>"),



    showCancelButton: true,
    confirmButtonText: 'Simpan',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const payload = {
        id: document.getElementById('holiday_id').value,
        tanggal: document.getElementById('holiday_tanggal').value,
        nama: document.getElementById('holiday_nama').value.trim(),
        active: document.getElementById('holiday_active').checked ? '1' : '0'
      };
      if (!payload.tanggal || !payload.nama) return Swal.showValidationMessage('Tanggal dan keterangan wajib diisi.');
      return payload;
    }
  }).then((result) => {
    if (!result.isConfirmed) return;
    Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res?.message || res?.error || 'Gagal menyimpan.', 'error');
        return;
      }
      Swal.fire('Tersimpan', 'Pengaturan libur berhasil diperbarui.', 'success');
      window._holidaySettings = null;
      loadHolidaySettings();
    }).withFailureHandler((error) => showServerError('Gagal Menyimpan', error)).saveHolidaySetting(result.value);
  });
}

function deleteHolidaySettingItem(id) {
  Swal.fire({
    title: 'Hapus tanggal libur?',
    text: 'Data yang dihapus tidak akan diperhitungkan dalam estimasi deadline.',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Hapus',
    cancelButtonText: 'Batal'
  }).then((result) => {
    if (!result.isConfirmed) return;
    Swal.fire({ title: 'Menghapus...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res?.message || res?.error || 'Gagal dihapus.', 'error');
        return;
      }
      Swal.fire('Terhapus', 'Tanggal libur berhasil dihapus.', 'success');
      window._holidaySettings = null;
      loadHolidaySettings();
    }).withFailureHandler((error) => showServerError('Gagal Menghapus', error)).deleteHolidaySetting(id);
  });
}
