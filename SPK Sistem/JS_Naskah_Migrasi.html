function injectDeadlineDownloadAction() {
  const menu = document.querySelector('.migration-board-actions .relative > div');
  if (!menu || document.getElementById('download_deadline_naskah_action')) return;
  const archiveLink = Array.from(menu.querySelectorAll('a')).find((link) => String(link.textContent || '').includes('Arsipkan Naskah Batal'));
  const link = document.createElement('a');
  link.id = 'download_deadline_naskah_action';
  link.href = 'javascript:void(0)';
  link.className = 'block w-full text-left px-4 py-3 text-xs font-bold text-red-600 hover:bg-red-50 transition-colors';
  link.innerHTML = '<i class="fa-solid fa-calendar-xmark mr-2 opacity-50"></i>Download Lewat Deadline';
  link.onclick = function () {
    if (link.parentElement) link.parentElement.classList.add('hidden');
    downloadDeadlineNaskahExcel();
  };
  if (archiveLink) menu.insertBefore(link, archiveLink);
  else menu.appendChild(link);
}


function naskahArchiveEscape(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}


function archiveCancelledNaskahUi() {
  Swal.fire({
    title: 'Arsipkan Naskah Batal?',
    text: 'Semua naskah yang sudah dibatalkan/disetujui batal akan dipindahkan dari sheet aktif ke NaskahArchive.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Arsipkan',
    cancelButtonText: 'Batal',
    confirmButtonColor: '#4763FD'
  }).then((result) => {
    if (!result.isConfirmed) return;
    gas.withSuccessHandler((res) => {
      const count = Number(res?.data?.count || 0);
      if (!res || res.success === false) {
        const errors = (res?.data?.errors || []).slice(0, 3).join('\n');
        Swal.fire('Sebagian Gagal', (res?.message || res?.error || 'Ada naskah yang gagal diarsipkan.') + (errors ? '\n\n' + errors : ''), 'warning');
      } else {
        Swal.fire('Diarsipkan', "".concat(count, " naskah batal berhasil dipindahkan ke arsip."), 'success');
      }
      loadNaskahMigrasi();
    }).withFailureHandler((error) => showServerError('Gagal Mengarsipkan Naskah', error)).archiveCancelledNaskah(state.user?.nama || 'Manajemen');
  });
}
window.archiveCancelledNaskahUi = archiveCancelledNaskahUi;

function normalizeImportDate(value) {
  if (!value) return '';
  if (value instanceof Date) return value.toISOString().split('T')[0];
  if (typeof value === 'number' && typeof XLSX !== 'undefined') {
    const parsed = XLSX.SSF.parse_date_code(value);
    if (parsed) {
      const month = String(parsed.m).padStart(2, '0');
      const day = String(parsed.d).padStart(2, '0');
      return "".concat(parsed.y, "-").concat(month, "-").concat(day);
    }
  }
  const text = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
  const parsedDate = new Date(text);
  if (!Number.isNaN(parsedDate.getTime())) return parsedDate.toISOString().split('T')[0];
  return text;
}


function normalizeMigrationProofValue(value) {
  const text = String(value || 'Perlu Proofreading').trim().toLowerCase();
  return text.includes('langsung') || text.includes('tidak') || text === '0' ? '0' : '1';
}


function importNaskahMigrasiExcel(event) {
  const input = event.target;
  const file = input.files && input.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') {
    Swal.fire('Gagal', 'Library Excel belum siap. Reload halaman lalu coba lagi.', 'error');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array', cellDates: true });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      if (!rows.length) {
        Swal.fire('File Kosong', 'Tidak ada baris data yang bisa diimport.', 'warning');
        return;
      }

      const activeDate = window._kpiActiveDate || '';
      const payloads = rows.map((row, idx) => {
        const get = (...keys) => {
          for (const key of keys) {
            if (row[key] !== undefined && row[key] !== '') return row[key];
          }
          return '';
        };
        const butuhProofreading = normalizeMigrationProofValue(get('Tahap Proofreading', 'Proofreading', 'Butuh Proofreading'));
        const skipProofreading = butuhProofreading === '0';
        const selectedTimeline = String(get('Tahap Saat Ini', 'Timeline', 'Tahap') || (skipProofreading ? 'Desain Cover & Layout' : 'Administrasi')).trim();
        const timeline = skipProofreading && (selectedTimeline === 'Administrasi' || selectedTimeline === 'Proofreading') ?
        'Desain Cover & Layout' :
        selectedTimeline;
        const judul = String(get('Judul Naskah', 'Judul') || '').trim();
        const penulis = String(get('Penulis') || '').trim();
        if (!judul || !penulis) throw new Error("Baris ".concat(idx + 2, ": Judul Naskah dan Penulis wajib diisi."));
        return {
          id: '',
          dealId: '',
          importMode: true,
          trackingCode: String(get('Kode Tracking', 'Tracking Code', 'Kode Naskah') || '').trim(),
          judul,
          penulis,
          noHpPenulis: String(get('No HP Penulis', 'Nomor HP Penulis', 'No HP', 'Telepon') || '').trim(),
          cs: 'Migrasi Manajemen',
          penerbit: String(get('Penerbit') || '').trim(),
          paket: String(get('Paket') || '').trim(),
          ukuran: String(get('Ukuran') || '').trim(),
          estimasiHalaman: Number(get('Estimasi Halaman', 'Halaman') || 0),
          estimasiKata: Number(get('Estimasi Kata', 'Kata') || 0),
          tanggal: normalizeImportDate(get('Tanggal Masuk', 'Tanggal')) || new Date().toISOString().split('T')[0],
          timeline,
          lengkap: false,
          batasRevisiProofreading: 0,
          batasRevisiLayout: 0,
          revisiProofreading: 0,
          revisiLayout: 0,
          statusIsbn: 'Menunggu',
          tindakanIsbn: '',
          picEditor: skipProofreading ? '' : String(get('PIC Editor', 'Editor') || '').trim(),
          picLayouter: String(get('PIC Layouter', 'Layouter') || '').trim(),
          statusEditor: skipProofreading ? 'Complete' : 'Menunggu',
          statusLayouter: 'Menunggu',
          deadlines: null,
          catatanCS: String(get('Catatan', 'Keterangan') || '').trim(),
          statusProses: 'Siap Proses',
          source: 'migrasi',
          kpiEligibleFrom: activeDate,
          butuhProofreading
        };
      });

      const saveOne = (payload) => new Promise((resolve, reject) => {
        gas.withSuccessHandler((res) => {
          if (res && res.success === false) reject(new Error(res.message || res.error || 'Gagal menyimpan data.'));else
          resolve(res);
        }).withFailureHandler(reject).saveNaskahData(payload);
      });
      const importResults = [];
      for (const payload of payloads) {
        importResults.push(await saveOne(payload));
      }
      input.value = '';
      loadNaskahMigrasi();
      const updatedCount = importResults.filter((result) => result?.data?.action === 'updated').length;
      const createdCount = importResults.length - updatedCount;
      Swal.fire('Import Berhasil', "".concat(createdCount, " naskah baru dan ").concat(updatedCount, " naskah diperbarui tanpa membuat KPI otomatis."), 'success');
    } catch (error) {
      input.value = '';
      Swal.fire('Import Gagal', String(error && error.message ? error.message : error), 'error');
    }
  };
  reader.readAsArrayBuffer(file);
}

function downloadDeadlineNaskahExcel() {
  if (typeof XLSX === 'undefined') {
    Swal.fire('Gagal', 'Library Excel belum siap. Reload halaman lalu coba lagi.', 'error');
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  const parseMap = (value) => {
    if (!value) return {};
    if (typeof value === 'object' && !Array.isArray(value)) return value;
    try {
      const parsed = JSON.parse(value);
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch (error) {
      return {};
    }
  };
  const stageLabel = {
    administrasi: 'Administrasi',
    proofreading: 'Proofreading',
    layout: 'Desain Cover & Layout',
    isbn: 'ISBN',
    produksi: 'Produksi',
    distribusi: 'Distribusi',
    selesai: 'Selesai'
  };
  const stageKeyFromTimeline = (timeline) => {
    const text = String(timeline || '').toLowerCase();
    if (text.includes('proof')) return 'proofreading';
    if (text.includes('layout') || text.includes('cover')) return 'layout';
    if (text.includes('isbn')) return 'isbn';
    if (text.includes('produksi') || text.includes('cetak')) return 'produksi';
    if (text.includes('distribusi')) return 'distribusi';
    if (text.includes('selesai')) return 'selesai';
    return 'administrasi';
  };
  const statusDone = (status) => ['done', 'complete', 'selesai', 'terbit'].includes(String(status || '').trim().toLowerCase());
  const statusStarted = (status) => {
    const normalized = String(status || '').trim().toLowerCase();
    return normalized && normalized !== 'menunggu';
  };
  const isbnDone = (status) => {
    const normalized = String(status || '').trim().toLowerCase();
    return statusDone(normalized) || normalized === 'diterima' || normalized === 'qrsbn';
  };
  const currentStageKey = (n) => {
    const order = ['administrasi', 'proofreading', 'layout', 'isbn', 'produksi', 'distribusi', 'selesai'];
    let idx = Math.max(0, order.indexOf(stageKeyFromTimeline(n.timeline)));
    const moveTo = (stage) => {
      const nextIdx = order.indexOf(stage);
      if (nextIdx > idx) idx = nextIdx;
    };
    if (String(n.butuhProofreading ?? '1') === '0' || statusDone(n.statusEditor)) moveTo('layout');
    if (statusStarted(n.statusLayouter)) moveTo('layout');
    if (statusDone(n.statusLayouter)) moveTo('isbn');
    if (statusStarted(n.statusIsbn)) moveTo('isbn');
    if (isbnDone(n.statusIsbn)) moveTo('produksi');
    if (statusStarted(n.statusProduksi)) moveTo('produksi');
    if (statusDone(n.statusProduksi)) moveTo('distribusi');
    if (statusStarted(n.statusDistribusi)) moveTo('distribusi');
    if (statusDone(n.statusDistribusi)) moveTo('selesai');
    return order[idx] || 'administrasi';
  };
  const nextDeadlineStage = (stage) => ({
    administrasi: 'proofreading',
    proofreading: 'layout',
    layout: 'isbn',
    isbn: 'produksi',
    produksi: 'distribusi',
    distribusi: 'selesai'
  })[stage] || '';
  const activeRows = (mockNaskahDB || []).filter((n) => {
    if (!n) return false;
    if (typeof isNaskahCancelled === 'function' && isNaskahCancelled(n)) return false;
    return n.statusProses === 'Siap Proses' || !n.statusProses || n.source === 'migrasi';
  });

  const exportData = activeRows.map((n) => {
    const deadlines = parseMap(n.deadlines);
    const baseDeadlines = parseMap(n.baseDeadlines);
    const merged = { ...baseDeadlines, ...deadlines };
    const currentStage = currentStageKey(n);
    const deadlineStage = nextDeadlineStage(currentStage);
    const deadline = String((deadlineStage && merged[deadlineStage]) || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(deadline) || deadline >= today) return null;
    return {
      'Kode Tracking': n.trackingCode || '',
      'ID Naskah': n.id || '',
      'Judul Naskah': n.judul || '',
      'Penulis': n.penulis || '',
      'Penerbit': n.penerbit || '',
      'Paket': n.paket || '',
      'Sumber': n.source === 'cs' || n.dealId ? 'Input CS' : 'Migrasi Manajemen',
      'Timeline Tersimpan': n.timeline || '',
      'Tahap Saat Ini': stageLabel[currentStage] || currentStage,
      'Tahap Deadline': stageLabel[deadlineStage] || deadlineStage,
      'Deadline': deadline,
      'Tanggal Cek': today,
      'Status Editor': n.statusEditor || '',
      'Status Layouter': n.statusLayouter || '',
      'Status ISBN': n.statusIsbn || '',
      'Status Produksi': n.statusProduksi || '',
      'Status Distribusi': n.statusDistribusi || ''
    };
  }).filter(Boolean);

  if (!exportData.length) {
    Swal.fire('Tidak Ada Data', 'Tidak ada naskah berjalan yang melewati deadline aktif.', 'info');
    return;
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(exportData);
  ws['!cols'] = [
    { wch: 22 }, { wch: 18 }, { wch: 42 }, { wch: 24 }, { wch: 16 }, { wch: 16 },
    { wch: 18 }, { wch: 22 }, { wch: 22 }, { wch: 18 }, { wch: 14 }, { wch: 14 },
    { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }, { wch: 16 }
  ];
  XLSX.utils.book_append_sheet(wb, ws, 'Naskah Lewat Deadline');
  XLSX.writeFile(wb, 'Naskah_Lewat_Deadline_' + today + '.xlsx');
  Swal.fire('Berhasil', `${exportData.length} naskah lewat deadline berhasil diunduh.`, 'success');
}


function downloadDoubleNaskahExcel() {
  if (typeof XLSX === 'undefined') {
    Swal.fire('Gagal', 'Library Excel belum siap.', 'error');
    return;
  }
  
  Swal.fire({ title: 'Menganalisis Naskah...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  
  gas.withSuccessHandler((res) => {
    const data = res?.data || [];
    const active = data.filter((n) => (n.statusProses === 'Siap Proses' || !n.statusProses || n.source === 'migrasi') && !(typeof isNaskahCancelled === 'function' && isNaskahCancelled(n)));
    
    function getSimilarity(s1, s2) {
      s1 = String(s1 || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      s2 = String(s2 || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!s1 || !s2) return 0;
      if (s1 === s2) return 1;
      if (s1.includes(s2) || s2.includes(s1)) return 0.9;
      
      const longer = s1.length > s2.length ? s1 : s2;
      const shorter = s1.length > s2.length ? s2 : s1;
      const longerLength = longer.length;
      
      const costs = new Array();
      for (let i = 0; i <= longer.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= shorter.length; j++) {
          if (i == 0) {
            costs[j] = j;
          } else if (j > 0) {
            let newValue = costs[j - 1];
            if (longer.charAt(i - 1) !== shorter.charAt(j - 1)) {
              newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
            }
            costs[j - 1] = lastValue;
            lastValue = newValue;
          }
        }
        if (i > 0) costs[shorter.length] = lastValue;
      }
      return (longerLength - costs[shorter.length]) / parseFloat(longerLength);
    }
    
    const duplicates = [];
    const checked = new Set();
    
    for (let i = 0; i < active.length; i++) {
      if (checked.has(active[i].id)) continue;
      
      const currentGroup = [active[i]];
      for (let j = i + 1; j < active.length; j++) {
        if (checked.has(active[j].id)) continue;
        
        const simJudul = getSimilarity(active[i].judul, active[j].judul);
        const simPenulis = getSimilarity(active[i].penulis, active[j].penulis);
        
        if (simJudul > 0.8 && simPenulis > 0.8) {
          currentGroup.push(active[j]);
          checked.add(active[j].id);
        }
      }
      
      if (currentGroup.length > 1) {
        checked.add(active[i].id);
        currentGroup.forEach(n => duplicates.push(n));
      }
    }
    
    if (duplicates.length === 0) {
      Swal.fire('Tidak Ditemukan', 'Sistem tidak menemukan indikasi naskah ganda yang memiliki kemiripan tinggi pada judul dan nama penulis.', 'info');
      return;
    }
    
    const exportData = duplicates.map(n => ({
      'Kode Tracking': n.trackingCode || '-',
      'Judul Naskah': n.judul || '-',
      'Nama Penulis': n.penulis || '-',
      'Riwayat Klaim KPI': [
         n.adminKpiClaimed ? 'Admin: ' + n.adminKpiClaimed : '',
         n.cssKpiClaimed ? 'CSS: ' + n.cssKpiClaimed : '',
         n.statusEditorUpdatedAt ? 'Editor: Selesai' : '',
         n.statusLayouterUpdatedAt ? 'Layouter: Selesai' : ''
      ].filter(Boolean).join(' | ') || 'Belum ada klaim KPI'
    }));
    
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(exportData);
    ws['!cols'] = [{ wch: 22 }, { wch: 45 }, { wch: 25 }, { wch: 40 }];
    
    XLSX.utils.book_append_sheet(wb, ws, 'Indikasi Naskah Double');
    XLSX.writeFile(wb, 'Laporan_Naskah_Double_' + new Date().toISOString().split('T')[0] + '.xlsx');
    
    Swal.fire('Berhasil', `Ditemukan ${exportData.length} baris naskah yang terindikasi double dan berhasil diunduh.`, 'success');
  }).withFailureHandler((error) => {
    Swal.fire('Gagal', 'Terjadi kesalahan saat mengambil data: ' + String(error), 'error');
  }).getNaskahData();
}
