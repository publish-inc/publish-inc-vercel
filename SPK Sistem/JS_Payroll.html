function parsePayrollJsonValue(value, fallback = {}) {
  if (!value) return fallback;
  if (typeof value === 'object') return value;
  try {
    return JSON.parse(String(value));
  } catch (e) {
    return fallback;
  }
}

const PAYROLL_FORMULA_VARIABLES = [
  { key: 'GP', label: 'Gaji Pokok Karyawan' },
  { key: 'TJ', label: 'Tunjangan Karyawan' },
  { key: 'HK', label: 'Hari Kerja Sebulan' },

function insertPayrollFormulaMention(variable) {
  const targetId = window._activePayrollFormulaInput || 'global_formula_alpa';
  const input = document.getElementById(targetId);
  if (!input) return;
  const mention = '@' + variable;
  const start = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  const end = typeof input.selectionEnd === 'number' ? input.selectionEnd : input.value.length;
  const before = input.value.slice(0, start);
  const after = input.value.slice(end);
  const prefix = before && !/[\s(+\-*/]$/.test(before) ? ' ' : '';
  const suffix = after && !/^[\s)+\-*/]/.test(after) ? ' ' : '';
  input.value = before + prefix + mention + suffix + after;
  const cursor = (before + prefix + mention).length;
  input.focus();
  input.setSelectionRange(cursor, cursor);
  hidePayrollMentionMenu();
}

function hidePayrollMentionMenu() {
  const menu = document.getElementById('payroll_formula_mention_menu');
  if (menu) menu.remove();
}

function selectPayrollFormulaMention(variable) {
  const input = document.getElementById(window._activePayrollFormulaInput || '');
  if (!input) return insertPayrollFormulaMention(variable);
  const cursor = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  const before = input.value.slice(0, cursor);
  const atIndex = before.lastIndexOf('@');
  if (atIndex === -1) return insertPayrollFormulaMention(variable);
  const after = input.value.slice(cursor);
  input.value = input.value.slice(0, atIndex) + '@' + variable + after;
  const nextCursor = atIndex + variable.length + 1;
  input.focus();
  input.setSelectionRange(nextCursor, nextCursor);
  hidePayrollMentionMenu();
}

function showPayrollMentionMenu(input) {
  if (!input) return;
  hidePayrollMentionMenu();
  window._activePayrollFormulaInput = input.id;
  const rect = input.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.id = 'payroll_formula_mention_menu';
  menu.style.cssText = [
    'position:fixed',
    `left:${Math.max(12, rect.left)}px`,
    `top:${rect.bottom + 6}px`,
    'z-index:99999',
    'width:min(360px, calc(100vw - 24px))',
    'max-height:260px',
    'overflow:auto',
    'background:#ffffff',
    'border:1px solid #e2e8f0',
    'border-radius:14px',
    'box-shadow:0 18px 45px rgba(15, 23, 42, 0.18)',
    'padding:6px'
  ].join(';');
  menu.innerHTML = PAYROLL_FORMULA_VARIABLES.map((item) => `
    <button type="button" onclick="selectPayrollFormulaMention('${item.key}')" style="display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:0;background:#fff;border-radius:10px;cursor:pointer;text-align:left;">
      <span style="font-family:monospace;font-weight:800;color:#4f46e5;">@${item.key}</span>
      <span style="font-size:12px;color:#475569;font-weight:700;">${item.label}</span>
    </button>
  `).join('');
  document.body.appendChild(menu);
}

function handlePayrollFormulaMentionInput(input) {
  window._activePayrollFormulaInput = input.id;
  const cursor = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  const before = input.value.slice(0, cursor);
  if (/@[A-Za-z]*$/.test(before)) showPayrollMentionMenu(input);else hidePayrollMentionMenu();
}

// Subtab History
function renderPayrollHistoryTab() {
  const container = document.getElementById('payrollSubContent');
  if (!container) return;
  
  gas.withSuccessHandler((res) => {
    const rawList = res?.data || [];
    const map = {};
    const toDelete = [];
    
    rawList.forEach(item => {
      const key = String(item.username || '').toLowerCase() + '-' + String(item.bulanTahun || '');
      if (!map[key]) {
        map[key] = item;
      } else {
        const existingTime = new Date(map[key].createdAt || 0).getTime();
        const currentTime = new Date(item.createdAt || 0).getTime();
        if (currentTime > existingTime) {
          toDelete.push(map[key].id);
          map[key] = item;
        } else {
          toDelete.push(item.id);
        }
      }
    });
    
    if (toDelete.length > 0) {
      toDelete.forEach(id => {
        if (id) gas.deletePayrollHistory(id);
      });
    }

    const list = Object.values(map).sort((a,b) => String(b.bulanTahun).localeCompare(String(a.bulanTahun)));
    
    container.innerHTML = `
      <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="p-6 border-b border-slate-50 flex flex-col sm:flex-row justify-between items-center gap-4">

        <div class="overflow-x-auto">
          <table class="w-full text-left" id="payroll_history_table">

              <tr>
                <th class="px-8 py-4">Bulan</th>

              ${list.map(item => `

                  <td class="px-8 py-4 font-mono font-bold text-slate-700">${item.bulanTahun}</td>
                  <td class="px-8 py-4 font-bold text-slate-900">${item.nama || item.username}</td>
                  <td class="px-8 py-4 text-slate-500 font-bold uppercase text-xs">${getRoleLabel(item.role)}</td>
                  <td class="px-8 py-4 text-right font-mono text-slate-600">${formatRp(item.gajiPokok)}</td>
                  <td class="px-8 py-4 text-right font-mono text-slate-600">${formatRp(item.tunjangan)}</td>
                  <td class="px-8 py-4 text-right font-mono text-red-500">-${formatRp(item.potonganKehadiran)}</td>
                  <td class="px-8 py-4 text-right font-mono text-emerald-600">+${formatRp(item.rewardKpi)}</td>
                  <td class="px-8 py-4 text-right font-mono font-bold text-slate-900 bg-slate-50/50">${formatRp(item.gajiBersih)}</td>
                  <td class="px-8 py-4 text-center space-x-2">
                    <button onclick="viewPayrollSlipHistory('${item.id}')" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold rounded-lg text-xs transition"><i class="fa-solid fa-eye"></i> Slip</button>

    window._cachedPayrollHistory = list;

function filterPayrollHistoryTable() {
  const query = String(document.getElementById('payroll_history_search').value || '').toLowerCase().trim();
  const rows = document.querySelectorAll('#payroll_history_table tbody tr');
  rows.forEach(r => {
    const text = String(r.textContent || '').toLowerCase();
    if (text.includes('belum ada riwayat')) return;
    r.style.display = text.includes(query) ? '' : 'none';
  });
}

function parsePayrollRewardTargetRules(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {
    const parsed = JSON.parse(String(value));
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch (e) {
    return {};
  }
}

function parsePayrollRewardPackageRates(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {
    const parsed = JSON.parse(String(value));
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch (e) {
    return {};
  }
}

function parsePayrollAllowanceDetails(value) {
  if (!value) return [];
  let items = value;
  if (typeof value === 'string') {
    try {
      items = JSON.parse(value);
    } catch (e) {
      items = [];
    }
  }
  if (!Array.isArray(items)) return [];
  return items.map((item) => ({
    nama: String(item?.nama || item?.name || item?.label || '').trim(),
    nominal: Math.max(0, Number(item?.nominal || item?.amount || item?.value || 0))
  })).filter((item) => item.nama || item.nominal > 0);
}

  let found = false;
  
  rows.forEach(row => {
    const nameInput = row.querySelector('[data-payroll-deduction-name]');
    if (nameInput && nameInput.value.startsWith(type)) {
      if (c > 0) {
        nameInput.value = `${type} (${c}x)`;
        row.querySelector('[data-payroll-deduction-amount]').value = total;
        found = true;
      } else {
        row.remove();
      }
    }
  });
  
  if (!found && c > 0) {
    const cb = document.getElementById('swal_deduction_enabled');
    if (cb) cb.checked = true;
    togglePayrollDeductionFields();
    addPayrollDeductionRow({ nama: `${type} (${c}x)`, nominal: total });
    
    Array.from(document.querySelectorAll('[data-payroll-deduction-row]')).forEach(r => {
      const n = r.querySelector('[data-payroll-deduction-name]')?.value;
      const amt = r.querySelector('[data-payroll-deduction-amount]')?.value;
      if (!n && (!amt || amt === '0')) r.remove();
    });
  }
  
  updatePayrollDeductionTotal();
};

function updatePayrollConfigSummary() {
  const gp = Number(document.getElementById('swal_gp')?.value || 0);
  const tj = Number(document.getElementById('swal_tj')?.value || 0);
  const potongan = Number(document.getElementById('swal_potongan_tambahan')?.value || 0);
  const rewardOn = !!document.getElementById('swal_reward_enabled')?.checked;
  const rewardBasis = document.getElementById('swal_reward_basis')?.value || '';
  const rewardManual = rewardOn && rewardBasis === 'manual' ? Number(document.getElementById('swal_rate')?.value || 0) : 0;
  
  const total = gp + tj + rewardManual - potongan;
  const el = document.getElementById('swal_payroll_summary');
  if (el) el.textContent = formatRp(Math.max(0, total));
}
window.updatePayrollConfigSummary = updatePayrollConfigSummary;

function getPayrollDefaultRewardBasis(role, conf = {}) {
  const saved = String(conf.rewardBasis || '').trim().toLowerCase();
  if (saved) return saved;
  const normalizedRole = String(role || '').toLowerCase();
  if (normalizedRole === 'cs') return 'omzet';
  if (['editor', 'pic_editor'].includes(normalizedRole)) return 'kata';
  if (['layouter', 'pic_layouter'].includes(normalizedRole)) return 'halaman';
  if (normalizedRole === 'karyawan') return 'manual';
  return '';
}

function getPayrollPackageNames() {
  const settings = window._payrollSettingsData || {};
  const publishers = settings.penerbit || [];
  return [...new Set(publishers.flatMap((pub) => {
    if (Array.isArray(pub.paket)) return pub.paket;
    return String(pub.paket || '').split(',').map((item) => item.trim()).filter(Boolean);
  }).filter(Boolean))].sort((a, b) => a.localeCompare(b));
}

function getPayrollConfigRow(username) {
  const rows = window._payrollConfigRows || [];
  return rows.find((row) => String(row.username || '').toLowerCase() === String(username || '').toLowerCase()) || {};
}

function getPayrollRewardTargets(role, targetRow) {
  const normalizedRole = String(role || '').toLowerCase();
  const items = [];
  if (normalizedRole === 'cs') {
    items.push({ key: 'targetOmzet', label: 'Target Omzet', value: Number(targetRow.targetOmzet || 0), unit: 'rupiah' });
    items.push({ key: 'targetTerbit', label: 'Target Deal Closing', value: Number(targetRow.targetTerbit || 0), unit: 'deal' });
    items.push({ key: 'targetCetak', label: 'Target Cetak', value: Number(targetRow.targetCetak || 0), unit: 'poin' });
  } else if (['editor', 'pic_editor'].includes(normalizedRole)) {
    items.push({ key: 'targetKata', label: 'Target Kata', value: Number(targetRow.targetKata || 0), unit: 'kata' });
  } else if (['layouter', 'pic_layouter'].includes(normalizedRole)) {
    items.push({ key: 'targetHalaman', label: 'Target Halaman', value: Number(targetRow.targetHalaman || 0), unit: 'halaman' });
  }
  return items.filter((item) => item.value > 0);
}

function getPayrollRewardMainTarget(role, targetRow) {
  const normalizedRole = String(role || '').toLowerCase();
  if (normalizedRole === 'cs') return Number(targetRow.targetOmzet || 0);
  if (['editor', 'pic_editor'].includes(normalizedRole)) return Number(targetRow.targetKata || 0);
  if (['layouter', 'pic_layouter'].includes(normalizedRole)) return Number(targetRow.targetHalaman || 0);
  return 0;
}

function formatPayrollRewardTarget(item) {
  if (item.unit === 'rupiah') return formatRp(item.value);
  return formatNumber(item.value) + ' ' + item.unit;
}

                <th class="px-8 py-4">Role</th>

                <th class="px-8 py-4 text-center">Aksi</th>

              const allowanceItems = parsePayrollAllowanceDetails(conf.tunjanganDetail);
              const allowanceTotal = allowanceItems.length ? allowanceItems.reduce((sum, item) => sum + Number(item.nominal || 0), 0) : Number(conf.tunjangan || 0);
              return `
                <tr class="hover:bg-slate-50 transition-colors">
                  <td class="px-8 py-4 font-bold text-slate-900">${u.nama || u.username} <span class="block text-[10px] font-bold text-slate-400 font-mono">${u.username}</span></td>
                  <td class="px-8 py-4 text-slate-500 font-bold uppercase text-xs">${getRoleLabel(u.role)}</td>

                  <td class="px-8 py-4 text-center">${allowanceItems.length ? `<div class="flex flex-wrap gap-1 justify-center max-w-[12rem] mx-auto">${allowanceItems.map(item => `<span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded-md text-[9px] font-black leading-tight border border-indigo-100/50">${item.nama}: ${formatRp(item.nominal)}</span>`).join('')}</div>` : '-'}</td>
                  <td class="px-8 py-4 text-center">
                    <button onclick="editEmployeePayrollTunjangan('${u.username}', '${u.nama || u.username}')" class="px-4 py-2 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 font-black rounded-xl text-xs border border-slate-100 transition shadow-sm"><i class="fa-solid fa-hand-holding-dollar mr-1"></i> Atur Tunjangan</button>
                  </td>

              `;

          } else if (activeTab === 'potongan') {

                <th class="px-8 py-4">Karyawan</th>
                <th class="px-8 py-4">Role</th>
                <th class="px-8 py-4 text-right">Total Potongan</th>
                <th class="px-8 py-4 text-center">Detail</th>
                <th class="px-8 py-4 text-center">Aksi</th>
              </tr>
            `;
            
            const bulanTahun = new Date().toISOString().substring(0, 7);
            const hk = Number(window._payrollSettingsData?.hariKerja || 26);
            const evalSimRate = (formula, a, i, t, gp, tj) => {
              try {
                if (!formula) return 0;
                let f = formula.toString().toUpperCase().replace(/@GP/g, gp).replace(/@TJ/g, tj).replace(/@HK/g, hk).replace(/@A/g, a).replace(/@I/g, i).replace(/@S/g, 0).replace(/@ISH/g, 0).replace(/@C/g, 0).replace(/@T/g, t);
                return Math.round(eval(f)) || 0;
              } catch(e) { return 0; }
            };
            
            tableBody = users.map(u => {
              const conf = configs.find(c => String(c.username).toLowerCase() === String(u.username).toLowerCase()) || { potonganDetail: '[]', gajiPokok: 0, tunjangan: 0 };

              const deductionTotal = deductionItems.length ? deductionItems.reduce((sum, item) => sum + Number(item.nominal || 0), 0) : 0;
              
              const gp = Number(conf.gajiPokok || 0);
              const tj = Number(conf.tunjangan || 0);
              const rateAlpa = evalSimRate(window._payrollSettingsData?.formulaAlpa, 1, 0, 0, gp, tj);
              const rateIzin = evalSimRate(window._payrollSettingsData?.formulaIzin, 0, 1, 0, gp, tj);
              const rateTerlambat = evalSimRate(window._payrollSettingsData?.formulaTerlambat, 0, 0, 1, gp, tj);
              
              let alpaCount = 0, izinCount = 0, terlambatCount = 0;
              (window._kehadiranData || []).forEach(row => {

                  const rName = String(row.karyawan || '').toLowerCase();

                    const status = String(row.status || '').toLowerCase();
                    if (status === 'alpa') alpaCount++;
                    else if (status.includes('izin')) izinCount++;
                    else if (status === 'terlambat') terlambatCount++;
                  }
                }
              });
              
              const totalAbsensi = (alpaCount * rateAlpa) + (izinCount * rateIzin) + (terlambatCount * rateTerlambat);
              const grandTotal = deductionTotal + totalAbsensi;
              
              let detailHtml = '';
              if (alpaCount > 0) detailHtml += `<span class="px-2 py-0.5 bg-orange-50 text-orange-600 rounded-md text-[9px] font-black leading-tight border border-orange-100/50">Alpa: ${formatRp(alpaCount * rateAlpa)}</span>`;
              if (izinCount > 0) detailHtml += `<span class="px-2 py-0.5 bg-orange-50 text-orange-600 rounded-md text-[9px] font-black leading-tight border border-orange-100/50">Izin: ${formatRp(izinCount * rateIzin)}</span>`;
              if (terlambatCount > 0) detailHtml += `<span class="px-2 py-0.5 bg-orange-50 text-orange-600 rounded-md text-[9px] font-black leading-tight border border-orange-100/50">Telat: ${formatRp(terlambatCount * rateTerlambat)}</span>`;
              
              return `
                <tr class="hover:bg-slate-50 transition-colors">
                  <td class="px-8 py-4 font-bold text-slate-900">${u.nama || u.username} <span class="block text-[10px] font-bold text-slate-400 font-mono">${u.username}</span></td>

                  <td class="px-8 py-4 text-center">
                    <button onclick="editEmployeePayrollPotongan('${u.username}', '${u.nama || u.username}')" class="px-4 py-2 bg-slate-50 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 font-black rounded-xl text-xs border border-slate-100 transition shadow-sm"><i class="fa-solid fa-money-bill-transfer mr-1"></i> Atur Potongan</button>
                  </td>
                </tr>
              `;
            }).join('');
          } else if (activeTab === 'reward') {
            tableHeaders = `
              <tr>
                <th class="px-8 py-4">Karyawan</th>
                <th class="px-8 py-4">Role</th>

              const conf = configs.find(c => String(c.username).toLowerCase() === String(u.username).toLowerCase()) || { rewardEnabled: '0', rewardRate: 0 };
              const rewardEnabled = String(conf.rewardEnabled || '') === '1';
              const targetRow = getPayrollTargetRow(u.username);
              const rewardBasis = getPayrollDefaultRewardBasis(u.role, conf);

                  targetKpiDisplay = targetRow.targetOmzet ? formatRp(targetRow.targetOmzet) : 'Belum disetting';

              } else if (rewardEnabled && ['layouter', 'pic_layouter'].includes(u.role)) {
                rewardRateDisplay = formatRp(conf.rewardRate) + ' / halaman';
                targetKpiDisplay = targetRow.targetHalaman ? formatNumber(targetRow.targetHalaman) + ' halaman' : 'Belum disetting';
              } else if (rewardEnabled && u.role === 'karyawan') {
                rewardRateDisplay = formatRp(conf.rewardRate);
                targetKpiDisplay = 'Manual';
              }
              
              return `
                <tr class="hover:bg-slate-50 transition-colors">

          </div>

          }).getKehadiranData();

        }).getHrdGlobalConfig();
      }).getTargetData();
    }).getPayrollConfig();
  }).getUsersData();
}

function editEmployeePayrollPotongan(username, nama) {
  const conf = getPayrollConfigRow(username);
  const deductionItems = parsePayrollAllowanceDetails(conf.potonganDetail);
  const deductionEnabled = deductionItems.length > 0;
  const initialDeductionItems = deductionItems.length ? deductionItems : [{ nama: '', nominal: 0 }];
  const initialDeductionTotal = initialDeductionItems.reduce((sum, item) => sum + Number(item.nominal || 0), 0);
  
  const gp = Number(conf.gajiPokok || 0);
  const tj = Number(conf.tunjangan || 0);
  const hk = Number(window._payrollSettingsData?.hariKerja || 26);
  const evalSimulatedRate = (formula, a, i, t) => {
    try {
      if (!formula) return 0;
      let f = formula.toString().toUpperCase().replace(/@GP/g, gp).replace(/@TJ/g, tj).replace(/@HK/g, hk).replace(/@A/g, a).replace(/@I/g, i).replace(/@S/g, 0).replace(/@ISH/g, 0).replace(/@C/g, 0).replace(/@T/g, t);
      return Math.round(eval(f)) || 0;
    } catch(e) { return 0; }
  };
  
  const rateAlpa = evalSimulatedRate(window._payrollSettingsData?.formulaAlpa, 1, 0, 0);
  const rateIzin = evalSimulatedRate(window._payrollSettingsData?.formulaIzin, 0, 1, 0);
  const rateTerlambat = evalSimulatedRate(window._payrollSettingsData?.formulaTerlambat, 0, 0, 1);

  const bulanTahun = new Date().toISOString().substring(0, 7);
  let alpaCount = 0;
  let izinCount = 0;
  let terlambatCount = 0;
  
  (window._kehadiranData || []).forEach(row => {
    if (String(row.tanggal || '').substring(0, 7) === bulanTahun) {
      const rName = String(row.karyawan || '').toLowerCase();
      const rUname = String(row.username || '').toLowerCase();
      if (rName === String(nama || '').toLowerCase() || (username && rUname === String(username || '').toLowerCase())) {
        const status = String(row.status || '').toLowerCase();
        if (status === 'alpa') alpaCount++;
        else if (status.includes('izin')) izinCount++;
        else if (status === 'terlambat') terlambatCount++;
      }
    }
  });

  const totalPotonganAlpa = alpaCount * rateAlpa;
  const totalPotonganIzin = izinCount * rateIzin;
  const totalPotonganTerlambat = terlambatCount * rateTerlambat;
  const totalAbsensi = totalPotonganAlpa + totalPotonganIzin + totalPotonganTerlambat;

  Swal.fire({
    title: `<div class="text-left font-black text-lg border-b border-slate-100 pb-3">Atur Potongan Tambahan: ${nama}</div>`,
    html: `
      <div class="text-left space-y-4 pt-3 text-sm min-h-[300px]">
        <div class="rounded-2xl border border-orange-100 bg-orange-50 p-4 mb-2 shadow-sm">
          <h4 class="text-xs font-black text-orange-600 uppercase tracking-widest mb-1"><i class="fa-solid fa-calendar-check mr-1"></i>Potongan Kehadiran (${bulanTahun})</h4>
          <p class="text-[11px] text-orange-600/80 font-bold leading-relaxed mb-3">Tarikan data otomatis dari absensi Manajemen untuk bulan ini.</p>
          
          <input type="hidden" id="swal_potongan_absensi_total" value="${totalAbsensi}" />
          
          <div class="grid grid-cols-1 gap-2 text-sm">
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-orange-100">
              <span class="text-slate-600 font-bold">Alpa (${alpaCount}x)</span>
              <span class="font-mono text-red-500 font-bold">-${formatRp(totalPotonganAlpa)}</span>
            </div>
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-orange-100">
              <span class="text-slate-600 font-bold">Izin (${izinCount}x)</span>
              <span class="font-mono text-red-500 font-bold">-${formatRp(totalPotonganIzin)}</span>
            </div>
            <div class="flex justify-between items-center bg-white px-3 py-2 rounded-lg border border-orange-100">
              <span class="text-slate-600 font-bold">Terlambat (${terlambatCount}x)</span>
              <span class="font-mono text-red-500 font-bold">-${formatRp(totalPotonganTerlambat)}</span>
            </div>
            <div class="flex justify-between items-center bg-orange-100/50 px-3 py-2 rounded-lg border border-orange-200 mt-1">
              <span class="text-orange-800 font-black text-xs uppercase tracking-wider">Total Absensi</span>
              <span class="font-mono text-red-600 font-black">-${formatRp(totalAbsensi)}</span>
            </div>
          </div>
        </div>
        
        <div class="rounded-2xl border border-slate-100 bg-slate-50 p-4">
          <label class="flex items-center justify-between gap-4 cursor-pointer">
            <span>
              <span class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Aktifkan Potongan Tambahan</span>
              <span class="block text-xs text-slate-500 font-bold mt-1">Aktifkan untuk menambah potongan lain (contoh: Kasbon, Pinjaman).</span>
            </span>
            <input type="checkbox" id="swal_deduction_enabled" ${deductionEnabled ? 'checked' : ''} onchange="togglePayrollDeductionFields()" class="w-5 h-5 accent-red-600">
          </label>
          <input type="hidden" id="swal_potongan_tambahan" value="${deductionEnabled ? initialDeductionTotal : 0}" />
          <div id="swal_deduction_area" class="${deductionEnabled ? '' : 'hidden'} mt-4 space-y-3 pt-3 border-t border-slate-200/60">
            <div id="swal_deduction_list" class="space-y-2">
              ${initialDeductionItems.map((item) => renderPayrollDeductionRow(item)).join('')}
            </div>
            <button type="button" onclick="addPayrollDeductionRow()" class="w-full px-4 py-2.5 rounded-xl border border-red-100 bg-red-50 text-red-600 text-xs font-black hover:bg-red-100 transition"><i class="fa-solid fa-plus mr-1"></i> Tambah Potongan</button>
          </div>
        </div>
        
        <div class="rounded-2xl border border-red-100 bg-red-50 p-4 mt-4 shadow-sm">
          <div class="flex items-center justify-between">
            <span class="text-sm font-black text-red-600 uppercase tracking-widest">Total Potongan</span>
            <span id="swal_grand_total_text" class="text-lg font-black text-red-700">${formatRp((deductionEnabled ? initialDeductionTotal : 0) + totalAbsensi)}</span>
          </div>
        </div>
      </div>
    `,
    width: 'min(94vw, 68rem)',
    customClass: { popup: 'rounded-[2rem] payroll-config-landscape-popup' },
    showCancelButton: true,
    confirmButtonText: 'Simpan Potongan',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const fullConfig = getFullConfigForSave(username);
      const isEnabled = document.getElementById('swal_deduction_enabled').checked;
      const rows = isEnabled ? getPayrollDeductionRows() : [];
      fullConfig.potonganDetail = JSON.stringify(rows);
      return fullConfig;
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      gas.withSuccessHandler(() => {
        Swal.fire('Berhasil!', 'Potongan tambahan berhasil disimpan.', 'success');
        renderPayrollConfigTab();
      }).savePayrollConfig(res.value);
    }
  });
}

function editEmployeePayrollReward(username, nama, role) {
  const conf = getPayrollConfigRow(username);
  const rewardEnabled = String(conf.rewardEnabled || '') === '1';
  const targetRow = getPayrollTargetRow(username);
  const rewardBasis = getPayrollDefaultRewardBasis(role, conf);
  const packageRates = parsePayrollRewardPackageRates(conf.rewardPackageRates);
  const rewardRate = conf.rewardRate;

  let rewardLabel = 'Rate Reward';

  if (role === 'cs') {
    rewardLabel = 'Rate Reward (%)';
    rewardPlaceholder = 'Contoh: 2 (berarti 2% dari total capaian omzet)';
  } else if (['editor', 'pic_editor'].includes(role)) {
    rewardLabel = 'Rate Reward (Rupiah per Kata)';
    rewardPlaceholder = 'Contoh: 10 (berarti Rp 10 per kata kelebihan)';

    rewardPlaceholder = 'Contoh: 5000 (berarti Rp 5.000 per halaman kelebihan)';

    rewardLabel = 'Nominal Reward Manual (Rp)';
    rewardPlaceholder = 'Contoh: 250000';

  Swal.fire({
    title: `<div class="text-left font-black text-lg border-b border-slate-100 pb-3">Atur Reward KPI: ${nama}</div>`,

          ${role === 'karyawan' ? `
            <input type="hidden" id="swal_reward_basis" value="manual" />

            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${rewardLabel}</label>
              <input type="number" step="any" id="swal_rate" value="${rewardRate}" placeholder="${rewardPlaceholder}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold outline-none focus:border-indigo-500 bg-white" />
              <p class="text-[11px] text-slate-400 font-bold mt-1">Nominal ini langsung ditambahkan ke total reward pada slip gaji.</p>
            </div>
          ` : role === 'cs' ? `
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Basis Reward</label>
              <select id="swal_reward_basis" onchange="togglePayrollRewardBasisFields()" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold outline-none focus:border-indigo-500 bg-white">
                <option value="omzet" ${rewardBasis === 'omzet' ? 'selected' : ''}>Omzet - persen dari total capaian</option>
                <option value="terbit" ${rewardBasis === 'terbit' ? 'selected' : ''}>Terbit - kelebihan deal per paket</option>
              </select>
            </div>
            <div data-payroll-basis-panel="omzet" class="${rewardBasis === 'omzet' ? '' : 'hidden'} space-y-4">
              <input type="hidden" id="swal_target_omzet" value="${Number(targetRow.targetOmzet || 0)}" />
              ${renderPayrollBasisTargetInfo('Target Omzet', Number(targetRow.targetOmzet || 0), formatRp(targetRow.targetOmzet || 0))}
              <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${rewardLabel}</label>
                <input type="number" step="any" id="swal_rate" value="${rewardRate}" placeholder="${rewardPlaceholder}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold outline-none focus:border-indigo-500 bg-white" />
                <p class="text-[11px] text-slate-400 font-bold mt-1">Jika target omzet tercapai, reward = rate x total capaian omzet.</p>
              </div>
            </div>
            <div data-payroll-basis-panel="terbit" class="${rewardBasis === 'terbit' ? '' : 'hidden'} space-y-4">
              <input type="hidden" id="swal_target_terbit" value="${Number(targetRow.targetTerbit || 0)}" />
              ${renderPayrollBasisTargetInfo('Target Terbit', Number(targetRow.targetTerbit || 0), formatNumber(targetRow.targetTerbit || 0) + ' deal')}
              ${renderPayrollPackageRateInputs(packageRates)}
              <p class="text-[11px] text-slate-400 font-bold">Reward dihitung dari kelebihan deal. Sistem memakai paket dari deal terakhir sejumlah kelebihannya.</p>
            </div>
          ` : `
            <input type="hidden" id="swal_reward_basis" value="${rewardBasis}" />
            <input type="hidden" id="swal_target_${rewardBasis}" value="${rewardBasis === 'kata' ? Number(targetRow.targetKata || 0) : Number(targetRow.targetHalaman || 0)}" />
            ${rewardBasis === 'kata' ? renderPayrollBasisTargetInfo('Target Kata', Number(targetRow.targetKata || 0), formatNumber(targetRow.targetKata || 0) + ' kata') : renderPayrollBasisTargetInfo('Target Halaman', Number(targetRow.targetHalaman || 0), formatNumber(targetRow.targetHalaman || 0) + ' halaman')}
            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">${rewardLabel}</label>
              <input type="number" step="any" id="swal_rate" value="${rewardRate}" placeholder="${rewardPlaceholder}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm font-bold outline-none focus:border-indigo-500 bg-white" />
            </div>

    customClass: { popup: 'rounded-[2rem] payroll-config-landscape-popup' },
    showCancelButton: true,
    confirmButtonText: 'Simpan Reward',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const fullConfig = getFullConfigForSave(username);
      const isEnabled = document.getElementById('swal_reward_enabled').checked;
      
      fullConfig.rewardEnabled = isEnabled ? '1' : '0';
      
      const rBasis = document.getElementById('swal_reward_basis')?.value || rewardBasis;
      fullConfig.rewardBasis = rBasis;
      fullConfig.targetKpi = Number(document.getElementById('swal_target_' + rBasis)?.value || 0);
      fullConfig.rewardRate = Number(document.getElementById('swal_rate')?.value || 0);
      
      const pRates = Array.from(document.querySelectorAll('[data-payroll-package-rate]')).reduce((rates, input) => {
        rates[input.getAttribute('data-payroll-package-rate')] = Number(input.value || 0);
        return rates;
      }, {});
      fullConfig.rewardPackageRates = JSON.stringify(pRates);
      
      const targetRules = {};
      document.querySelectorAll('[data-payroll-target-rule]').forEach((input) => {
        targetRules[input.getAttribute('data-payroll-target-rule')] = input.checked;
      });
      fullConfig.rewardTargetRules = JSON.stringify(targetRules);
      
      return fullConfig;
    }
  }).then(res => {
    if (res.isConfirmed && res.value) {
      gas.withSuccessHandler(() => {
        Swal.fire('Berhasil!', 'Reward KPI berhasil disimpan.', 'success');
        renderPayrollConfigTab();
      }).savePayrollConfig(res.value);
    }
  });
}

// Print Slip Gaji Helper
function payrollSafeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function payrollSafeScriptJson(value) {
  return JSON.stringify(value).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026');
}

function payrollDepartmentByRole(role) {
  const r = String(role || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
  if (['pic_editor', 'editor', 'pic_layouter', 'layouter'].includes(r)) return 'Kreatif';
  if (['css', 'admin'].includes(r)) return 'Operasional';
  if (r === 'cs') return 'Konsultan';
  if (['campaign', 'admin_marketplace'].includes(r)) return 'Campaign';
  if (r === 'karyawan') return 'Umum';
  return '-';
}

function payrollNormalizeDepartment(value, role) {
  const label = String(value || '').trim();
  if (!label || label === '-') return payrollDepartmentByRole(role);
  return label.replace(/^Departemen\s+/i, '');
}

function payrollMonthTitle(value) {
  const date = new Date(String(value || '').substring(0, 7) + '-01T00:00:00');
  if (Number.isNaN(date.getTime())) return String(value || '-');
  return date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
}

function payrollSlipDate(value) {
  const date = new Date(String(value || '').substring(0, 7) + '-01T00:00:00');
  const d = Number.isNaN(date.getTime()) ? new Date() : date;
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
}

function terbilangIndonesia(number) {
  const n = Math.floor(Math.abs(Number(number || 0)));
  const words = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  const say = (num) => {
    if (num < 12) return words[num];
    if (num < 20) return say(num - 10) + ' Belas';
    if (num < 100) return say(Math.floor(num / 10)) + ' Puluh ' + say(num % 10);
    if (num < 200) return 'Seratus ' + say(num - 100);
    if (num < 1000) return say(Math.floor(num / 100)) + ' Ratus ' + say(num % 100);
    if (num < 2000) return 'Seribu ' + say(num - 1000);
    if (num < 1000000) return say(Math.floor(num / 1000)) + ' Ribu ' + say(num % 1000);
    if (num < 1000000000) return say(Math.floor(num / 1000000)) + ' Juta ' + say(num % 1000000);
    return say(Math.floor(num / 1000000000)) + ' Miliar ' + say(num % 1000000000);
  };
  return (n === 0 ? 'Nol' : say(n).replace(/\s+/g, ' ').trim()) + ' Rupiah';
}

function payrollMoneyCell(value) {
  const n = Number(value || 0);
  return n ? n.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '-';
}

        async function saveSlipGajiPdf() {
          const btn = document.getElementById('btnSavePdf');
          const origText = btn ? btn.textContent : '';
          try {
            if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
            const html2canvasLib = window.html2canvas || (window.opener && window.opener.html2canvas);
            const jsPDFLib = (window.jspdf && window.jspdf.jsPDF) || (window.opener && window.opener.jspdf && window.opener.jspdf.jsPDF);
            if (!html2canvasLib || !jsPDFLib) { alert('Library PDF belum siap. Refresh portal lalu buka slip lagi.'); return; }
            const pdf = new jsPDFLib({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pages = document.querySelectorAll('.page');
            for (let i = 0; i < pages.length; i++) {
              if (i > 0) pdf.addPage('a4', 'portrait');
              const canvas = await html2canvasLib(pages[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
              const imgData = canvas.toDataURL('image/jpeg', 0.95);
              pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
            }
            pdf.save(SLIP_FILENAME);
          } catch (err) { alert('Gagal menyimpan PDF: ' + (err && err.message ? err.message : err));
          } finally { if (btn) { btn.disabled = false; btn.textContent = origText || 'Simpan PDF'; } }
        }
      <\/script>
    </body>
    </html>
  `;
  const win = window.open("", "_blank", "width=820,height=650");
  win.document.write(htmlContent);
  win.document.close();
}
