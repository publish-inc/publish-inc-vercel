<script>



// --- MODUL PENERBIT / IMPRINT ---

function normalizePenerbitPackageClient(pkg, idx) {
  const defaults = ['#FF6B35', '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];
  const isObject = pkg && typeof pkg === 'object';
  const nama = String(isObject ? (pkg.nama || pkg.name || pkg.label || '') : (pkg || '')).trim();
  let warna = String(isObject ? (pkg.warna || pkg.color || '') : '').trim();
  if (!/^#[0-9a-fA-F]{6}$/.test(warna)) warna = defaults[Math.abs(Number(idx || 0)) % defaults.length];
  return nama ? { nama, warna } : null;
}

function penerbitSafeAttr(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}

function getPenerbitPackageRows() {
  return Array.from(document.querySelectorAll('#pub_paket_rows [data-package-row]')).map((row, idx) => {
    const nama = row.querySelector('[data-package-name]')?.value.trim() || '';
    const warna = row.querySelector('[data-package-color]')?.value || '';
    return normalizePenerbitPackageClient({ nama, warna }, idx);
  }).filter(Boolean);
}

function addPenerbitPackageRow(nama = '', warna = '') {
  const wrap = document.getElementById('pub_paket_rows');
  if (!wrap) return;
  const pkg = normalizePenerbitPackageClient({ nama, warna }, wrap.children.length) || { nama: '', warna: '#FF6B35' };
  const row = document.createElement('div');
  row.dataset.packageRow = '1';
  row.className = 'grid grid-cols-[1fr_52px_42px] gap-2 items-center';
  row.innerHTML = `
    <input type="text" data-package-name required class="w-full p-3 border rounded-xl outline-none focus:border-accent-600 text-sm" placeholder="Nama paket" value="${penerbitSafeAttr(pkg.nama)}">
    <input type="color" data-package-color class="w-full h-12 p-1 border rounded-xl bg-white cursor-pointer" value="${penerbitSafeAttr(pkg.warna)}">
    <button type="button" onclick="this.closest('[data-package-row]').remove()" class="h-12 rounded-xl bg-red-50 text-red-500"><i class="fa-solid fa-trash"></i></button>
  `;
  wrap.appendChild(row);
}

function renderPenerbitPackageRows(packages = []) {
  const wrap = document.getElementById('pub_paket_rows');
  if (!wrap) return;
  wrap.innerHTML = '';
  const rows = (packages || []).map(normalizePenerbitPackageClient).filter(Boolean);
  (rows.length ? rows : [{ nama: '', warna: '#FF6B35' }]).forEach((pkg) => addPenerbitPackageRow(pkg.nama, pkg.warna));
}

function loadKelolaPenerbit() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const settings = res?.data || { penerbit: [] };

    content.innerHTML = "\n                    <div class=\"bg-white rounded-3xl shadow-sm border border-slate-100 overflow-x-auto\">\n                        <table class=\"w-full text-left\">\n                            <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                <tr>\n                                    <th class=\"px-8 py-4\">Nama Penerbit</th>\n                                    <th class=\"px-8 py-4\">Daftar Paket / Layanan</th>\n                                    <th class=\"px-8 py-4 text-center\">Aksi</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y divide-slate-50 text-[13px]\">\n                                ".concat(










      settings.penerbit.map((p) => "\n                                    <tr class=\"hover:bg-slate-50 transition-colors\">\n                                        <td class=\"px-8 py-4 font-bold text-slate-800\">".concat(

        p.nama, "</td>\n                                        <td class=\"px-8 py-4\">\n                                            <div class=\"flex flex-wrap gap-1\">\n                                                ").concat(


        (p.paket || []).map((pkt, idx) => normalizePenerbitPackageClient(pkt, idx)).filter(Boolean).map((pkt) => "<span class=\"inline-flex items-center gap-1.5 px-2 py-1 rounded-lg border text-[9px] font-black\" style=\"background:".concat(pkt.warna, "18;border-color:").concat(pkt.warna, "55;color:").concat(pkt.warna, "\"><span class=\"w-2 h-2 rounded-full\" style=\"background:").concat(pkt.warna, "\"></span>").concat(reportSafeText(pkt.nama), "</span>")).join(''), "\n                                            </div>\n                                        </td>\n                                        <td class=\"px-8 py-4 text-center\">\n                                            <button onclick=\"editPenerbit('").concat(



        p.id, "')\" class=\"p-2 text-blue-500 hover:bg-blue-50 rounded-lg\"><i class=\"fa-solid fa-edit\"></i></button>\n                                            <button onclick=\"deletePenerbit('").concat(
        p.id, "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg ml-1\"><i class=\"fa-solid fa-trash\"></i></button>\n                                        </td>\n                                    </tr>")

      ).join(''), "\n                                ").concat(
      settings.penerbit.length === 0 ? '<tr><td colspan="3" class="p-16 text-center text-slate-300 italic">Belum ada data penerbit.</td></tr>' : '', "\n                            </tbody>\n                        </table>\n                    </div>\n                ");




  }).getSettingsData();
}


function openFormPenerbit() {
  document.getElementById('penerbitModalTitle').innerText = "Tambah Penerbit Baru";
  document.getElementById('pub_id').value = '';
  document.getElementById('pub_nama').value = '';
  document.getElementById('pub_paket').value = '';
  renderPenerbitPackageRows([]);
  openModal('modalPenerbit');
}


function editPenerbit(id) {
  gas.withSuccessHandler((res) => {
    const p = (res?.data?.penerbit || []).find((x) => x.id === id);
    if (p) {
      document.getElementById('penerbitModalTitle').innerText = "Edit Penerbit";
      document.getElementById('pub_id').value = p.id;
      document.getElementById('pub_nama').value = p.nama;
      document.getElementById('pub_paket').value = '';
      renderPenerbitPackageRows(p.paket || []);
      openModal('modalPenerbit');
    }
  }).getSettingsData();
}


function deletePenerbit(id) {
  Swal.fire({ title: 'Hapus Penerbit?', text: 'Data penerbit akan hilang dari pilihan form.', icon: 'warning', showCancelButton: true }).then((r) => {
    if (r.isConfirmed) gas.withSuccessHandler(() => loadKelolaPenerbit()).deletePenerbitData(id);
  });
}


function handleSavePenerbit(e) {
  e.preventDefault();
  const paketArr = getPenerbitPackageRows();
  if (!paketArr.length) {
    Swal.fire('Paket Kosong', 'Minimal isi satu paket penerbitan.', 'warning');
    return;
  }

  const payload = {
    id: document.getElementById('pub_id').value,
    nama: document.getElementById('pub_nama').value,
    paket: paketArr
  };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {
    closeModal('modalPenerbit');
    loadKelolaPenerbit();
    Swal.fire('Tersimpan!', 'Data penerbit dan paket berhasil diperbarui.', 'success');
  }).savePenerbitData(payload);
}

// --- HANDLER JENIS KPI ---

[
'loadKelolaPenerbit',
'openFormPenerbit',
'addPenerbitPackageRow',
'editPenerbit',
'deletePenerbit',
'handleSavePenerbit'].
forEach((name) => {
  try {
    const fn = eval(name);
    if (typeof fn === 'function') window[name] = fn;
  } catch (error) {}
});
</script>
