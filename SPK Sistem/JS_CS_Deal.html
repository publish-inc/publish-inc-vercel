<script>



function tambahDpDeal(id) {
  gas.withSuccessHandler((res) => {
    const d = (res?.data || []).find((x) => x.id === id);
    if (!d) {
      Swal.fire('Data Tidak Ditemukan', 'Deal tidak ditemukan atau sudah berubah.', 'warning');
      return;
    }
    if (d.statusPayment !== 'DP') {
      Swal.fire('Tidak Tersedia', 'Tambah DP hanya tersedia untuk deal yang masih DP.', 'warning');
      return;
    }
    const sisa = Math.max(0, Number(d.nilai || 0) - Number(d.nominalDP || 0));
    Swal.fire({
      title: 'Tambah DP',
      html: 'Masukkan nominal DP tambahan.<br><small>Sisa tagihan saat ini: <b>' + reportFormatRp(sisa) + '</b></small>',
      icon: 'question',
      input: 'number',
      showCancelButton: true,
      confirmButtonColor: '#4763FD',
      confirmButtonText: 'Simpan DP',
      cancelButtonText: 'Batal',
      inputValidator: (value) => {
        const amount = Number(value || 0);
        if (amount <= 0) return 'Nominal tambah DP tidak valid!';
        if (amount >= sisa) return 'Jika nominal sama/melebihi sisa, gunakan tombol Lunasi.';
      }
    }).then((r) => {
      if (!r.isConfirmed || !r.value) return;
      gas.withSuccessHandler((saveRes) => {
        if (!saveRes || saveRes.success === false) {
          Swal.fire('Gagal', saveRes && (saveRes.message || saveRes.error) || 'Tambah DP gagal disimpan.', 'error');
          return;
        }
        if (state.activeTab === 'dashboard_kpi') loadDashboardKPI();
        if (state.activeTab === 'kelola_deal' && typeof loadKelolaDeal === 'function') loadKelolaDeal();
        Swal.fire('Berhasil!', 'Tambah DP berhasil dicatat sebagai omzet bulan berjalan.', 'success');
      }).withFailureHandler((error) => {
        showServerError('Gagal Menyimpan Tambah DP', error);
      }).addDealDpPayment(id, Number(r.value));
    });
  }).withFailureHandler((error) => {
    showServerError('Gagal Memuat Deal', error);
  }).getDealData();
}
function lunasiDeal(id) {
  gas.withSuccessHandler((res) => {
    const d = (res?.data || []).find((x) => x.id === id);
    if (!d) {
      Swal.fire('Data Tidak Ditemukan', 'Deal tidak ditemukan atau sudah berubah.', 'warning');
      return;
    }
    const sisa = Math.max(0, Number(d.nilai || 0) - Number(d.nominalDP || 0));
    Swal.fire({
      title: 'Konfirmasi Pelunasan',
      html: 'Masukkan nominal pelunasan yang diterima.<br><small>Nominal ini akan masuk omzet bulan berjalan.</small>',
      icon: 'question',
      input: 'number',
      inputValue: sisa,
      showCancelButton: true,
      confirmButtonColor: '#10b981',
      confirmButtonText: 'Simpan & Lunasi',
      cancelButtonText: 'Batal',
      inputValidator: (value) => {
        if (!value || Number(value) <= 0) return 'Nominal pelunasan tidak valid!';
      }
    }).then((r) => {
      if (!r.isConfirmed || !r.value) return;
      const pelunasanBaru = Number(r.value);
      gas.withSuccessHandler((resSave) => {
        if (resSave && resSave.success === false) {
          Swal.fire('Gagal', resSave.message || resSave.error || 'Pelunasan gagal disimpan.', 'error');
          return;
        }
        if (state.activeTab === 'dashboard_kpi') loadDashboardKPI();
        Swal.fire('Berhasil!', 'Pelunasan berhasil dicatat dan ditambahkan ke capaian omzet bulan berjalan.', 'success');
      }).withFailureHandler((error) => {
        showServerError('Gagal Menyimpan Pelunasan', error);
      }).addDealPelunasanPayment(id, pelunasanBaru);
    });
  }).getDealData();
}
function tambahBiayaDeal(id) {
  gas.withSuccessHandler((res) => {
    const d = (res?.data || []).find((x) => x.id === id);
    if (!d) {
      Swal.fire('Data Tidak Ditemukan', 'Deal tidak ditemukan atau sudah berubah.', 'warning');
      return;
    }
    const tx = Array.isArray(d.transaksiTambahan) ? d.transaksiTambahan : (() => {
      try {
        const parsed = JSON.parse(d.transaksiTambahan || '[]');
        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        return [];
      }
    })();
    const isTambahDp = (item) => String(item?.kategori || '').toLowerCase() === 'tambah dp' || String(item?.tipe || '').toLowerCase() === 'tambah dp';
    const biayaSaatIni = tx.filter((item) => !isTambahDp(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
    Swal.fire({
      title: 'Update Biaya',
      html: 'Edit total biaya tambahan untuk deal ini.<br><small>Total biaya saat ini: <b>' + reportFormatRp(biayaSaatIni) + '</b>. Isi 0 untuk menghapus biaya tambahan.</small>',
      icon: 'question',
      input: 'number',
      inputValue: biayaSaatIni,
      showCancelButton: true,
      confirmButtonColor: '#10b981',
      confirmButtonText: 'Update Biaya',
      cancelButtonText: 'Batal',
      inputValidator: (value) => {
        if (value === '' || value === null || Number(value) < 0) return 'Nominal biaya tidak valid!';
      }
    }).then((r) => {
      if (!r.isConfirmed) return;
      gas.withSuccessHandler((saveRes) => {
        if (!saveRes || saveRes.success === false) {
          Swal.fire('Gagal', saveRes && (saveRes.message || saveRes.error) || 'Update biaya gagal disimpan.', 'error');
          return;
        }
        if (state.activeTab === 'dashboard_kpi') loadDashboardKPI();
        if (state.activeTab === 'kelola_deal' && typeof loadKelolaDeal === 'function') loadKelolaDeal();
        Swal.fire('Berhasil!', 'Total biaya berhasil diperbarui dan akan mengikuti capaian omzet/KPI CS bulan berjalan.', 'success');
      }).withFailureHandler((error) => {
        showServerError('Gagal Update Biaya', error);
      }).updateDealAdditionalPayment(id, Number(r.value || 0));
    });
  }).withFailureHandler((error) => {
    showServerError('Gagal Memuat Deal', error);
  }).getDealData();
}
function updatePembayaranDealCS(id) {
  gas.withSuccessHandler((res) => {
    const d = (res?.data || []).find((x) => x.id === id);
    if (!d) {
      Swal.fire('Data Tidak Ditemukan', 'Deal tidak ditemukan atau sudah berubah.', 'warning');
      return;
    }
    const nilai = Number(d.nilai || 0);
    const dp = Number(d.nominalDP || 0);
    const pelunasan = Number(d.nominalPelunasan || 0);
    const hasPelunasan = pelunasan > 0;
    const payment = d.statusPayment || 'Full Payment';
    Swal.fire({
      title: 'Update Pembayaran',
      html: `
        <div class="text-left space-y-3 text-sm">
          <div class="rounded-xl bg-slate-50 border border-slate-100 p-3 text-xs text-slate-500">
            <div><b>${reportSafeText(d.judul || '-')}</b></div>
            <div>Status saat ini: ${reportSafeText(payment)}${hasPelunasan ? ' | Pelunasan: ' + reportFormatRp(pelunasan) : ''}</div>
          </div>
          <label class="block">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Nilai Deal Total (Rp)</span>
            <input id="payment_update_nilai" type="number" min="1" value="${nilai}" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-accent-400">
          </label>
          <label class="block">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Status Pembayaran</span>
            <select id="payment_update_status" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 outline-none bg-white focus:border-accent-400">
              <option value="Full Payment" ${payment === 'Full Payment' ? 'selected' : ''}>Full Payment</option>
              <option value="DP" ${payment === 'DP' ? 'selected' : ''}>DP</option>
            </select>
          </label>
          <label id="payment_update_dp_wrap" class="block">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${hasPelunasan ? 'Nominal DP Awal (Rp)' : 'Nominal DP (Rp)'}</span>
            <input id="payment_update_dp" type="number" min="0" value="${dp}" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-accent-400">
            <p class="text-[10px] text-slate-400 mt-1">${hasPelunasan ? 'Deal ini sudah punya pelunasan, jadi DP awal tetap dipakai untuk histori omzet.' : 'Diisi hanya jika status pembayaran DP.'}</p>
          </label>
          <label class="block">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Catatan Koreksi</span>
            <textarea id="payment_update_note" rows="2" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-accent-400" placeholder="Contoh: salah input nominal awal"></textarea>
          </label>
          <label class="block">
            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Password Otorisasi</span>
            <input id="payment_update_password" type="password" class="mt-1 w-full px-4 py-3 rounded-xl border border-slate-200 outline-none focus:border-accent-400" placeholder="Password otorisasi">
          </label>
        </div>
      `,
      icon: 'question',
      showCancelButton: true,
      confirmButtonColor: '#4763FD',
      confirmButtonText: 'Simpan Update',
      cancelButtonText: 'Batal',
      didOpen: () => {
        const status = document.getElementById('payment_update_status');
        const wrap = document.getElementById('payment_update_dp_wrap');
        const toggle = () => {
          if (wrap) wrap.classList.toggle('hidden', !hasPelunasan && status?.value !== 'DP');
        };
        status?.addEventListener('change', toggle);
        toggle();
      },
      preConfirm: () => {
        const nextNilai = Number(document.getElementById('payment_update_nilai')?.value || 0);
        const nextStatus = document.getElementById('payment_update_status')?.value || '';
        const nextDp = Number(document.getElementById('payment_update_dp')?.value || 0);
        const authPassword = document.getElementById('payment_update_password')?.value || '';
        const note = document.getElementById('payment_update_note')?.value || '';
        if (nextNilai <= 0) {
          Swal.showValidationMessage('Nilai deal wajib lebih dari 0.');
          return false;
        }
        if (!authPassword) {
          Swal.showValidationMessage('Password otorisasi wajib diisi.');
          return false;
        }
        if ((nextStatus === 'DP' || hasPelunasan) && (nextDp <= 0 || nextDp >= nextNilai)) {
          Swal.showValidationMessage(hasPelunasan ? 'Nominal DP awal wajib lebih dari 0 dan lebih kecil dari nilai deal.' : 'Nominal DP wajib lebih dari 0 dan lebih kecil dari nilai deal.');
          return false;
        }
        return { nilai: nextNilai, statusPayment: nextStatus, nominalDP: nextDp, authPassword, note, username: state.user?.username || '', updatedBy: state.user?.nama || '' };
      }
    }).then((result) => {
      if (!result.isConfirmed || !result.value) return;
      gas.withSuccessHandler((saveRes) => {
        if (!saveRes || saveRes.success === false) {
          Swal.fire('Gagal', saveRes && (saveRes.message || saveRes.error) || 'Update pembayaran gagal disimpan.', 'error');
          return;
        }
        if (state.activeTab === 'kelola_deal' && typeof loadKelolaDeal === 'function') loadKelolaDeal();
        if (state.activeTab === 'dashboard_kpi') loadDashboardKPI();
        Swal.fire('Berhasil', 'Pembayaran deal berhasil diperbarui dan capaian omzet akan mengikuti data terbaru.', 'success');
      }).withFailureHandler((error) => showServerError('Gagal Update Pembayaran', error)).updateDealPaymentCorrection(id, result.value);
    });
  }).withFailureHandler((error) => showServerError('Gagal Memuat Deal', error)).getDealData();
}
function arsipkanDealSelesai(id) {
  Swal.fire({
    title: 'Arsipkan Deal?',
    text: 'Deal akan dipindahkan dari daftar aktif ke arsip agar dashboard CS tetap ringan.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonColor: '#4763FD',
    confirmButtonText: 'Arsipkan',
    cancelButtonText: 'Batal'
  }).then((r) => {
    if (!r.isConfirmed) return;
    gas.withSuccessHandler((res) => {
      if (!res || res.success === false) {
        Swal.fire('Gagal', res && (res.message || res.error) || 'Deal gagal diarsipkan.', 'error');
        return;
      }
      if (state.activeTab === 'dashboard_kpi') loadDashboardKPI();
      if (state.activeTab === 'deal_lama') loadDealLama();
      Swal.fire('Diarsipkan', 'Deal selesai berhasil dipindahkan ke arsip.', 'success');
    }).archiveDeal(id);
  });
}
function loadDetailCapaianSaya() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const d = res?.data || {};
    const role = normalizeRole(state.user.role);
    const currentMonth = getReportCurrentMonth();
    const rows = [];
    const safe = reportSafeText;
    const formatValue = (value) => Number.isFinite(Number(value)) ? Number(value || 0).toLocaleString('id-ID') : String(value || '-');
    const isCurrentMonth = (value) => String(value || '').startsWith(currentMonth);
    const isTambahDpTx = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
    const paymentTx = (value) => normalizeReportTransactions(value);
    const originalDealNominal = (deal) => {
      const tx = paymentTx(deal.transaksiTambahan);
      const addedDp = tx.filter(isTambahDpTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const addedCost = tx.filter((item) => !isTambahDpTx(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const hasPelunasan = Number(deal.nominalPelunasan || 0) > 0;
      if (deal.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(deal.nominalDP || 0) - addedDp);
      return Math.max(0, Number(deal.nilai || 0) - addedCost);
    };
    const originalKpiNominal = (kpi) => {
      const tx = paymentTx(kpi.transaksiTambahan);
      const addedDp = tx.filter(isTambahDpTx).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const hasPelunasan = Number(kpi.nominalPelunasan || 0) > 0;
      if (kpi.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(kpi.nominalDP || 0) - addedDp);
      return Number(kpi.nominal || 0);
    };
    const push = (row) => rows.push({ tanggal: row.tanggal || '', ...row });

    if (role === 'cs') {
      const deals = [...(d.deal || []), ...(d.dealArchive || [])].filter((deal) => deal.csName === state.user.nama);
      deals.forEach((deal) => {
        const packageText = [deal.penerbit, deal.paket].filter(Boolean).join(' - ') || 'Deal Penerbitan';
        const dealDate = deal.tanggal || deal.deadline || '';
        if (deal.source !== 'legacy' && isCurrentMonth(dealDate)) {
          push({
            tanggal: dealDate,
            judul: deal.judul || '-',
            kotaAsal: deal.kotaAsal || '-',
            uraian: packageText,
            jenis: 'Terbit',
            terbit: 1,
            cetak: '',
            lainnya: '',
            nominal: originalDealNominal(deal)
          });
        }
        if (isCurrentMonth(deal.tanggalPelunasan)) {
          push({
            tanggal: deal.tanggalPelunasan,
            judul: deal.judul || '-',
            kotaAsal: deal.kotaAsal || '-',
            uraian: 'Pelunasan - ' + packageText,
            jenis: 'Pelunasan',
            terbit: '',
            cetak: '',
            lainnya: '',
            nominal: Number(deal.nominalPelunasan || 0)
          });
        }
        paymentTx(deal.transaksiTambahan).forEach((tx) => {
          if (!isCurrentMonth(tx.tanggal)) return;
          push({
            tanggal: tx.tanggal,
            judul: deal.judul || '-',
            kotaAsal: deal.kotaAsal || '-',
            uraian: (isTambahDpTx(tx) ? 'Tambah DP - ' : 'Tambahan biaya - ') + packageText,
            jenis: isTambahDpTx(tx) ? 'Tambah DP' : 'Tambahan Biaya',
            terbit: '',
            cetak: '',
            lainnya: '',
            nominal: Number(tx.nominal || 0)
          });
        });
      });
      (d.kpi || []).filter((k) => k.picName === state.user.nama && (k.jenis === 'Cetak' || k.jenis === 'Lainnya')).forEach((k) => {
        const nilaiKpi = Number(k.jumlahKinerja || k.jumlahUmum || 1) || 1;
        if (isCurrentMonth(k.tanggal)) {
          push({
            tanggal: k.tanggal,
            judul: k.judul || k.spesifikasi || '-',
            kotaAsal: k.kotaAsal || '-',
            uraian: k.spesifikasi || k.jenis || '-',
            jenis: k.jenis,
            terbit: '',
            cetak: k.jenis === 'Cetak' ? nilaiKpi : '',
            lainnya: k.jenis === 'Lainnya' ? nilaiKpi : '',
            nominal: originalKpiNominal(k)
          });
        }
        if (isCurrentMonth(k.tanggalPelunasan)) {
          push({ tanggal: k.tanggalPelunasan, judul: k.judul || k.spesifikasi || '-', kotaAsal: k.kotaAsal || '-', uraian: 'Pelunasan - ' + (k.spesifikasi || k.jenis), jenis: 'Pelunasan ' + k.jenis, terbit: '', cetak: '', lainnya: '', nominal: Number(k.nominalPelunasan || 0) });
        }
        paymentTx(k.transaksiTambahan).forEach((tx) => {
          if (isCurrentMonth(tx.tanggal)) push({ tanggal: tx.tanggal, judul: k.judul || k.spesifikasi || '-', kotaAsal: k.kotaAsal || '-', uraian: 'Tambah DP - ' + (k.spesifikasi || k.jenis), jenis: 'Tambah DP ' + k.jenis, terbit: '', cetak: '', lainnya: '', nominal: Number(tx.nominal || 0) });
        });
      });
    } else {
      (d.kpi || []).filter((k) => k.picName === state.user.nama && isCurrentMonth(k.tanggal)).forEach((k) => {
        let capaian = Number(k.jumlahKinerja || k.jumlahUmum || 0);
        let satuan = 'Nilai';
        if (Number(k.jumlahKata || 0) > 0) {capaian = Number(k.jumlahKata || 0);satuan = 'Kata';} else
        if (Number(k.jumlahHalaman || 0) > 0) {capaian = Number(k.jumlahHalaman || 0);satuan = 'Halaman';} else
        if (k.jenis === 'Quality Control') {capaian = Number(k.qcErrorCount || 0);satuan = k.qcResult === 'tidak_ada' ? 'Tidak ada kesalahan' : 'Kesalahan QC';} else
        if (k.jenis === 'Evaluasi Tim') {capaian = k.evalMet === '1' || k.evalMet === 1 || k.evalMet === true ? 'Memenuhi' : 'Belum memenuhi';satuan = k.evalLayouter || 'Evaluasi';}
        push({
          tanggal: k.tanggal,
          judul: k.judul || k.spesifikasi || k.evalLayouter || k.jenis || '-',
          jenis: k.jenis || '-',
          capaian,
          satuan,
          keterangan: k.spesifikasi || k.qualityControl || k.evalTarget || '-'
        });
      });
    }

    rows.sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)) || String(a.judul).localeCompare(String(b.judul)));
    const key = 'detail_capaian_saya';
    const page = getReportDetailPage(key, rows.length);
    const pageRows = rows.slice((page - 1) * REPORT_DETAIL_PAGE_SIZE, page * REPORT_DETAIL_PAGE_SIZE);
    const totalNominal = rows.reduce((sum, row) => sum + Number(row.nominal || 0), 0);
    const isCs = role === 'cs';
    const headerStats = isCs ?
    [
    { label: 'Terbit', value: rows.reduce((sum, r) => sum + Number(r.terbit || 0), 0) },
    { label: 'Cetak', value: rows.reduce((sum, r) => sum + Number(r.cetak || 0), 0) },
    { label: 'Lainnya', value: rows.reduce((sum, r) => sum + Number(r.lainnya || 0), 0) },
    { label: 'Nominal', value: reportFormatRp(totalNominal) }] :

    [
    { label: 'Total Entri', value: rows.length },
    { label: 'Bulan', value: currentMonth },
    { label: 'Role', value: getRoleLabel(role) }];

    const personalGroup = {
      nama: state.user.nama,
      role: getRoleLabel(role),
      rows,
      pageRows,
      summary: {
        terbit: rows.reduce((sum, r) => sum + Number(r.terbit || 0), 0),
        cetak: rows.reduce((sum, r) => sum + Number(r.cetak || 0), 0),
        lainnya: rows.reduce((sum, r) => sum + Number(r.lainnya || 0), 0),
        nominal: totalNominal,
        entri: rows.length,
        nilai: rows.reduce((sum, r) => sum + Number(r.capaian || 0), 0)
      },
      paginationKey: key
    };
    const getPersonalDealRowStyle = (row) => {
      const text = String([row.uraian, row.jenis].filter(Boolean).join(' ')).toLowerCase();
      if (text.includes('pelunasan') || text.includes('tambah dp') || text.includes('tambahan biaya') || text.includes('tambahan')) return 'background-color:#ffffff;';
      if (text.includes('exclusive') || text.includes('eksklusif') || text.includes('ekslusif') || text.includes('exlusive')) return 'background-color:#fef08a;';
      if (text.includes('express') || text.includes('expres')) return 'background-color:#bfdbfe;';
      if (text.includes('advance') || text.includes('advanced')) return 'background-color:#fed7aa;';
      if (text.includes('idebuku') || text.includes('ide buku')) return 'background-color:#ddd6fe;';
      return 'background-color:#ffffff;';
    };
    const isCreative = ['editor', 'layouter', 'pic_editor', 'pic_layouter'].includes(role);
    const renderPersonalSummary = () => {
      if (isCs) return "\n                    <div class=\"grid grid-cols-2 lg:grid-cols-4 gap-2 px-5 py-4 bg-white border-b border-slate-100\">\n                        <div class=\"border border-slate-100 bg-slate-50 px-3 py-2\"><div class=\"text-[9px] uppercase tracking-widest text-slate-400 font-black\">Terbit</div><div class=\"text-xl font-black text-accent-600\">".concat(

        personalGroup.summary.terbit.toLocaleString('id-ID'), "</div></div>\n                        <div class=\"border border-slate-100 bg-slate-50 px-3 py-2\"><div class=\"text-[9px] uppercase tracking-widest text-slate-400 font-black\">Cetak</div><div class=\"text-xl font-black text-accent-600\">").concat(
        personalGroup.summary.cetak.toLocaleString('id-ID'), "</div></div>\n                        <div class=\"border border-slate-100 bg-slate-50 px-3 py-2\"><div class=\"text-[9px] uppercase tracking-widest text-slate-400 font-black\">Lainnya</div><div class=\"text-xl font-black text-accent-600\">").concat(
        personalGroup.summary.lainnya.toLocaleString('id-ID'), "</div></div>\n                        <div class=\"border border-slate-100 bg-slate-50 px-3 py-2\"><div class=\"text-[9px] uppercase tracking-widest text-slate-400 font-black\">Nominal</div><div class=\"text-xl font-black text-emerald-600\">").concat(
        reportFormatRp(personalGroup.summary.nominal), "</div></div>\n                    </div>");

      const byJenis = {};
      rows.forEach((row) => {
        const label = row.jenis || 'Tanpa Jenis';
        byJenis[label] = (byJenis[label] || 0) + 1;
      });
      const items = Object.entries(byJenis).slice(0, 5).map(([label, value]) => ({ label, value }));
      if (!items.length) items.push({ label: 'Total Entri', value: rows.length });
      return "<div class=\"px-5 py-4 border-b border-slate-100 bg-slate-50/50 grid grid-cols-2 md:grid-cols-".concat(Math.min(items.length, 5), " gap-3\">\n                    ").concat(

function updateDealDeadlineFromPackage() {
  const publisher = document.getElementById('deal_penerbit')?.value || '';
  const paket = document.getElementById('deal_paket')?.value || '';
  const acceleration = document.getElementById('deal_percepatan_proses')?.value || '';
  const deadline = document.getElementById('deal_deadline');
  const hint = document.getElementById('deal_deadline_hint');
  if (!deadline) return;
  const apply = (rows) => {
    window._deadlineSettings = rows && rows.length ? rows : getDefaultDeadlineSettings();
    if (!paket) {
      if (hint) {
        const pubSettings = window._deadlineSettings.filter((s) => !s.penerbit || String(s.penerbit).toLowerCase() === String(publisher).toLowerCase());
        const labels = pubSettings.map((s) => "".concat(s.paket, " (").concat(Number(s.totalHari || s.selesai || 0), " hari)")).join(', ');
        hint.textContent = labels ? "Pilih paket: ".concat(labels) : 'Pilih paket terlebih dahulu.';
      }
      return;
    }
    const setting = resolveDealDeadlineSettingClient(publisher, paket, acceleration, window._deadlineSettings);
    if (!setting) return;
    const today = new Date().toISOString().slice(0, 10);
    const minDate = addBusinessDaysClient(today, Number(setting.totalHari || setting.selesai || 0));
    deadline.min = minDate;
    if (!deadline.value || businessDaysBetweenClient(today, deadline.value) < Number(setting.totalHari || setting.selesai || 0)) {
      deadline.value = minDate;
    }
    if (hint) {
      const dayText = Number(setting.totalHari || setting.selesai || 0);
      hint.textContent = acceleration ?
        "".concat(acceleration, ": minimal ").concat(dayText, " hari kerja (").concat(minDate, "). CS hanya bisa memperpanjang.") :
        "Standar paket ".concat(setting.paket, ": minimal ").concat(dayText, " hari kerja (").concat(minDate, "). CS hanya bisa memperpanjang.");
    }
  };
  if (window._deadlineSettings) {
    apply(window._deadlineSettings);
  } else {
    fetchDeadlineSettingsClient((res) => apply(res?.data || []), () => apply(getDefaultDeadlineSettings()));
  }
}

function normalizeLegacyDealCategory(value) {
  const text = String(value || '').trim().toLowerCase();

            deadline: normalizeImportDate(get('Deadline')),
            estimasiHalaman: Number(get('Estimasi Halaman', 'Halaman') || 0),
            estimasiKata: Number(get('Estimasi Kata', 'Kata') || 0),
            ukuran: String(get('Ukuran') || '').trim(),
            catatan: String(get('Catatan', 'Keterangan') || '').trim(),
            tanggal: normalizeImportDate(get('Tanggal Deal', 'Tanggal')) || new Date().toISOString().split('T')[0],
            statusProses: 'Tagihan Berjalan',
            source: 'legacy',
            importedAt: new Date().toISOString().split('T')[0],
            butuhProofreading: '1'
          };
        });
        const saveOne = (payload) => new Promise((resolve, reject) => {
          gas.withSuccessHandler((res) => {
            if (res && res.success === false) reject(new Error(res.message || res.error || 'Gagal menyimpan data.'));else
            resolve(res);
          }).withFailureHandler(reject).saveLegacyDealData(payload);
        });
        for (const payload of payloads) await saveOne(payload);
        input.value = '';
        loadDealLama();
        Swal.fire('Import Berhasil', "".concat(payloads.length, " deal lama berhasil diupload tanpa masuk KPI/omzet bulan berjalan."), 'success');
      } catch (error) {
        input.value = '';
        Swal.fire('Import Gagal', String(error && error.message ? error.message : error), 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  }).getUsersData();
}
