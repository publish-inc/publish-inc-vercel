<script>



function loadManajemenCampaign() {
  if (!state.user) return;
  const content = document.getElementById('contentArea');
  if (!content) return;

  content.innerHTML = '<div class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i><div class="text-sm">Memuat Data Campaign...</div></div>';

  gas.withSuccessHandler((resEvent) => {
    gas.withSuccessHandler((resKonten) => {
      gas.withSuccessHandler((resBroadcast) => {
        const eventData = resEvent?.data || [];
        const kontenData = resKonten?.data || [];
        const broadcastData = resBroadcast?.data || [];

        const statusPill = (status, type) => {
          let cls = 'bg-slate-100 text-slate-600';
          if (['Done', 'Published', 'Sent'].includes(status)) cls = 'bg-emerald-50 text-emerald-600';else
          if (['Ongoing', 'Scheduled'].includes(status)) cls = 'bg-blue-50 text-blue-600';else
          if (['Upcoming', 'Draft'].includes(status)) cls = type === 'content' ? 'bg-slate-100 text-slate-600' : 'bg-amber-50 text-amber-600';
          return "<span class=\"px-3 py-1 rounded-full text-[10px] font-black uppercase ".concat(cls, "\">").concat(status || '-', "</span>");
        };
        const tableShell = (id, rows, emptyText) => "\n                            <div id=\"".concat(
          id, "\" class=\"campaign-tab-panel ").concat(id === 'campaignTab' ? '' : 'hidden', "\">\n                                <div class=\"overflow-x-auto\">\n                                    <table class=\"w-full text-left\">\n                                        ").concat(


          rows, "\n                                    </table>\n                                </div>\n                                ").concat(


          emptyText, "\n                            </div>\n                        ");



        content.innerHTML = "\n                            <div class=\"bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden\">\n                                <div class=\"px-6 py-5 border-b border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4\">\n                                    <div>\n                                        <h3 class=\"text-xl font-black text-slate-900\">Campaign Workspace</h3>\n                                        <p class=\"text-sm text-slate-500 mt-1\">Kelola campaign, content, dan broadcast dalam satu tampilan.</p>\n                                    </div>\n                                    <div class=\"flex items-center gap-3 w-full lg:w-96\">\n                                        <span class=\"w-11 h-11 rounded-2xl bg-slate-50 border border-slate-100 text-slate-400 flex items-center justify-center shrink-0\"><i class=\"fa-solid fa-magnifying-glass\"></i></span>\n                                        <input type=\"text\" id=\"campaignSearch\" oninput=\"filterCampaignRows(this.value)\" class=\"w-full px-4 py-3 rounded-2xl border border-slate-100 bg-slate-50 outline-none focus:border-accent-600 text-sm\" placeholder=\"Cari data campaign...\">\n                                    </div>\n                                </div>\n\n                                <div class=\"px-6 pt-5 bg-slate-50/60\">\n                                    <div class=\"flex flex-wrap items-center gap-3\">\n                                        <button onclick=\"showCampaignTab('campaignTab', this)\" class=\"campaign-tab-btn bg-white text-accent-600 shadow-sm border border-slate-100 px-5 py-3 rounded-2xl text-xs font-black flex items-center gap-2\">\n                                            <i class=\"fa-solid fa-calendar-check\"></i> Campaign <span class=\"px-2 py-0.5 rounded-full bg-accent-50 text-accent-600\">".concat(















          eventData.length, "</span>\n                                        </button>\n                                        <button onclick=\"showCampaignTab('contentTab', this)\" class=\"campaign-tab-btn bg-slate-100 text-slate-500 border border-transparent px-5 py-3 rounded-2xl text-xs font-black flex items-center gap-2\">\n                                            <i class=\"fa-solid fa-layer-group\"></i> Content <span class=\"px-2 py-0.5 rounded-full bg-white text-slate-500\">").concat(


          kontenData.length, "</span>\n                                        </button>\n                                        <button onclick=\"showCampaignTab('broadcastTab', this)\" class=\"campaign-tab-btn bg-slate-100 text-slate-500 border border-transparent px-5 py-3 rounded-2xl text-xs font-black flex items-center gap-2\">\n                                            <i class=\"fa-solid fa-bullhorn\"></i> Broadcast <span class=\"px-2 py-0.5 rounded-full bg-white text-slate-500\">").concat(


          broadcastData.length, "</span>\n                                        </button>\n                                    </div>\n                                </div>\n\n                                <div class=\"p-6\">\n                                    <div class=\"mb-5 flex justify-end gap-2\">\n                                        <button data-tab-action=\"campaignTab\" onclick=\"openFormEvent()\" class=\"campaign-action-btn px-4 py-2.5 bg-accent-600 text-white rounded-xl text-xs font-black shadow-sm hover:bg-accent-700 transition\"><i class=\"fa-solid fa-plus mr-1.5\"></i>New Campaign</button>\n                                        <button data-tab-action=\"contentTab\" onclick=\"openFormKonten()\" class=\"campaign-action-btn hidden px-4 py-2.5 bg-accent-600 text-white rounded-xl text-xs font-black shadow-sm hover:bg-accent-700 transition\"><i class=\"fa-solid fa-plus mr-1.5\"></i>New Content</button>\n                                        <button data-tab-action=\"broadcastTab\" onclick=\"openFormBroadcast()\" class=\"campaign-action-btn hidden px-4 py-2.5 bg-accent-600 text-white rounded-xl text-xs font-black shadow-sm hover:bg-accent-700 transition\"><i class=\"fa-solid fa-plus mr-1.5\"></i>New Broadcast</button>\n                                    </div>\n\n                                    ").concat(











          tableShell('campaignTab', "\n                                        <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                            <tr><th class=\"px-5 py-4\">Nama Campaign</th><th class=\"px-5 py-4\">Tanggal</th><th class=\"px-5 py-4\">Lokasi</th><th class=\"px-5 py-4 text-center\">Status</th><th class=\"px-5 py-4 text-right\">Aksi</th></tr>\n                                        </thead>\n                                        <tbody class=\"divide-y divide-slate-50\">\n                                            ".concat(




            eventData.map((e) => "\n                                                <tr class=\"campaign-row text-[13px] hover:bg-slate-50 transition-colors\">\n                                                    <td class=\"px-5 py-4 font-black text-slate-800\">".concat(

              e.nama, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600 font-mono\">").concat(
              e.tanggal, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600\">").concat(
              e.lokasi, "</td>\n                                                    <td class=\"px-5 py-4 text-center\">").concat(
              statusPill(e.status, 'campaign'), "</td>\n                                                    <td class=\"px-5 py-4 text-right\"><button onclick=\"editEvent('").concat(
              e.id, "')\" class=\"p-2 text-blue-500 hover:bg-blue-50 rounded-lg\"><i class=\"fa-solid fa-edit\"></i></button><button onclick=\"deleteEventItem('").concat(e.id, "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg ml-1\"><i class=\"fa-solid fa-trash\"></i></button></td>\n                                                </tr>\n                                            ")

            ).join(''), "\n                                        </tbody>\n                                    "),

          eventData.length === 0 ? '<div class="p-12 text-center text-slate-300 italic">Belum ada campaign.</div>' : ''), "\n\n                                    ").concat(

          tableShell('contentTab', "\n                                        <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                            <tr><th class=\"px-5 py-4\">Judul Content</th><th class=\"px-5 py-4\">Platform</th><th class=\"px-5 py-4\">Tgl Publish</th><th class=\"px-5 py-4 text-center\">Status</th><th class=\"px-5 py-4 text-right\">Aksi</th></tr>\n                                        </thead>\n                                        <tbody class=\"divide-y divide-slate-50\">\n                                            ".concat(




            kontenData.map((e) => "\n                                                <tr class=\"campaign-row text-[13px] hover:bg-slate-50 transition-colors\">\n                                                    <td class=\"px-5 py-4 font-black text-slate-800\">".concat(

              e.judul, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600\">").concat(
              e.platform, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600 font-mono\">").concat(
              e.tanggal, "</td>\n                                                    <td class=\"px-5 py-4 text-center\">").concat(
              statusPill(e.status, 'content'), "</td>\n                                                    <td class=\"px-5 py-4 text-right\"><button onclick=\"editKonten('").concat(
              e.id, "')\" class=\"p-2 text-blue-500 hover:bg-blue-50 rounded-lg\"><i class=\"fa-solid fa-edit\"></i></button><button onclick=\"deleteKontenItem('").concat(e.id, "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg ml-1\"><i class=\"fa-solid fa-trash\"></i></button></td>\n                                                </tr>\n                                            ")

            ).join(''), "\n                                        </tbody>\n                                    "),

          kontenData.length === 0 ? '<div class="p-12 text-center text-slate-300 italic">Belum ada content.</div>' : ''), "\n\n                                    ").concat(

          tableShell('broadcastTab', "\n                                        <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                            <tr><th class=\"px-5 py-4\">Nama Broadcast</th><th class=\"px-5 py-4\">Tanggal Jadwal</th><th class=\"px-5 py-4\">Platform</th><th class=\"px-5 py-4 text-center\">Status</th><th class=\"px-5 py-4 text-right\">Aksi</th></tr>\n                                        </thead>\n                                        <tbody class=\"divide-y divide-slate-50\">\n                                            ".concat(




            broadcastData.map((e) => "\n                                                <tr class=\"campaign-row text-[13px] hover:bg-slate-50 transition-colors\">\n                                                    <td class=\"px-5 py-4 font-black text-slate-800\">".concat(

              e.nama, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600 font-mono\">").concat(
              e.tanggal, "</td>\n                                                    <td class=\"px-5 py-4 text-slate-600\">").concat(
              e.platform, "</td>\n                                                    <td class=\"px-5 py-4 text-center\">").concat(
              statusPill(e.status, 'broadcast'), "</td>\n                                                    <td class=\"px-5 py-4 text-right\"><button onclick=\"editBroadcast('").concat(
              e.id, "')\" class=\"p-2 text-blue-500 hover:bg-blue-50 rounded-lg\"><i class=\"fa-solid fa-edit\"></i></button><button onclick=\"deleteBroadcastItem('").concat(e.id, "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg ml-1\"><i class=\"fa-solid fa-trash\"></i></button></td>\n                                                </tr>\n                                            ")

            ).join(''), "\n                                        </tbody>\n                                    "),

          broadcastData.length === 0 ? '<div class="p-12 text-center text-slate-300 italic">Belum ada broadcast.</div>' : ''), "\n                                </div>\n                            </div>\n                        ");



      }).getBroadcastData();
    }).getKontenData();
  }).getEventData();
}

function showCampaignTab(tabId, buttonEl) {
  document.querySelectorAll('.campaign-tab-panel').forEach((panel) => panel.classList.add('hidden'));
  const activePanel = document.getElementById(tabId);
  if (activePanel) activePanel.classList.remove('hidden');

  document.querySelectorAll('.campaign-tab-btn').forEach((btn) => {
    btn.classList.remove('bg-white', 'text-accent-600', 'shadow-sm', 'border-slate-100');
    btn.classList.add('bg-slate-100', 'text-slate-500', 'border-transparent');
  });
  if (buttonEl) {
    buttonEl.classList.add('bg-white', 'text-accent-600', 'shadow-sm', 'border-slate-100');
    buttonEl.classList.remove('bg-slate-100', 'text-slate-500', 'border-transparent');
  }

  document.querySelectorAll('.campaign-action-btn').forEach((btn) => {
    btn.classList.toggle('hidden', btn.getAttribute('data-tab-action') !== tabId);
  });

  const search = document.getElementById('campaignSearch');
  if (search) filterCampaignRows(search.value);
}

function filterCampaignRows(keyword) {
  const term = String(keyword || '').toLowerCase();
  document.querySelectorAll('.campaign-tab-panel:not(.hidden) .campaign-row').forEach((row) => {
    row.style.display = row.textContent.toLowerCase().includes(term) ? '' : 'none';
  });
}

function openFormEvent() {
  document.getElementById('eventModalTitle').innerText = 'Buat Event Baru';
  document.getElementById('evt_id').value = '';
  document.getElementById('evt_nama').value = '';
  document.getElementById('evt_tanggal').value = new Date().toISOString().split('T')[0];
  document.getElementById('evt_lokasi').value = '';
  document.getElementById('evt_status').value = 'Upcoming';
  openModal('modalEvent');
}

function editEvent(id) {
  gas.withSuccessHandler((res) => {
    const p = (res?.data || []).find((x) => x.id === id);
    if (p) {
      document.getElementById('eventModalTitle').innerText = 'Edit Event';
      document.getElementById('evt_id').value = p.id;
      document.getElementById('evt_nama').value = p.nama;
      document.getElementById('evt_tanggal').value = p.tanggal;
      document.getElementById('evt_lokasi').value = p.lokasi;
      document.getElementById('evt_status').value = p.status;
      openModal('modalEvent');
    }
  }).getEventData();
}
function deleteEventItem(id) {Swal.fire({ title: 'Hapus Event?', text: 'Data event akan dihapus!', icon: 'warning', showCancelButton: true }).then((r) => {if (r.isConfirmed) gas.withSuccessHandler(() => loadManajemenCampaign()).deleteEvent(id);});}
function handleSaveEvent(e) {
  e.preventDefault();
  const payload = { id: document.getElementById('evt_id').value, nama: document.getElementById('evt_nama').value, tanggal: document.getElementById('evt_tanggal').value, lokasi: document.getElementById('evt_lokasi').value, status: document.getElementById('evt_status').value };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {closeModal('modalEvent');loadManajemenCampaign();Swal.fire('Tersimpan!', 'Event berhasil disimpan.', 'success');}).saveEventData(payload);
}

function loadKehadiranKaryawan(selectedMonth) {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;

    let allAbsensi = (res?.data || []).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
    
    // Kehadiran di UI dibatasi ke pilihan 3 bulan terakhir.
    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov', 'Des'];
    const months = [];
    for (let i = 0; i < 3; i++) {
      const date = new Date();
      date.setMonth(date.getMonth() - i);
      months.push({
        value: date.toISOString().slice(0, 7),
        label: monthNames[date.getMonth()] + ' ' + date.getFullYear()
      });
    }
    const currentMonth = months[0].value;
    const validMonthValues = months.map((m) => m.value);
    selectedMonth = validMonthValues.includes(selectedMonth) ? selectedMonth : window._kehadiranSelectedMonth;
    selectedMonth = validMonthValues.includes(selectedMonth) ? selectedMonth : currentMonth;
    window._kehadiranSelectedMonth = selectedMonth;
    const activeMonthObj = months.find((m) => m.value === selectedMonth) || months[0];
    let absensi = allAbsensi.filter((a) => a.tanggal && a.tanggal.startsWith(selectedMonth));

    window.downloadExcelKehadiran = function () {
      if (typeof XLSX === 'undefined') {
        Swal.fire('Excel Belum Siap', 'Library Excel belum termuat. Coba muat ulang halaman.', 'warning');
        return;
      }
      const statusColumns = ['Alpa', 'Izin', 'Izin Setengah Hari', 'Sakit', 'Terlambat', 'Cuti'];
      const statusLabels = {
        'Alpa': 'ALPA',
        'Izin': 'IZIN',
        'Izin Setengah Hari': 'IZIN SETENGAH HARI',
        'Sakit': 'SAKIT',
        'Terlambat': 'TERLAMBAT',
        'Cuti': 'CUTI'
      };
      const normalizeStatus = (value) => {
        const text = String(value || '').trim().toLowerCase();
        return statusColumns.find((status) => status.toLowerCase() === text) || '';
      };
      const formatAttendanceDate = (value) => {
        if (!value) return '';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleDateString('en-US', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
      };
      // Filter data untuk 3 bulan terakhir + bulan ini
      const now = new Date();
      const threeMonthsAgo = new Date(now.getFullYear(), now.getMonth() - 3, 1);
      const absensiForExcel = allAbsensi.filter((a) => {
        if (!a.tanggal) return false;
        const d = new Date(a.tanggal);
        return d >= threeMonthsAgo;
      });

      // Group by month
      const groupedData = {};
      
      absensiForExcel.forEach(a => {
        if (!a.tanggal) return;
        const d = new Date(a.tanggal);
        const key = `${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        const sortKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        if (!groupedData[sortKey]) groupedData[sortKey] = { name: key, data: [] };
        groupedData[sortKey].data.push(a);
      });

      const wb = XLSX.utils.book_new();

      // Buat sheet untuk setiap bulan (dari terbaru ke terlama)
      Object.keys(groupedData).sort((a, b) => b.localeCompare(a)).forEach(key => {
        const group = groupedData[key];
        const sheetName = group.name;
        
        const rows = [
        [`REKAPAN KEHADIRAN TIM NASMEDIA (${sheetName})`, '', '', '', '', '', '', '', ''],
        ['NAMA KARYAWAN', 'TANGGAL', ...statusColumns.map((status) => statusLabels[status]), 'CATATAN'],
        ...group.data.
        slice().
        sort((a, b) => String(a.karyawan || '').localeCompare(String(b.karyawan || '')) || String(a.tanggal || '').localeCompare(String(b.tanggal || ''))).
        map((a) => {
          const status = normalizeStatus(a.status);
          return [
          a.karyawan || '',
          formatAttendanceDate(a.tanggal),
          ...statusColumns.map((col) => col === status ? 'V' : ''),
          a.keterangan || ''];
        })];

        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 8 } }];
        ws['!cols'] = [
        { wch: 24 },
        { wch: 28 },
        { wch: 12 },
        { wch: 12 },
        { wch: 20 },
        { wch: 12 },
        { wch: 15 },
        { wch: 12 },
        { wch: 42 }];

        ws['!rows'] = [{ hpt: 22 }, { hpt: 20 }];
        const range = XLSX.utils.decode_range(ws['!ref']);
        for (let R = range.s.r; R <= range.e.r; ++R) {
          for (let C = range.s.c; C <= range.e.c; ++C) {
            const addr = XLSX.utils.encode_cell({ r: R, c: C });
            if (!ws[addr]) continue;
            ws[addr].s = ws[addr].s || {};
            ws[addr].s.alignment = { horizontal: C === 8 ? 'left' : 'center', vertical: 'center' };
            ws[addr].s.border = {
              top: { style: 'thin', color: { rgb: '000000' } },
              bottom: { style: 'thin', color: { rgb: '000000' } },
              left: { style: 'thin', color: { rgb: '000000' } },
              right: { style: 'thin', color: { rgb: '000000' } }
            };
            if (R === 0) {
              ws[addr].s.font = { bold: true };
              ws[addr].s.fill = { fgColor: { rgb: 'FFFF00' } };
            }
            if (R === 1) {
              ws[addr].s.font = { bold: true };
            }
          }
        }
        const headerColors = ['FFFFFF', 'FF0000', '92D050', '00B0F0', '00B0F0', '00B050', '0070C0', '7030A0', 'FFFFFF'];
        headerColors.forEach((color, idx) => {
          const addr = XLSX.utils.encode_cell({ r: 1, c: idx });
          if (ws[addr]) {
            ws[addr].s = ws[addr].s || {};
            ws[addr].s.fill = { fgColor: { rgb: color } };
            ws[addr].s.font = { bold: true, color: { rgb: ['FF0000', '00B050', '0070C0', '7030A0'].includes(color) ? 'FFFFFF' : '000000' } };
          }
        });
        
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
      });
      XLSX.writeFile(wb, "Rekapan_Kehadiran_Tim_Nasmedia_" + new Date().toISOString().split('T')[0] + ".xlsx");
    };

    window.clearKehadiranData = function () {
      Swal.fire({
        title: 'Clear Semua Data Kehadiran?',
        text: 'Tindakan ini akan menghapus seluruh histori log kehadiran permanen!',
        icon: 'warning',
        input: 'text',
        inputPlaceholder: 'Ketik CLEAR...',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',

function openFormKehadiran() {
  document.getElementById('kehadiranModalTitle').innerText = 'Catat Kehadiran / Ketidakhadiran';
  document.getElementById('att_id').value = '';
  
  const today = new Date();
  const offset = today.getTimezoneOffset();
  const localDate = new Date(today.getTime() - (offset*60*1000)).toISOString().split('T')[0];
  document.getElementById('att_tanggal').value = localDate;
  document.getElementById('att_tanggal').min = localDate.slice(0, 7) + '-01';
  document.getElementById('att_status').value = 'Terlambat';
  document.getElementById('att_keterangan').value = '';
  openModal('modalKehadiran');
  gas.withSuccessHandler((res) => {
    const users = res?.data || [];
    const select = document.getElementById('att_karyawan');
    if (select) {
      select.innerHTML = '<option value="">Pilih Karyawan</option>';
      users.filter((u) => !['pimpinan', 'report'].includes(normalizeRole(u.role))).forEach((u) => {
        const opt = document.createElement('option');
        opt.value = u.nama;
        opt.textContent = u.nama + ' (' + (u.employeeId || '-') + ' - ' + getRoleLabel(u.role) + ')';
        select.appendChild(opt);
      });
    }
  }).getUsersData();
}

function handleSaveKehadiran(e) {
  e.preventDefault();
  const payload = {
    id: document.getElementById('att_id').value,
    tanggal: document.getElementById('att_tanggal').value,
    karyawan: document.getElementById('att_karyawan').value,
    status: document.getElementById('att_status').value,
    keterangan: document.getElementById('att_keterangan').value
  };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {
    closeModal('modalKehadiran');
    loadKehadiranKaryawan();
    Swal.fire('Tersimpan!', 'Record kehadiran berhasil disimpan.', 'success');
  }).saveKehadiranData(payload);
}

function deleteKehadiranItem(id) {
  Swal.fire({ title: 'Hapus Record?', text: 'Data kehadiran ini akan dihapus permanen!', icon: 'warning', showCancelButton: true }).then((r) => {
    if (r.isConfirmed) gas.withSuccessHandler(() => loadKehadiranKaryawan()).deleteKehadiran(id);
  });
}

function exportMitraCSV() {
  if (!window.mitraData || window.mitraData.length === 0) return Swal.fire('Ops', 'Tidak ada data', 'warning');
  const headers = ["Nama Lengkap", "NIK", "Email", "WhatsApp", "Tanggal Lahir", "Instansi", "Jenis Instansi", "Jabatan", "Alamat", "Bank", "No Rekening", "Atas Nama Rekening", "Skala", "Program", "Waktu Daftar", "Level Mitra"];
  const csvRows = [headers.join(",")];
  window.mitraData.forEach((m) => {
    const row = [
    '"' + (m.nama || '') + '"', '"' + (m.nik || '') + '\\t"', m.email || '', '"' + (m.wa || '') + '\\t"', m.tgl_lahir || '',
    '"' + (m.instansi || '') + '"', '"' + (m.jenis_instansi || '') + '"', '"' + (m.jabatan || '') + '"', '"' + (m.alamat || '') + '"',
    m.bank || '', '"' + (m.rekening || '') + '\\t"', '"' + (m.an_rekening || '') + '"', '"' + (m.skala || '') + '"', m.program || '', m.waktuDaftar || '', m.level_mitra || 'Scholar'];

    csvRows.push(row.join(","));
  });
  const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\\n");
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "Data_Mitra_" + new Date().toISOString().split('T')[0] + ".csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

window.handleImportMitra = function (event) {
  const file = event.target.files[0];
  if (!file) return;
  Swal.fire({ title: 'Memproses File...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false });
      if (json.length === 0) {Swal.fire('Error', 'File kosong!', 'error');return;}

      const payload = json.map((r) => {
        const getVal = (keyNames) => {
          for (let k of Object.keys(r)) {
            if (keyNames.some((kn) => k.toLowerCase().includes(kn.toLowerCase()))) return r[k];
          }
          return '';
        };

        return {
          nama: getVal(['Nama Lengkap', 'Nama']),
          nik: getVal(['NIK']),
          email: getVal(['Email']),
          wa: getVal(['WhatsApp', 'WA', 'No HP']),
          tgl_lahir: getVal(['Tanggal Lahir', 'Tgl Lahir', 'Lahir']),
          instansi: getVal(['Instansi']),
          jenis_instansi: getVal(['Jenis Instansi', 'Jenis']),
          jabatan: getVal(['Jabatan']),
          alamat: getVal(['Alamat Instansi', 'Alamat']),
          bank: getVal(['Bank']),
          rekening: getVal(['No Rekening', 'Rekening']),
          an_rekening: getVal(['Atas Nama', 'A.N']),
          skala: getVal(['Skala']),
          program: getVal(['Program']) || 'Teman Nasmedia',
          waktuDaftar: getVal(['Waktu Daftar', 'Tanggal Daftar', 'Waktu']) || new Date().toISOString().split('T')[0],
          level_mitra: 'Scholar'
        };
      }).filter((r) => r.nama);

      if (payload.length === 0) {
        Swal.fire('Error', 'Tidak ada data valid yang bisa diimpor. Pastikan format kolom sesuai.', 'error');
        return;
      }

      gas.withSuccessHandler(() => {
        loadDataMitra();
        Swal.fire('Berhasil', payload.length + ' data mitra berhasil diimpor.', 'success');
      }).importMitraData(payload);
    } catch (error) {
      console.error(error);
      Swal.fire('Error', 'Gagal membaca file Excel.', 'error');
    }
  };
  reader.readAsArrayBuffer(file);
  event.target.value = '';
};

function calculateKomisi() {
  const omset = Number(document.getElementById('kms_omset').value) || 0;
  const persen = Number(document.getElementById('kms_persen').value) || 0;
  document.getElementById('kms_nominal_komisi').value = (omset * persen / 100).toFixed(0);
}

function populateMitraDropdownForKomisi(selectedId = '') {
  const sel = document.getElementById('kms_mitra_id');
  sel.innerHTML = '<option value="">Loading...</option>';
  gas.withSuccessHandler((res) => {
    const data = res?.data || [];
    window.cachedMitraForKomisi = data;
    sel.innerHTML = '<option value="">Pilih Mitra...</option>' + data.map((m) => "<option value=\"".concat(m.id, "\" ").concat(m.id === selectedId ? 'selected' : '', ">").concat(m.nama, " (").concat(m.program || 'Mitra', ")</option>")).join('');
  }).getMitraData();
}

function openFormKomisi(id = null) {
  document.getElementById('kms_id').value = id || '';
  document.getElementById('komisiModalTitle').innerText = id ? 'Edit Klaim Komisi' : 'Input Klaim Komisi Baru';

  if (id && window.komisiData) {
    const k = window.komisiData.find((x) => x.id === id);
    if (k) {
      populateMitraDropdownForKomisi(k.mitra_id);
      document.getElementById('kms_calon_penulis').value = k.calon_penulis || '';
      document.getElementById('kms_tgl_referensi').value = k.tgl_referensi || '';
      document.getElementById('kms_omset').value = k.omset || '';
      document.getElementById('kms_persen').value = k.persen || '';
      document.getElementById('kms_nominal_komisi').value = k.nominal_komisi || '';
      document.getElementById('kms_status_bayar').value = k.status_bayar || 'Belum Dibayar';
    }
  } else {
    populateMitraDropdownForKomisi();
    document.getElementById('kms_calon_penulis').value = '';
    document.getElementById('kms_tgl_referensi').value = new Date().toISOString().split('T')[0];
    document.getElementById('kms_omset').value = '';
    document.getElementById('kms_persen').value = '10'; // Default 10%
    document.getElementById('kms_nominal_komisi').value = '';
    document.getElementById('kms_status_bayar').value = 'Belum Dibayar';
  }
  openModal('modalKomisi');
}

function handleSaveKomisi(e) {
  e.preventDefault();

  const mitraId = document.getElementById('kms_mitra_id').value;
  const selectedMitra = (window.cachedMitraForKomisi || []).find((m) => m.id === mitraId) || {};

  const payload = {
    id: document.getElementById('kms_id').value,
    mitra_id: mitraId,
    mitra_nama: selectedMitra.nama || '',
    mitra_program: selectedMitra.program || '',
    calon_penulis: document.getElementById('kms_calon_penulis').value,
    tgl_referensi: document.getElementById('kms_tgl_referensi').value,
    omset: document.getElementById('kms_omset').value,
    persen: document.getElementById('kms_persen').value,
    nominal_komisi: document.getElementById('kms_nominal_komisi').value,
    status_bayar: document.getElementById('kms_status_bayar').value
  };

  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler((res) => {
    closeModal('modalKomisi');
    loadKomisiMitra();
    Swal.fire({ icon: 'success', title: 'Tersimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
  }).saveKomisiData(payload);
}

function editKomisi(id) {openFormKomisi(id);}
function deleteKomisi(id) {

    window.saveCetakModalForm(e);
    return;
  }
  Swal.fire('Form Cetak Belum Siap', 'Modul input cetak baru belum termuat. Reload halaman lalu coba lagi.', 'warning');
}

function deleteCetakEntry(id) {
  Swal.fire({ title: 'Hapus Data Cetak?', text: 'Data tidak dapat dikembalikan!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya, Hapus!' }).
  then((r) => {if (r.isConfirmed) gas.withSuccessHandler(() => {loadInputCetak();Swal.fire('Terhapus!', '', 'success');}).deleteKPI(id);});
}

      formatRp(totalNominal), "</p></div>\n                        </div>\n                    </div>\n\n                    <div class=\"flex justify-between items-center mb-4\">\n                        <h3 class=\"font-bold text-slate-800\"><i class=\"fa-solid fa-layer-group text-amber-500 mr-2\"></i>Riwayat Input Lainnya</h3>\n                        <button onclick=\"openFormLainnya()\" class=\"btn-gradient text-white px-4 py-2 rounded-xl font-bold text-sm shadow-md\"><i class=\"fa-solid fa-plus mr-2\"></i>Input Lainnya</button>\n                    </div>\n\n                    <div class=\"bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden\">\n                        <div class=\"overflow-x-auto\">\n                            <table class=\"w-full text-sm text-left\">\n                                <thead class=\"bg-slate-50 text-xs text-slate-500 uppercase\">\n                                    <tr>\n                                        <th class=\"px-6 py-4\">Tanggal</th>\n                                        <th class=\"px-6 py-4\">Spesifikasi</th>\n                                        <th class=\"px-6 py-4\">Nominal</th>\n                                        <th class=\"px-6 py-4\">Pembayaran</th>\n                                        <th class=\"px-6 py-4\">Nilai KPI</th>\n                                        <th class=\"px-6 py-4\">Aksi</th>\n                                    </tr>\n                                </thead>\n                                <tbody class=\"divide-y divide-slate-100\">\n                                    ").concat(






















      data.length === 0 ? '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-400">Belum ada data input lainnya</td></tr>' :
      data.sort((a, b) => (b.tanggal || '').localeCompare(a.tanggal || '')).map((k) => "\n                                        <tr class=\"hover:bg-slate-50 transition-colors\">\n                                            <td class=\"px-6 py-4 text-xs font-medium\">".concat(

        k.tanggal || '-', "</td>\n                                            <td class=\"px-6 py-4\">\n                                                <div class=\"font-bold text-slate-800\">").concat(

        k.spesifikasi || '-', "</div>\n                                                ").concat(

        formatRp(k.nominal || 0), "</td>\n                                            <td class=\"px-6 py-4\">\n                                                <span class=\"px-2 py-1 rounded-md text-[10px] font-bold ").concat(

        (k.statusPayment || 'Full Payment') === 'DP' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700', "\">").concat(k.statusPayment || 'Full Payment', "</span>\n                                                ").concat(
        (k.statusPayment || 'Full Payment') === 'DP' ? "<div class=\"mt-1 text-[10px] font-bold text-amber-600\">DP: ".concat(formatRp(k.nominalDP || 0), "</div>") : '', "\n                                            </td>\n                                            <td class=\"px-6 py-4 text-xs text-slate-400\">").concat(

function openFormLainnya(id = null) {
  document.getElementById('lainnya_id').value = id || '';
  document.getElementById('lainnyaModalTitle').innerText = id ? 'Edit Input Lainnya' : 'Input Lainnya Baru';
  if (id && window.lainnyaData) {
    const k = window.lainnyaData.find((x) => x.id === id);
    if (k) {
      document.getElementById('lainnya_tanggal').value = k.tanggal || '';
      document.getElementById('lainnya_spesifikasi').value = k.spesifikasi || '';
      document.getElementById('lainnya_kota_asal').value = k.kotaAsal || '';
      document.getElementById('lainnya_nominal').value = k.nominal || '';
      document.getElementById('lainnya_status_payment').value = k.statusPayment || 'Full Payment';
      document.getElementById('lainnya_nominal_dp').value = k.nominalDP || '';
      toggleLainnyaDPField(k.statusPayment || 'Full Payment');
      document.getElementById('lainnya_nilai_kpi').value = k.jumlahKinerja || '';
    }
  } else {
    document.getElementById('lainnya_tanggal').value = new Date().toISOString().split('T')[0];
    document.getElementById('lainnya_spesifikasi').value = '';
    document.getElementById('lainnya_kota_asal').value = '';
    document.getElementById('lainnya_nominal').value = '';
    document.getElementById('lainnya_status_payment').value = 'Full Payment';
    document.getElementById('lainnya_nominal_dp').value = '';
    toggleLainnyaDPField('Full Payment');
    document.getElementById('lainnya_nilai_kpi').value = '';
  }
  openModal('modalInputLainnya');
}

function toggleLainnyaDPField(value) {
  const wrap = document.getElementById('lainnya_dp_wrap');
  const input = document.getElementById('lainnya_nominal_dp');
  if (!wrap || !input) return;
  wrap.classList.toggle('hidden', value !== 'DP');
  input.required = value === 'DP';
  if (value !== 'DP') input.value = '';
}

function handleSaveLainnya(e) {
  e.preventDefault();
  const statusPayment = document.getElementById('lainnya_status_payment').value;
  const payload = {
    id: document.getElementById('lainnya_id').value,
    picName: state.user.nama,
    tanggal: document.getElementById('lainnya_tanggal').value,
    jenis: 'Lainnya',
    spesifikasi: document.getElementById('lainnya_spesifikasi').value,
    kotaAsal: document.getElementById('lainnya_kota_asal')?.value.trim() || '',
    nominal: document.getElementById('lainnya_nominal').value,
    statusPayment,
    nominalDP: statusPayment === 'DP' ? document.getElementById('lainnya_nominal_dp').value : '',
    jumlahKinerja: document.getElementById('lainnya_nilai_kpi').value || '0'
  };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler((res) => {
    closeModal('modalInputLainnya');
    loadInputLainnya();
    Swal.fire({ icon: 'success', title: 'Tersimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 3000 });
  }).saveKPIData(payload);
}

function deleteLainnyaEntry(id) {
  Swal.fire({ title: 'Hapus Data?', text: 'Data tidak dapat dikembalikan!', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya, Hapus!' }).
  then((r) => {if (r.isConfirmed) gas.withSuccessHandler(() => {loadInputLainnya();Swal.fire('Terhapus!', '', 'success');}).deleteKPI(id);});
}
