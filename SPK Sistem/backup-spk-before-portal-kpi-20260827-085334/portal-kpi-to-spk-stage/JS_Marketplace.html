<script>



function loadDashboardMarketplace() {
  gas.withSuccessHandler((resInit) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const d = resInit?.data || {};
    const stokData = d.stok || [];
    const penjualanData = d.penjualan || [];

    const totalStokJogja = stokData.filter((s) => s.gudang === 'Jogja').reduce((a, b) => a + Number(b.stok), 0);
    const totalStokMakassar = stokData.filter((s) => s.gudang === 'Makassar').reduce((a, b) => a + Number(b.stok), 0);
    const totalPenjualan = penjualanData.reduce((a, b) => a + Number(b.qty), 0);
    const totalOmzet = penjualanData.reduce((a, b) => a + Number(b.qty) * Number(b.hargaJual), 0);

    const mpStats = {};
    penjualanData.forEach((p) => {
      if (!mpStats[p.marketplace]) mpStats[p.marketplace] = { qty: 0, omzet: 0 };
      mpStats[p.marketplace].qty += Number(p.qty);
      mpStats[p.marketplace].omzet += Number(p.qty) * Number(p.hargaJual);

    content.innerHTML = "\n                            <div class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10\">\n                                ".concat(

      renderStatCard('Stok Jogja', totalStokJogja + ' Eks', 'fa-warehouse', 'bg-blue-50 text-blue-600'), "\n                                ").concat(
      renderStatCard('Stok Makassar', totalStokMakassar + ' Eks', 'fa-warehouse', 'bg-indigo-50 text-indigo-600'), "\n                                ").concat(
      renderStatCard('Total Terjual', totalPenjualan + ' Eks', 'fa-cart-shopping', 'bg-amber-50 text-amber-600'), "\n                                ").concat(
      renderStatCard('Total Omzet MP', formatRp(totalOmzet), 'fa-money-bill-wave', 'bg-emerald-50 text-emerald-600'), "\n                            </div>\n                            <div class=\"grid grid-cols-1 lg:grid-cols-2 gap-8\">\n                                <div class=\"bg-white p-8 rounded-3xl border border-slate-100 shadow-sm\">\n                                    <h3 class=\"font-bold text-slate-800 mb-6 flex items-center gap-2\"><i class=\"fa-solid fa-store text-accent-600\"></i> Penjualan per Marketplace</h3>\n                                    <div class=\"space-y-4\">\n                                        ").concat(





      Object.keys(mpStats).length > 0 ? Object.entries(mpStats).map(([mp, d]) => {

        return "<div class=\"flex items-center justify-between p-4 rounded-2xl bg-slate-50 border border-slate-100\">\n                                                <div class=\"flex items-center gap-3\"><div class=\"w-10 h-10 rounded-xl ".concat(
          mpColor, " flex items-center justify-center font-bold text-sm\"><i class=\"fa-solid fa-shop\"></i></div>\n                                                <div><h4 class=\"font-bold text-slate-800 text-sm\">").concat(
          mp, "</h4><p class=\"text-[10px] text-slate-400\">").concat(d.qty, " eksemplar terjual</p></div></div>\n                                                <div class=\"text-right\"><div class=\"font-mono font-bold text-emerald-600\">").concat(

function loadRoyaltiBuku() {
  gas.withSuccessHandler((resInit) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;

    const d = resInit?.data || {};
    let globalRoyalti = 10;
    (d.settings || []).forEach((g) => {if (g.key === 'royaltiGlobal') globalRoyalti = parseFloat(g.value);});
    const penjualanData = d.penjualan || [];
    const naskahData = d.naskah || [];
    const formatRp = (a) => 'Rp ' + Number(a).toLocaleString('id-ID');

    const grouped = {};
    penjualanData.forEach((p) => {
      if (!grouped[p.judul]) {
        const naskahInfo = naskahData.find((n) => n.judul.toLowerCase() === p.judul.toLowerCase());
        grouped[p.judul] = {
          judul: p.judul,
          penulis: naskahInfo ? naskahInfo.penulis : '-',
          hargaJual: Number(p.hargaJual),
          qty: 0
        };
      }
      grouped[p.judul].qty += Number(p.qty);
    });
    const listRoyalti = Object.values(grouped);

    content.innerHTML = "\n                            <div class=\"mb-6 p-4 bg-indigo-50 text-indigo-700 rounded-xl text-sm border border-indigo-100 flex items-center gap-3\">\n                                <i class=\"fa-solid fa-info-circle\"></i>\n                                <div>Royalti global saat ini adalah <b>".concat(


      globalRoyalti, "%</b>. Dihitung berdasarkan persentase &times; Harga Jual &times; Total Qty Terjual.</div>\n                            </div>\n                            <div class=\"bg-white rounded-3xl shadow-sm border border-slate-100 overflow-x-auto\">\n                                <table class=\"w-full text-left\">\n                                    <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                        <tr><th class=\"px-8 py-4\">Judul Buku</th><th class=\"px-8 py-4\">Penulis</th><th class=\"px-8 py-4 text-center\">Royalti (%)</th><th class=\"px-8 py-4 text-right\">Harga Jual</th><th class=\"px-8 py-4 text-center\">Qty Terjual</th><th class=\"px-8 py-4 text-right\">Royalti Terkumpul</th></tr>\n                                    </thead>\n                                    <tbody class=\"divide-y divide-slate-50\">\n                                        ").concat(







      listRoyalti.map((r) => {
        const royaltiNominal = globalRoyalti / 100 * r.hargaJual * r.qty;
        return "<tr class=\"text-[13px] hover:bg-slate-50 transition-colors\">\n                                                <td class=\"px-8 py-4 font-bold text-slate-800\">".concat(
          r.judul, "</td>\n                                                <td class=\"px-8 py-4 text-slate-600\">").concat(
          r.penulis, "</td>\n                                                <td class=\"px-8 py-4 text-center\"><span class=\"px-3 py-1 bg-accent-50 text-accent-600 rounded-full font-bold text-xs\">").concat(
          globalRoyalti, "%</span></td>\n                                                <td class=\"px-8 py-4 text-right font-mono text-slate-600\">").concat(
          formatRp(r.hargaJual), "</td>\n                                                <td class=\"px-8 py-4 text-center font-mono font-bold\">").concat(
          r.qty, "</td>\n                                                <td class=\"px-8 py-4 text-right font-mono font-bold text-emerald-600 text-lg\">").concat(
          formatRp(royaltiNominal), "</td>\n                                            </tr>");

      }).join(''), "\n                                        ").concat(
      listRoyalti.length === 0 ? '<tr><td colspan="6" class="p-16 text-center text-slate-300 italic">Belum ada penjualan buku.</td></tr>' : '', "\n                                    </tbody>\n                                </table>\n                            </div>");



  }).getInitialData();
}

// --- MARKETPLACE HANDLERS ---
function openFormStok() {
  document.getElementById('stokModalTitle').innerText = 'Input Stok Baru';
  document.getElementById('stok_id').value = '';
  document.getElementById('stok_judul').value = '';
  document.getElementById('stok_gudang').value = '';
  document.getElementById('stok_qty').value = '';
  openModal('modalStok');
}
function editStok(id) {
  gas.withSuccessHandler((res) => {
    const s = (res?.data || []).find((x) => x.id === id);
    if (s) {
      document.getElementById('stokModalTitle').innerText = 'Edit Stok';
      document.getElementById('stok_id').value = s.id;
      document.getElementById('stok_judul').value = s.judul;
      document.getElementById('stok_gudang').value = s.gudang;
      document.getElementById('stok_qty').value = s.stok;
      openModal('modalStok');
    }
  }).getStokData();
}
function deleteStok(id) {Swal.fire({ title: 'Hapus Stok?', text: 'Data stok akan dihapus permanen!', icon: 'warning', showCancelButton: true }).then((r) => {if (r.isConfirmed) gas.withSuccessHandler(() => loadStokBuku()).deleteStok(id);});}
function handleSaveStok(e) {
  e.preventDefault();
  const payload = { id: document.getElementById('stok_id').value, judul: document.getElementById('stok_judul').value, gudang: document.getElementById('stok_gudang').value, stok: Number(document.getElementById('stok_qty').value), lastUpdate: new Date().toISOString().split('T')[0] };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {closeModal('modalStok');loadStokBuku();Swal.fire('Tersimpan!', 'Data stok berhasil diperbarui.', 'success');}).withFailureHandler((error) => {
    showServerError('Gagal Menyimpan Stok', error);
  }).saveStokData(payload);
}
function openFormPenjualan() {
  document.getElementById('penjualanModalTitle').innerText = 'Input Penjualan Baru';
  document.getElementById('pnj_id').value = '';
  document.getElementById('pnj_marketplace').value = '';
  document.getElementById('pnj_gudang').value = '';
  document.getElementById('pnj_qty').value = '';
  document.getElementById('pnj_harga').value = '';
  document.getElementById('pnj_tanggal').value = new Date().toISOString().split('T')[0];
  const judulSelect = document.getElementById('pnj_judul');
  judulSelect.innerHTML = '<option value="">Memuat data stok...</option>';
  gas.withSuccessHandler((res) => {
    const stokData = res?.data || [];
    window._stokDataCache = stokData;
    judulSelect.innerHTML = '<option value="">Pilih Judul Buku</option>';
    const uniqueTitles = [...new Set(stokData.map((s) => s.judul))].sort();
    uniqueTitles.forEach((judul) => {
      const stokInfo = stokData.filter((s) => s.judul === judul);
      const totalStok = stokInfo.reduce((a, s) => a + Number(s.stok || 0), 0);
      const el = document.createElement('option');
      el.value = judul;
      el.textContent = totalStok <= 0 ? judul + ' (Stok Habis)' : judul;
      if (totalStok <= 0) {el.disabled = true;el.style.color = '#94a3b8';}
      judulSelect.appendChild(el);
    });
    if (uniqueTitles.length === 0) {
      judulSelect.innerHTML = '<option value="">Belum ada data stok</option>';
    }
  }).getStokData();
  openModal('modalPenjualan');
}
function editPenjualan(id) {
  gas.withSuccessHandler((res) => {
    const p = (res?.data || []).find((x) => x.id === id);
    if (p) {
      document.getElementById('penjualanModalTitle').innerText = 'Edit Penjualan';
      document.getElementById('pnj_id').value = p.id;
      const judulSelect = document.getElementById('pnj_judul');
      judulSelect.innerHTML = '<option value="">Memuat...</option>';
      gas.withSuccessHandler((resStok) => {
        const stokData = resStok?.data || [];
        judulSelect.innerHTML = '<option value="">Pilih Judul Buku</option>';
        const uniqueTitles = [...new Set(stokData.map((s) => s.judul))].sort();
        if (p.judul && !uniqueTitles.includes(p.judul)) uniqueTitles.unshift(p.judul);
        uniqueTitles.forEach((judul) => {
          const el = document.createElement('option');
          el.value = judul;
          el.textContent = judul;
          if (judul === p.judul) el.selected = true;
          judulSelect.appendChild(el);
        });
      }).getStokData();
      document.getElementById('pnj_marketplace').value = p.marketplace;
      document.getElementById('pnj_gudang').value = p.gudang;
      document.getElementById('pnj_qty').value = p.qty;
      document.getElementById('pnj_harga').value = p.hargaJual;
      document.getElementById('pnj_tanggal').value = p.tanggal;
      openModal('modalPenjualan');
    }
  }).getPenjualanData();
}
function deletePenjualanItem(id) {Swal.fire({ title: 'Hapus Penjualan?', text: 'Data penjualan akan dihapus dan stok akan dikembalikan otomatis.', icon: 'warning', showCancelButton: true }).then((r) => {if (r.isConfirmed) gas.withSuccessHandler(() => loadPenjualanMarketplace()).deletePenjualan(id);});}
function handleSavePenjualan(e) {
  e.preventDefault();
  const judul = document.getElementById('pnj_judul').value;
  const qty = Number(document.getElementById('pnj_qty').value);
  const isEdit = !!document.getElementById('pnj_id').value;
  if (!isEdit && window._stokDataCache) {
    const gudang = document.getElementById('pnj_gudang').value;
    const stokInfoGudang = window._stokDataCache.filter((s) => s.judul === judul && s.gudang === gudang);
    const stokGudang = stokInfoGudang.reduce((a, s) => a + Number(s.stok || 0), 0);
    if (stokGudang <= 0) {
      Swal.fire('Stok Habis di Gudang ' + gudang + '!', 'Buku ini tidak memiliki stok di gudang ' + gudang + '. Silakan pilih gudang lain atau update stok terlebih dahulu.', 'warning');
      return;
    }
    if (qty > stokGudang) {
      Swal.fire('Stok Tidak Cukup!', 'Jumlah penjualan (' + qty + ') melebihi stok di gudang ' + gudang + ' (' + stokGudang + '). Silakan kurangi jumlah atau update stok.', 'warning');
      return;
    }
  }
  const payload = { id: document.getElementById('pnj_id').value, judul: judul, marketplace: document.getElementById('pnj_marketplace').value, gudang: document.getElementById('pnj_gudang').value, qty: qty, hargaJual: Number(document.getElementById('pnj_harga').value), tanggal: document.getElementById('pnj_tanggal').value };
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {closeModal('modalPenjualan');loadPenjualanMarketplace();Swal.fire('Tersimpan!', 'Data penjualan berhasil dicatat.', 'success');}).withFailureHandler((error) => {
    showServerError('Gagal Menyimpan Penjualan', error);
  }).savePenjualanData(payload);
}

// --- DOWNLOAD & CLEAR KPI/TARGET ---
function downloadKPIExcel() {
  gas.withSuccessHandler((resUsers) => {
    gas.withSuccessHandler((resTarget) => {
      gas.withSuccessHandler((resKPI) => {
        gas.withSuccessHandler((resDeal) => {
          const users = (resUsers?.data || []).filter((u) => ['cs', 'editor', 'layouter', 'pic_editor', 'pic_layouter', 'admin', 'css', 'admin_marketplace', 'campaign'].includes(u.role));
          const targets = resTarget?.data || [];
          const allKPI = resKPI?.data || [];
          const allDeal = resDeal?.data || [];
          const currentMonth = new Date().toISOString().slice(0, 7);
          const namaBulan = new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' });

          // Sheet 1: Rekap KPI & Target per Pegawai
          const rekapRows = users.map((usr) => {
            const t = targets.find((x) => x.username === usr.username) || { targetTerbit: 0, targetCetak: 0, targetOmzet: 0, targetKata: 0, targetHalaman: 0 };
            const myKPI = allKPI.filter((k) => k.picName === usr.nama && String(k.tanggal || '').startsWith(currentMonth));
            const myDeals = allDeal.filter((d) => d.csName === usr.nama && String(d.deadline || d.tanggal || '').startsWith(currentMonth));
            let capaian = myKPI.length + ' item';
            let targetUtama = t.targetTerbit;
            let satuan = 'Item';
            let targetDetail = '-';
            if (usr.role === 'editor' || usr.role === 'pic_editor') {const mainKPI = myKPI.filter((k) => !isRevisiKPI(k));const total = mainKPI.reduce((a, b) => a + Number(b.jumlahKata || 0), 0);capaian = total + ' Kata / ' + mainKPI.length + ' Judul';satuan = 'Kata';targetUtama = t.targetKata;} else
            if (usr.role === 'layouter' || usr.role === 'pic_layouter') {const mainKPI = myKPI.filter((k) => !isRevisiKPI(k));const total = mainKPI.reduce((a, b) => {let v = Number(b.jumlahHalaman || 0);if (b.qualityControl) {v *= 1 - Number(b.qualityControl) * 0.1;}return a + v;}, 0);capaian = total + ' Hal / ' + mainKPI.length + ' Judul';satuan = 'Halaman';targetUtama = t.targetHalaman;} else
            if (usr.role === 'cs') {satuan = 'Deal';capaian = myDeals.length + ' Deal';} else
            if (['admin', 'css', 'admin_marketplace', 'campaign'].includes(usr.role)) {
              const perJenis = t.targetPerJenis || {};
              const jenisKeys = Object.keys(perJenis);
              if (jenisKeys.length > 0) {
                targetDetail = jenisKeys.map((j) => "".concat(j, ": ").concat(perJenis[j])).join(' | ');
                const parts = jenisKeys.map((j) => {
                  const achieved = myKPI.filter((k) => k.jenis === j).reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
                  return "".concat(j, ": ").concat(achieved, "/").concat(perJenis[j]);
                });
                capaian = parts.join(' | ');
                targetUtama = jenisKeys.reduce((a, j) => a + (perJenis[j] || 0), 0);
              } else {
                const total = myKPI.reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
                capaian = total + ' Nilai / ' + myKPI.length + ' Item';
              }
              satuan = 'Kinerja';
            }
            return {
              'Nama': usr.nama, 'Role': usr.role.toUpperCase(),
              'Target Naskah/Item': t.targetTerbit,
              'Target Cetak': usr.role === 'cs' ? t.targetCetak : '-',
              'Target Omzet': usr.role === 'cs' ? t.targetOmzet : '-',
              'Target Kata': usr.role === 'editor' || usr.role === 'pic_editor' ? t.targetKata : '-',
              'Target Halaman': usr.role === 'layouter' || usr.role === 'pic_layouter' ? t.targetHalaman : '-',
              'Target Per Jenis': targetDetail,
              'Capaian Bulan Ini': capaian
            };
          });

          // Sheet 2: Detail KPI Individu
          const detailRows = allKPI.filter((k) => String(k.tanggal || '').startsWith(currentMonth)).map((k) => ({
            'Tanggal': k.tanggal, 'Nama PIC': k.picName, 'Jenis KPI': k.jenis,
            'Judul Naskah': k.judul,
            'Jumlah Kata': k.jumlahKata || '-',
            'Jumlah Halaman': k.jumlahHalaman || '-',
            'Nilai Kinerja': k.jumlahKinerja || '-'
          }));

          // Sheet 3: Data Deal CS
          const dealRows = allDeal.filter((d) => String(d.deadline || d.tanggal || '').startsWith(currentMonth)).map((d) => ({
            'CS': d.csName, 'Penulis': d.penulis, 'Judul': d.judul,
            'Penerbit': d.penerbit, 'Paket': d.paket,
            'Nilai Deal': d.nilai, 'Status Bayar': d.statusPayment,
            'Nominal DP': d.nominalDP || 0, 'Deadline': d.deadline,
            'Catatan': d.catatan || '-'
          }));

          const wb = XLSX.utils.book_new();
          const ws1 = XLSX.utils.json_to_sheet(rekapRows);
          const ws2 = XLSX.utils.json_to_sheet(detailRows.length > 0 ? detailRows : [{ 'Info': 'Belum ada data KPI bulan ini' }]);
          const ws3 = XLSX.utils.json_to_sheet(dealRows.length > 0 ? dealRows : [{ 'Info': 'Belum ada data deal bulan ini' }]);
          XLSX.utils.book_append_sheet(wb, ws1, 'Rekap KPI & Target');
          XLSX.utils.book_append_sheet(wb, ws2, 'Detail KPI');
          XLSX.utils.book_append_sheet(wb, ws3, 'Data Deal CS');
          XLSX.writeFile(wb, "KPI_Target_".concat(currentMonth, ".xlsx"));
          Swal.fire('Berhasil!', "File Excel periode <b>".concat(namaBulan, "</b> berhasil diunduh (3 sheet)."), 'success');
        }).getDealData();
      }).getKPIData();
    }).getTargetData();
  }).getUsersData();
}

    showCancelButton: true,
    confirmButtonColor: '#ef4444',
    confirmButtonText: '<i class="fa-solid fa-paper-plane mr-1"></i> Ajukan ke Manajemen',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const alasan = document.getElementById('del_catatan').value.trim();

        penulis: naskah.penulis,

      }).saveDeleteRequest(payload);

  });

      gas.withSuccessHandler(() => {
        loadApprovalHapusNaskah();
        Swal.fire('Ditolak', 'Permintaan hapus ditolak. Naskah tetap di sistem.', 'info');
      }).rejectDeleteRequest(reqId);
    }
  });
}

  const rows = document.querySelectorAll('#stokTbody tr.stok-row');
  let visibleCount = 0;

  rows.forEach((row) => {
    const matchSearch = row.getAttribute('data-judul').includes(search);
    const matchGudang = gudang === '' || row.getAttribute('data-gudang') === gudang;

    if (matchSearch && matchGudang) {
      row.style.display = '';
      visibleCount++;
    } else {
      row.style.display = 'none';
    }
  });

  // Handle no data row
  let noDataRow = document.querySelector('#stokTbody tr.no-data-filter');
  if (visibleCount === 0 && rows.length > 0) {

      noDataRow = document.createElement('tr');

      document.getElementById('stokTbody').appendChild(noDataRow);
    }
    noDataRow.style.display = '';
  } else if (noDataRow) {
    noDataRow.style.display = 'none';
  }
}

function updateMarketplaceCalculatorResult() {
  const settings = window._marketplaceCalcSettings || {};
  const sizes = settings.sizes || [];

  const pages = Number(document.getElementById('mp_calc_pages')?.value || 0);
  const adminPercent = Number(document.getElementById('mp_calc_admin')?.value || settings.adminPercent || 0);
  const rounding = Math.max(1, Number(document.getElementById('mp_calc_rounding')?.value || settings.rounding || 1000));
  const printCost = pages * Number(size.perPage || 0) + Number(size.fixedCost || 0);
  const basePrice = printCost * Number(size.multiplier || 1);
  const adminValue = basePrice * adminPercent / 100;
  const finalPrice = Math.ceil((basePrice + adminValue) / rounding) * rounding;
  const result = document.getElementById('mp_calc_result');
  const detail = document.getElementById('mp_calc_detail');
  if (result) result.textContent = 'Rp ' + Number(finalPrice || 0).toLocaleString('id-ID');

  ].join('<br>');
}

function saveMarketplaceCalcSettings() {
  const adminPercent = document.getElementById('calc_admin_percent');
  const rounding = document.getElementById('calc_rounding');
  if (!adminPercent || !rounding) return;

  const payload = {
    adminPercent: Number(adminPercent.value || 0),
    rounding: Number(rounding.value || 1000),
    sizes: []
  };

  const sizeInputs = document.querySelectorAll('[id^="calc_size_label_"]');
  let hasError = false;

  sizeInputs.forEach((input, idx) => {
    const label = input.value.trim();
    const perPage = Number(document.getElementById("calc_size_perpage_".concat(idx))?.value || 0);
    const fixedCost = Number(document.getElementById("calc_size_fixed_".concat(idx))?.value || 0);
    const multiplier = Number(document.getElementById("calc_size_multiplier_".concat(idx))?.value || 1);

    if (!label) hasError = true;
    payload.sizes.push({
      id: label.replace(/\s+/g, '_').toUpperCase(),
      label: label,
      perPage: perPage,
      fixedCost: fixedCost,
      multiplier: multiplier
    });
  });

  if (hasError) {
    Swal.fire('Data Tidak Lengkap', 'Nama ukuran buku tidak boleh kosong.', 'warning');
    return;
  }

  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  gas.withSuccessHandler((res) => {
    if (!res || res.success === false) {
      Swal.fire('Gagal', res?.message || 'Gagal menyimpan pengaturan kalkulator.', 'error');
      return;
    }
    Swal.fire('Tersimpan', 'Pengaturan kalkulator marketplace berhasil diperbarui.', 'success');
    loadMarketplaceCalculatorSettings();
  }).withFailureHandler((error) => showServerError('Gagal Menyimpan', error)).saveMarketplaceCalculatorSettings(payload);
}
