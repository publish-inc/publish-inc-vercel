function toggleDPField(val) {

  if (val === 'DP') {

    input.required = false;

}

function populatePenerbitDropdown(selectId, selectedValue, callback) {
  const select = document.getElementById(selectId);
  if (!select) return;
  select.innerHTML = '<option value=">Memuat penerbit...</option>';
  google.script.run.
  withSuccessHandler(function (res) {
    select.innerHTML = '<option value=">Pilih Penerbit</option>';
    (res && res.data && res.data.penerbit || []).forEach(function (p) {
      const option = document.createElement('option');
      option.value = p.nama;
      option.textContent = p.nama;
      if (p.nama === selectedValue) option.selected = true;
      select.appendChild(option);
    });
    if (callback) callback();
  }).
  withFailureHandler(function () {
    select.innerHTML = '<option value=">Gagal memuat penerbit</option>';
  }).
  getSettingsData();
}

function updatePaketDropdown(penerbitId, paketId, selectedValue, callback) {
  const penerbitEl = document.getElementById(penerbitId);
  const paketSelect = document.getElementById(paketId);
  if (!penerbitEl || !paketSelect) return;
  const penerbitNama = penerbitEl.value;
  paketSelect.innerHTML = '<option value=">Memuat paket...</option>';
  google.script.run.
  withSuccessHandler(function (res) {
    paketSelect.innerHTML = '<option value=">Pilih Paket</option>';
    const rows = res && res.data && res.data.penerbit || [];
    const pub = rows.find(function (p) {return p.nama === penerbitNama;});
    if (pub && pub.paket) {
      pub.paket.forEach(function (p) {
        const option = document.createElement('option');
        option.value = p;
        option.textContent = p;
        if (p === selectedValue) option.selected = true;
        paketSelect.appendChild(option);
      });
    } else {
      paketSelect.innerHTML = '<option value=">Pilih Penerbit Dulu</option>';
    }
    if (callback) callback();
  }).
  withFailureHandler(function () {
    paketSelect.innerHTML = '<option value=">Gagal memuat paket</option>';
  }).
  getSettingsData();
}

function formatDealDateCore(date) {
  const yyyy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return yyyy + '-' + mm + '-' + dd;
}

function getDefaultDealDeadlineSettingsCore() {
  return [
  { id: 'DL-EXCLUSIVE', penerbit: 'Nasmedia', paket: 'Exclusive', totalHari: 14, selesai: 14 },
  { id: 'DL-EXPRESS', penerbit: 'Nasmedia', paket: 'Express', totalHari: 21, selesai: 21 },
  { id: 'DL-ADVANCE', penerbit: 'Nasmedia', paket: 'Advance', totalHari: 30, selesai: 30 },
  { id: 'DL-IDEBUKU-DEFAULT', penerbit: 'Idebuku', paket: '', totalHari: 30, selesai: 30 },
  { id: 'DL-IDEBUKU-VIP', penerbit: 'Idebuku', paket: 'VIP', totalHari: 21, selesai: 21 },
  { id: 'DL-IDEBUKU-VVIP', penerbit: 'Idebuku', paket: 'VVIP', totalHari: 14, selesai: 14 }];

}

function normalizeDealPublisherKeyCore(penerbit) {
  const compact = String(penerbit || '').trim().toLowerCase().replace(/\s+/g, '');
  if (compact === 'idebuku') return 'idebuku';
  return String(penerbit || '').trim().toLowerCase();
}

function findDealDeadlineSettingCore(rows, penerbit, paket) {
  const pub = normalizeDealPublisherKeyCore(penerbit);
  const pkg = String(paket || '').trim().toLowerCase();
  return (rows || []).find(function (row) {
    return String(row.paket || '').trim().toLowerCase() === pkg &&
    normalizeDealPublisherKeyCore(row.penerbit) === pub;
  }) || (rows || []).find(function (row) {
    return String(row.paket || '').trim().toLowerCase() === pkg &&
    !String(row.penerbit || '').trim();
  }) || (rows || []).find(function (row) {
    return !String(row.paket || '').trim() &&
    String(row.penerbit || '').trim().toLowerCase() === pub;
  }) || null;
}

function addDealBusinessDaysCore(startText, days, holidayMap) {
  const date = startText ? new Date(startText + 'T00:00:00') : new Date();
  let count = 0;
  const target = Math.max(0, Number(days || 0));
  while (count < target) {
    date.setDate(date.getDate() + 1);
    const day = date.getDay();
    const key = formatDealDateCore(date);
    if (day !== 0 && day !== 6 && !(holidayMap || {})[key]) count++;
  }
  return formatDealDateCore(date);
}

function businessDaysBetweenDealCore(startText, endText, holidayMap) {
  if (!startText || !endText) return 0;
  const start = new Date(startText + 'T00:00:00');
  const end = new Date(endText + 'T00:00:00');
  let count = 0;
  while (start < end) {
    start.setDate(start.getDate() + 1);
    const day = start.getDay();
    const key = formatDealDateCore(start);
    if (day !== 0 && day !== 6 && !(holidayMap || {})[key]) count++;
  }
  return Math.max(0, count);
}

function updateDealDeadlineFromPackage() {
  const penerbit = document.getElementById('deal_penerbit')?.value || '';
  const paket = document.getElementById('deal_paket')?.value || '';
  const acceleration = document.getElementById('deal_percepatan_proses')?.value || '';
  const deadline = document.getElementById('deal_deadline');
  const hint = document.getElementById('deal_deadline_hint');
  if (!deadline) return;
  if (!penerbit || !paket) {
    deadline.value = '';
    deadline.removeAttribute('min');
    if (hint) hint.textContent = 'Pilih penerbit dan paket terlebih dahulu.';
    return;
  }
  const runner = typeof google !== 'undefined' && google.script && google.script.run ? google.script.run : null;
  const apply = function (settingsRows, holidayRows) {
    const rows = settingsRows && settingsRows.length ? settingsRows : getDefaultDealDeadlineSettingsCore();
    const isIdebuku = normalizeDealPublisherKeyCore(penerbit) === 'idebuku';
    const accelerationKey = String(acceleration || '').trim().toUpperCase();
    const setting = isIdebuku && (accelerationKey === 'VIP' || accelerationKey === 'VVIP') ?
      findDealDeadlineSettingCore(rows, 'Idebuku', accelerationKey) || findDealDeadlineSettingCore(rows, penerbit, paket) :
      findDealDeadlineSettingCore(rows, penerbit, paket);
    if (!setting) {
      if (hint) hint.textContent = 'Belum ada pengaturan deadline untuk paket ini.';
      return;
    }
    const holidays = {};
    (holidayRows || []).forEach(function (row) {
      const dateText = String(row && row.tanggal || '').substring(0, 10);
      if (dateText && String(row.active || '1') !== '0') holidays[dateText] = true;
    });
    const total = Number(setting.totalHari || setting.selesai || 0);
    const today = formatDealDateCore(new Date());
    const minDate = addDealBusinessDaysCore(today, total, holidays);
    deadline.min = minDate;
    if (!deadline.value || businessDaysBetweenDealCore(today, deadline.value, holidays) < total) deadline.value = minDate;
    if (hint) hint.textContent = accelerationKey && isIdebuku ?
      accelerationKey + ' Idebuku: minimal ' + total + ' hari kerja (' + minDate + ').' :
      'Standar paket ' + paket + ': minimal ' + total + ' hari kerja (' + minDate + ').';
  };
  if (!runner) {
    apply(getDefaultDealDeadlineSettingsCore(), []);
    return;
  }
  runner.withSuccessHandler(function (settingsRes) {
    runner.withSuccessHandler(function (holidayRes) {
      apply(settingsRes && settingsRes.data || [], holidayRes && holidayRes.data || []);
    }).withFailureHandler(function () {
      apply(settingsRes && settingsRes.data || [], []);
    }).getHolidaySettings();
  }).withFailureHandler(function () {
    apply(getDefaultDealDeadlineSettingsCore(), []);
  }).getDeadlineSettings();
}

window.populatePenerbitDropdown = populatePenerbitDropdown;

function escapeDealOption(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
  });
}

function normalizeDealRoleCore(role) {
  return String(role || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
}

function renderDealCssOptionsCore(rows, selectedUsername, label) {
  const select = document.getElementById('deal_assigned_css');
  const hint = document.getElementById('deal_assigned_css_hint');
  if (!select) return;
  const cssRows = (rows || []).filter(function (u) {return normalizeDealRoleCore(u.role) === 'css';});
  if (!cssRows.length) {
    select.disabled = false;
    select.innerHTML = '<option value="">Belum ada akun CSS</option>';
    if (hint) hint.textContent = 'Tidak ada akun dengan role CSS yang terbaca.';
    return;
  }
  select.disabled = false;
  select.innerHTML = '<option value="">Pilih CSS penanggung jawab</option>' + cssRows.map(function (u) {
    const name = u.nama || u.username || '';
    const total = Number(u.total || 0);
    const suffix = u.total == null ? '' : ' (' + total + ' naskah aktif)';
    return '<option value="' + escapeDealOption(u.username || '') + '">' + escapeDealOption(name + suffix) + '</option>';
  }).join('');
  select.value = selectedUsername || '';
  if (hint) hint.textContent = 'Pilih CSS yang akan menerima naskah dari deal ini' + (label ? ' (' + label + ')' : '') + '.';
}

function loadDealCssOptionsCore(selectedUsername) {
  const select = document.getElementById('deal_assigned_css');
  const hint = document.getElementById('deal_assigned_css_hint');
  if (!select) return;
  select.disabled = true;
  select.innerHTML = '<option value="">Memuat daftar CSS...</option>';
  if (hint) hint.textContent = 'Memuat daftar CSS...';
  let done = false;
  const runner = typeof google !== 'undefined' && google.script && google.script.run ? google.script.run : null;
  const render = function (rows, label) {
    if (done) return;
    done = true;
    renderDealCssOptionsCore(rows, selectedUsername || '', label);
  };
  if (!runner && typeof mockUsersDB !== 'undefined' && Array.isArray(mockUsersDB)) {
    renderDealCssOptionsCore(mockUsersDB, selectedUsername || '', 'data lokal sementara');
  }
  if (!runner) return;
  setTimeout(function () {
    if (!done && hint) hint.textContent = 'Masih memuat CSS dari database...';
  }, 1200);
  setTimeout(function () {
    if (!done) {
      done = true;
      select.disabled = false;
      select.innerHTML = '<option value="">Gagal memuat CSS</option>';
      if (hint) hint.textContent = 'Daftar CSS tidak berhasil dimuat dari database. Coba reload halaman.';
    }
  }, 7000);
  runner.withSuccessHandler(function (res) {
    render(res && res.data || [], 'database');
  }).withFailureHandler(function () {
    runner.withSuccessHandler(function (res) {
      render(res && res.data || [], 'users');
    }).withFailureHandler(function () {
      if (!done) render([], '');
    }).getUsersData();
  }).getCssUsersForDeal();
}

function downloadExcelNaskahMigrasi() {
  if (typeof XLSX === 'undefined') {
    Swal.fire('Gagal', 'Library Excel belum siap. Reload halaman lalu coba lagi.', 'error');
    return;
  }
  const parseDelays = (value) => {
    if (!value) return {};
    if (typeof value === 'object' && !Array.isArray(value)) return value;
    try {
      const parsed = JSON.parse(value);
      return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
    } catch (error) {
      return {};
    }
  };
  const stages = [
  ['administrasi', 'Administrasi'],
  ['proofreading', 'Proofreading'],
  ['layout', 'Layout'],
  ['isbn', 'ISBN'],
  ['produksi', 'Produksi'],
  ['distribusi', 'Distribusi']];

  const delayFields = (n) => {
    const delays = parseDelays(n.trackingDelays);
    const flatRows = [];
    stages.forEach(([key, label]) => {
      const rows = Array.isArray(delays[key]) ? delays[key] : delays[key] ? [delays[key]] : [];
      rows.forEach((row) => flatRows.push({ key, label, ...row }));
    });
    const fields = {
      'Total Hari Mundur': flatRows.reduce((sum, row) => sum + Number(row.days || 0), 0),
      'Ringkasan Kemunduran Timeline': flatRows.map((row) => "".concat(row.label, ": ").concat(Number(row.days || 0), " hari - ").concat(row.reason || row.reasonCode || 'Estimasi tahapan membutuhkan penyesuaian.').concat(row.note ? ' (' + row.note + ')' : '')).join('\n')
    };
    stages.forEach(([key, label]) => {
      const rows = flatRows.filter((row) => row.key === key);
      fields["Hari Mundur ".concat(label)] = rows.reduce((sum, row) => sum + Number(row.days || 0), 0) || '';
      fields["Kode Alasan Kemunduran ".concat(label)] = rows.map((row) => row.reasonCode || '').filter(Boolean).join('\n');
      fields["Alasan Kemunduran ".concat(label)] = rows.map((row) => row.reason || row.reasonCode || '').filter(Boolean).join('\n');
      fields["Catatan Kemunduran ".concat(label)] = rows.map((row) => row.note || '').filter(Boolean).join('\n');
    });
    return fields;
  };
  const buildWorkbook = (rows) => {
    const dataExcel = rows.map((n, idx) => {
      const deadlines = n.deadlines || {};
      const baseDeadlines = n.baseDeadlines || {};
      const source = n.source === 'cs' || n.dealId ? 'Input CS' : 'Migrasi Manajemen';
      return {
        'No': idx + 1,
        'Kode Tracking': n.trackingCode || '',
        'Judul Naskah': n.judul || '',
        'Penulis': n.penulis || '',
        'No HP Penulis': n.noHpPenulis || '',
        'Kota Asal': n.kotaAsal || '',
        'Sumber': source,
        'CS': n.cs || '',
        'CSS': n.assignedCssName || n.assignedCssUsername || '',
        'Penerbit': n.penerbit || '',
        'Paket': n.paket || '',
        'Ukuran': n.ukuran || '',
        'Tanggal Masuk': n.tanggal || '',
        'Tahap Saat Ini': n.timeline || '',
        'Butuh Proofreading': String(n.butuhProofreading || '1') === '0' ? 'Tidak' : 'Ya',
        'PIC Editor': n.picEditor || '',
        'Status Editor': n.statusEditor || '',
        'PIC Layouter': n.picLayouter || '',
        'Status Layout': n.statusLayouter || '',
        'Status ISBN': n.statusIsbn || '',
        'Estimasi Halaman': Number(n.estimasiHalaman || 0),
        'Estimasi Kata': Number(n.estimasiKata || 0),
        'Deadline Proofreading': deadlines.proofreading || baseDeadlines.proofreading || '',
        'Deadline Layout': deadlines.layout || baseDeadlines.layout || '',
        'Deadline ISBN': deadlines.isbn || baseDeadlines.isbn || '',
        'Deadline Produksi': deadlines.produksi || baseDeadlines.produksi || '',
        'Deadline Distribusi': deadlines.distribusi || baseDeadlines.distribusi || '',
        'Deadline Selesai': deadlines.selesai || baseDeadlines.selesai || '',
        ...delayFields(n),
        'Catatan CS': n.catatanCS || n.catatan || ''
      };
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(dataExcel);
    ws['!cols'] = Object.keys(dataExcel[0] || {}).map((key) => /Judul|Ringkasan|Alasan|Catatan/i.test(key) ? { wch: 34 } : { wch: 18 });
    XLSX.utils.book_append_sheet(wb, ws, 'Naskah Berjalan');
    XLSX.writeFile(wb, 'Naskah_Berjalan_' + new Date().toISOString().split('T')[0] + '.xlsx');
  };
  const cached = Array.isArray(window._naskahMigrasiExportData) ? window._naskahMigrasiExportData : [];
  if (cached.length) {
    buildWorkbook(cached);
    return;
  }
  if (!gas || !gas.getNaskahData) {
    Swal.fire('Data Belum Siap', 'Data Naskah Berjalan belum termuat. Muat ulang halaman lalu coba kembali.', 'info');
    return;
  }
  Swal.fire({ title: 'Menyiapkan Excel...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  gas.withSuccessHandler((res) => {
    const rows = (res?.data || []).filter((n) => (n.statusProses === 'Siap Proses' || !n.statusProses || n.source === 'migrasi') && !(typeof isNaskahCancelled === 'function' && isNaskahCancelled(n)) && (n.source === 'migrasi' || n.dealId || n.source === 'cs' || n.cs === 'Migrasi Manajemen'));
    if (!rows.length) {
      Swal.fire('Belum Ada Data', 'Tidak ada data Naskah Berjalan untuk diunduh.', 'info');
      return;
    }
    Swal.close();
    buildWorkbook(rows);
  }).withFailureHandler((error) => {
    showServerError ? showServerError('Gagal Mengunduh Excel', error) : Swal.fire('Gagal', String(error), 'error');
  }).getNaskahData();
}
window.downloadExcelNaskahMigrasi = window.downloadExcelNaskahMigrasi || downloadExcelNaskahMigrasi;

}

// --- MOCK API YANG THREAD-SAFE ---
function createMockGas(sc, fc) {
  return {
    withSuccessHandler: function (newSc) {return createMockGas(newSc, fc);},
    withFailureHandler: function (newFc) {return createMockGas(sc, newFc);},

    loginAuth: (u, p) => setTimeout(() => {
      const username = String(u || '').trim().toLowerCase();
      if (String(p || '') === '') {
        if (sc) sc({ success: false, message: 'Password wajib diisi!' });
        return;
      }
      const user = mockUsersDB.find((x) => String(x.username || '').trim().toLowerCase() === username && x.password === p);
      if (user) {
        const userRole = normalizeRole(user.role);
        if (userRole === 'karyawan') {
          if (sc) sc({ success: false, message: 'Data karyawan ini hanya digunakan untuk kehadiran dan tidak memiliki akses portal.' });
          return;
        }
        const needsProfileSetup = !['manajemen', 'pimpinan', 'report', 'hrd'].includes(userRole) && String(user.profileComplete || '') !== '1';
        if (sc) sc({ success: true, data: { ...user, role: userRole, needsProfileSetup } });
      } else {
        if (sc) sc({ success: false, message: 'Username atau password salah!' });
      }
    }, 100),
    getUsersData: () => setTimeout(() => {if (sc) sc({ success: true, data: [...mockUsersDB] });}, 100),
    completeEmployeeProfile: (p) => {

function coreCopyTextSafe(value, successTitle, manualTitle, btn) {
  const text = String(value || '');
  const onSuccess = () => {
    Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: successTitle, showConfirmButton: false, timer: 2000 });
    if (btn) {
      btn.innerHTML = '<i class="fa-solid fa-check text-emerald-500 mr-1"></i>Tersalin';
      setTimeout(() => { btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML; btn.disabled = false; }, 2000);
    }
  };
  const onFallback = () => {
    if (btn) {
      btn.innerHTML = btn.dataset.originalHtml || btn.innerHTML;
      btn.disabled = false;
    }
    coreShowManualCopyDialog(manualTitle, text);
  };
  try {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      return navigator.clipboard.writeText(text).then(onSuccess).catch(onFallback);
    }
  } catch (error) {}
  try {
    const input = document.createElement('textarea');
    input.value = text;
    input.setAttribute('readonly', '');
    input.style.position = 'fixed';
    input.style.left = '-9999px';
    document.body.appendChild(input);
    input.select();
    const copied = document.execCommand && document.execCommand('copy');
    input.remove();
    if (copied) {
      onSuccess();
      return Promise.resolve(true);
    }
  } catch (error) {}
  onFallback();
  return Promise.resolve(false);
}

function checkDatabaseCleanupAlerts() {
  if (!state.user) return;
  const role = normalizeRole(state.user.role);
  if (!['manajemen', 'admin'].includes(role)) return;
  if (window._databaseCleanupAlertChecked) return;
  window._databaseCleanupAlertChecked = true;

  gas.withSuccessHandler((res) => {
    if (!res || !res.success || !res.data) return;
    const { surat, archive, kehadiran } = res.data;
    const queue = [];
    
    if (kehadiran.needsBackup && !kehadiran.approved) {
      queue.push({
        title: '⚠️ Backup Data Kehadiran',
        text: `Terdapat ${kehadiran.count} data Kehadiran Karyawan yang berusia lebih dari 3 bulan dan akan segera dibersihkan. Silakan unduh/download data kehadiran terlebih dahulu dari menu Kehadiran. Apakah Anda menyetujui pembersihan data lama ini?`,
        type: 'kehadiran'
      });
    }
    
    if (archive.needsBackup && !archive.approved) {
      queue.push({
        title: '⚠️ Backup Data Arsip',
        text: `Terdapat ${archive.count} data arsip (Naskah, Deal, KPI) yang berusia lebih dari 3 bulan dan akan segera dibersihkan. Silakan unduh/download data arsip terlebih dahulu. Apakah Anda menyetujui pembersihan data lama ini?`,
        type: 'archive'
      });
    }
    
    if (surat.needsBackup && !surat.approved) {
      queue.push({
        title: '⚠️ Backup Data Nomor Surat',
        text: `Data nomor surat tahun ini perlu dibersihkan untuk menyambut tahun baru. Silakan unduh/download data surat tahun berjalan melalui menu Administrasi terlebih dahulu. Apakah Anda menyetujui pembersihan data tahun berjalan ini?`,
        type: 'surat'
      });
    }
    
    if (queue.length > 0) {
      processCleanupAlertQueue(queue);
    }
  }).getDatabaseCleanupStatus();
}

function processCleanupAlertQueue(queue) {
  if (queue.length === 0) return;
  const alert = queue.shift();
  
  Swal.fire({
    title: alert.title,
    text: alert.text,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Setujui Pembersihan',
    cancelButtonText: 'Tunda (Ingatkan Nanti)',
    confirmButtonColor: '#FF6B35',
    cancelButtonColor: '#94a3b8',
    allowOutsideClick: false,
    allowEscapeKey: false
  }).then((result) => {
    if (result.isConfirmed) {
      gas.withSuccessHandler((res) => {
        Swal.fire('Disetujui', 'Pembersihan data telah dijadwalkan dan disetujui.', 'success')
          .then(() => {
            processCleanupAlertQueue(queue);
          });
      }).approveDatabaseCleanup(alert.type, true);
    } else {
      window._databaseCleanupAlertChecked = false;
    }
  });
}

function setupDataViewEnhancer() {
  if (state.activeTab === 'laporan') return;
  if (['detail_deal_cs', 'detail_tim_kreatif', 'detail_tim_non_target', 'detail_capaian_saya', 'kalender_konten_report'].includes(state.activeTab)) return;
  if (typeof MutationObserver === 'undefined') {
    setTimeout(enhanceDataViews, 300);
    return;
  }
  if (window._dataViewObserver) window._dataViewObserver.disconnect();
  const area = document.getElementById('contentArea');
  if (!area) return;
  const run = () => {
    clearTimeout(window._dataViewEnhanceTimer);
    window._dataViewEnhanceTimer = setTimeout(enhanceDataViews, 80);
  };
  window._dataViewObserver = new MutationObserver(run);
  window._dataViewObserver.observe(area, { childList: true, subtree: true });
  run();
}

function enhanceDataViews() {
  // Global data-view enhancer disabled; keep page-specific tables and reports untouched.
  return;
  const area = document.getElementById('contentArea');
  if (state.activeTab === 'laporan' || area && area.classList && area.classList.contains('report-page')) return;
  if (['detail_deal_cs', 'detail_tim_kreatif', 'detail_tim_non_target', 'detail_capaian_saya', 'kalender_konten_report'].includes(state.activeTab)) return;
  if (state.activeTab === 'dashboard_kpi' && ['editor', 'layouter'].includes(state.user?.role)) return;
  if (!area || area.dataset.enhancing === '1') return;
  area.dataset.enhancing = '1';
  try {
    const tables = [...area.querySelectorAll('table')].filter((table) =>
    !table.dataset.dataDashboardEnhanced &&
    !table.closest('.swal2-popup') &&
    !table.closest('.report-display-screen') &&
    !table.closest('.data-dashboard-shell')
    );

    tables.forEach((table, idx) => {
      const tableWrap = table.closest('.overflow-x-auto') || table.parentElement;
      if (!tableWrap || tableWrap.closest('.data-dashboard-shell')) return;
      const panel = tableWrap.closest('.bg-white') || tableWrap;
      if (!panel || panel.closest('.data-dashboard-shell')) return;

      const rows = [...table.querySelectorAll('tbody tr')].filter((row) => row.querySelectorAll('td').length > 0);
      const visibleRows = rows.filter((row) => !/belum ada|tidak ada/i.test(row.innerText || ''));
      const headers = [...table.querySelectorAll('thead th')].map((th) => th.innerText.trim()).filter(Boolean);
      if (visibleRows.length === 0 && headers.length === 0) return;

      table.dataset.dataDashboardEnhanced = '1';
      const title = panel.querySelector('h3')?.innerText?.trim() ||
      document.querySelector('header h2')?.innerText?.trim() ||
      'Data';
      const skipMobileCsInputExport = state.user?.role === 'cs' &&
      ['kelola_deal', 'input_cetak', 'input_lainnya'].includes(state.activeTab) &&
      typeof window !== 'undefined' &&
      window.matchMedia &&
      window.matchMedia('(max-width: 1023px)').matches;
      const skipExport = table.dataset.noExport === 'true' || skipMobileCsInputExport;
      const hasExistingExcelButton = [...area.querySelectorAll('button, a')].some((el) =>
      !el.closest('.data-dashboard-shell') &&
      /(unduh|download|export).*excel|excel/i.test(el.innerText || el.getAttribute('title') || '')
      );
      const firstHeader = headers[0] || 'Data Utama';
      const secondHeader = headers[1] || 'Detail';
      const now = new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
      const cellRows = visibleRows.map((row) => [...row.querySelectorAll('td')].map((td) => td.innerText.replace(/\s+/g, ' ').trim()).filter(Boolean));
      const normalize = (value) => String(value || '').toLowerCase().replace(/\s+/g, ' ').trim();
      const escapeHTML = (value) => String(value ?? '-').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
      const formatSummaryValue = (value) => typeof value === 'number' ? value.toLocaleString('id-ID') : value;
      const headerIndex = (names) => headers.findIndex((header) => names.some((name) => normalize(header).includes(normalize(name))));
      const valuesByHeader = (names) => {
        const foundIndex = headerIndex(names);
        if (foundIndex < 0) return [];
        return cellRows.map((cells) => cells[foundIndex] || '').filter(Boolean);
      };
      const toNumber = (value) => {
        const cleaned = String(value || '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
        return Number(cleaned) || 0;
      };
      const countMap = (values) => values.reduce((acc, value) => {
        const key = String(value || '').trim() || '-';
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});
      const cardsFromMap = (map, icon = 'fa-chart-simple') => Object.entries(map).
      sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).
      slice(0, 3).
      map(([label, value]) => ({ label, value, icon }));
      const cardsByHeader = (names, icon = 'fa-chart-simple', transform = (value) => value) =>
      cardsFromMap(countMap(valuesByHeader(names).map(transform).filter(Boolean)), icon);
      const sumByHeader = (names) => valuesByHeader(names).reduce((sum, value) => sum + toNumber(value), 0);
      const uniqueByHeader = (names) => new Set(valuesByHeader(names).map((value) => value.trim()).filter(Boolean)).size;
      const cardsByText = (labels, icon = 'fa-chart-simple') => labels.map((label) => ({
        label,
        value: cellRows.filter((cells) => normalize(cells.join(' ')).includes(normalize(label))).length,
        icon

        const btn = [...area.querySelectorAll('.campaign-tab-btn')].find((el) => normalize(el.innerText).includes(normalize(label)));
        const match = btn?.innerText?.match(/\d+/);

      const buildSummaryCards = () => {
        const activeTab = state.activeTab;
        const activeRole = state.user?.role;

        if (activeTab === 'kelola_royalti' || activeTab === 'royalti_buku') {
          return [
          { label: 'Judul Buku', value: uniqueByHeader(['Judul Buku', 'Judul']), icon: 'fa-book' },
          { label: 'QTY Terjual', value: sumByHeader(['QTY Terjual', 'Qty Terjual', 'Terjual', 'Qty']), icon: 'fa-cart-shopping' }];

        }
        if (activeTab === 'kelola_jenis_kpi') {
          return [
          { label: 'Total KPI', value: visibleRows.length, icon: 'fa-tags' },
          ...cardsByHeader(['Role', 'Roles'], 'fa-user-tag').slice(0, 2)];

        }
        if (['kelola_deal', 'input_cetak', 'input_lainnya'].includes(activeTab)) {
          return cardsByText(['Full Payment', 'DP'], 'fa-money-check-dollar');
        }
        if (activeTab === 'surat') return cardsByHeader(['Kategori', 'Jenis Surat', 'Jenis'], 'fa-folder-open');
        if (activeTab === 'naskah' && ['pic_editor', 'pic_layouter'].includes(activeRole)) {
          return cardsByHeader(['Penerbit'], 'fa-building', (value) => /nasmedia/i.test(value) ? 'Nasmedia' : 'Lainnya');
        }
        if (activeTab === 'tugas_naskah') return cardsByText(['Menunggu', 'Done', 'Revisi', 'Complete'], 'fa-list-check');
        if (activeTab === 'manajemen_campaign') {
          return [
          { label: 'Campaign', value: campaignTabCount('Campaign'), icon: 'fa-calendar-check' },
          { label: 'Konten', value: campaignTabCount('Content'), icon: 'fa-layer-group' },
          { label: 'Broadcast', value: campaignTabCount('Broadcast'), icon: 'fa-bullhorn' }];

        }
        if (activeTab === 'data_mitra') return cardsByHeader(['Program'], 'fa-handshake');
        if (activeTab === 'level_mitra') return cardsByHeader(['Current Level', 'Level Mitra', 'Level'], 'fa-ranking-star');
        if (activeTab === 'komisi_mitra') return cardsByHeader(['Status Bayar', 'Status'], 'fa-money-bill-wave');
        if (activeTab === 'stok_buku') return cardsByHeader(['Gudang'], 'fa-warehouse');
        if (activeTab === 'penjualan_marketplace') return cardsByHeader(['Marketplace'], 'fa-store');

        const statusWords = ['Alpa', 'Izin', 'Izin Setengah Hari', 'Sakit', 'Terlambat', 'Cuti', 'Hadir', 'Menunggu', 'Selesai', 'Done', 'Complete', 'Revisi', 'On Process', 'Proses', 'Draft', 'Published', 'Upcoming'];
        const statusCards = cardsByText(statusWords, 'fa-chart-simple').filter((card) => card.value > 0).sort((a, b) => b.value - a.value).slice(0, 3);
        if (statusCards.length) return statusCards;
        return [
        { label: 'Total Data', value: visibleRows.length, icon: 'fa-database' },
        { label: 'Kolom', value: headers.length || '-', icon: 'fa-table-columns' },
        { label: 'Update', value: now, icon: 'fa-clock' }];

      };
      const summaryCards = buildSummaryCards().filter(Boolean).slice(0, 3);
      const latestItems = visibleRows.slice(0, 6).map((row) => {
        const cells = [...row.querySelectorAll('td')].map((td) => td.innerText.replace(/\s+/g, ' ').trim()).filter(Boolean);
        return {
          title: cells[0] || '-',
          meta: cells.slice(1, 3).join(' - ') || secondHeader,
          initial: (cells[0] || '?').charAt(0).toUpperCase()
        };
      });

      const shell = document.createElement('div');
      shell.className = 'data-dashboard-shell';
      shell.innerHTML = "\n                        <div class=\"data-dashboard-summary\">\n                            ".concat(

        summaryCards.map((card) => "\n                                <div class=\"data-summary-card\">\n                                    <span class=\"data-summary-icon\"><i class=\"fa-solid ".concat(

          card.icon, "\"></i></span>\n                                    <div><b>").concat(
          escapeHTML(formatSummaryValue(card.value)), "</b><small>").concat(escapeHTML(card.label), "</small></div>\n                                </div>\n                            ")

        ).join(''), "\n                            ").concat(
        hasExistingExcelButton || skipExport ? '' : "<button type=\"button\" class=\"data-export-btn\" data-table-export=\"".concat(idx, "\"><i class=\"fa-solid fa-file-excel\"></i> Excel</button>"), "\n                        </div>\n                        <div class=\"data-dashboard-grid\">\n                            <div class=\"data-table-panel\">\n                                <div class=\"data-panel-head\">\n                                    <div>\n                                        <h3>").concat(





        escapeHTML(title), "</h3>\n                                        <p>").concat(
        escapeHTML(firstHeader), " dan informasi terkait.</p>\n                                    </div>\n                                </div>\n                            </div>\n                            <aside class=\"data-side-panel\">\n                                <div class=\"data-panel-head\">\n                                    <div>\n                                        <h3>Data Terbaru</h3>\n                                        <p>Ringkasan dari tabel aktif.</p>\n                                    </div>\n                                </div>\n                                <div class=\"data-side-list\">\n                                    ").concat(











        latestItems.length ? latestItems.map((item) => "\n                                        <div class=\"data-side-item\">\n                                            <span>".concat(

          escapeHTML(item.initial), "</span>\n                                            <div><b>").concat(
          escapeHTML(item.title), "</b><small>").concat(escapeHTML(item.meta), "</small></div>\n                                        </div>\n                                    ")

        ).join('') : '<div class="data-empty-side">Belum ada data.</div>', "\n                                </div>\n                            </aside>\n                        </div>\n                    ");





      panel.parentNode.insertBefore(shell, panel);
      const tablePanel = shell.querySelector('.data-table-panel');
      tablePanel.appendChild(panel);
      const exportBtn = shell.querySelector('.data-export-btn');
      if (exportBtn) exportBtn.addEventListener('click', () => exportTableToExcel(table, title));
    });
  } finally {
    area.dataset.enhancing = '0';
  }
}

function exportTableToExcel(table, title = 'Data') {
  if (typeof XLSX === 'undefined') {
    Swal.fire('Excel Belum Siap', 'Library Excel belum termuat. Coba muat ulang halaman.', 'warning');
    return;
  }
  const rows = [...table.querySelectorAll('tr')].map((row) =>
  [...row.querySelectorAll('th,td')].map((cell) => cell.innerText.replace(/\s+/g, ' ').trim())
  ).filter((row) => row.some(Boolean));
  if (!rows.length) {
    Swal.fire('Tidak Ada Data', 'Belum ada data yang bisa diunduh.', 'info');
    return;
  }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, 'Data');
  const safeName = String(title || 'Data').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') || 'Data';
  XLSX.writeFile(wb, safeName + '_' + new Date().toISOString().split('T')[0] + '.xlsx');
}

function closeSidebarFlyouts() {
  document.querySelectorAll('.sidebar-nav-group.is-open').forEach((group) => group.classList.remove('is-open'));
}
window.closeSidebarFlyouts = closeSidebarFlyouts;

function positionSidebarFlyout(groupEl) {
  if (!groupEl) return;
  closeSidebarFlyouts();
  const flyout = groupEl.querySelector('.sidebar-nav-flyout');
  if (!flyout) return;
  const rect = groupEl.getBoundingClientRect();
  const viewportHeight = window.innerHeight || document.documentElement.clientHeight || 720;
  const flyoutHeight = Math.min(flyout.scrollHeight || 240, viewportHeight - 24);
  const top = Math.max(12, Math.min(rect.top, viewportHeight - flyoutHeight - 12));
  flyout.style.top = `${top}px`;
  groupEl.classList.add('is-open');
}
window.positionSidebarFlyout = positionSidebarFlyout;

function toggleSidebarFlyout(event, groupEl) {
  event.preventDefault();
  event.stopPropagation();
  if (groupEl && groupEl.classList.contains('is-open')) {
    groupEl.classList.remove('is-open');
    return;
  }
  positionSidebarFlyout(groupEl);
}
window.toggleSidebarFlyout = toggleSidebarFlyout;

function msgEscape(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
}

function getCommunicationUnreadCounts() {
  const counts = { pesan: 0, memo: 0 };
  (state.notifications || []).forEach((n) => {
    if (String(n.deleted || '') === '1' || String(n.status || 'unread') === 'read') return;
    const target = String(n.targetTab || n.type || '').toLowerCase();
    if (target === 'pesan' || target === 'message') counts.pesan += 1;
    if (target === 'memo') counts.memo += 1;
  });
  return counts;
}

function renderCommunicationBadge(id) {
  if (!['pesan', 'memo'].includes(String(id || ''))) return '';
  const count = getCommunicationUnreadCounts()[id] || 0;
  return "<span data-comm-badge=\"".concat(id, "\" class=\"").concat(count ? '' : 'hidden', " ml-auto min-w-[1.15rem] h-[1.15rem] px-1 rounded-full bg-red-500 text-white text-[10px] font-black inline-flex items-center justify-center leading-none\">").concat(count, "</span>");
}

function renderDeadlineNavBadge(id) {
  if (String(id || '') !== 'alert_deadline') return '';
  const count = Array.isArray(state.deadlineAlerts) ? state.deadlineAlerts.length : 0;
  return "<span data-deadline-badge class=\"".concat(count ? '' : 'hidden', " ml-auto min-w-[1.15rem] h-[1.15rem] px-1 rounded-full bg-amber-400 text-slate-950 text-[10px] font-black inline-flex items-center justify-center leading-none\">").concat(count, "</span>");

function renderIntakeNavBadge(id) {

function updateIntakeBadges() {
  const counts = state.intakeCounts || {};
  ['naskah_baru', 'administrasi_naskah'].forEach((id) => {
    const count = Number(counts[id] || 0);
    document.querySelectorAll("[data-intake-badge=\"".concat(id, "\"]")).forEach((el) => {
      el.textContent = count;
      el.classList.toggle('hidden', count === 0);

  if (!state.user) return;
  const role = normalizeRole(state.user.role);
  if (role === 'css') {
    gas.withSuccessHandler((res) => {
      state.intakeCounts = state.intakeCounts || {};

function updateNotificationIndicators() {
  const notifications = state.notifications || [];

    badge.textContent = notifications.length;
    badge.classList.toggle('hidden', notifications.length === 0);

  const counts = getCommunicationUnreadCounts();
  ['pesan', 'memo'].forEach((id) => {
    document.querySelectorAll("[data-comm-badge=\"".concat(id, "\"]")).forEach((el) => {
      const count = counts[id] || 0;
      el.textContent = count;
      el.classList.toggle('hidden', count === 0);

  });
  const deadlineCount = Array.isArray(state.deadlineAlerts) ? state.deadlineAlerts.length : 0;

function requestBrowserNotificationPermission() {
  if (!isBrowserNotificationSupported()) {

  if (Notification.permission === 'granted') {

    return;
  }
  if (Notification.permission === 'denied') {

      return;

}

function showBrowserNotificationOnce(key, options) {
  if (!key || !isBrowserNotificationSupported() || Notification.permission !== 'granted') return;
  window._browserNotificationShown = window._browserNotificationShown || new Set();
  const finalKey = String(key);
  if (window._browserNotificationShown.has(finalKey)) return;
  window._browserNotificationShown.add(finalKey);
  try {
    const notification = new Notification(String(options?.title || 'Portal KPI'), {
      body: String(options?.body || '').slice(0, 180),
      tag: finalKey,
      renotify: false
    });
    notification.onclick = () => {
      window.focus();
      notification.close();
      if (typeof options?.onOpen === 'function') options.onOpen();
    };
    setTimeout(() => notification.close(), 8000);

    console.warn('Browser notification failed', error);
  }
}

}

function refreshNotifications(showError) {

  gas.withSuccessHandler((res) => {

function openMessageNaskah(messageId) {

  const keyword = message.trackingCode || message.judulNaskah || message.naskahId || '';
  const role = normalizeRole(state.user?.role);
  window._skipMessageReloadOnClose = true;

    window._csNaskahSearch = keyword;
    window._csNaskahPage = 1;

  window._progressPage = 1;
  switchTab('progres');

function sendInternalMessageFromForm(event) {
  event.preventDefault();
  const toUsername = document.getElementById('msg_to')?.value || '';
  const naskahText = document.getElementById('msg_naskah_search')?.value || '';
  const normalizedNaskahText = String(naskahText || '').trim().toLowerCase();
  const naskah = (window._messageNaskahOptions || []).find((n) => {
    const optionValue = n.trackingCode ? "".concat(n.trackingCode, " - ").concat(n.judul) : n.judul;
    return [n.judul, n.trackingCode, optionValue, n.id].some((value) => String(value || '').trim().toLowerCase() === normalizedNaskahText);
  }) || {};
  const message = document.getElementById('msg_body')?.value || '';
  const payload = {
    fromUsername: state.user.username,
    fromName: state.user.nama,
    toUsername,
    naskahId: naskah.id || '',
    judulNaskah: naskah.judul || naskahText || '',
    trackingCode: naskah.trackingCode || '',
    message
  };
  gas.withSuccessHandler((res) => {
    if (!res || !res.success) {
      Swal.fire('Gagal', res?.message || res?.error || 'Pesan gagal dikirim.', 'error');
      return;
    }
    Swal.fire('Terkirim', 'Pesan berhasil dikirim.', 'success');
    window._messageTab = 'sent';
    window._openMessageId = res.data?.id || '';
    loadPesan({ silent: true });
  }).withFailureHandler((error) => showServerError('Gagal Mengirim Pesan', error)).sendInternalMessage(payload);
}

function formatMemoDate(value) {
  const text = String(value || '').trim();
  if (!text) return '-';
  const parts = text.split('-');
  if (parts.length === 3) return "".concat(parts[2], "/").concat(parts[1], "/").concat(parts[0]);
  return text;
}

function getTodayInputValue() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function openFormInternalMemo() {
  if (!['manajemen', 'pimpinan'].includes(normalizeRole(state.user?.role))) {
    Swal.fire('Akses Ditolak', 'Memo hanya bisa dibuat oleh manajemen dan pimpinan.', 'warning');

  }
  const today = getTodayInputValue();
  Swal.fire({

    html: "\n                    <style>\n                        .swal2-popup.memo-wide-popup{width:min(96vw,1180px)!important;max-width:min(96vw,1180px)!important}\n                        .swal2-html-container.memo-wide-html{max-width:none!important;width:100%!important;margin:0!important;overflow:visible!important}\n                        .memo-form-wrap{width:100%;max-width:none;margin:0 auto;text-align:left}\n                        .memo-form-note{border:1px solid #dbeafe;background:#eff6ff;border-radius:20px;padding:16px 18px;margin-bottom:20px}\n                        .memo-form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}\n                        .memo-form-field{display:flex;flex-direction:column;gap:8px;min-width:0}\n                        .memo-form-field.full{grid-column:1 / -1}\n                        .memo-form-field.wide{grid-column:span 2}\n                        .memo-form-label{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#94a3b8}\n                        .memo-form-input,.memo-form-textarea{width:100%;box-sizing:border-box;border:1px solid #dbe3ef;border-radius:16px;background:#fff;color:#0f172a;font-weight:800;font-size:14px;outline:none;box-shadow:none;margin:0;padding:0 16px}\n                        .memo-form-input{height:48px}\n                        .memo-form-textarea{min-height:230px;padding:14px 16px;line-height:1.65;resize:vertical}\n                        .memo-form-input:focus,.memo-form-textarea:focus{border-color:#4f63ff;box-shadow:0 0 0 4px rgba(79,99,255,.10)}\n                        @media (max-width:900px){.memo-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.memo-form-field.wide{grid-column:1 / -1}}\n                        @media (max-width:640px){.memo-form-grid{grid-template-columns:1fr}.memo-form-field.wide{grid-column:1 / -1}}\n                    </style>\n                    <div class=\"memo-form-wrap\">\n                        <div class=\"rounded-3xl bg-accent-50 border border-accent-100 p-5\">\n                            <div class=\"text-[10px] font-black text-accent-500 uppercase tracking-widest\">Internal Memo</div>\n                            <div class=\"mt-1 text-sm text-slate-500 font-bold\">Memo akan dikirim ke tim operasional lewat notifikasi internal.</div>\n                        </div>\n                        <div class=\"memo-form-grid\">\n                            <div class=\"memo-form-field\"><span class=\"memo-form-label\">Nomor Memo *</span><input id=\"memo_nomor\" class=\"memo-form-input\" placeholder=\"Contoh: 001/Memo/VI/2026\"></div>\n                            <div class=\"memo-form-field\"><span class=\"memo-form-label\">Tanggal Memo *</span><input id=\"memo_tanggal\" type=\"date\" value=\"".concat(
























      today, "\" class=\"memo-form-input\"></div>\n                            <div class=\"memo-form-field\"><span class=\"memo-form-label\">Tanggal Expired</span><input id=\"memo_expired\" type=\"date\" class=\"memo-form-input\"></div>\n                            <div class=\"memo-form-field full\"><span class=\"memo-form-label\">Link PDF Google Drive</span><input id=\"memo_pdf\" type=\"url\" class=\"memo-form-input\" placeholder=\"Tempel link Google Drive PDF\"></div>\n                            <div class=\"memo-form-field\"><span class=\"memo-form-label\">Nama Pembuat *</span><input id=\"memo_nama\" value=\"").concat(

    width: 'min(96vw, 1180px)',
    customClass: {
      popup: 'memo-wide-popup rounded-[2rem] !p-8',

    },
    showCancelButton: true,
    confirmButtonText: 'Kirim Memo',

    focusConfirm: false,
    preConfirm: () => {

        nomorMemo: document.getElementById('memo_nomor')?.value.trim(),

        expiredAt: document.getElementById('memo_expired')?.value,
        pdfUrl: document.getElementById('memo_pdf')?.value.trim(),
        pembuatNama: document.getElementById('memo_nama')?.value.trim(),
        pembuatJabatan: document.getElementById('memo_jabatan')?.value.trim(),
        isiMemo: document.getElementById('memo_isi')?.value.trim(),
        createdBy: state.user.username
      };
      if (!payload.nomorMemo || !payload.tanggalMemo || !payload.pembuatNama || !payload.pembuatJabatan || !payload.isiMemo) {
        Swal.showValidationMessage('Nomor, tanggal, nama, jabatan, dan isi memo wajib diisi.');
        return false;
      }
      return payload;
    }
  }).then((result) => {
    if (!result.isConfirmed) return;
    gas.withSuccessHandler((res) => {
      if (!res || !res.success) {
        Swal.fire('Gagal', res?.message || res?.error || 'Memo gagal dikirim.', 'error');

function getReportSlideDefinitions() {
  return [
  { key: 'kpi', label: 'Capaian KPI', icon: 'fa-trophy' },
  { key: 'discipline', label: 'Kedisiplinan', icon: 'fa-user-check' },
  { key: 'progress', label: 'Progress Naskah', icon: 'fa-timeline' }];

}

function getReportSlideOptions() {
  const defaults = { kpi: true, discipline: true, progress: true };
  if (window._reportEnabledSlides) return window._reportEnabledSlides;
  try {
    window._reportEnabledSlides = { ...defaults, ...JSON.parse(localStorage.getItem('reportEnabledSlides') || '{}') };
  } catch (e) {
    window._reportEnabledSlides = defaults;
  }
  return window._reportEnabledSlides;
}

function setReportSlideOption(key, enabled) {
  const current = getReportSlideOptions();
  current[key] = !!enabled;
  window._reportEnabledSlides = current;
  try {localStorage.setItem('reportEnabledSlides', JSON.stringify(current));} catch (e) {}
}

function toggleReportSlideOption(key) {
  const options = getReportSlideOptions();
  setReportSlideOption(key, options[key] === false);
  if (typeof loadReportHome === 'function') loadReportHome();else
  renderReportHomeContent();
}

function requestReportFullscreen() {
  const fullscreenTarget = document.documentElement;
  if (fullscreenTarget && fullscreenTarget.requestFullscreen) {
    fullscreenTarget.requestFullscreen().catch(() => {});
  }
}

function startReportDisplay() {
  const options = getReportSlideOptions();
  if (!Object.values(options).some(Boolean)) {
    Swal.fire('Pilih Laporan', 'Aktifkan minimal satu laporan untuk ditampilkan.', 'warning');
    return;
  }
  requestReportFullscreen();
  state.activeTab = 'report_display';
  if (document.getElementById('contentArea')) loadContent();else
  render();
}

function waitForReportDisplay(attempt) {
  const tries = Number(attempt || 0);
  renderReportLoading();
  if (typeof loadReportDisplay === 'function') {
    loadReportDisplay();
    return;
  }
  if (tries >= 30) {
    renderReportHomeContent();
    Swal.fire('Display belum siap', 'Script laporan belum selesai termuat. Reload halaman lalu coba lagi.', 'warning');
    return;
  }
  setTimeout(() => waitForReportDisplay(tries + 1), 150);
}
