        /* === Universal Publisher Row Highlights === */

            background-color: #f3e8ff !important;
        }

        .text-accent-800 { color: var(--accent-800); }

        body {

            background-size: 24px 24px;
            color: #1e293b;
            line-height: 1.5;
        }

        .clip-tracking-stage {
            clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%, 18px 50%);
        }

        .clip-tracking-stage:first-child {
            clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%);
        }

        /* === SIDEBAR COMPACT === */
        aside {
            width: 15rem !important;
            /* 210px instead of 256px */
            padding: 0.75rem !important;
        }

        aside .mb-8 {

        }

        aside .mb-6 {
            margin-bottom: 0.5rem !important;
        }

        aside nav button {
            padding: 0.4rem 0.6rem !important;
            font-size: 0.78rem !important;
        }

        aside nav button i {
            font-size: 0.75rem !important;
        }

        .app-sidebar {
            width: 15.25rem !important;
            padding: 0.7rem !important;
            background: linear-gradient(180deg, #0A2540 0%, #061a2d 100%) !important;
            border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
        }

        .app-sidebar-shell {
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .app-sidebar-brand {
            padding: 0.25rem 0.2rem 0.55rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        .app-sidebar-store {
            padding: 0 0.2rem 0.55rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);

        .app-sidebar-label {

        .app-sidebar-role {

        .app-sidebar-avatar {

            font-size: 1rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .app-sidebar nav button {
            padding: 0.45rem 0.55rem !important;
            font-size: 0.76rem !important;
            color: rgba(255, 255, 255, 0.74) !important;
            border-radius: 0.75rem !important;
        }

        .app-sidebar nav button i {
            font-size: 0.82rem !important;
            color: rgba(255, 255, 255, 0.78);
        }

        .app-sidebar nav button.nav-link-active {
            background: rgba(71, 99, 253, 0.95) !important;
            color: #ffffff !important;
            box-shadow: 0 12px 28px rgba(71, 99, 253, 0.28);
        }

        .app-sidebar nav button.nav-link-active i {
            color: #ffffff;
        }

        .app-sidebar nav .sidebar-nav-group {
            position: relative;
        }

        .app-sidebar nav .sidebar-nav-group-trigger {
            cursor: pointer;
        }

        .app-sidebar nav .sidebar-nav-group.is-open .sidebar-nav-group-trigger .fa-chevron-right,
        .app-sidebar nav .sidebar-nav-group:hover .sidebar-nav-group-trigger .fa-chevron-right,
        .app-sidebar nav .sidebar-nav-group:focus-within .sidebar-nav-group-trigger .fa-chevron-right {
            transform: translateX(2px);
        }

        .sidebar-nav-flyout {
            position: fixed;
            left: 15.1rem;
            top: 1rem;
            z-index: 70;
            width: 15.5rem;
            max-height: calc(100vh - 1.5rem);
            overflow-y: auto;
            padding: 0.5rem;
            border-radius: 0.95rem;
            background: #061b36;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 18px 20px 50px rgba(2, 8, 23, 0.32);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateX(-6px) scale(0.98);
            transition: opacity 0.14s ease, transform 0.14s ease, visibility 0.14s ease;
        }

        .sidebar-nav-group.is-open .sidebar-nav-flyout,
        .sidebar-nav-group:hover .sidebar-nav-flyout,
        .sidebar-nav-group:focus-within .sidebar-nav-flyout {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateX(0) scale(1);
        }

        .sidebar-nav-flyout-title {

        /* === MODERN FORM INPUT UI === */
        [id^="modal"].fixed {
            background: rgba(15, 23, 42, 0.34) !important;
            backdrop-filter: blur(14px);
        }

        [id^="modal"].fixed>div:has(form) {
            width: min(92vw, 58rem) !important;
            max-width: 58rem !important;
            max-height: 90vh;
            display: grid;
            grid-template-columns: 15rem minmax(0, 1fr);
            padding: 0 !important;
            border-radius: 1.5rem !important;
            overflow: hidden;
            background: #ffffff !important;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 28px 80px rgba(15, 23, 42, 0.18);
        }

        [id^="modal"].fixed>div:has(form)::before {
            content: "Form Input";
            white-space: pre-line;
            grid-row: 1 / span 2;
            min-height: 100%;
            padding: 9.25rem 2rem 2.5rem;
            background: linear-gradient(180deg, #FF6B35 0%, #e85a28 100%);
            border-right: 1px solid rgba(71, 99, 253, 0.28);
            color: #ffffff;
            font-weight: 900;
            line-height: 1.22;
            font-size: 0.96rem;
            letter-spacing: 0;
        }

        [id^="modal"].fixed>div:has(form)>h3 {
            grid-column: 2;
            margin: 0 !important;
            padding: 2.4rem 2.6rem 0.8rem !important;
            font-size: 1.35rem !important;
            font-weight: 900 !important;
            color: #0f172a;
        }

        [id^="modal"].fixed>div:has(form)>form {
            grid-column: 2;
            padding: 0 2.6rem 2.3rem;
            overflow-y: auto;
            max-height: calc(90vh - 5.2rem);
        }

        [id^="modal"].fixed>div:has(form) label {
            display: block;
            color: #64748b !important;
            font-size: 0.67rem !important;
            font-weight: 900 !important;
            letter-spacing: 0.08em;
            margin-bottom: 0.45rem;
        }

        [id^="modal"].fixed>div:has(form) input:not([type="hidden"]),
        [id^="modal"].fixed>div:has(form) select,
        [id^="modal"].fixed>div:has(form) textarea {
            width: 100%;
            min-height: 3rem;
            padding: 0.8rem 1rem !important;
            border-radius: 0.85rem !important;
            border: 1px solid #e2e8f0 !important;
            background: #ffffff !important;
            color: #0f172a;
            font-size: 0.88rem !important;
            font-weight: 600;
            outline: none;
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        [id^="modal"].fixed>div:has(form) input:not([type="hidden"]):focus,
        [id^="modal"].fixed>div:has(form) select:focus,
        [id^="modal"].fixed>div:has(form) textarea:focus {
            border-color: #FF6B35 !important;
            box-shadow: 0 0 0 4px rgba(71, 99, 253, 0.11);
        }

        [id^="modal"].fixed>div:has(form) input::placeholder,
        [id^="modal"].fixed>div:has(form) textarea::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        #modalTarget #tgt_per_jenis_fields input[data-jenis-nama] {
            width: 4.5rem !important;
            min-width: 4.5rem !important;
            max-width: 4.5rem !important;
            min-height: 2.25rem !important;
            padding: 0.35rem 0.45rem !important;
            flex: 0 0 4.5rem !important;
        }

        [id^="modal"].fixed>div:has(form) form>div:last-child {
            padding-top: 1.1rem;
            border-top: 1px solid #e2e8f0;
        }

        [id^="modal"].fixed>div:has(form) button[type="submit"] {
            min-height: 2.8rem;
            border-radius: 999px !important;
            padding: 0.7rem 1.5rem !important;
            font-size: 0.82rem !important;
            box-shadow: 0 14px 26px rgba(71, 99, 253, 0.2);
        }

        [id^="modal"].fixed>div:has(form) button[type="button"] {
            min-height: 2.8rem;
            border-radius: 999px;
            padding: 0.7rem 1.2rem !important;
        }

        #modalDeal>div:has(form),
        #modalInputCetak>div:has(form) {
            width: min(94vw, 68rem) !important;
            max-width: 68rem !important;
            grid-template-columns: 16rem minmax(0, 1fr);
        }

        #modalDeal>div:has(form)>form,
        #modalInputCetak>div:has(form)>form {
            min-width: 0;
            padding-right: 2.2rem;
        }

        #modalDeal>div:has(form)>form>.grid,
        #modalInputCetak>div:has(form)>form>.grid {
            min-width: 0;
            align-items: start;
        }

        #modalDeal>div:has(form)>form>.grid>*,
        #modalDeal>div:has(form)>form>div,
        #modalInputCetak>div:has(form)>form>.grid>*,
        #modalInputCetak>div:has(form)>form>div {
            min-width: 0;
        }

        #modalDeal>div:has(form) input:not([type="hidden"]),
        #modalDeal>div:has(form) select,
        #modalDeal>div:has(form) textarea,
        #modalInputCetak>div:has(form) input:not([type="hidden"]),
        #modalInputCetak>div:has(form) select,
        #modalInputCetak>div:has(form) textarea {
            box-sizing: border-box;
            max-width: 100%;
        }

        #modalDeal>div:has(form) select,
        #modalInputCetak>div:has(form) select {
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        @media (min-width: 769px) and (max-width: 1180px) {
            #modalDeal>div:has(form),
            #modalInputCetak>div:has(form) {
                width: min(96vw, 60rem) !important;
                grid-template-columns: 13rem minmax(0, 1fr);
            }

            #modalDeal>div:has(form)>h3,
            #modalInputCetak>div:has(form)>h3 {
                padding-left: 2rem !important;
                padding-right: 2rem !important;
            }

            #modalDeal>div:has(form)>form,
            #modalInputCetak>div:has(form)>form {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }

        @media (max-width: 768px) {
            [id^="modal"].fixed>div:has(form) {
                grid-template-columns: 1fr;
                width: min(94vw, 34rem) !important;
            }

            [id^="modal"].fixed>div:has(form)::before,
            [id^="modal"].fixed>div:has(form)::after {
                display: none;
            }

            [id^="modal"].fixed>div:has(form)>h3 {
                grid-column: 1;
                padding: 1.6rem 1.4rem 0.6rem !important;
            }

            [id^="modal"].fixed>div:has(form)>form {
                grid-column: 1;
                padding: 0 1.4rem 1.5rem;
            }
        }

        /* === BUTTONS COMPACT === */
        .btn-gradient,
        button[type="submit"] {
            padding: 0.4rem 1rem !important;
            font-size: 0.78rem !important;
        }

        /* === TABLE COMPACT === */
        table th,
        table td {
            padding: 0.35rem 0.6rem !important;
            font-size: 0.75rem !important;
        }

        table th {
            font-size: 0.68rem !important;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        /* === STAT CARDS COMPACT === */
        .grid>div>.text-3xl,
        .grid>div>.text-2xl {
            font-size: 1.25rem !important;
        }

        .grid>div>.text-xl {
            font-size: 1rem !important;
        }

        /* === LABELS COMPACT === */
        label {
            font-size: 0.65rem !important;
        }

        /* === BADGE/TAG COMPACT === */
        span[class*="rounded-full"] {
            padding: 0.15rem 0.5rem !important;
            font-size: 0.65rem !important;
        }

        /* === LAPORAN CARDS COMPACT === */
        .space-y-8>div {
            margin-top: 1rem !important;
        }

        .space-y-8>div:first-child {
            margin-top: 0 !important;
        }

        /* === SECTION CONTAINERS COMPACT === */
        .bg-white.p-8.rounded-3xl {
            padding: 1.25rem !important;
        }

        .bg-white.p-6.rounded-3xl,
        .bg-white.p-5.rounded-3xl {
            padding: 1rem !important;
        }

        /* === PROGRESS TRACKING COMPACT === */
        .space-y-4>div {
            margin-top: 0.6rem !important;
        }

        .space-y-4>div:first-child {
            margin-top: 0 !important;
        }

        /* === KARYAWAN CARD IN LAPORAN === */
        .grid.grid-cols-1.md\:grid-cols-2.lg\:grid-cols-3>div {
            padding: 0.75rem !important;
        }

        .grid.grid-cols-1.md\:grid-cols-2.lg\:grid-cols-3>div h4 {
            font-size: 0.8rem !important;
        }

        /* === KPI DONUT CARDS === */
        .grid .relative.rounded-full {
            width: 3.5rem !important;
            height: 3.5rem !important;
        }

        /* === DOUBLE </td> fix (cleanup) === */
        td+td:empty {
            display: none;
        }

        /* === ORIGINAL STYLES === */
        .nav-link-active {
            background: linear-gradient(135deg, #FF6B35 0%, #ff8a5c 100%);
            color: white !important;
            box-shadow: 0 4px 12px rgba(71, 99, 253, 0.3);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #FF6B35 0%, #ff8a5c 100%);
        }

        .fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-line {
            height: 2px;
            flex-grow: 1;
            background: #e2e8f0;
            margin: 0 8px;
        }

        .progress-line-filled {
            background: #FF6B35;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: #e2e8f0;
