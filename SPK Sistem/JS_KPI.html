<script>



// --- MODUL KPI (DASHBOARD, TARGET, INPUT) ---

const ADDITIONAL_KPI = 'KPI Tambahan';
const LAYOUTER_ADDITIONAL_KPI = ADDITIONAL_KPI;
const SYSTEM_KPI_TYPES = [
  { nama: 'Pendampingan', role: 'css' },
  { nama: 'Administrasi', role: 'admin' }
];

function isLayouterAdditionalKpi(jenis) {
  return isAdditionalKpi(jenis);
}

function isAdditionalKpi(jenis) {
  return String(jenis || '') === ADDITIONAL_KPI;
}

function isEditorWordKpi(jenis) {
  return ['Proofreading', ADDITIONAL_KPI].includes(String(jenis || ''));
}

function isLayouterPageKpi(jenis) {
  return ['Layout', 'Desain Cover', ADDITIONAL_KPI].includes(String(jenis || ''));
}

function isSystemKpiType(nama, role) {
  return SYSTEM_KPI_TYPES.some((item) => String(item.nama || '') === String(nama || '') && String(item.role || '') === String(role || ''));
}

function getSystemKpiTypesForRole(role) {
  return SYSTEM_KPI_TYPES.filter((item) => String(item.role || '') === String(role || ''));
}

function switchJenisKPIRoleTab(role) {
  window._jenisKPIRoleTab = role;
  loadKelolaJenisKPI();
}


function switchTargetKPIRoleTab(role) {
  window._targetKPIRoleTab = role;
  loadTargetKPI();
}


function loadKelolaJenisKPI() {
  gas.withSuccessHandler((res) => {
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;
    const settings = res?.data || { jenisKPI: [] };
    const roles = ['css', 'admin', 'campaign', 'admin_marketplace'];
    const roleLabel = (role) => getRoleLabel(role);
    const activeRole = roles.includes(window._jenisKPIRoleTab) ? window._jenisKPIRoleTab : roles[0];
    window._jenisKPIRoleTab = activeRole;
    const jenisKPI = (settings.jenisKPI || []).filter((j) => roles.includes(j.role) && !isSystemKpiType(j.nama, j.role));
    const filteredJenis = jenisKPI.filter((j) => j.role === activeRole);

    content.innerHTML = "\n                    <div class=\"mb-5 overflow-x-auto\">\n                        <div class=\"inline-flex gap-2 rounded-2xl bg-white border border-slate-100 p-1 shadow-sm\">\n                            ".concat(


      roles.map((role) => {
        const count = jenisKPI.filter((j) => j.role === role).length;
        return "<button onclick=\"switchJenisKPIRoleTab('".concat(role, "')\" class=\"px-4 py-2 rounded-xl text-xs font-black transition ").concat(activeRole === role ? 'bg-accent-600 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50', "\">").concat(roleLabel(role), " <span class=\"ml-1 ").concat(activeRole === role ? 'text-white/75' : 'text-slate-300', "\">").concat(count, "</span></button>");
      }).join(''), "\n                        </div>\n                    </div>\n                    <div class=\"bg-white rounded-3xl shadow-sm border border-slate-100 overflow-x-auto\">\n                        <table class=\"w-full text-left\">\n                            <thead class=\"bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest\">\n                                <tr>\n                                    <th class=\"px-8 py-4\">Nama Jenis KPI</th>\n                                    <th class=\"px-8 py-4\">Ditetapkan Untuk Role</th>\n                                    <th class=\"px-8 py-4 text-center\">Aksi</th>\n                                </tr>\n                            </thead>\n                            <tbody class=\"divide-y divide-slate-50 text-[13px]\">\n                                ").concat(












      filteredJenis.map((j) => "\n                                    <tr class=\"hover:bg-slate-50 transition-colors\">\n                                        <td class=\"px-8 py-4 font-bold text-slate-800\">".concat(

        j.nama, "</td>\n                                        <td class=\"px-8 py-4\">\n                                            <span class=\"px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[9px] font-bold uppercase tracking-wider\">").concat(

        roleLabel(j.role), "</span>\n                                        </td>\n                                        <td class=\"px-8 py-4 text-center\">\n                                            <button onclick=\"editJenisKPI('").concat(


        j.id, "')\" class=\"p-2 text-blue-500 hover:bg-blue-50 rounded-lg\"><i class=\"fa-solid fa-edit\"></i></button>\n                                            <button onclick=\"deleteJenisKPI('").concat(
        j.id, "')\" class=\"p-2 text-red-500 hover:bg-red-50 rounded-lg ml-1\"><i class=\"fa-solid fa-trash\"></i></button>\n                                        </td>\n                                    </tr>")

      ).join(''), "\n                                ").concat(
      filteredJenis.length === 0 ? "<tr><td colspan=\"3\" class=\"p-16 text-center text-slate-300 italic\">Belum ada data jenis KPI untuk ".concat(roleLabel(activeRole), ".</td></tr>") : '', "\n                            </tbody>\n                        </table>\n                    </div>\n                ");




  }).getSettingsData();
}


function loadTargetKPI() {
  gas.withSuccessHandler((resUsers) => {
    const kpiUsers = (resUsers?.data || []).filter((u) => !['manajemen', 'pimpinan', 'karyawan', 'report'].includes(u.role));
    gas.withSuccessHandler((resTarget) => {
      gas.withSuccessHandler((resKPI) => {
        if (!state.user) return;
        const content = document.getElementById('contentArea');
        if (!content) return;

        const targets = resTarget?.data || [];
        const allKPI = resKPI?.data || [];
        const currentMonth = new Date().toISOString().slice(0, 7);
        const kpiDataBulanIni = allKPI.filter((k) => String(k.tanggal || '').startsWith(currentMonth));
        const formatRp = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');

        const today = new Date();
        const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
        const isEndOfMonth = today.getDate() >= lastDay - 3;
        const namaBulan = today.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

        let alertHTML = '';
        if (isEndOfMonth) {
          alertHTML = "\n                                <div class=\"mb-6 p-4 bg-amber-50 text-amber-800 rounded-xl text-sm border border-amber-200 flex items-start gap-3\">\n                                    <i class=\"fa-solid fa-triangle-exclamation text-lg mt-0.5\"></i>\n                                    <div>\n                                        <b>Peringatan Akhir Bulan!</b><br>\n                                        Periode <b>".concat(




            namaBulan, "</b> akan segera berakhir. Pastikan semua data KPI sudah lengkap sebelum melakukan <b>download</b> dan <b>reset</b> data untuk periode bulan baru.\n                                    </div>\n                                </div>");


        }

        // Pre-compute data per user
        const roleOrder = ['cs', 'editor', 'layouter', 'pic_editor', 'pic_layouter', 'admin', 'css', 'campaign', 'admin_marketplace'];
        const userRoles = [...new Set(kpiUsers.map((u) => u.role))].
        sort((a, b) => {
          const ia = roleOrder.indexOf(a);
          const ib = roleOrder.indexOf(b);
          return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || getRoleLabel(a).localeCompare(getRoleLabel(b));
        });
        const activeRole = userRoles.includes(window._targetKPIRoleTab) ? window._targetKPIRoleTab : userRoles[0];
        window._targetKPIRoleTab = activeRole;
        const activeUsers = activeRole ? kpiUsers.filter((u) => u.role === activeRole) : [];

        const usersData = activeUsers.map((usr) => {
          const t = targets.find((x) => x.username === usr.username) || { targetTerbit: 0, targetCetak: 0, targetOmzet: 0, targetKata: 0, targetHalaman: 0 };
          const myKPI = kpiDataBulanIni.filter((k) => k.picName === usr.nama);
          let mainValue = 0,mainTarget = 0,mainLabel = '',mainUnit = '';
          let detailRows = [];

          if (usr.role === 'cs') {
            // CS: use deal count vs targetTerbit
            mainValue = myKPI.length;mainTarget = t.targetTerbit || 0;mainLabel = 'Deal';mainUnit = 'Deal';
            detailRows.push({ label: 'Target Naskah/Deal', value: t.targetTerbit + ' Item' });
            detailRows.push({ label: 'Target Cetak', value: t.targetCetak + ' Poin' });
            detailRows.push({ label: 'Target Omzet', value: formatRp(t.targetOmzet) });
            detailRows.push({ label: 'Capaian KPI', value: myKPI.length + ' entri' });
          } else if (usr.role === 'editor' || usr.role === 'pic_editor') {
            const mainKPI = myKPI.filter((k) => isEditorWordKpi(k.jenis));
            const totalKata = mainKPI.reduce((a, b) => a + Number(b.jumlahKata || 0), 0);
            mainValue = totalKata;mainTarget = t.targetKata || 0;mainLabel = 'Kata';mainUnit = 'Kata';
            detailRows.push({ label: 'Target Kata', value: (t.targetKata || 0).toLocaleString('id-ID') + ' Kata' });
            detailRows.push({ label: 'Capaian Kata', value: totalKata.toLocaleString('id-ID') + ' Kata' });
            detailRows.push({ label: 'Judul Selesai', value: mainKPI.length + ' Judul' });
            const revisi = myKPI.filter(isRevisiKPI);
            if (revisi.length > 0) detailRows.push({ label: 'Revisi', value: revisi.length + ' naskah' });

            // Custom KPIs
            const perJenis = t.targetPerJenis || {};
            Object.keys(perJenis).forEach((jenis) => {
              if (!isEditorWordKpi(jenis) && jenis !== 'Lainnya') {
                const tgtVal = perJenis[jenis] || 0;
                const achieved = myKPI.filter((k) => k.jenis === jenis).reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
                const pct = tgtVal > 0 ? Math.min(Math.round(achieved / tgtVal * 100), 100) : 0;
                detailRows.push({ label: jenis, value: achieved + ' / ' + tgtVal + ' (' + pct + '%)' });
              }
            });
          } else if (usr.role === 'layouter') {
            const mainKPI = myKPI.filter((k) => isLayouterPageKpi(k.jenis));
            const totalHal = mainKPI.reduce((a, b) => a + Number(b.jumlahHalaman || 0), 0);
            mainValue = totalHal;mainTarget = t.targetHalaman || 0;mainLabel = 'Halaman';mainUnit = 'Hal';
            detailRows.push({ label: 'Target Halaman', value: (t.targetHalaman || 0).toLocaleString('id-ID') + ' Hal' });
            detailRows.push({ label: 'Capaian Halaman', value: totalHal.toLocaleString('id-ID') + ' Hal' });
            detailRows.push({ label: 'Judul Selesai', value: mainKPI.length + ' Judul' });
            const revisi = myKPI.filter(isRevisiKPI);
            if (revisi.length > 0) detailRows.push({ label: 'Revisi', value: revisi.length + ' naskah' });

            // Custom KPIs
            const perJenis = t.targetPerJenis || {};
            Object.keys(perJenis).forEach((jenis) => {
              if (!isLayouterPageKpi(jenis) && !['Quality Control', 'Evaluasi Tim', 'Lainnya'].includes(jenis)) {
                const tgtVal = perJenis[jenis] || 0;
                const achieved = myKPI.filter((k) => k.jenis === jenis).reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
                const pct = tgtVal > 0 ? Math.min(Math.round(achieved / tgtVal * 100), 100) : 0;
                detailRows.push({ label: jenis, value: achieved + ' / ' + tgtVal + ' (' + pct + '%)' });
              }
            });
          } else if (usr.role === 'pic_layouter') {
            // 1. Layout KPI (Halaman) - tercatat sebagai detail, bukan persentase utama PIC Layouter
            const layoutKPI = myKPI.filter((k) => isLayouterPageKpi(k.jenis));
            const totalHal = layoutKPI.reduce((a, b) => a + Number(b.jumlahHalaman || 0), 0);
            const targetHal = Number(t.targetHalaman || 0);
            const persenLayout = targetHal > 0 ? Math.min(Math.round(totalHal / targetHal * 100), 100) : 0;
            const picScore = getPicLayouterQcEvalSummary(usr.nama, kpiDataBulanIni, resUsers?.data || [], resTarget?.data || []);
            const pctAverage = picScore.score;
            mainValue = pctAverage;mainTarget = 100;mainLabel = 'Persentase';mainUnit = '%';

            detailRows.push({ label: 'Capaian Utama', value: pctAverage + '% (QC + Evaluasi Tim)' });
            detailRows.push({ label: 'Quality Control (QC)', value: picScore.qcScore + '% (' + picScore.qcTotal + ' Naskah di-QC)' });
            detailRows.push({ label: 'Evaluasi Tim', value: picScore.evalScore + '% (' + picScore.evalMet + '/' + picScore.evalTotal + ' Layouter)' });
            detailRows.push({ label: 'Layout Halaman', value: totalHal.toLocaleString('id-ID') + ' / ' + targetHal.toLocaleString('id-ID') + ' Hal (' + persenLayout + '% tercatat)' });
          } else if (['admin', 'css', 'admin_marketplace', 'campaign'].includes(usr.role)) {
            const perJenis = t.targetPerJenis || {};
            const jenisKeys = Object.keys(perJenis);
            if (jenisKeys.length > 0) {
              let totalAchieved = 0,totalTgt = 0;
              jenisKeys.forEach((jenis) => {
                const tgtVal = perJenis[jenis] || 0;
                const achieved = myKPI.filter((k) => k.jenis === jenis).reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
                totalAchieved += achieved;totalTgt += tgtVal;
                const pct = tgtVal > 0 ? Math.min(Math.round(achieved / tgtVal * 100), 100) : 0;
                detailRows.push({ label: jenis, value: achieved + ' / ' + tgtVal + ' (' + pct + '%)' });
              });
              mainValue = totalAchieved;mainTarget = totalTgt;mainLabel = 'Total Nilai';mainUnit = 'Nilai';
            } else {
              const totalKinerja = myKPI.reduce((a, b) => a + Number(b.jumlahKinerja || 0), 0);
              mainValue = totalKinerja;mainTarget = t.targetTerbit || 0;mainLabel = 'Nilai';mainUnit = 'Nilai';
              detailRows.push({ label: 'Total KPI', value: totalKinerja + ' Nilai' });
              detailRows.push({ label: 'Entri KPI', value: myKPI.length + ' Item' });
            }
          }

          const pct = mainTarget > 0 ? Math.min(Math.round(mainValue / mainTarget * 100), 100) : 0;
          const pctColor = pct >= 100 ? 'emerald' : pct >= 50 ? 'amber' : 'red';
          return { usr, t, pct, pctColor, mainValue, mainTarget, mainUnit, detailRows };
        });

        // Store for detail modal
        window._targetKPIData = usersData;

        content.innerHTML = "\n                            ".concat(
          alertHTML, "\n                            <div class=\"flex flex-wrap items-center justify-between gap-3 mb-5\">\n                                <div class=\"overflow-x-auto\">\n                                    <div class=\"inline-flex gap-2 rounded-2xl bg-white border border-slate-100 p-1 shadow-sm\">\n                                        ").concat(



          userRoles.map((role) => {
            const count = kpiUsers.filter((u) => u.role === role).length;
            return "<button onclick=\"switchTargetKPIRoleTab('".concat(role, "')\" class=\"px-4 py-2 rounded-xl text-xs font-black transition ").concat(activeRole === role ? 'bg-accent-600 text-white shadow-sm' : 'text-slate-500 hover:bg-slate-50', "\">").concat(getRoleLabel(role), " <span class=\"ml-1 ").concat(activeRole === role ? 'text-white/75' : 'text-slate-300', "\">").concat(count, "</span></button>");
          }).join(''), "\n                                    </div>\n                                </div>\n                                <div class=\"flex flex-wrap gap-3\">\n                                <button onclick=\"downloadKPIExcel()\" class=\"flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-lg transition-colors\">\n                                    <i class=\"fa-solid fa-file-excel\"></i> Download KPI & Target\n                                </button>\n                                <button onclick=\"clearAllKPITarget()\" class=\"flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl font-bold text-xs shadow-lg transition-colors\">\n                                    <i class=\"fa-solid fa-eraser\"></i> Reset Bulan Baru\n                                </button>\n                                </div>\n                            </div>\n                            <div class=\"grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2\">\n                                ").concat(












          usersData.map((d, idx) => "\n                                    <div onclick=\"showDetailTarget(".concat(
            idx, ")\" class=\"bg-white rounded-xl border border-slate-100 shadow-sm p-3 hover:shadow-md hover:border-accent-200 transition-all cursor-pointer group\">\n                                        <div class=\"flex items-center gap-2 mb-2\">\n                                            <div class=\"w-7 h-7 rounded-lg bg-").concat(

            d.pctColor, "-50 text-").concat(d.pctColor, "-600 flex items-center justify-center text-[10px] font-black shrink-0\">").concat(d.usr.nama.charAt(0), "</div>\n                                            <div class=\"min-w-0 flex-1\">\n                                                <div class=\"font-bold text-slate-800 text-[11px] truncate\">").concat(

            d.usr.nama, "</div>\n                                                <div class=\"text-[8px] text-slate-400 uppercase font-bold tracking-wider\">").concat(
            getRoleLabel(d.usr.role), "</div>\n                                            </div>\n                                        </div>\n                                        <div class=\"flex items-end justify-between\">\n                                            <div class=\"text-lg font-black text-").concat(



            d.pctColor, "-600 leading-none\">").concat(d.pct, "%</div>\n                                            <span class=\"text-[9px] text-slate-400 group-hover:text-accent-600 transition-colors\"><i class=\"fa-solid fa-arrow-right\"></i></span>\n                                        </div>\n                                    </div>\n                                ")



          ).join(''), "\n                                ").concat(
          usersData.length === 0 ? '<div class="col-span-full text-center p-10 text-slate-300 italic">Belum ada user pada role ini.</div>' : '', "\n                            </div>\n                        ");


      }).getKPIData();
    }).getTargetData();
  }).getUsersData();
}


function showDetailTarget(idx) {
  const d = window._targetKPIData?.[idx];
  if (!d) return;
  const formatRp = (a) => 'Rp ' + Number(a).toLocaleString('id-ID');
  const pctColor = d.pct >= 100 ? '#10b981' : d.pct >= 50 ? '#f59e0b' : '#ef4444';
  const detailHTML = d.detailRows.map((r) => "\n                <div class=\"flex justify-between items-center py-2 border-b border-slate-50 last:border-0\">\n                    <span class=\"text-xs text-slate-500\">".concat(

    r.label, "</span>\n                    <span class=\"text-xs font-bold text-slate-800\">").concat(
    r.value, "</span>\n                </div>\n            ")

  ).join('');

  Swal.fire({
    title: null,
    html: "\n                    <div class=\"text-left\">\n                        <div class=\"flex items-center gap-3 mb-4\">\n                            <div class=\"w-10 h-10 rounded-xl flex items-center justify-center text-sm font-black text-white\" style=\"background:".concat(


      pctColor, "\">").concat(d.usr.nama.charAt(0), "</div>\n                            <div>\n                                <div class=\"font-bold text-slate-800\">").concat(

      d.usr.nama, "</div>\n                                <div class=\"text-[10px] text-slate-400 uppercase font-bold tracking-wider\">").concat(
      getRoleLabel(d.usr.role), "</div>\n                            </div>\n                            <div class=\"ml-auto text-right\">\n                                <div class=\"text-2xl font-black\" style=\"color:").concat(


      pctColor, "\">").concat(d.pct, "%</div>\n                            </div>\n                        </div>\n                        <div class=\"w-full bg-slate-100 rounded-full h-2 mb-4\">\n                            <div class=\"h-2 rounded-full transition-all\" style=\"width:").concat(



      d.pct, "%;background:").concat(pctColor, "\"></div>\n                        </div>\n                        <div class=\"flex justify-between text-[10px] text-slate-500 mb-4\">\n                            <span>Capaian: <b class=\"text-slate-800\">").concat(


      d.mainValue.toLocaleString('id-ID'), " ").concat(d.mainUnit, "</b></span>\n                            <span>Target: <b class=\"text-slate-800\">").concat(
      d.mainTarget.toLocaleString('id-ID'), " ").concat(d.mainUnit, "</b></span>\n                        </div>\n                        <div class=\"bg-slate-50 rounded-xl p-3 mb-2\">\n                            <div class=\"text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2\">Detail Target & Capaian</div>\n                            ").concat(



      detailHTML || '<div class="text-xs text-slate-300 italic text-center py-2">Belum ada data</div>', "\n                        </div>\n                    </div>\n                "),



    showCancelButton: true,
    confirmButtonText: '<i class="fa-solid fa-sliders mr-1"></i> Atur Target',
    cancelButtonText: 'Tutup',
    confirmButtonColor: '#4763FD',
    width: '28em'
  }).then((result) => {
    if (result.isConfirmed) {
      editTarget(d.usr.username, d.usr.nama, d.usr.role, d.t.targetTerbit, d.t.targetCetak, d.t.targetOmzet, d.t.targetKata || 0, d.t.targetHalaman || 0);
    }
  });
}

// --- VIEWS KPI (CS & EDITOR & LAYOUTER & ADMIN) ---

function loadDashboardKPI() {
  gas.withSuccessHandler((resInit) => {
    if (!state.user) return;
    const d = resInit?.data || {};
    const resTarget = { data: d.target };
    const resKPI = { data: d.kpi };
    const activeDealRows = d.deal || [];
    const allDealRowsForKpi = [...activeDealRows, ...(d.dealArchive || [])];
    const resDeal = { data: allDealRowsForKpi };
    const resNaskah = { data: d.naskah };
    mockNaskahDB = resNaskah?.data || mockNaskahDB;
    if (!state.user) return;
    const content = document.getElementById('contentArea');
    if (!content) return;

    let myTarget = (resTarget?.data || []).find((t) => t.username === state.user.username) || { targetOmzet: 0, targetTerbit: 0, targetCetak: 0, targetKata: 0, targetHalaman: 0 };
    const cachedTarget = (state.targets || []).find((t) => t.username === state.user.username);
    if (cachedTarget && !(myTarget.targetPerJenis && Object.prototype.hasOwnProperty.call(myTarget.targetPerJenis, 'Lainnya'))) {
      myTarget = { ...myTarget, ...cachedTarget };
    }
    if (typeof myTarget.targetPerJenis === 'string') {
      try {myTarget.targetPerJenis = JSON.parse(myTarget.targetPerJenis) || {};} catch (err) {myTarget.targetPerJenis = {};}
    }
    const hasPerJenisTarget = (perJenis, jenisName) => Object.keys(perJenis || {}).some((key) => String(key || '').trim().toLowerCase() === String(jenisName || '').trim().toLowerCase());
    const getPerJenisTarget = (perJenis, jenisName) => {
      const match = Object.entries(perJenis || {}).find(([key]) => String(key || '').trim().toLowerCase() === String(jenisName || '').trim().toLowerCase());
      return match ? Number(match[1] || 0) : 0;
    };
    const currentMonth = new Date().toISOString().slice(0, 7); // YYYY-MM format

    // Data untuk perhitungan KPI bulan ini
    const kpiData = (resKPI?.data || []).filter((k) => k.picName === state.user.nama && String(k.tanggal || '').startsWith(currentMonth));
    const dealData = (resDeal?.data || []).filter((d) => d.csName === state.user.nama && d.source !== 'legacy' && (d.tanggal || d.deadline || '').startsWith(currentMonth));

    // Mengambil SEMUA data deal CS ini tanpa filter bulan (khusus untuk Sidebar DP)
    const allMyDeals = (resDeal?.data || []).filter((d) => d.csName === state.user.nama);
    const activeMyDeals = activeDealRows.filter((d) => d.csName === state.user.nama);
    const allMyKpi = (resKPI?.data || []).filter((k) => k.picName === state.user.nama);

    const formatRp = (angka) => 'Rp ' + Number(angka).toLocaleString('id-ID');
    const isCurrentMonth = (dateValue) => String(dateValue || '').startsWith(currentMonth);
    const normalizePaymentTransactions = (value) => {
      if (Array.isArray(value)) return value;
      if (typeof value === 'string' && value.trim()) {
        try {
          const parsed = JSON.parse(value);
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          return [];
        }
      }
      return [];
    };
    const isTambahDpTransaction = (tx) => String(tx?.tipe || '').toLowerCase() === 'tambah dp';
    const getDealOriginalPaymentAmount = (d) => {
      const tx = normalizePaymentTransactions(d.transaksiTambahan);
      const addedDp = tx.filter(isTambahDpTransaction).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const addedCost = tx.filter((item) => !isTambahDpTransaction(item)).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
      const hasPelunasan = Number(d.nominalPelunasan || 0) > 0;
      if (d.statusPayment === 'DP' || hasPelunasan) return Math.max(0, Number(d.nominalDP || 0) - addedDp);
      return Math.max(0, Number(d.nilai || 0) - addedCost);
    };
    const getInitialPaymentAmount = (item, totalField) => {
      const hasPelunasan = Number(item.nominalPelunasan || 0) > 0;

function onKPIJenisChange(val) {
  const role = state.user.role;
  const fLayouter = document.getElementById('kpi_layouter_fields');
  const fQC = document.getElementById('kpi_qc_fields');
  const fEval = document.getElementById('kpi_eval_tim_fields');
  const fEditor = document.getElementById('kpi_editor_fields');
  const fUmum = document.getElementById('kpi_umum_fields');
  const fCsCetak = document.getElementById('kpi_cs_cetak_fields');
  const halamanInput = document.getElementById('kpi_jumlah_halaman');
  const kataInput = document.getElementById('kpi_jumlah_kata');
  const judulField = document.getElementById('kpi_judul');
  const umumInput = document.getElementById('kpi_jumlah_umum');
  const csNominal = document.getElementById('kpi_cs_nominal');
  const csNilai = document.getElementById('kpi_cs_nilai');

  if (role === 'cs') {
    if (val === 'Cetak' || val === 'Lainnya') {
      if (fUmum) fUmum.classList.add('hidden');
      if (fCsCetak) fCsCetak.classList.remove('hidden');
      if (umumInput) umumInput.required = false;
      if (csNominal) csNominal.required = true;
      if (csNilai) csNilai.required = true;
    } else {
      if (fUmum) fUmum.classList.remove('hidden');
      if (fCsCetak) fCsCetak.classList.add('hidden');
      if (umumInput) umumInput.required = true;
      if (csNominal) csNominal.required = false;
      if (csNilai) csNilai.required = false;
    }
    return;
  }

  // Handle 'Lainnya' and manual Revisi for editor/layouter as point-based KPI.
  const isLainnya = (role === 'editor' || role === 'pic_editor' || role === 'layouter' || role === 'pic_layouter') && val === 'Lainnya';
  const isManualRevisi = (role === 'editor' || role === 'pic_editor' || role === 'layouter' || role === 'pic_layouter') && val === 'Revisi';

  if (isLainnya || isManualRevisi) {
    if (fEditor) fEditor.classList.add('hidden');
    if (fLayouter) fLayouter.classList.add('hidden');
    if (fQC) fQC.classList.add('hidden');
    if (fEval) fEval.classList.add('hidden');
    if (kataInput) kataInput.required = false;
    if (halamanInput) halamanInput.required = false;
    if (fUmum) fUmum.classList.remove('hidden');
    if (umumInput) umumInput.required = true;
    if (judulField) judulField.placeholder = isManualRevisi ? 'Judul naskah yang direvisi' : 'Masukkan keterangan capaian';
    return;
  }

  // For general roles (like admin, css, campaign), the input field should be visible for any KPI jenis.
  const isUmumRole = role === 'css' || role === 'admin' || role === 'admin_marketplace' || role === 'campaign';

  if (isUmumRole) {
    if (fUmum) fUmum.classList.remove('hidden');
    if (umumInput) umumInput.required = true;
  } else {
    if (fUmum) fUmum.classList.add('hidden');
    if (umumInput) umumInput.required = false;
  }

  // Handle Revisi for editor and layouter - show kata/halaman fields for KPI claim
  if (role === 'editor' || role === 'pic_editor') {
    if (fEditor) fEditor.classList.remove('hidden');
    if (kataInput) kataInput.required = true;
    if (judulField) judulField.placeholder = val === 'Revisi' ? 'Judul naskah yang direvisi' : 'Masukkan judul naskah atau keterangan';
    return;
  }

  if (role === 'layouter') {
    if (fLayouter) fLayouter.classList.remove('hidden');
    if (halamanInput) halamanInput.required = true;
    if (judulField) judulField.placeholder = isAdditionalKpi(val) ? 'Wajib isi catatan, contoh: ISBN tempel - Judul naskah' : val === 'Revisi' ? 'Judul naskah yang direvisi' : 'Masukkan judul naskah atau keterangan';
    return;
  }

  if (role !== 'pic_layouter') return;

  // Hide all first for PIC Layouter
  if (fLayouter) fLayouter.classList.add('hidden');
  if (fQC) fQC.classList.add('hidden');
  if (fEval) fEval.classList.add('hidden');
  if (halamanInput) halamanInput.required = false;

  if (isLayouterPageKpi(val)) {
    if (fLayouter) fLayouter.classList.remove('hidden');
    if (halamanInput) halamanInput.required = true;
    if (judulField) {judulField.placeholder = isAdditionalKpi(val) ? 'Wajib isi catatan, contoh: ISBN tempel - Judul naskah' : val === 'Revisi' ? 'Judul naskah yang direvisi' : 'Masukkan judul naskah';}
  } else if (val === 'Quality Control') {
    if (fQC) fQC.classList.remove('hidden');
    if (judulField) {judulField.placeholder = 'Judul naskah yang di-QC';}
    toggleQCErrorCount(document.getElementById('kpi_quality_control')?.value || 'tidak_ada');
  }
}

function setKPIFieldsRequired(role) {
  const isEditor = role === 'editor' || role === 'pic_editor';
  const isLayouter = role === 'layouter' || role === 'pic_layouter';
  const isUmum = role === 'cs' || role === 'css' || role === 'admin' || role === 'admin_marketplace' || role === 'campaign' || role === 'pic_editor' || role === 'layouter';

  const editorFields = document.getElementById('kpi_editor_fields');
  const layouterFields = document.getElementById('kpi_layouter_fields');
  const qcFields = document.getElementById('kpi_qc_fields');
  const evalFields = document.getElementById('kpi_eval_tim_fields');
  const umumFields = document.getElementById('kpi_umum_fields');
  const editorInput = document.getElementById('kpi_jumlah_kata');
  const layouterInput = document.getElementById('kpi_jumlah_halaman');
  const umumInput = document.getElementById('kpi_jumlah_umum');

  // For editor/layouter, field visibility is controlled by onKPIJenisChange
  if (isEditor) {
    // Wait for onKPIJenisChange to show fEditor/fUmum
    if (editorInput) editorInput.required = false;
  } else {
    if (editorFields) editorFields.classList.add('hidden');
    if (editorInput) editorInput.required = false;
  }

  if (isLayouter && role !== 'pic_layouter') {
    // Wait for onKPIJenisChange to show fLayouter/fUmum
    if (layouterInput) layouterInput.required = false;
  } else if (role === 'pic_layouter') {
    if (layouterFields) layouterFields.classList.add('hidden');
    if (layouterInput) layouterInput.required = false;
  } else {
    if (layouterFields) layouterFields.classList.add('hidden');
    if (layouterInput) layouterInput.required = false;
  }

  if (qcFields) qcFields.classList.add('hidden');
  if (evalFields) evalFields.classList.add('hidden');

  // Allow onKPIJenisChange to show fUmum for custom KPIs
  if (isUmum) {
    if (umumFields) umumFields.classList.remove('hidden');
    if (umumInput) umumInput.required = true;
  } else {
    if (umumFields) umumFields.classList.add('hidden');
    if (umumInput) umumInput.required = false;
  }
}


function populateKPIJenisDropdown(role, selectedValue = '') {
  gas.withSuccessHandler((res) => {
    const select = document.getElementById('kpi_jenis');
    if (!select) return;
    select.innerHTML = '<option value="">Pilih Jenis KPI</option>';

    // Base options yang selalu ada untuk role tersebut
    const baseOptions = role === 'editor' ? [ADDITIONAL_KPI, 'Lainnya'] :
    role === 'pic_editor' ? [ADDITIONAL_KPI, 'Lainnya'] :
    role === 'pic_layouter' ? [ADDITIONAL_KPI, 'Lainnya', 'Quality Control'] :
    role === 'layouter' ? [ADDITIONAL_KPI, 'Lainnya'] :
    role === 'cs' ? ['Terbit', 'Cetak'] : 
    role === 'admin' ? ['Administrasi'] : 
    role === 'css' ? ['Pendampingan'] : [];

    const restrictedKpiRoles = ['campaign']; // Removed 'admin' and 'css' so baseOptions are included
    const isRestrictedKpiRole = restrictedKpiRoles.includes(role);

    const buildOptions = (enabledJenis = null) => {
      select.innerHTML = '<option value="">Pilih Jenis KPI</option>';
      let customOptions = (res?.data?.jenisKPI || []).filter((j) => {
        if (role === 'pic_editor') return j.nama === 'Lainnya' || j.nama === ADDITIONAL_KPI;
        if (role === 'editor') return j.role === 'editor';
        if (role === 'layouter') return j.nama === 'Lainnya' || j.nama === ADDITIONAL_KPI;
        if (role === 'pic_layouter') return j.role === 'layouter' || j.role === 'pic_layouter';
        return j.role === role;
      }).map((j) => j.nama);

      customOptions = customOptions.filter((nama) => !isSystemKpiType(nama, role));
      if (role === 'editor' || role === 'pic_editor') {
        customOptions = customOptions.filter((nama) => !['Proofreading', 'Revisi'].includes(nama));
      }
      if (role === 'layouter' || role === 'pic_layouter') {
        customOptions = customOptions.filter((nama) => !['Layout', 'Revisi'].includes(nama));
      }
      if (role === 'pic_layouter') {
        customOptions = customOptions.filter((nama) => nama !== 'Evaluasi Tim');
      }

      // (Previously blocked CSS Pendampingan, now unblocked so they can manually input if needed)

      if (role === 'campaign' && Array.isArray(enabledJenis)) {
        customOptions = customOptions.filter((nama) => enabledJenis.includes(nama));
      }
      if ((role === 'layouter' || role === 'pic_layouter' || role === 'editor' || role === 'pic_editor') && !customOptions.includes(ADDITIONAL_KPI)) {
        customOptions.push(ADDITIONAL_KPI);
      }
      if ((role === 'layouter' || role === 'pic_layouter' || role === 'editor' || role === 'pic_editor') && !customOptions.includes('Lainnya')) {
        customOptions.push('Lainnya');
      }

      // Role admin/css/campaign hanya boleh input KPI yang dibuat/diaktifkan Manajemen.
      const allOptions = isRestrictedKpiRole ?
      [...new Set(customOptions)] :
      [...new Set([...baseOptions, ...customOptions])];

      if (isRestrictedKpiRole && allOptions.length === 0) {
        const el = document.createElement('option');
        el.value = '';
        el.textContent = role === 'campaign' || role === 'layouter' ? 'Belum ada KPI aktif dari target Anda' : 'Belum ada jenis KPI dari Manajemen';
        el.disabled = true;
        el.selected = true;
        select.appendChild(el);
      }

      allOptions.forEach((opt) => {
        const el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        if (opt === selectedValue) el.selected = true;
        select.appendChild(el);
      });

      const finalVal = select.value;
      if (['editor', 'pic_editor', 'layouter', 'pic_layouter', 'cs', 'admin', 'css', 'campaign'].includes(role)) {
        onKPIJenisChange(finalVal);
      }
    };

    if (role === 'campaign') {
      gas.withSuccessHandler((resTarget) => {
        const myTarget = (resTarget?.data || []).find((t) => t.username === state.user.username) || {};
        const enabledJenis = Object.keys(myTarget.targetPerJenis || {});
        buildOptions(enabledJenis);
      }).getTargetData();
    } else {
      buildOptions();
    }
  }).getSettingsData();
}

function toggleTargetJenisEnabled(idx, enabled) {
  const input = document.querySelector("#tgt_per_jenis_fields input[name=\"tgt_jenis_".concat(idx, "\"]"));
  const row = document.getElementById("tgt_jenis_row_".concat(idx));
  const status = document.getElementById("tgt_jenis_status_".concat(idx));
  const track = document.getElementById("tgt_jenis_track_".concat(idx));
  const thumb = document.getElementById("tgt_jenis_thumb_".concat(idx));
  if (!input) return;
  input.disabled = !enabled;
  input.dataset.targetEnabled = enabled ? '1' : '0';
  input.classList.toggle('bg-slate-100', !enabled);
  input.classList.toggle('text-slate-400', !enabled);
  input.classList.toggle('opacity-60', !enabled);
  if (row) row.classList.toggle('opacity-60', !enabled);
  if (status) {
    status.textContent = enabled ? 'ON' : 'OFF';
    status.className = enabled ? 'w-6 text-[8px] font-black text-emerald-600 uppercase text-right' : 'w-6 text-[8px] font-black text-slate-400 uppercase text-right';
  }
  if (track) {
    track.classList.toggle('bg-emerald-500', enabled);
    track.classList.toggle('bg-slate-300', !enabled);
  }
  if (thumb) {
    thumb.classList.toggle('translate-x-4', enabled);
    thumb.classList.toggle('translate-x-0.5', !enabled);
  }
}

function handleSaveTarget(e) {
  e.preventDefault();
  const role = document.getElementById('tgt_role').value;
  const payload = {
    username: document.getElementById('tgt_username').value,
    targetTerbit: Number(document.getElementById('tgt_terbit').value)
  };

  // Kumpulkan target per jenis dari input fields dinamis jika ada
  const perJenisInputs = document.querySelectorAll('#tgt_per_jenis_fields input[data-jenis-nama]');
  const targetPerJenis = {};
  let totalTargetPerJenis = 0;
  perJenisInputs.forEach((inp) => {
    if (inp.disabled || inp.dataset.targetEnabled === '0') return;
    const jenisNama = inp.getAttribute('data-jenis-nama');
    const val = Number(inp.value) || 0;
    targetPerJenis[jenisNama] = val;
    totalTargetPerJenis += val;
  });

  if (role === 'editor' || role === 'pic_editor') {
    payload.targetTerbit = 0;
    payload.targetKata = Number(document.getElementById('tgt_kata').value);
    payload.targetCetak = 0;
    payload.targetOmzet = 0;
    payload.targetHalaman = 0;
    payload.targetPerJenis = targetPerJenis;
  } else if (role === 'layouter' || role === 'pic_layouter') {
    payload.targetTerbit = 0;
    payload.targetHalaman = Number(document.getElementById('tgt_halaman').value);
    payload.targetKata = 0;
    payload.targetCetak = 0;
    payload.targetOmzet = 0;
    payload.targetPerJenis = targetPerJenis;
  } else if (['admin', 'css', 'admin_marketplace', 'campaign'].includes(role)) {
    payload.targetPerJenis = targetPerJenis;
    payload.targetTerbit = totalTargetPerJenis; // Total semua target per jenis
    payload.targetCetak = 0;
    payload.targetOmzet = 0;
    payload.targetKata = 0;
    payload.targetHalaman = 0;
  } else {
    payload.targetTerbit = Number(document.getElementById('tgt_terbit').value);
    payload.targetCetak = Number(document.getElementById('tgt_cetak').value);
    payload.targetOmzet = Number(document.getElementById('tgt_omzet').value);
    payload.targetKata = 0;
    payload.targetHalaman = 0;
  }

  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {
    state.targets = [];
    closeModal('modalTarget');
    loadTargetKPI(); // Reload the current tab
    Swal.fire('Tersimpan!', 'Target bulanan berhasil diperbarui.', 'success');
  }).withFailureHandler((error) => {
    showServerError('Gagal Menyimpan Target', error);
  }).saveTargetData(payload);
}


function parseKpiRequestData(value) {
  if (!value) return {};
  if (typeof value === 'object') return value;
  try {return JSON.parse(value);} catch (err) {return {};}
}


function formatKpiRequestValue(value) {
  if (value === undefined || value === null || value === '') return '-';
  if (typeof value === 'object') return JSON.stringify(value);
  return String(value);
}


function getKpiCorrectionFields() {
  return [
  { key: 'tanggal', label: 'Tanggal', type: 'date' },
  { key: 'judul', label: 'Judul / Keterangan', type: 'text' },
  { key: 'jumlahKata', label: 'Jumlah Kata', type: 'number' },
  { key: 'jumlahHalaman', label: 'Jumlah Halaman', type: 'number' },
  { key: 'jumlahKinerja', label: 'Nilai KPI / Poin', type: 'number' },
  { key: 'jumlahUmum', label: 'Jumlah Umum', type: 'number' },
  { key: 'qcErrorCount', label: 'Kesalahan QC', type: 'number' },
  { key: 'nominal', label: 'Nominal', type: 'number' },
  { key: 'nominalDP', label: 'Nominal DP', type: 'number' },
  { key: 'nominalPelunasan', label: 'Nominal Pelunasan', type: 'number' },
  { key: 'tanggalPelunasan', label: 'Tanggal Pelunasan', type: 'date' },
  { key: 'evalTarget', label: 'Target Evaluasi', type: 'number' },
  { key: 'evalCapaian', label: 'Capaian Evaluasi', type: 'number' }];

}


function getRelevantKpiCorrectionFields(kpi) {
  const jenis = String(kpi?.jenis || '').toLowerCase();
  const fields = [
  { key: 'tanggal', label: 'Tanggal', type: 'date' },
  { key: 'judul', label: 'Judul / Keterangan', type: 'text' }];

  if (Number(kpi?.jumlahKata || 0) > 0 || jenis.includes('proof') || jenis.includes('kata')) {
    fields.push({ key: 'jumlahKata', label: 'Jumlah Kata', type: 'number' });
  }
  if (Number(kpi?.jumlahHalaman || 0) > 0 || jenis.includes('layout') || jenis.includes('cover') || jenis.includes('halaman')) {
    fields.push({ key: 'jumlahHalaman', label: 'Jumlah Halaman', type: 'number' });
  }
  if (jenis.includes('revisi')) {
    fields.push({ key: 'jumlahKinerja', label: 'Poin Revisi', type: 'number' });
  }
  if (jenis.includes('quality')) fields.push({ key: 'qcErrorCount', label: 'Jumlah Kesalahan QC', type: 'number' });
  if (jenis.includes('evaluasi')) {
    fields.push({ key: 'evalTarget', label: 'Target Evaluasi', type: 'number' });
    fields.push({ key: 'evalCapaian', label: 'Capaian Evaluasi', type: 'number' });
  }
  if (jenis.includes('lainnya') || Number(kpi?.jumlahKinerja || 0) > 0 || Number(kpi?.jumlahUmum || 0) > 0) {
    fields.push({ key: 'jumlahKinerja', label: 'Nilai KPI / Poin', type: 'number' });
  }
  return fields.filter((field, index, arr) => arr.findIndex((item) => item.key === field.key) === index);
}

  } else if (state.user.role === 'pic_layouter') {
    const jenis = payload.jenis;
    if (jenis === 'Lainnya' || jenis === 'Revisi') {
      payload.jumlahKinerja = document.getElementById('kpi_jumlah_umum').value;
    } else if (jenis === 'Layout') {
      payload.jumlahHalaman = document.getElementById('kpi_jumlah_halaman').value;
    } else if (jenis === 'Quality Control') {
      payload.qcResult = document.getElementById('kpi_quality_control').value;
      payload.qcErrorCount = payload.qcResult === 'ada' ? Number(document.getElementById('kpi_qc_error_count').value || 0) : 0;
    } else if (isLayouterPageKpi(jenis)) {
      payload.jumlahHalaman = document.getElementById('kpi_jumlah_halaman').value;
      if (isAdditionalKpi(jenis)) {
        if (!String(payload.judul || '').trim()) {
          Swal.fire('Catatan Wajib', 'Isi keterangan KPI Tambahan, contoh: ISBN tempel - Judul naskah.', 'warning');
          return;
        }
        if (Number(payload.jumlahHalaman || 0) <= 0) {
          Swal.fire('Jumlah Halaman Wajib', 'Jumlah halaman KPI Tambahan harus lebih dari 0.', 'warning');
          return;
        }
      }
    }
  } else if (state.user.role === 'layouter') {
    if (payload.jenis === 'Lainnya' || payload.jenis === 'Revisi') {
      payload.jumlahKinerja = document.getElementById('kpi_jumlah_umum').value;
    } else {
      payload.jumlahHalaman = document.getElementById('kpi_jumlah_halaman').value;
      if (isAdditionalKpi(payload.jenis)) {
        if (!String(payload.judul || '').trim()) {
          Swal.fire('Catatan Wajib', 'Isi keterangan KPI Tambahan, contoh: ISBN tempel - Judul naskah.', 'warning');
          return;
        }
        if (Number(payload.jumlahHalaman || 0) <= 0) {
          Swal.fire('Jumlah Halaman Wajib', 'Jumlah halaman KPI Tambahan harus lebih dari 0.', 'warning');
          return;
        }
      }
    }
  } else if (state.user.role === 'cs') {
    if (payload.jenis === 'Cetak' || payload.jenis === 'Lainnya') {
      payload.nominal = document.getElementById('kpi_cs_nominal').value;
      payload.jumlahKinerja = document.getElementById('kpi_cs_nilai').value;
    } else {
      payload.jumlahKinerja = document.getElementById('kpi_jumlah_umum').value;
    }
  } else if (['css', 'admin', 'admin_marketplace', 'campaign'].includes(state.user.role)) {
    payload.jumlahKinerja = document.getElementById('kpi_jumlah_umum').value;
  }

  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => {Swal.showLoading();} });
  gas.withSuccessHandler(() => {
    closeModal('modalKPI');
    loadInputKPI();
    Swal.fire('Tersimpan!', 'Pencapaian KPI berhasil dicatat.', 'success');
  }).withFailureHandler((error) => {
    showServerError('Gagal Menyimpan KPI', error);
  }).saveKPIData(payload);
}
function loadRekapKpiHistory(selectedMonth) {
  if (window._rekapKpiData) {
      renderRekapKpiTable(selectedMonth);
      return;
  }
  gas.withSuccessHandler((resInit) => {
    if (!state.user) return;
    const d = resInit?.data || {};
    window._rekapKpiData = [...(d.kpi || []), ...(d.kpiArchive || [])];
    window._rekapKpiUsers = (d.users || []).filter(u => !['manajemen', 'pimpinan', 'report'].includes(normalizeRole(u.role)));
    renderRekapKpiTable(selectedMonth);
  }).getInitialData();
}

function renderRekapKpiTable(selectedMonth) {
    const content = document.getElementById('contentArea');
    if (!content) return;
    const allKPI = window._rekapKpiData || [];
    const users = window._rekapKpiUsers || [];
    
    const months = [];
    for (let i = 0; i < 3; i++) {
       let date = new Date();
       date.setMonth(date.getMonth() - i);
       months.push({
           value: date.toISOString().slice(0, 7),
           label: date.toLocaleString('id-ID', { month: 'long', year: 'numeric' })
       });
    }
    
    if (!selectedMonth) selectedMonth = months[1]?.value || months[0].value;
    const activeMonthObj = months.find(m => m.value === selectedMonth) || months[1] || months[0];
    
    const roleOrder = ['cs', 'editor', 'layouter', 'pic_editor', 'pic_layouter', 'admin', 'css', 'campaign', 'admin_marketplace'];
    const activeUsers = users.sort((a,b) => {
       const ia = roleOrder.indexOf(normalizeRole(a.role));
       const ib = roleOrder.indexOf(normalizeRole(b.role));
       return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || (a.nama || '').localeCompare(b.nama || '');
    });

    const rowsHTML = activeUsers.map(u => {
        const myKPI = allKPI.filter(k => k.picName === u.nama && String(k.tanggal || '').startsWith(selectedMonth));
        let cell = '<td class="px-4 py-3 text-center text-slate-300">-</td>';
        let summary = '';
        
        if (myKPI.length > 0) {
            const role = normalizeRole(u.role);
            if (role === 'cs') {
               summary = myKPI.length + ' Entri (Poin/Deal)';
            } else if (role === 'editor' || role === 'pic_editor') {
               const kata = myKPI.filter(k => isEditorWordKpi(k.jenis)).reduce((sum, k) => sum + Number(k.jumlahKata || 0), 0);
               summary = kata.toLocaleString('id-ID') + ' Kata<br><span class="text-[9px] text-slate-400">' + myKPI.length + ' Entri</span>';
            } else if (role === 'layouter' || role === 'pic_layouter') {
               const hal = myKPI.filter(k => isLayouterPageKpi(k.jenis)).reduce((sum, k) => sum + Number(k.jumlahHalaman || 0), 0);
               summary = hal.toLocaleString('id-ID') + ' Hal<br><span class="text-[9px] text-slate-400">' + myKPI.length + ' Entri</span>';
            } else {
               const nilai = myKPI.reduce((sum, k) => sum + Number(k.jumlahKinerja || 0), 0);
               summary = nilai.toLocaleString('id-ID') + ' Poin<br><span class="text-[9px] text-slate-400">' + myKPI.length + ' Entri</span>';
            }
            cell = `<td class="px-4 py-3 text-center font-bold text-slate-700">${summary}</td>`;
        }
        
        return `<tr class="hover:bg-slate-50 transition border-b border-slate-50">
           <td class="px-4 py-4 font-bold text-slate-800">${u.nama}<br><span class="text-[9px] font-black uppercase text-slate-400 tracking-wider">${getRoleLabel(u.role)}</span></td>
           ${cell}
           <td class="px-4 py-3 text-right">
               <button onclick="showRekapKpiDetail('${u.username}', '${selectedMonth}')" class="px-3 py-1.5 bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white rounded-lg text-xs font-bold transition">
                   <i class="fa-solid fa-eye mr-1"></i> Detail
               </button>
           </td>
        </tr>`;
    }).join('');

    content.innerHTML = `
        <div class="mb-6 flex flex-col sm:flex-row justify-between sm:items-center bg-white p-6 rounded-3xl border border-slate-100 shadow-sm gap-4">
            <div>
                <h4 class="font-black text-slate-900 text-xl tracking-tight">Laporan Historis KPI</h4>
                <p class="text-xs text-slate-500 mt-1">Ditarik dari data sheet KPI berjalan dan Arsip KPI secara otomatis.</p>
            </div>
            <div class="flex items-center gap-3">
                <select onchange="loadRekapKpiHistory(this.value)" class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-700 outline-none focus:border-indigo-500 transition">
                    ${months.map(m => `<option value="${m.value}" ${m.value === selectedMonth ? 'selected' : ''}>${m.label}</option>`).join('')}
                </select>
                <div class="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold border border-indigo-100">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> Mode Arsip
                </div>
            </div>
        </div>
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
                    <tr>
                        <th class="px-6 py-4 w-1/3">Nama Pegawai & Role</th>
                        <th class="px-4 py-4 text-center">${activeMonthObj.label}</th>
                        <th class="px-4 py-4 text-right pr-6 w-32">Aksi</th>
                    </tr>
                </thead>
                <tbody class="text-[13px] divide-y divide-slate-50">
                    ${rowsHTML}
                    ${activeUsers.length === 0 ? '<tr><td colspan="3" class="p-10 text-center text-slate-300 italic">Belum ada data pegawai</td></tr>' : ''}
                </tbody>
            </table>
        </div>
    `;
}

function showRekapKpiDetail(username, selectedMonth) {
    const allKPI = window._rekapKpiData || [];
    const users = window._rekapKpiUsers || [];
    const user = users.find(u => u.username === username);
    if (!user) return;
    
    const myKPI = allKPI.filter(k => k.picName === user.nama && String(k.tanggal || '').startsWith(selectedMonth));
    
    const grouped = {};
    myKPI.forEach(k => {
        const jenis = k.jenis || 'Lainnya';
        if (!grouped[jenis]) grouped[jenis] = [];
        grouped[jenis].push(k);
    });
    
    const role = normalizeRole(user.role);
    let detailsHtml = '';
    
    if (Object.keys(grouped).length === 0) {
        detailsHtml = '<div class="p-6 text-center text-slate-400 italic">Tidak ada catatan KPI di bulan ini.</div>';
    } else {
        detailsHtml += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
        Object.keys(grouped).forEach(jenis => {
            const list = grouped[jenis];
            let subSummary = '';
            if (role === 'cs') {
                subSummary = list.length + ' Entri';
            } else if (role === 'editor' || role === 'pic_editor') {
                const totalKata = list.reduce((sum, k) => sum + Number(k.jumlahKata || 0), 0);
                const totalPoin = list.reduce((sum, k) => sum + Number(k.jumlahKinerja || 0), 0);
                subSummary = isEditorWordKpi(jenis) ? totalKata.toLocaleString('id-ID') + ' Kata (' + list.length + ' Judul)' : totalPoin.toLocaleString('id-ID') + ' Poin (' + list.length + ' Entri)';
            } else if (role === 'layouter' || role === 'pic_layouter') {
                const totalHal = list.reduce((sum, k) => sum + Number(k.jumlahHalaman || 0), 0);
                const totalPoin = list.reduce((sum, k) => sum + Number(k.jumlahKinerja || 0), 0);
                subSummary = isLayouterPageKpi(jenis) ? totalHal.toLocaleString('id-ID') + ' Halaman (' + list.length + ' Judul)' : jenis === 'Quality Control' || jenis === 'Evaluasi Tim' ? list.length + ' Entri' : totalPoin.toLocaleString('id-ID') + ' Poin (' + list.length + ' Entri)';
            } else {
                const totalNilai = list.reduce((sum, k) => sum + Number(k.jumlahKinerja || 0), 0);
                subSummary = totalNilai.toLocaleString('id-ID') + ' Poin (' + list.length + ' Entri)';
            }
            
            detailsHtml += `
                <div class="mb-2 h-max">
                    <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-t-lg border border-slate-100">
                        <span class="font-black text-slate-700 text-xs">${jenis}</span>
                        <span class="font-bold text-indigo-600 text-xs whitespace-nowrap ml-2">${subSummary}</span>
                    </div>
                    <div class="border border-t-0 border-slate-100 rounded-b-lg p-2 text-xs bg-white">
                        <table class="w-full text-left table-fixed">
                            <tbody>
                                ${list.map(k => `
                                    <tr class="border-b border-slate-50 last:border-0">
                                        <td class="py-1.5 px-2 text-slate-600 w-2/3 truncate pr-2" title="${k.judul || k.jenis}">${k.judul || k.jenis}</td>
                                        <td class="py-1.5 px-2 text-right font-bold text-slate-800 truncate w-1/3">
                                            ${(role === 'editor' || role === 'pic_editor') ? (isEditorWordKpi(k.jenis) ? (k.jumlahKata || 0).toLocaleString('id-ID') + ' Kata' : (k.jumlahKinerja || 0).toLocaleString('id-ID') + ' Poin') : 
                                              (role === 'layouter' || role === 'pic_layouter') ? (isLayouterPageKpi(k.jenis) ? (k.jumlahHalaman || 0).toLocaleString('id-ID') + ' Hal' : k.jenis === 'Quality Control' ? ((k.qcResult === 'tidak_ada' || Number(k.qcErrorCount || 0) === 0) ? 'QC OK' : (k.qcErrorCount || 0) + ' Kesalahan') : k.jenis === 'Evaluasi Tim' ? ((k.evalMet === '1' || k.evalMet === 1 || k.evalMet === true) ? 'Memenuhi' : 'Belum') : (k.jumlahKinerja || 0).toLocaleString('id-ID') + ' Poin') : 
                                              (role === 'cs') ? '1 Deal' : (k.jumlahKinerja || 0) + ' Poin'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        });
        detailsHtml += '</div>';
    }

    Swal.fire({
        title: `<div class="text-left"><div class="text-lg font-black text-slate-800">${user.nama}</div><div class="text-xs text-slate-500 uppercase tracking-widest mt-1">${getRoleLabel(user.role)} - ${selectedMonth}</div></div>`,
        html: `<div class="text-left mt-4">${detailsHtml}</div>`,
        showConfirmButton: true,
        confirmButtonText: 'Tutup',
        confirmButtonColor: '#4f46e5',
        customClass: {
            popup: 'rounded-3xl p-6 naskah-landscape-popup',
            title: 'p-0',
            htmlContainer: 'm-0 p-0'
        },
        width: '800px'
    });
}
